  - id: REQ-STAMPA-001
    title: "Comanda al banco e scontrino al cliente"
    area: "src/lib/printer.js"
    description: >
      Si stampa la comanda in lavorazione (con dentro le aggiunte appena fatte) e
      lo scontrino non fiscale del conto, con i metodi di pagamento davvero usati.
      Entrambe possono essere automatiche.
      IL LOGO IN CIMA è un di più: se non si carica, la carta esce lo stesso
      — uno scontrino senza logo è ancora uno scontrino, uno scontrino che
      non esce è un cliente che aspetta. E si tenta UNA VOLTA SOLA per
      sessione (BUG-032): prima ogni stampa rifaceva il caricamento e
      aspettava l'errore, e la carta usciva dopo ogni volta.
      QUANDO ESCE LO SCONTRINO: al GESTO della riscossione, sempre e solo
      lì — il pannello dei pagamenti, i tasti rapidi Contanti/Carta della
      card. Mai da uno sguardo sulla coda: la coda stampa comande. «Deve
      avvenire solo quando esco dall'ordine e deve stampare la COMANDA, non
      lo scontrino» (l'utente, 20/08, dopo aver visto uscire la carta di
      tutta la serata rientrando in coda — BUG-055).
      E IL SEGNO «GIÀ STAMPATO» STA SUL DATO: `receipt_print_at` sul conto,
      scritto in sottofondo a carta uscita, come `auto_print_at` sulla
      comanda. La pretesa in localStorage resta come primo filtro per i
      doppioni di questo terminale; il segno sul conto lo sanno tutti, e
      un browser con la memoria vuota non ristampa la serata. Riaprendo un
      conto il segno si azzera: riscuotendo di nuovo la carta esce di nuovo
      (BUG-047).
      DAL 21/08/2026 «SEMPRE E SOLO LÌ» VUOL DIRE: al gesto della
      riscossione CHE CHIUDE IL CONTO. Una riscossione parziale non ha mai
      fatto uscire niente — la stampa è appesa a `closePaid` — ed era una
      scelta presa quando l'acconto era un caso di margine. Adesso quella
      riscossione ha la SUA carta, che è un documento diverso: lo scontrino
      d'acconto (REQ-STAMPA-015). Lo scontrino di chiusura resta quello
      descritto qui, con la sua pretesa e il suo segno sul dato; l'acconto
      non prende né l'una né l'altro, perché è un evento e non lo stato del
      conto — su un conto ce ne stanno tre, e il segno ne lascerebbe uscire
      uno solo.
      SULLA COMANDA LE VOCI SONO SEMPRE ACCORPATE (BUG-083, 22/08/2026), e
      non «come stanno sul conto». Al POS «Unisci / Separa uguali» serve ai
      SOLDI — dividere il conto fra chi paga cosa — mentre chi prepara conta
      PEZZI: quattro righe «1 JEFFERSON» si contano peggio di una
      «4 JEFFERSON». La regola è una funzione pura, `righeDellaComanda` in
      lib/comande.js, e la attraversano tutte le stampe del banco perché il
      punto in cui si accorpa è UNO, dentro `printComanda`. La chiave è
      quella del POS (`lineSignature`): stesso drink, stesso prezzo, stessa
      ricetta e STESSA NOTA — una nota è lavoro diverso, e il prezzo tiene
      separati due prodotti liberi battuti con lo stesso nome a cifre
      diverse. Sui soldi non cambia niente: scontrino e schermata di
      pagamento restano come sono.
      E UNA STAMPA NON PUÒ RESTARE APPESA (BUG-086, 24/08/2026). La carta
      che non esce è un guaio; una stampa che non finisce MAI è un guaio
      peggiore: la pretesa dello scontrino si prende PRIMA di stampare e
      torna libera solo nel `catch` di chi l'ha chiesta — e una promessa
      che non si chiude né bene né male quel `catch` non lo fa partire
      mai. Quel conto non stampa più, nemmeno riaperto, nemmeno dalla
      coda, e a schermo non compare niente. Quindi ogni lavoro di stampa
      ha un tempo massimo suo, QUINDICI SECONDI: scaduti, la promessa
      rifiuta, la pretesa torna libera, il messaggio arriva a schermo e la
      coda delle stampe riparte. Il lavoro abbandonato, se poi arriva in
      fondo, scrive nel vuoto: una seconda copia non esce.
      E UN DOCUMENTO STORTO NON SI MANGIA IL TICKET: una riga senza nome
      esce come «(senza nome)» e una senza prezzo come «0.00€», ma la
      carta esce. Prima `item.name.toUpperCase()` faceva saltare la
      comanda a metà, e l'auto-stampa ci riprovava a ogni snapshot senza
      farla uscire mai.
    status: implemented
    generate_issue: false
    labels: [stampa]
    test_cases:
      - tests/unit/logoScontrino.test.js
      - tests/unit/scontrinoSegnato.test.js
      - tests/unit/comandaAccorpata.test.js
      - tests/unit/aliquotaIva.test.js
      - tests/unit/stampaCheNonSiChiude.test.js

