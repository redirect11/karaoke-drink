  - id: REQ-OFFLINE-006
    title: "Il giro di una serata funziona a rete staccata, e i test lo dimostrano"
    area: "src/lib/api.js, src/lib/sync.js, tests/unit/giroInLocale.test.js, CLAUDE.md"
    description: >
      LA REGOLA PIU' IMPORTANTE DEL PROGETTO NON AVEVA UNA VOCE, e per
      questo si perdeva: stava nei commenti del codice e in un paragrafo di
      CLAUDE.md, ma nessun requisito la teneva ferma e nessun test la
      sorvegliava. E' stata violata piu' volte, sempre per distrazione,
      sempre con lo stesso danno (BUG-045 l'ultima).
      DETTA DALL'UTENTE il 19/08, e queste sono le sue parole: «coda ordini,
      comande, nuovo ordine, modifica ordine, contanti devono lavorare solo
      in locale. Tutto va aggiornato localmente. Le card si devono
      aggiornare subito, le liste anche quando si passa di stato, i
      pagamenti pure. Tutto locale e sincronizzazione in background». E
      ancora: «non voglio aggiungere prodotti in un ordine quando non ho
      connessione e non vedere i dati perche' non c'e' internet».
      COSA VUOL DIRE, in concreto: tutto il giro con la CASSA APERTA deve
      funzionare con la rete staccata. Si batte un ordine, si aggiungono
      righe, si avanza una comanda, si annulla, si incassa in contanti — e
      ogni gesto si vede sullo schermo nell'istante in cui si tocca. La
      sincronizzazione e' una cosa che succede dopo, in sottofondo, e
      nessuno la aspetta.
      LE QUATTRO REGOLE che ne scendono:
      1) niente `await` prima di mostrare l'esito di un gesto — un `await`
      su una scrittura Firestore offline non torna mai;
      2) NON SI RILEGGE QUELLO CHE SI E' APPENA SCRITTO, si compone: la
      scrittura parte in sottofondo, quindi la rilettura prende la versione
      di prima. Si monta il risultato in memoria (`ordineDopo`) dal
      documento di partenza piu' la patch mandata;
      3) se un dato serve e non c'e', si PRECARICA (progressivi.js), non lo
      si chiede in mezzo a un gesto;
      4) le scritture partono in sottofondo (`bgWrite`), con l'indicatore di
      sincronizzazione a dire come sta andando.
      I TEST LO DEVONO DIMOSTRARE, non darlo per buono. Chi tocca queste
      schermate scrive un test che gira SENZA RETE: si mocka
      `firebase/firestore` in modo che ogni scrittura resti appesa per
      sempre e ogni lettura risponda con quello che c'era prima — che e'
      quello che fa davvero una cache mentre la scrittura e' in coda. NON si
      mocka `src/lib/api.js`: si proverebbe il mock invece del codice. Il
      modello da copiare e' tests/unit/giroInLocale.test.js. I test con la
      rete che risponde si fanno IN PIU', non al posto di quelli.
      E C'E' UNA GUARDIA NEL CODICE: un test legge api.js e boccia
      qualunque `return mapOrder(await leggiOrdine(...))`. Una regola scritta
      solo nella documentazione non ferma nessuno — questa e' tornata tre
      volte.
    status: implemented
    generate_issue: true
    labels: [metodo, offline, ordini]
    priority: P1
    test_cases: [tests/unit/giroInLocale.test.js, tests/unit/incassoOffline.test.js, tests/unit/scritturaComande.test.js, tests/unit/codaRicordo.test.js]

  - id: REQ-OFFLINE-007
    title: "Il guscio dell'app e il logo non si aspettano dalla rete"
    area: "public/sw.js"
    description: >
      Il service worker tiene in cache quello che serve ad aprire l'app —
      la pagina, il manifest, l'icona — e da BUG-086 anche `logo.png`, che
      e' la risorsa piu' richiesta di tutte: sta in cima allo scontrino e
      al preconto, negli avvisi in pagina e nelle notifiche di sistema.
      PER IL LOGO SI GUARDA PRIMA LA CACHE, e questa e' la parte che conta.
      Tutto il resto e' servito «prima la rete, e la cache se la rete
      fallisce» — che va benissimo per una pagina, ma non protegge da una
      richiesta che resta APPESA: una fetch che non risolve e non rifiuta
      non fa scattare nessun ripiego, e chi la aspetta aspetta per sempre.
      La sera del 24/08 e' successo esattamente questo, e ad aspettare
      c'era la stampa dello scontrino (BUG-086): l'<img> del logo non ha
      fatto ne' onload ne' onerror, e il conto appena riscosso non e'
      uscito. Precaricarlo da solo non sarebbe bastato — la cache non la si
      sarebbe guardata mai.
      Il logo se lo puo' permettere perche' e' un'immagine ferma: la copia
      nuova si va a prendere lo stesso, in sottofondo, per la volta dopo, e
      un logo cambiato dalle impostazioni ha comunque un altro indirizzo.
      QUANDO LA LISTA CAMBIA, CAMBIA IL NOME DELLA CACHE (v3 → v4). Il
      service worker nuovo si installa, `skipWaiting` lo fa partire subito
      e `activate` butta le cache vecchie: chi ha l'app aperta con la
      versione di prima non perde niente, perche' quello che stava nella
      cache vecchia sta anche nella nuova. E se una risorsa della lista
      manca, l'installazione non si pianta: `addAll` e' tutto-o-niente, il
      suo errore si ingoia e le richieste passano dalla rete come prima.
    status: implemented
    generate_issue: true
    labels: [offline, pwa, stampa]
    priority: P2
    test_cases: [tests/unit/serviceWorkerCache.test.js]
