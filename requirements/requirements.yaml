  - id: REQ-MAG-029
    title: "Un prodotto, piu' fornitori: il listino si stacca dal magazzino"
    area: "src/lib/listini.js, src/components/PurchaseOrdersPanel.jsx, src/lib/inventory.js, src/lib/api.js, firestore.rules"
    description: >
      Nasce da Flavio, che ha provato la sezione Ordini (registrazioni del
      26/08/2026): «questo significa che quel prodotto — ad esempio il
      Campari — deve essere associato a quel fornitore, e io questo non lo
      posso fare CATEGORICAMENTE: e' quasi sicuro che il Campari lo prendo
      anche da fornitori differenti». E subito dopo: «sarebbe buono se avesse
      il campetto di ricerca, in modo tale che io posso mettere il prodotto
      INDIPENDENTEMENTE da quale fornitore resta associato».
      IL DATO CHE CAMBIA LA DISCUSSIONE, misurato il 26/08: il legame
      prodotto-fornitore oggi non esiste. Dieci prodotti su 388 hanno un
      fornitore scritto; gli altri hanno il campo a nullo, perche' l'import
      da Excel lo scrive nullo per ogni riga (src/dev/importExcel.js). La
      sezione Ordini non ha un limite di disegno: non ha i dati. Scegliendo
      NOVA si vedono tre prodotti su 388. Non c'e' niente da migrare.
      IL MODELLO, deciso dall'utente il 26/08: si associano I PRODOTTI AI
      FORNITORI e non i fornitori ai prodotti. Nasce il LISTINO, una
      collezione con una riga per coppia prodotto-fornitore (id
      deterministico, cosi' l'unicita' della coppia e' un fatto strutturale
      e non un controllo applicativo): fornitore, prodotto, prezzo netto per
      pezzo, la confezione DI QUEL FORNITORE, il codice sul suo listino,
      l'ultimo prezzo pagato con la sua data.
      IL MAGAZZINO NON CAMBIA: il prodotto Campari resta UNO, con UNA
      giacenza. Parole dell'utente: «l'entita' prodotto sara' sempre la
      stessa anche se associata a fornitori diversi: se ordino il Campari da
      Pippo o da Pluto deve valere la SOMMA dell'ordine Campari, e il
      magazzino deve popolare il prodotto Campari, che NON sara' duplicato».
      A DUPLICARSI E' LA RIGA DELLA TABELLA. Sempre parole sue: «facciamo
      una tabella con tutta la lista di prodotti, anche se sono duplicati, e
      li distinguiamo per fornitore. Quando Flavio seleziona un fornitore
      vedra' solamente la lista dei prodotti ordinabili da quel fornitore;
      se seleziona un altro fornitore lo puo' ordinare da quell'altro. Se
      non seleziona nessun fornitore vedremo i doppioni, identificati da un
      COLORE e dal fornitore associato». Quindi: senza filtro una riga per
      coppia prodotto-fornitore, col filtro il catalogo di quel fornitore.
      Il colore del fornitore si sceglie alla creazione (a caso, oppure
      scelto a mano) e si vede come le strisce laterali della lista del
      magazzino (REQ-MAG-027).
      I TRE LIVELLI DELL'ORDINE, parole di Flavio del 26/08: «ci devono
      stare i livelli di RICHIESTO, CONSEGNATO, PAGATO. Io mi creo l'ordine
      che devo mandare al fornitore e in quel momento lui non mi carica
      ancora i prodotti; una volta che me li ha portati io faccio
      consegnato, e dopo mi fa il carico». Il carico a magazzino avviene
      quindi al passaggio a CONSEGNATO, non prima: e' questo che risolve
      «ordinato ma non ancora ricevuto» senza inventare uno stato nuovo.
      IL PREZZO SI CORREGGE ALLA CONSEGNA, IL FORNITORE NO. Flavio: «prendo
      dieci cose, mi esce 300 euro di ordine; una volta che il fornitore mi
      scarica l'ordine vedo se veramente sono 300 o di piu' o di meno, e
      modifico il prezzo quando necessario. NON POSSO MODIFICARE IL
      FORNITORE PERCHE' DA LUI L'HO COMPRATO. Lo metto come consegnato, e da
      li' me lo metto come da pagare, e me lo inizia anche a caricare nel
      magazzino». La correzione aggiorna il prezzo di quella riga di listino
      (con la sua data) e il costo di riferimento del prodotto.
      IL COSTO, deciso dall'utente: «il costo del prodotto dipendera' da
      quanto e' stato pagato, dallo specifico fornitore, ma il costo che poi
      viene del menu rimane quello che decide Flavio». Due numeri distinti,
      e nessuno dei due si muove da solo: il LISTINO tiene il prezzo per
      fornitore e serve a CONFRONTARE PRIMA DI ORDINARE; il costo sul
      prodotto resta UN NUMERO SOLO — l'ultimo effettivamente pagato,
      chiunque fosse il fornitore, come gia' fa il carico — e serve a
      VALORIZZARE il magazzino e a calcolare il costo ricetta. Il PREZZO DI
      VENDITA del drink non lo tocca nessuno: e' di Flavio, e il prezzo
      consigliato resta un suggerimento.
      IL FORNITORE PROPOSTO quando si aggiunge un prodotto a un ordine e'
      quello dell'ULTIMO ACQUISTO. Non il piu' economico: il prezzo piu'
      basso in archivio e' quasi sempre il piu' vecchio, perche' nessuno
      aggiorna al rialzo un fornitore da cui non compra piu'. Il piu'
      economico si MOSTRA accanto, come confronto, non si sceglie. Un
      fornitore da cui quel prodotto e' gia' stato ordinato nello stesso
      giro non e' piu' scegliibile per la stessa riga: «va anche bene che e'
      disabilitato il fornitore in quanto gia' l'ho ordinato a quel
      fornitore» (Flavio).
      L'ORDINE RESTA UNO, coi fornitori dentro, e il per-fornitore e' una
      VISTA: e' la decisione del 20/08 in REQ-MAG-025. Di conseguenza il
      testo dell'email, la stampa e il gancio con la fattura vanno per FETTA
      di fornitore: mandare a Nova anche le righe di Enofel e' un errore
      verso il fornitore, non un dettaglio grafico.
      «IN ASSORTIMENTO» NON CAMBIA SIGNIFICATO. Il campo di stato del
      prodotto (assortimento / linea / premium / fuori assortimento,
      REQ-MAG-007) resta politica commerciale. Lo stato «ordinato ma non
      ancora ricevuto» non ha bisogno di un nome nuovo, perche' e' un
      LIVELLO DELLA RIGA D'ORDINE ed e' Flavio stesso a nominarlo:
      richiesto, consegnato, pagato. Il pre-impostato di REQ-MAG-025 punto 5
      resta quello che era: alla consegna, insieme al carico, si puo'
      applicare il cambio di stato commerciale deciso al momento
      dell'ordine.
      COME SI POPOLANO I LISTINI. Li associa Flavio a mano, e va bene cosi':
      «devo associare io i prodotti ai fornitori, in modo tale che magari il
      Campari ce l'ho associato a due fornitori su cinque, e va bene cosi'».
      L'utente ha aggiunto che si puo' tentare di ripassare l'Excel, e il
      dato c'e': REQ-MAG-023 descrive GEN ORD REC.xlsx, centotrenta fogli,
      ognuno il catalogo intero con IL FORNITORE SULL'ARTICOLO e il prezzo
      netto al pezzo. Centotrenta fogli nel tempo vogliono dire lo stesso
      prodotto con fornitori diversi in giri diversi: cioe' il listino, con
      prezzi e date. Il reimport e' una strada, non un prerequisito: la
      schermata deve reggere anche con zero listini.
      IL PASSAGGIO NON MIGRA NIENTE. La compatibilita' sta in una funzione
      sola: un prodotto senza righe di listino ma col vecchio fornitore
      scritto produce una riga VIRTUALE con quel fornitore e quel costo. I
      dieci prodotti agganciati si comportano come oggi, senza che nessuno
      lanci niente contro il database. La scheda prodotto smette di SCRIVERE
      il vecchio campo e non lo cancella. Uno script di pulizia e'
      facoltativo, idempotente, e gira su emulatore o test: LA PRODUZIONE
      NON SI TOCCA.
      DOPO, NON ADESSO (Flavio, 26/08): «affronteremo in un secondo momento
      il discorso delle statistiche, mettiamo prima a posto inventario e
      ordini. Poi vediamo: potrebbe essere carino l'andamento dei prezzi —
      ogni volta che carico qualcosa e vado a modificare il prezzo, il
      sistema mi dovrebbe registrare quanto acquistato e la variazione di
      prezzo su un grafico». La riga di listino con prezzo e data e' gia' il
      dato che serve: la voce si aprira' quando sara' il momento.
      RESTA APERTO: se la confezione di un fornitore diversa da quella del
      prodotto debba potersi ordinare come tale o convertirsi al carico;
      quanti prodotti col vecchio campo e quanti ordini ci siano davvero in
      produzione, da contare in SOLA LETTURA prima di scrivere il ramo di
      compatibilita'.
      FATTO (26/08/2026). Il listino vive nella collezione `supplier_prices`,
      con id `<fornitore>__<prodotto>`: l'unicita' della coppia e' cosi' un
      fatto del database e non un controllo che qualcuno dimentica di fare
      da un secondo terminale. La logica pura sta in `src/lib/listini.js`,
      senza Firebase, perche' e' li' che si prova.
      LA SCHERMATA ORDINI PARTE DALLA RICERCA. Campo «Cerca un prodotto» in
      cima, filtro fornitore sotto come VISTA; il catalogo ha una riga per
      coppia prodotto-fornitore, con la striscia del colore del fornitore —
      le stesse di REQ-MAG-027, riusate e non riscritte — e le due etichette
      «ultimo acquisto» e «piu' economico». Il fornitore si sceglie sulla
      RIGA DELL'ORDINE, dove la decisione conta: la tendina propone l'ultimo
      acquisto e DISABILITA chi e' gia' stato usato per quel prodotto nello
      stesso ordine.
      I TRE LIVELLI stanno sulla RIGA (`stato`: richiesto / consegnato /
      pagato). Il carico avviene alla consegna, per FETTA di fornitore:
      `consegnaRigheOrdine` in api.js alza la giacenza, scrive il movimento,
      aggiorna il prezzo di quella riga di listino con la sua data e il costo
      di riferimento del prodotto. Il vecchio `receivePurchaseOrder`, che
      caricava l'ordine intero in un colpo, non c'e' piu': con piu' fornitori
      dentro quel gesto non esiste, perche' consegnano in giorni diversi.
      Il PAGATO si puo' mettere solo su cio' che e' gia' consegnato.
      EMAIL, STAMPA E COPIA VANNO PER FETTA. `fetteFornitore` taglia l'ordine
      e ogni fetta ha la stessa FORMA di un ordine (data, nome, righe,
      totali): cosi' `purchaseOrderText` e `printOrdineFornitore` non
      cambiano di una riga, e a Nova non arrivano le righe di Enofel.
      IL COLORE DEL FORNITORE si sceglie alla creazione — a caso, oppure a
      mano dalla tavolozza nell'anagrafica — e chi e' nato prima ne riceve
      uno STABILE calcolato dal suo id (`coloreFornitore`), perche' un colore
      che cambia a ogni ricarica non identifica niente.
      NESSUNA MIGRAZIONE, NESSUNO SCRIPT LANCIATO. `rigaVirtuale` fa il ramo
      di compatibilita': un prodotto senza righe di listino ma col vecchio
      `supplier_id` scritto produce una riga virtuale con quel fornitore e
      quel costo. La scheda prodotto ha smesso di SCRIVERE quel campo — ne
      fa una riga di listino — e non lo cancella; il filtro per fornitore
      del magazzino guarda il listino (`fornitoriPerArticolo`) e ricade sul
      vecchio campo dove il listino non c'e'.
      DECISO IN IMPLEMENTAZIONE, e non stava nel testo: (1) un prodotto senza
      nessun fornitore resta ORDINABILE, con la casella vuota e la fetta
      «Senza fornitore» — sono 378 su 388, e nasconderli avrebbe lasciato la
      schermata vuota; (2) la scheda prodotto TIENE la sua tendina fornitore
      (REQ-MAG-028 dice che di li' si crea un fornitore nuovo, e quella
      strada resta), ma adesso scrive nel listino; (3) il catalogo a schermo
      si ferma a 60 righe e lo dice, perche' 388 prodotti per i loro
      fornitori non si scorrono — si cercano; (4) il campo `status` in testa
      all'ordine resta nel vocabolario di prima (inviato / ricevuto) e si
      ricava dalle righe, per non rinominare un campo scritto su documenti
      veri.
      ⚠️ FATTO IL 27/08/2026: IL REIMPORT DEI FOGLI, che qui sopra era
      chiamato «una strada, non un prerequisito». La strada c'era davvero. In
      `GEN ORD REC.xlsx` la colonna `FORNIT` e' compilata su TUTTI e 126 i
      fogli — 420 coppie prodotto-fornitore distinte col prezzo netto, e 33
      prodotti comprati da piu' fornitori, che e' la prova nei dati di quello
      che diceva Flavio. I fogli nominano 13 fornitori mentre l'anagrafica ne
      aveva 6.
      Attrezzi: `scripts/migra-listini.mjs` (il vecchio campo `supplier_id`
      del prodotto diventa una riga di listino) e `scripts/importa-listini.mjs`
      (i fogli diventano listini, agganciando i nomi con `nameMatch.js`).
      Girano SOLO sull'emulatore; la produzione non compare in quei file.
      LA LEZIONE, che vale per il prossimo aggancio di nomi: la somiglianza
      dei nomi NON basta e sbaglia in modo pericoloso, perche' i nomi vicini
      sono spesso prodotti DIVERSI — «Brockmans Agave Cut» non e' «Brockmans»
      (e' gin tagliato con agave, un'altra categoria merceologica) e «Mazzetti
      Barricata» non e' «Mazzetti Bianca». Quello che decide davvero e' IL
      FORMATO: il foglio porta la colonna `cl`, il magazzino il contenuto del
      pezzo, e confrontarli scioglie i casi che il nome lascia aperti —
      «Estathe' Limone» a 33 cl e' la LATTINA e non il vetro, «Schweppes
      Ginger» a 18 cl e' la Ginger BEER (180 ml) e non la Ale (200 ml),
      «Pompelmo» a 20 cl NON e' il «Pompelmo 1L» e va creato. Ha sciolto anche
      «Nikka From the Barrel» → «Nikka»: 50 cl, che e' il formato tipico di
      quella bottiglia mentre le altre Nikka sono da 70.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-037/038). Due cose scritte qui
      sopra sono SUPERATE, e vanno lette li'.
      1) «L'ORDINE RESTA UNO, coi fornitori dentro, e il per-fornitore e' una
      VISTA»: non piu'. L'utente ha deciso il 27/08 UN ORDINE PER FORNITORE.
      La schermata di composizione resta una sola e attraversa i fornitori,
      ma alla conferma nascono N ordini distinti.
      2) «IN ASSORTIMENTO NON CAMBIA SIGNIFICATO»: cambia. E' uno stato
      SUPERIORE e temporaneo che prende il posto di «in linea» o «premium» e
      poi restituisce quello di prima. Il perche' e le regole di entrata e
      uscita stanno in REQ-MAG-037.
      RESTA VERO tutto il resto, ed e' la parte che regge il seguito: il
      listino come collezione con id deterministico, un prodotto solo in
      magazzino con una giacenza sola, il fornitore proposto che e' quello
      dell'ultimo acquisto e non il piu' economico, il costo come numero solo
      e il prezzo del menu che non si tocca.
