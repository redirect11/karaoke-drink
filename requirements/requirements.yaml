  - id: REQ-MAG-024
    title: "Il consumo a settimana si divide per le settimane vere"
    area: "src/lib/warehouse.js stockCountCompute, src/components/InventoryManager.jsx"
    description: >
      COSA FA IL FOGLIO (INV.xlsx, verificato). Ogni conta è un foglio con
      l'intervallo nel nome («07-06 01-07») e, per riga: DEP (giacenza
      iniziale), ACQ (comprato nel periodo), RIM (contato alla fine), CONS =
      DEP + ACQ − RIM, CONS/w, prezzo netto, prezzo ivato, VALORE € = RIM ×
      prezzo, costo al cl, costo alla porzione (prezzo / (cl × 0,34)).
      IL CONSUMO A SETTIMANA È DIVISO PER UNA COSTANTE, non per le settimane
      vere del periodo: nei primi due fogli è «÷ 3», poi «÷ 2» per cinque
      fogli, poi «÷ 1,5» per quindici, poi «÷ 4» negli ultimi nove. Il
      divisore lo si aggiorna a mano ogni tanto, e nel frattempo sbaglia di
      quanto è lontano dalla realtà: «16-02 02-04» sono sei settimane e
      vengono divise per 4, «07-06 01-07» sono tre settimane e mezzo e
      vengono divise per 4 anche loro. È il numero su cui si decide quanto
      ordinare (REQ-MAG-023), quindi l'errore non resta dov'è.
      COSA FA L'APP: `stockCountCompute` calcola DEP + ACQ − RIM e la
      valorizzazione (REQ-MAG-005), ma non calcola nessun consumo a
      settimana — quella colonna non esiste.
      PROPOSTA. Il consumo per settimana si ricava dai GIORNI VERI fra due
      conte, che l'app conosce perché le conte hanno una data: consumo /
      giorni × 7. Nessun divisore da tenere aggiornato, e nessun modo di
      sbagliarlo dimenticandosene. Dove le conte sono meno di due, o troppo
      vicine per dire qualcosa, il numero non si mostra invece di mostrarne
      uno finto: un consumo inventato manda a ordinare merce che non serve.
      NON DIPENDE DA NIENTE: le conte hanno già la loro data e
      `stockCountCompute` calcola già il consumo del periodo — qui si
      aggiunge una divisione e una colonna. Si può partire subito, ed è il
      pezzo che serve prima di REQ-MAG-023.
      FATTO (19/08). `giorniDiConta` e `consumoSettimanale`
      (src/lib/warehouse.js) fanno la divisione sui giorni veri;
      `stockCountCompute` porta `cons_week` su ogni riga e `giorni` sul
      risultato. Nella conta APERTA il periodo arriva ad adesso e si
      allunga mentre la si compila; nel dettaglio di una conta CHIUSA i
      giorni sono quelli fra apertura e chiusura, e il numero si ricalcola
      dalle date — le conte vecchie un consumo settimanale salvato non
      l'hanno mai avuto.
      SOTTO UN GIORNO PIENO NON SI DIVIDE: una conta aperta e chiusa in tre
      ore darebbe un settimanale di otto volte quello vero, e su quel numero
      si decide quanto ordinare. Il numero non si mostra invece di
      mostrarne uno finto.
      E SI ARROTONDA: 1500 / 14 × 7 in virgola mobile fa 749,9999999999999,
      e chi scrive le quantità non riconosce più i 75 cl tondi — lo stesso
      consumo finirebbe scritto in due modi diversi in due schermate.
    status: implemented
    generate_issue: true
    labels: [magazzino, metodo]
    priority: P2
    test_cases:
      - tests/unit/warehouse.test.js
      - tests/component/StockCountPanel.test.jsx

