  - id: REQ-MAG-026
    title: "Gli ordini nascono dalle giacenze: chi e' in esaurimento entra da solo"
    area: "src/lib/warehouse.js, src/components/PurchaseOrdersPanel.jsx, src/lib/api.js"
    description: >
      Chiesto dall'utente il 19/08: «gli ordini andrebbero creati dalle
      giacenze di magazzino. Se un articolo e' in esaurimento dovrebbe essere
      aggiunto automaticamente all'ordine per quel fornitore».
      OGGI E' AL CONTRARIO, ed e' il punto. Il generatore chiede PRIMA il
      fornitore: si apre un ordine per Nova, e solo dentro quell'ordine il
      tasto «Precompila i sotto scorta» propone le quantita' per i prodotti
      di Nova (`suggestedPackages`: sotto soglia si riporta la giacenza a due
      volte la soglia, minimo una confezione). Chi ordina deve quindi
      RICORDARSI da solo quali fornitori guardare: se non apre l'ordine di
      Piccolo, il prodotto di Piccolo sotto scorta non lo vede nessuno. E'
      esattamente il modo in cui si dimentica qualcosa.
      COME DEVE ANDARE: si parte dal MAGAZZINO, non dal fornitore. Una
      passata su tutte le giacenze raccoglie chi e' in esaurimento e lo mette
      nell'ordine del SUO fornitore — il fornitore e' gia' scritto
      sull'articolo (`supplier_id` su `inventory_items`), quindi il
      raggruppamento non chiede niente a nessuno. Da una passata escono N
      ordini gia' compilati, uno per fornitore.
      E QUESTO E' IL GIRO di REQ-MAG-025: la seduta in cui si guarda il
      fabbisogno una volta sola e ne nascono piu' ordini. Con questa voce il
      giro smette di essere un contenitore e diventa il gesto: si guardano le
      giacenze, escono gli ordini, ognuno prende la sua strada (arriva, si
      carica, si fattura).
      LA QUANTITA' NON LA DECIDE QUESTA VOCE: quanto ordinare e' REQ-MAG-023
      (soglia scritta a mano contro consumo reale, con la domanda aperta su
      quante settimane coprire). Qui si decide CHI entra nell'ordine e in
      QUALE ordine; la quantita' resta quella che il calcolo di turno
      propone. Le due voci si incastrano ma non si sovrappongono.
      COSA VA DECISO PRIMA DI SCRIVERE, e non si indovina:
      1) «IN ESAURIMENTO» OGGI VUOL DIRE `stock <= low_threshold`, e senza
      soglia impostata il prodotto non entra mai — silenziosamente. Su un
      magazzino dove le soglie non sono tutte compilate, «crea l'ordine dalle
      giacenze» produrrebbe un ordine che sembra completo e non lo e'. O si
      mostra chiaro quanti prodotti sono rimasti fuori per soglia mancante, o
      si trova una regola che non dipenda solo da quella (il consumo, appunto
      — REQ-MAG-023).
      2) COSA SUCCEDE AGLI ORDINI GIA' APERTI per lo stesso fornitore: si
      aggiunge la riga a quello aperto o se ne fa un altro? Ordinare due
      volte la stessa cassa e' un errore che si paga in magazzino.
      3) CHI NON HA FORNITORE: un prodotto senza `supplier_id` sotto scorta
      non ha un ordine dove andare. Va mostrato a parte, non lasciato cadere
      — e' lo stesso buco delle categorie senza macro (REQ-UI-022) e dei
      prodotti nuovi da sistemare (REQ-MAG-025).
      4) LA PROPOSTA SI CORREGGE SEMPRE: quello che esce e' un ordine da
      guardare e ritoccare prima di mandarlo, non da spedire al buio. Chi sta
      al banco sa cose che la giacenza non sa — la festa di sabato, il
      fornitore che salta la consegna.
      NON TOCCA LO SCARICO: le giacenze restano quelle che sono, con le regole
      di sempre. Questa voce le LEGGE soltanto.
      COM'E' FATTO OGGI IL GENERATORE, letto riga per riga il 19/08
      (src/components/PurchaseOrdersPanel.jsx, 272 righe):
      si sceglie PRIMA il fornitore da una tendina; da quel momento la
      schermata mostra `supplierItems`, cioe' i soli prodotti di quel
      fornitore che non siano 'out'; un tasto «Precompila i sotto scorta»
      riempie le quantita' con `suggestedPackages` (riporta la giacenza a
      DUE VOLTE la soglia di avviso, minimo una confezione, e non propone
      niente se la soglia manca); si aggiusta a mano e le righe con
      quantita' maggiore di zero diventano l'ordine, con totale netto e
      lordo. Da li' l'ordine si stampa, si copia, si manda per email al
      fornitore (mailto precompilato) e, quando arriva, «ricevuto» carica
      il magazzino.
      LE TRE DIFFERENZE con quello che serve, e sono precise:
      (a) OGGI SI VEDE UN FORNITORE PER VOLTA, non tutto l'inventario: chi
      ordina deve ricordarsi da solo quali fornitori aprire, ed e' cosi'
      che si dimentica qualcosa;
      (b) LA QUANTITA' PROPOSTA VIENE DALLA SOGLIA (2x), non da una
      quantita' minima d'ordine scritta sul prodotto — e senza soglia il
      prodotto non viene proposto MAI, in silenzio;
      (c) IL FILTRO ESCLUDE SOLO 'out': i prodotti in assortimento entrano
      nel precompilato come quelli in linea.
      Il resto della macchina — righe, totali, stampa, email, ricevimento e
      carico — c'e' gia' e non si rifa'.
      COME FUNZIONA IL GESTO, deciso dall'utente il 19/08 e da qui si
      implementa. «L'ordine lo deve generare l'admin o il bartender, e
      quando lo genera genera l'ordine per fornitore, e sulla base dei
      prodotti esauriti o in esaurimento. Quando genero un ordine vedro'
      tutto l'inventario ma l'ordine generato conterra' solo quello che
      decide admin/bartender, prepopolato con le quantita' minime (decise
      da admin per prodotto di inventario) da ordinare».
      IN ORDINE, cosa succede:
      1) CHI: admin o bartender (mai la sala). Il confronto si fa con
      src/lib/ruoli.js, che e' l'unico posto dove i ruoli si guardano.
      2) SI PARTE DAL MAGAZZINO, MA SOLO QUANDO LO SI CHIEDE. Parole
      dell'utente (19/08): «ovviamente lo fai solo quando admin crea un
      nuovo ordine e clicca, calcola da magazzino». Non e' una cosa che
      gira da sola ne' che si aggiorna mentre si guarda: e' un tasto, e
      quello che ne esce e' una proposta ferma su cui si lavora. Si guarda
      chi e' esaurito o in esaurimento, e ogni prodotto va nell'ordine del
      SUO fornitore — che e' gia' scritto sull'articolo. Una passata, N
      ordini.
      3) SI VEDE TUTTO L'INVENTARIO, non solo i sotto scorta: la
      schermata mostra l'intero elenco e il prepopolato e' solo un punto
      di partenza. Chi ordina aggiunge quello che sa lui — la festa di
      sabato, il fornitore che salta la consegna — e toglie quello che
      non serve.
      4) NELL'ORDINE FINISCE SOLO QUELLO CHE DECIDE CHI ORDINA. La
      proposta non parte mai da sola.
      5) LA QUANTITA' SI CALCOLA PER DIFFERENZA, e non si stima niente.
      Precisato dall'utente il 19/08, dopo che avevo capito male: «non
      c'entra quanto deve bastare o deve durare. Non lo sappiamo e non lo
      sapremo». Ogni prodotto ha una QUANTITA' MINIMA DA TENERE IN
      MAGAZZINO, decisa dall'admin sull'anagrafica del prodotto; l'ordine
      propone quello che manca per tornarci:
          da ordinare = quantita' minima - giacenza attuale
      Nessuna previsione di consumo, nessun orizzonte di settimane: due
      numeri che l'app ha gia' o che l'admin scrive una volta.
      CAMPO NUOVO da aggiungere all'articolo di magazzino (verificato il
      19/08: oggi non esiste, nessuno dei 388 prodotti di test ce l'ha).
      NON E' LA SOGLIA CHE C'E' GIA': `low_threshold` dice QUANDO avvisare
      («questo sta finendo»), la quantita' minima dice QUANTO deve essercene
      quando si e' a posto. Sono due numeri diversi e servono a due momenti
      diversi — oggi il generatore usa la soglia moltiplicata per due, che
      e' un modo di indovinare il secondo numero dal primo.
      SENZA QUEL NUMERO non si sa quanto ordinare: e' l'unica cosa che
      l'admin deve scrivere perche' il resto funzioni, e va detto chiaro in
      schermata invece di proporre zero in silenzio.
      6) CHI ENTRA NEL PREPOPOLATO: solo i prodotti IN LINEA o PREMIUM.
      Gli altri no. Il campo esiste gia' — `status` sull'articolo, valori
      in ASSORTIMENTI (src/lib/inventory.js): 'assortimento' (il default,
      «si tiene senza niente di speciale»), 'linea' (i cavalli di
      battaglia che non devono mancare), 'premium' (le bottiglie buone),
      'out' (fuori assortimento, non si ricompra).
      ATTENZIONE, UN FATTO DA GUARDARE PRIMA DI SCRIVERE (misurato su
      tana-drink-test il 19/08): dei 388 articoli solo 78 sono classificati
      linea (36) o premium (42). Duecentouno sono in 'assortimento' e
      centonove 'out'. Siccome 'assortimento' e' il DEFAULT di chi non ha
      mai dichiarato niente, la regola cosi' com'e' lascerebbe fuori dal
      prepopolato duecento prodotti — e non si sa se quei duecento sono
      «tenuti senza niente di speciale» per scelta o solo mai classificati.
      Se sono la seconda cosa, l'ordine prepopolato salterebbe in silenzio
      merce che serve, ed e' il tipo di buco di cui ci si accorge quando
      manca la bottiglia. DA CHIEDERE A FLAVIO prima di implementare, e nel
      frattempo la regola resta quella detta: linea e premium.
      NOTA DEL 20/08, dal giro di decisioni su REQ-MAG-025: il carico al
      ricevimento NON e' piu' automatico — «arrivato» lo segna l'admin, e
      il bartender sceglie se e quali righe caricare (o «carica tutti»).
      Questa voce genera l'ordine; il suo ricevimento segue la regola
      nuova scritta la'.
    status: todo
    generate_issue: true
    labels: [magazzino, fornitori]
    priority: P2
    test_cases: []

  - id: REQ-DEV-013
    title: "Una voce scartata si chiude dicendo che non la faremo, e resta scritta"
    area: "scripts/lib-requisiti.mjs, scripts/generate-issues.mjs"
    description: >
      Chiesto dall'utente il 19/08: «perche' cancelli i requisiti? E non li
      chiudi? Non devono scomparire da GitHub ne' dal file dei requisiti» —
      e subito dopo la regola: «se non vengono implementati vengono chiusi
      come won't do».
      VERIFICATO CHE NON SI CANCELLA NIENTE, e il sospetto era infondato: dal
      rilascio 1.5.0 a oggi il registro requisiti e' passato da 172 a 190
      voci e quello dei bug da 33 a 41 — solo aggiunte. Le voci non
      spariscono mai: cambia lo `status`, e sulla bacheca la card cambia
      colonna.
      MA C'ERA IL PROBLEMA OPPOSTO, ed e' quello che questa voce sistema:
      una cosa scartata restava aperta per sempre su GitHub. REQ-MENU-012,
      buttato dall'utente il 19/08, nel registro era gia' `deprecated` e la
      sua issue #36 era ancora APERTA.
      DUE CAUSE, una dietro l'altra:
      1) gli stati che chiudevano un'issue erano solo quelli del lavoro
      finito (`fixed`, `implemented`, `done`): `deprecated` e `wontfix` non
      chiudevano niente;
      2) chi scarta una voce di solito spegne anche `generate_issue`, e il
      generatore prendeva in mano SOLO le voci col flag acceso — quindi
      quell'issue non veniva nemmeno guardata. Orfana due volte.
      COME FUNZIONA ADESSO. Gli stati di chiusura sono due famiglie tenute
      distinte: `STATI_FATTI` (fixed, implemented, done) e `STATI_SCARTATI`
      (deprecated, wontfix). Le scartate entrano nel giro ANCHE senza
      `generate_issue`, ma solo per essere chiuse — `deveNascere` non ne apre
      di nuove. E si chiudono con lo stato che GitHub chiama «not planned»,
      non «completed»: sono due icone diverse, e fra sei mesi una cosa fatta
      e una che abbiamo deciso di non fare non devono leggersi uguali.
      IL COMMENTO CHE RESTA SULL'ISSUE lo dice a parole: «Non la faremo», col
      rimando alla voce del registro e la frase che conta — la voce RESTA nel
      registro col suo perche', qui si chiude solo la richiesta di lavoro. E'
      la differenza fra archiviare una decisione e perderla.
      QUANDO SUCCEDE: alla chiusura vera si arriva da `main`, come per tutte
      le altre (la pipeline chiude le issue solo li'). Da un ramo di rilascio
      il generatore ora lo dice e basta — «Non la faremo (deprecated) —
      l'issue si chiude da main» — invece di ignorare la voce.
    status: implemented
    generate_issue: true
    labels: [metodo, issue]
    test_cases: [tests/unit/issueScartate.test.js]

  - id: REQ-CODA-005
    title: "Nella legenda della coda c'e' anche chi e' collegato adesso"
    area: "src/lib/presenza.js, src/lib/api.js, src/pages/BartenderPage.jsx, firestore.rules"
    description: >
      Chiesto dall'utente il 19/08: «quando un utente si logga ed e' nel
      sistema deve uscire nella legenda nella coda ordini, dove vengono
      indicate le iniziali di chi apre un ordine».
      COM'ERA: la legenda si costruiva SOLO dai conti gia' battuti oggi
      (`placedByLetter` su ordersOggi). Chi si collegava e non aveva ancora
      aperto niente non compariva da nessuna parte — nemmeno per se' stesso,
      e quindi non sapeva con che lettera si sarebbe riconosciuto sulle
      card.
      CHI VEDE COSA, deciso dall'utente il 19/08 e questa e' la parte da non
      sbagliare: «tutti quelli collegati, ma solo admin e bartender possono
      vedere chi e' collegato; staff puo' solo vedere chi ha aggiunto ordine
      con legenda, non vede chi e' online. I clienti non vedono niente».
      Quindi: chi e' collegato lo leggono solo ADMIN e BARTENDER
      (`isGestore`); la SALA vede la legenda di sempre, quella che nasce dai
      conti battuti; il CLIENTE non vede niente. E' riservatezza, non
      dettaglio: sapere chi e' collegato e' un'informazione sulle PERSONE,
      non sul lavoro, e non deve servire a controllare i colleghi.
      MA IL COLPO DI VITA LO DA' CHIUNQUE sia del personale, sala compresa:
      un cameriere non sa chi c'e', ma gli altri sanno che c'e' lui.
      COME SI SA CHI C'E'. Non esiste un logout affidabile — si chiude
      l'app, si blocca il tablet, finisce la batteria — quindi la presenza
      non si spegne: SCADE. Ogni terminale scrive «ci sono» ogni tre minuti
      mentre la pagina e' davanti, e chi tace da piu' di dieci minuti esce
      dall'elenco. Due colpi persi si sopportano (rete che va e viene, il
      tablet che dorme un momento) senza far sparire chi sta lavorando. Non
      serve nessuna pulizia: il tempo fa da solo.
      SOLO MENTRE LA PAGINA E' DAVANTI: un tablet in tasca con l'app aperta
      direbbe «ci sono» tutta la notte. Al ritorno in primo piano parte
      subito un colpo, che e' quello che rimette la lettera in legenda.
      DETTAGLI CHE FANNO LA DIFFERENZA:
      - UNA RIGA PER PERSONA, non per dispositivo: la legenda mostra
      PERSONE, e lo stesso Marco su tablet e telefono e' un Marco solo. E'
      il contrario di `staff_tokens`, che e' per dispositivo perche' li' si
      deve far squillare ogni apparecchio;
      - IL NOME si ricava con `placedByName`, la STESSA funzione che da' il
      nome sulle card: se i due divergessero, uno comparirebbe in legenda
      con una lettera e sui suoi conti con un'altra;
      - CHI HA GIA' BATTUTO NON SI DUPLICA: la sua voce nasce dai conti — il
      dato piu' vecchio e piu' sicuro — e resta com'e';
      - «SEI TU» accanto alla propria voce: e' meta' del motivo per cui la
      cosa e' stata chiesta;
      - un CLIENTE collegato non e' mai una voce della legenda: quella dice
      chi lavora, e la riga «Cliente» nasce dagli ordini, non da chi ha
      l'app aperta;
      - L'ORARIO E' QUELLO DEL CLIENT (`last_seen` ISO, non
      `serverTimestamp`): la finestra si misura con lo stesso orologio che
      poi la legge, se no due terminali con l'ora storta si vedrebbero
      sempre online o mai;
      - LA SCRITTURA NON SI ASPETTA MAI: e' un colpo di vita, non un gesto.
      Se fallisce non deve rompere niente e non deve dire niente a nessuno.
      IL LUCCHETTO STA ANCHE LATO SERVER (`firestore.rules`): legge solo
      `isBartender()` (che li' vuol dire admin+bartender), scrive solo se
      stesso chi e' del personale. Un permesso che esiste solo
      nell'interfaccia non e' un permesso.
    status: implemented
    generate_issue: true
    labels: [coda, ruoli, ui]
    test_cases: [tests/unit/presenza.test.js, tests/component/CodaCorsie.test.jsx]

  - id: REQ-UI-023
    title: "La card della comanda si legge da lontano: numero e nome grandi, meno righe"
    area: "src/components/CorsieComande.jsx, src/components/CorsieStato.jsx, src/components/RigheCorsia.jsx, src/index.css"
    description: >
      Chiesto dall'utente il 19/08 guardando la lavagna del banco: «il badge
      servizio non serve. E poi il nome deve apparire piu' grande vicino
      all'id della comanda. Anche l'id piu' grande. Nome del tavolo e id
      stesse dimensioni e piu' grandi, come quelle degli ordini. Diminuisci
      il numero di item visibile nella card a 4».
      TRE COSE, e vanno insieme: quella card si guarda DA LONTANO, mentre si
      versa, e ogni cosa che non risponde a «di chi e' questo giro» ruba
      spazio a quelle che rispondono.
      1) NUMERO E NOME INSIEME, DELLA STESSA MISURA (1,35rem, grassetto).
      Prima il numero stava in corpo normale e il nome sotto, piccolo e
      smorzato — ma quando si chiama un tavolo si dice «il ventidue, quello
      di Peppe»: sono due meta' della stessa risposta, e una era scritta
      come una nota a pie' di pagina. Il nome NON prende il colore
      d'accento: due cose accese sulla stessa riga si contendono l'occhio, e
      il numero resta il modo in cui il conto si chiama.
      2) VIA IL BADGE «Ritiro / Servizio». Diceva come va consegnato, ma la
      card lo dice gia' senza pastiglie — un conto con un tavolo si porta,
      uno al bancone si ritira — e col tavolo scritto in grande si legge
      prima di prima. Una pastiglia su ogni card pronta costava una riga a
      tutte per una cosa che si capisce dal nome.
      3) QUATTRO RIGHE A VISTA, non sei. Una card da sei righe piu' testata
      piu' tasti si mangiava mezza colonna: con due card la corsia era gia'
      finita e le altre comande stavano sotto il bordo. Quattro dicono lo
      stesso — di che ordine e', e piu' o meno quanto c'e' da fare — in due
      terzi dello spazio, e chi ne ha di piu' tocca «altre N».
      ANCHE LE CORSIE DEI CONTI, non solo quelle delle comande: e' la stessa
