      "non ritirato": lì il drink è stato preparato e il prodotto è consumato.
    status: implemented
    generate_issue: false
    labels: [ordini, magazzino]
    test_cases: [tests/unit/warehouse.test.js]

  - id: REQ-ORD-006
    title: "Chiudendo un conto sparisce subito dalla coda"
    area: "src/lib/ordiniNascosti.js, src/components/OrderPosDetail.jsx"
    description: >
      Chiudendo o annullando si torna alla lista ordini, dove quel conto non deve
      più comparire: la scrittura viaggia in sottofondo e la coda avrebbe ancora
      la versione di prima — lo si vedeva lì, e lo si guardava sparire. I conti
      chiusi da questo dispositivo escono subito dalla lista; se la scrittura
      fallisce ricompaiono, e la memoria scade da sé dopo un minuto.
    status: implemented
    generate_issue: false
    labels: [ordini, coda, ux]
    test_cases: [tests/unit/ordiniNascosti.test.js, tests/component/OrderPosDetail.test.jsx]

  - id: REQ-ORD-007
    title: "La coda distingue aperti e chiusi, e ignora gli annullati"
    area: "src/lib/coda.js"
    description: >
      La coda smista i conti per stato, conta e somma solo i non annullati e sa
      dire quanti conti sono ancora aperti. Con la gestione della preparazione
      attiva un conto pagato ma non servito resta da fare; senza, il pagamento
      chiude e basta. (Dell'avviso «comande non ancora servite» che compariva
      nella schermata di pagamento non resta niente a schermo dal 21/08/2026:
      occupava una riga fissa nella colonna del tastierino. Quello che diceva
      sta nel `title` di «Riscuotere» — vedi REQ-ORD-014.)
      E la coda è il lavoro di ADESSO: un conto incassato o annullato prima
      dell'ultima chiusura di cassa non compare, in nessuna tab — chiusi,
      annullati o tutti — perché quei conti sono già stati contati e
      rendicontati; stanno in Cassa, nella lista ordini. Non basta guardare
      la giornata: in una serata la cassa si chiude e si riapre. I conti
      APERTI restano sempre, cassa chiusa compresa: quelli sono da chiudere,
      e nasconderli vorrebbe dire perderli.
      Chiudendo o annullando un conto si scrive in QUALE cassa è successo, e
      la coda tiene d'occhio anche quelli: senza, un conto aperto giorni
      prima e annullato stasera usciva dall'elenco dei conti aperti, non
      entrava in quello di oggi — che guarda la data di apertura — e spariva
      dallo schermo nell'istante in cui lo si annullava. Vale anche per il
      rendiconto di cassa: un tavolo aperto ieri e incassato stasera è
      incasso di stasera.
      Conta QUANDO è stato chiuso, non quando è stato aperto: un conto di
      ieri rimasto aperto e annullato stasera è successo stasera, e guardando
      la sessione in cui era nato spariva dalla tab «annullati» nell'istante
      in cui lo si annullava — si agisce su un conto e quello svanisce, senza
      sapere se l'operazione è andata a buon fine.
      Il riepilogo in testata NON cambia cambiando tab: è cumulativo — aperti,
      chiusi e annullati di questa apertura — e si calcola sugli ordini
      grezzi, non su quelli che la tab sta mostrando. «In corso» nasconde i
      conti appena chiusi da qui e le altre tab no: il numero ballava solo
      perché si toccava un filtro.
      Il riepilogo in testata è di questa apertura di cassa — a cassa chiusa
      sono zeri — e accanto ad aperti e chiusi dice quanti conti sono stati
      ANNULLATI, che non fanno cassa ma sono un dato del banco. Chi la cassa
      non la apre mai continua a vedere la giornata: è l'unico riferimento
      che ha.
    status: implemented
    generate_issue: false
    labels: [ordini, coda]
    test_cases:
      - tests/unit/coda.test.js
      - tests/unit/codaCache.test.js
      - tests/unit/cashSessionHook.test.js
      - tests/component/PaymentScreen.test.jsx

  - id: REQ-ORD-014
    title: "Riscuoti, oppure riscuoti e servi in un colpo solo"
    area: "src/components/PaymentScreen.jsx, src/lib/api.js"
    description: >
      Con gli stati del servizio, incassare non chiude il conto: si paga anche
      in anticipo e restano drink da fare, e marcare tutto «servito» farebbe
      sparire dalla coda lavoro ancora da fare. Il conto si riscuote sempre,
      si chiude solo quando è servito.
      Al banco però capita spessissimo il contrario — si consegna e si
      incassa nello stesso gesto — e lì due passaggi sono uno di troppo: il
      locale può accendere «Un tasto per incassare e servire insieme»
      (Impostazioni → Pagamenti). Acceso, nella schermata di
      pagamento compare anche «Riscuoti e servi», che chiude il conto in un
      colpo. Spento di default: chi segue il servizio di solito lo segue
      apposta. Il tasto non compare dove non serve — servizio spento, conto
      già servito o già chiuso.

      DOVE SI ACCENDE, dal 21/08/2026: in «Pagamenti», accanto al gemello
      «incassare senza stampare». Stava in «Gestione preparazione» e
      l'utente non lo trovava (BUG-070) — chi cerca un tasto della
      schermata di pagamento apre Pagamenti. La condizione se l'è portata
      dietro: l'interruttore si vede solo col servizio acceso, perché
      «servire» esiste solo se si seguono i passi, e un interruttore che
      non fa niente è peggio di uno assente.

      COME STA IN SCHERMATA, dal 21/08/2026: «Riscuoti e servi» e
      «Riscuoti (senza stampa)» stanno AFFIANCATI su una riga sola sotto al
      tasto grande — «mettili affiancati, non uno sopra l'altro» (l'utente,
      21/08/2026). «Riscuotere» resta da solo a tutta larghezza: è il
      gesto normale, le altre due sono le eccezioni. Le due condizioni sono
      indipendenti, quindi in riga può finirci un tasto solo: in quel caso
      si allarga e prende tutto. Su un telefono stretto vanno a capo invece
      di stringersi — le scritte sono lunghe e il bersaglio resta da
      pollice.

      L'AVVISO A SCHERMO NON C'È PIÙ, dal 21/08/2026. Sotto il display del
      tastierino c'era una riga fissa — «⚠️ Comande non ancora servite: il
      conto resta aperto anche dopo l'incasso, a meno di «Riscuoti e
      servi»» — e l'utente l'ha fatta togliere: «questo messaggio toglilo,
      che occupa spazio quando zoomo». Ha ragione due volte: quella riga si
      legge una volta sola in una vita, e nella colonna centrale ogni riga
      fissa è altezza tolta al tastierino — che a zoom alto proprio lì
      finiva sotto «Riscuotere» (BUG-075).
      L'informazione non è sparita, sta dove non costa altezza. La dice a
      voce alta il tasto stesso: «Riscuoti e servi · chiude il conto» —
      quel «chiude il conto» dice per differenza che l'altro non chiude. E
      quando il locale tiene spento quel tasto, e quindi non c'è, resta il
      `title` di «Riscuotere», che porta la stessa frase di prima e non
      occupa niente. Nessun terzo posto e nessun altro banner: è la stessa
      regola con cui il motivo di un metodo di pagamento spento non sta
      scritto sotto al tasto (REQ-PAG-004).

      E È L'UNICA STRADA CHE SERVE LE COMANDE. Il pagamento non può portare
      avanti nel flusso una comanda che sta a «da fare», «in preparazione» o
      «pronto»: quei drink vanno fatti lo stesso, e una comanda che risulta
      servita senza esserlo sparisce dagli occhi di chi doveva prepararla e
      scarica il magazzino per roba mai uscita. `autoServe` parte SPENTO in
      chiusuraPagamento, registerPayment e markOrderPaid, e il pagamento di
      un gruppo (payGroupCash) passa dalla stessa regola: sbagliando in
      questo verso resta un conto aperto e si chiude, sbagliando nell'altro
      non si torna indietro. Senza gli stati del servizio i passi non
      esistono e il pagamento chiude, come ha sempre fatto.
    status: implemented
    generate_issue: false
    labels: [ordini, pagamenti, impostazioni]
    test_cases:
      - tests/component/PaymentScreen.test.jsx
      - tests/component/SettingsTab.test.jsx
      - tests/unit/css.test.js
      - tests/unit/pagamentoNonServe.test.js

  - id: REQ-ORD-019
    title: "Chi ha preso l'ordine lo modifica davvero: anche aggiungendo"
    area: "src/pages/OrderStatusPage.jsx, src/components/OrderPosDetail.jsx"
    description: >
      Nel dettaglio di un ordine, la sala poteva solo cambiare le QUANTITÀ di
      quello che c'era già: chi aveva preso l'ordine e si sentiva dire
      «aggiungi anche una birra» doveva battere un secondo conto.
      «Modifica ordine · aggiungi prodotti» apre la schermata del conto: la
      stessa del banco, quella vera, con la griglia dei prodotti. Niente
      versione ridotta — chi prende un ordine al tavolo ci fa le stesse
      cose, e un tasto spento in una schermata e acceso nell'altra è solo
      una cosa che non si capisce. Aprire e chiudere la CASSA resta invece
      del banco (REQ-CASSA-008): quella è la serata, non il conto.
      «Salva modifiche» resta dov'è: correggere una quantità e aggiungere un
      drink sono due gesti diversi, e chi fa il primo non deve passare per
      una schermata intera.
      E c'è «Pagamento», che apre la stessa schermata già sul pagamento: al
      tavolo si incassa lì, e senza quel tasto bisognava tornare in coda,
      riaprire il conto dal banco e incassare da lì — col cliente che
      aspetta col portafogli in mano. Su un conto già saldato o annullato
      non compare.
      Al cliente niente di tutto questo: dal suo telefono modifica le
      quantità del proprio ordine finché è ricevuto, e basta.
    status: implemented
    generate_issue: false
    labels: [ordini, staff]
    test_cases: [tests/component/OrderStatusPage.test.jsx]

  - id: REQ-ORD-018
    title: "Salvare le modifiche a un ordine lo dice, e riporta indietro"
    area: "src/pages/OrderStatusPage.jsx"
    description: >
      Nel dettaglio ordine della vista staff, «Salva modifiche» tornava
      «Salva modifiche» e basta: identico a prima di premerlo. Chi aveva
      cambiato una quantità restava lì a chiedersi se fosse andata, e spesso
      ripremeva. Ora la conferma si vede e si torna alla coda — da dove si è
      arrivati, e dove il conto si rilegge aggiornato. In errore invece si
      resta, e il motivo si dice anche col toast: l'avviso in fondo alla
      pagina, su un conto lungo, sta fuori schermo — chi ha premuto vede il
      tasto tornare com'era e crede che non sia successo niente.
    status: implemented
    generate_issue: false
    labels: [ordini, ux]
    test_cases: [tests/component/OrderStatusPage.test.jsx]

  - id: REQ-ORD-017
    title: "Il QR per il cliente c'è solo se c'è qualcosa da seguire"
    area: "src/pages/OrderStatusPage.jsx"
    description: >
      Sul dettaglio di un ordine battuto al banco, allo staff compare «Mostra
      QR al cliente»: chi lo scansiona segue il proprio drink dal telefono.
      Con gli stati del servizio SPENTI non c'è niente da seguire — la
      pagina dice solo cosa è stato ordinato — e offrirlo è promettere una
      cosa che non succede: lì il tasto non compare.
    status: implemented
    generate_issue: false
    labels: [ordini, clienti]
    test_cases: [tests/component/OrderStatusPage.test.jsx]

  - id: REQ-ORD-015
    title: "Nella lista ordini si cercano anche le serate passate"
    area: "src/lib/periodo.js, src/components/SelettorePeriodo.jsx, src/components/OrdersHistory.jsx, src/lib/api.js"
    description: >
      La lista mostrava gli ultimi conti e basta: per ritrovare una serata di
      due settimane fa non c'era strada. C'è un selettore a calendario come
      quelli degli alberghi — si tocca il giorno d'inizio, poi quello di
      fine, e in mezzo si accende tutto; un tocco solo vuol dire quella
      serata e basta, che è il caso più frequente. Sopra ci sono le
      scorciatoie (oggi, ieri, ultimi 7 e 30 giorni), perché quasi sempre si
      cerca lì.
      I giorni sono GIORNATE COMMERCIALI: la serata del venerdì finisce alle
      quattro del sabato, e chi cerca «venerdì» cerca quella. I giorni futuri
      sono spenti. Scelto un periodo, i conti si vanno a leggere dal
      database: in tempo reale ci sono solo gli ultimi.
      C'è anche un filtro su CHI ha aperto il conto — il locale (banco e
      sala) o il cliente dal suo telefono — che compare solo se di ordini dai
      clienti ce n'è davvero: dove non succede sarebbe una domanda senza
      risposta.
    status: implemented
    generate_issue: false
    labels: [ordini, cassa]
    test_cases: [tests/unit/periodo.test.js]

  - id: REQ-ORD-016
    title: "Battere un conto non aspetta la rete, e non ne nascono due"
    area: "src/lib/progressivi.js, src/lib/api.js, src/components/OrderPosDetail.jsx"
    description: >
      Prima di scrivere un ordine si facevano TRE letture al server — quale
      cassa è aperta, il progressivo della serata, quello assoluto — e solo
      dopo il conto compariva: era il mezzo secondo fra «Conferma» e il conto
      a schermo. Adesso quei numeri stanno in memoria, tenuti aggiornati da
      ascolti che partono all'avvio dell'app: alla creazione non si chiede
      niente a nessuno.
      E DUE CONTI NON PRENDONO PIÙ LO STESSO NUMERO. Il numero è il più
      grande fra quello del server e l'ultimo dato da questo dispositivo, più
      uno: due creazioni ravvicinate non possono più leggere lo stesso valore
      solo perché la scrittura del contatore è ancora per strada — è così che
      sono nati due conti #15 nella stessa serata. Quello che si è assegnato
      resta scritto anche dopo un ricaricamento, e il contatore si scrive con
      un incremento, che non torna mai indietro.
      Resta scoperto un solo caso: due DISPOSITIVI che battono nello stesso
      istante. Escluderlo vorrebbe dire una transazione, cioè aspettare il
      server a ogni ordine — il contrario di quello che serve al banco.
      IN QUALE SERATA SI STA, ci si RICORDA. Il contatore da usare dipende da
      una domanda sola — c'è una cassa aperta? — e finché l'ascolto su
      `counters/_active_cash` non ha risposto quella domanda ha una terza
      risposta possibile, «non lo so ancora», che non è «no». Presa per un
      no, il conto si numerava sul contatore della GIORNATA — che è un altro
      contatore, e nella stessa sera dà lo stesso numero — e nasceva perfino
      senza serata (`cash_session_id: null`), quindi fuori dalla chiusura di
      cassa. L'ultima cassa che si sapeva aperta resta scritta in memoria
      locale, come i numeri già assegnati, e vale per la giornata commerciale
      in cui è stata scritta: un ricaricamento non fa più dimenticare la
      serata, e non si aspetta nessuno. Quando il server dice che nessuna
      cassa è aperta — che è una risposta — la memoria si cancella.
      UNA BATTUTA, UN CONTO. La schermata può chiedere la creazione due volte
      (l'auto-creazione che scatta mentre si preme «Paga», un doppio tocco):
      la chiave della battuta fa restituire il conto che sta già nascendo
      invece di farne un altro.
      E il «+» apre sempre un conto NUOVO: la memoria del conto in corso
      serve a riprenderlo dopo un ricaricamento della pagina, non a
      rimetterci dentro chi esce e rientra.
      DUE TERMINALI, LO STESSO NUMERO: la disputa la chiude il SERVER, che è
      l'unico posto dove esiste un «prima» e un «dopo» veri. Tiene il numero
      chi è arrivato prima; chi arriva dopo prende il primo libero dopo il
      più alto — un buco in mezzo sarebbe di un conto ancora per strada, e la
      disputa ricomincerebbe. A parità di istante decide l'id del documento:
      arbitrario, ma UGUALE per i due terminali, che è l'unica cosa che
      conta. Tutto automatico: al banco non si ferma una serata per un
      numero. Il numero cambia solo a chi ha perso, e resta scritto da dove
      veniva (`daily_number_precedente`), perché la comanda può essere già
      uscita dalla stampante col numero vecchio.
      LE TRE SCHERMATE DEL SERVIZIO — coda, conto, pagamento — LAVORANO IN
      LOCALE. Leggono dalla cache, scrivono in sottofondo e si aggiornano da
      sole quando il server manda qualcosa di nuovo. Niente attese per far
      vedere l'esito di un gesto: incassare, annullare, aggiungere una riga
      si vedono nell'istante in cui si tocca, e i numeri in cima si muovono
      con loro. Il dato che serve si PRECARICA — i progressivi, la cassa
      aperta — invece di andarlo a chiedere al momento del bisogno.
      QUELLO CHE HO APPENA FATTO IO STA IN UN POSTO SOLO
      (src/lib/comandeLocali.js): l'array `comande` come lo vede questo
      terminale, per conto, che se ne va da sé quando il server racconta la
      stessa cosa. «La stessa cosa» è la FIRMA DEL LAVORO (firmaLavoro in
      comande.js): i passi e le quantità, senza gli id — una comanda appena
      creata qui non ha ancora il nome che le darà il server — e senza i
      campi che il server aggiunge per conto suo. Si toglie solo allora, mai
      subito dopo la scrittura: quella risponde PRIMA dello snapshot, e
      toglierla lì farebbe riapparire per un battito lo stato di prima.
      Erano tre copie della stessa idea (la coda, il conto, il dettaglio
      della comanda) e si comportavano già in modo diverso.
      DOVE FINISCONO LE RIGHE AGGIUNTE a un conto aperto lo dice
      `comandaPerLeAggiunte` (comande.js), un punto solo per tutte le
      strade. La regola si è formata in tre passaggi nello stesso giorno, e
      vale la pena tenerli tutti e tre: è la storia di come si è capito.
      (1) 20/08, SERA PRIMA. «Se una comanda passa da "da fare" a "in
      preparazione", i prodotti successivi che aggiungo all'ordine dovranno
      creare una NUOVA comanda. Al momento succede solo se da in
      preparazione passano a da servire. Se sono in preparazione significa
      che la vecchia comanda è stata già presa in carico». Il perché sta in
      quell'ultima riga: chi sta già shakerando non deve vedersi allungare
      il ticket sotto le mani. (Prima ancora la domanda era «c'è una
      comanda nel passo dove NASCE il lavoro?», e prima ancora
      `comandaEditable`, che vuol dire «si può ancora toccare» e includeva
      «in preparazione» — BUG-024.)
      (2) 20/08, DOPO IL DANNO AL BANCO: un conto solo, DUE facsimili — un
      LIMONCELLO da solo e poi tutto il resto. «Mi crea più comande quando
      creo un solo ordine. In fase di creazione deve gestire tutto come UNA
      comanda. Devi aggiungere prodotti a una NUOVA comanda solo se lo
      stato viene PASSATO in preparazione (comanda presa in carico)». Da
      qui: IL DISCRIMINE È LA PRESA IN CARICO, NON LO STATO. Una comanda
      NATA «in preparazione» perché il locale ha acceso quell'impostazione
      non l'ha presa in mano nessuno, e accoglie; una PORTATA lì da un
      gesto no. Si distinguono col segno `presa_in_carico`, che scrive solo
      `advanceComanda` e mai la nascita. Sui documenti vecchi il campo non
      c'è: lì vale lo stato con la regola prudente — «in preparazione»
      senza segno è presa in carico, così i ticket già in mano al banco non
      si gonfiano.
      (3) 20/08, LA RIFINITURA: LA SESSIONE DI CREAZIONE. «Se non sono
      ancora uscito dalla creazione ordine (solo con il tasto indietro agli
      ordini) quella è sempre UNA SOLA comanda (anche se da creazione
      ordine vado in pagamento). Quando torno alla coda ordini e rientro in
      un ordine creato — e creato significa che la prima volta che lo creo,
      se non esco dalla creazione vuol dire che lo sto ancora creando —
      allora lì, se aggiungo altri prodotti, ha senso creare una nuova
      comanda». Quindi la creazione ha un SOTTOSTATO, scritto sul conto
      (`in_creazione`): lo apre il POS alla nascita e lo chiude l'uscita
      dalla schermata — andare in pagamento e tornare non lo chiude, è
      sempre la stessa battuta. Finché è aperto: ogni aggiunta entra nella
      comanda 1, qualunque stato abbia e qualunque impostazione abbia il
      locale, e L'AUTO-STAMPA NON PARTE (`comandeDaStampare` salta le
      comande di un conto in creazione). Il ticket esce quando la sessione
      si chiude, e allora è completo. Il local-first non cambia di un
      millimetro: il conto nasce al primo prodotto e la card si vede
      subito, cambia solo il sottostato.
      A SESSIONE CHIUSA, rientrando in modifica: con gli stati del servizio
      ACCESI decide la presa in carico (comanda non presa in mano → le
      righe ci entrano; presa in mano → ne nasce una nuova, che stampa da
      sé). Con gli stati del servizio SPENTI non esiste nessun appiglio per
      decidere, e a saperlo è solo chi sta al banco: «il bartender/admin
      SCEGLIE, solo in modifica». Due tasti sotto il totale — «Nella
      comanda» / «Comanda nuova» — e finché non si risponde le righe
      restano a schermo, dove si vedono. Uscendo senza scegliere vanno
      nella comanda, che è la strada che non fa carta in più.
      L'ESCLUSIONE DELLA COMANDA GIÀ STAMPATA (`auto_print_at`, BUG-050)
      NON C'È PIÙ: contraddiceva la regola nuova, e un conto battuto in
      fretta faceva un ticket per riga. La ragione per cui era nata resta
      vera — se una comanda già stampata si gonfia, la carta al banco è
      vecchia — e la cura coerente è un'altra: quando una comanda NON presa
      in carico riceve aggiunte, il suo `auto_print_at` si AZZERA e la coda
      RISTAMPA il ticket completo. Il banco butta il foglio vecchio e ha
      quello giusto. La pretesa locale della stampa segue le RIGHE e non
      solo l'id, o il terminale che aveva già stampato resterebbe zitto.
      SE L'APP MUORE A METÀ BATTUTA il segno resta appeso e quella comanda
      non esce da sé. È una decisione, non un buco: «non è un problema,
      Flavio può ristampare la comanda con l'apposito tasto» (l'utente,
      20/08). Anche un avanzamento di stato chiude la sessione: se qualcuno
      l'ha preso in mano, la composizione è finita comunque.
      La comanda nuova che nasce da un'aggiunta esce da sola:
      `comandeDaStampare` la vede perché è al banco e non porta il segno.
      Una comanda provvisoria nasce col passo e il numero che avrà DAVVERO,
      o si vedrebbe cambiare da sé un istante dopo.
      IN CHE PASSO NASCE UNA COMANDA lo decide il locale
      («Le comande nascono già in preparazione», Impostazioni → Gestione
      preparazione; di suo SPENTA, quindi «da fare») e lo si chiede a
      `statoComandaNuova(settings)` in comande.js. Vale allo stesso modo per
      la prima comanda di un conto nuovo e per le aggiunte a metà serata:
      prima erano due regole diverse scritte in due posti, più una terza nel
      placeholder della coda, e le tre risposte non combaciavano — la card
      compariva «Al banco» e saltava in «Da fare» appena arrivava dal
      server. È una FUNZIONE e non una costante esportata apposta: con un
      valore da copiare basta che una strada scriva un «ricevuto» a mano
      per non seguire l'impostazione, e non se ne accorge nessuno.
      COL SALTO ACCESO IL PASSO «DA FARE» NON ESISTE, e non deve comparire
      da nessuna parte come destinazione: sparisce dalle pastiglie
      «↩︎ Torna a…» (statiPrimaComanda in comande.js: i passi già fatti,
      meno quelli PRIMA di dove nasce il lavoro) e dall'elenco delle
      colonne che si accendono a mano (corsieSceglibili). Non si tocca
      però quello che c'è già: una comanda ferma a «da fare» resta dov'è e
      va avanti normalmente, e la sua colonna compare da sé
      (corsieDaMostrare) — il lavoro non si nasconde mai, e a mostrarlo è
      l'app, non una voce di menu che l'utente deve trovare.
      LE PAROLE DEL BANCO NON SONO QUELLE DEL CLIENTE: al banco il passo si
      chiama «Da fare» come la colonna (statoAlBanco in orderStatus.js), al
      cliente «Ordine ricevuto», che è quello che gli serve sapere — non è
      lui che lo deve fare. Due etichette, non una sola «giusta».
      E UNA SCRITTURA IN SOTTOFONDO TOCCA SOLO I CAMPI CHE LE COMPETONO:
      `comande` è un array e Firestore lo riscrive intero, quindi chi scrive
      si rilegge il documento NELL'ISTANTE PRIMA DI SCRIVERE, non all'inizio
      del lavoro (vedi BUG-022: fra le due cose ci sono le letture di
      ricette e articoli, e l'array vecchio si portava via l'avanzamento
      appena fatto).
      Anche i tasti: «invia comanda» e «annulla ordine» funzionano su un
      conto appena battuto, senza aspettare che esista sul server. E
      annullare lascia SEMPRE un conto annullato, anche se l'ordine non era
      ancora nato: il numero è già stato mostrato e preso, e di quello che è
      stato battuto deve restare traccia.
      LA SCHERMATA DEL CONTO NUOVO SI APRE PULITA, senza pulizie
      all'apertura: uscendo — dalla freccia, dal menu, dal tasto indietro —
      quello che è stato battuto diventa un conto e la bozza si chiude. La
      «bozza che non si perde» continua a valere: non si perde perché
      diventa un conto, non perché resta in un cassetto da cui il conto dopo
      se la ritrova dentro.
      Un tasto 🧹 svuota tutte le righe in un colpo (con conferma), invece
      di toglierle una per una. E la
      bozza si svuota all'istante: aspettare la scrittura voleva dire
      aprire il conto dopo e trovarci dentro le righe di quello prima.
      LE MODIFICHE CHE NON PASSERANNO MAI si dicono e si scartano. «Il
      documento non esiste più» o «non hai i permessi» non cambiano al
      secondo tentativo — succede quando qualcuno cancella un prodotto
      mentre tu ne stavi scalando la scorta — quindi non si riprovano da
      sole, si spiegano a parole («una scheda del magazzino non esiste
      più») e si tolgono dalla lista con un tasto. Senza, la campanella
      resta rossa per sempre su roba che non si può salvare.
      E QUELLO CHE SI SCRIVE ARRIVA AGLI ALTRI DA SÉ. Ogni modifica entra
      prima nella memoria locale e parte per il server in sottofondo: gli
      altri terminali la vedono comparire senza che nessuno prema niente.
      Offline le scritture non falliscono — restano in coda dentro Firestore,
      che le conserva anche a app chiusa, e partono appena c'è linea. Quelle
      RIFIUTATE (un errore vero, la rete che si chiude a metà) si riprovano
      da sole al ritorno della rete, fino a tre volte: oltre, restano lì e lo
      dice la campanella, perché una scrittura che continua a essere
      rifiutata ha bisogno di una persona, non di un altro tentativo.
      E NIENTE ASPETTA IL SERVER. Ogni azione su un conto — incassare,
      annullare, avanzare, aggiungere righe — leggeva il documento dal
      SERVER prima di scrivere: da lì il ritardo fra il tocco e la coda che
      si muove, e il riepilogo in cima che sembrava aggiornarsi solo alla
      risposta del server. Si legge dalla cache, che l'ascolto della coda
      tiene già allineata.
      E USCIRE DAL CONTO NON ASPETTA NIENTE. Il box del nome aspettava che il
      conto fosse nato per sapere se chiederlo — ma il nome si sa già dalla
      schermata: l'unica cosa che quell'attesa produceva era il box in
      ritardo. Il conto nasce per conto suo, e il nome lo raggiunge appena
      c'è.
      DUE GESTI RAVVICINATI SULLO STESSO CONTO NON SI CANCELLANO PIÙ
      (BUG-056, lib/mutazioniOrdine.js). Ogni mutazione ricompone l'array
      `comande` e lo riscrive INTERO — Firestore un array lo riscrive
      intero — quindi due gesti partiti insieme leggevano lo stesso passato
      e l'ultimo che scriveva cancellava l'altro: battendo in fretta
      restava una riga sola, o nascevano due «comanda 2». Adesso le
      mutazioni di UNO STESSO conto si mettono in fila (una catena di
      promesse per conto, come la coda di stampa), e conti diversi non si
      aspettano fra loro: al banco si lavora su più conti insieme.
      LA FILA DA SOLA NON BASTA, ed è il pezzo meno ovvio: il turno finisce
      quando la scrittura è PARTITA — local-first, non si aspetta niente —
      non quando la cache l'ha applicata, e fra le due cose passa un giro.
      Quindi ogni mutazione RICORDA il conto come l'ha appena composto, e la
      mutazione dopo legge quello finché la cache non ha recuperato. Come si
      capisce che ha recuperato: si guarda se i campi scritti sono tornati
      indietro uguali — nessun timer che indovina. Un tempo massimo c'è, ma
      è solo la rete di sicurezza per la scrittura che in cache non arriverà
      mai. Il limite, dichiarato: finché il ricordo è vivo, una modifica di
      un ALTRO terminale sugli stessi campi si perde — è la finestra fra la
      scrittura e la cache, millisecondi, ed è lo stesso «l'ultimo che
      scrive vince» che c'era già, ristretto invece che allargato.
    status: implemented
