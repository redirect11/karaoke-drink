      del proprio conto — mentre ELENCARNE tanti passa solo dove la domanda
      si dimostra sicura da sé: il personale, il cliente registrato sui conti
      del suo account, e le due liste del tabellone del menù. Da qui scende
      una cosa nel client: «i miei ordini» del cliente non registrato chiede
      i conti salvati sul telefono uno per id, non con una lista (BUG-093).
