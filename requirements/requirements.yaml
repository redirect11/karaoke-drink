  - id: REQ-PAG-010
    title: "Si vede che cosa è stato pagato, e cosa copre"
    area: "src/lib/pagamento.js, src/components/OrderPosDetail.jsx, src/components/PaymentScreen.jsx"
    description: >
      In fondo al conto c'era una riga sola: «Sconto e acconti già incassati
      −15,00 €». Quindici euro di che? Uno sconto, un acconto, con che
      metodo, per quali righe? Al banco, davanti al cliente che chiede,
      quella riga non risponde a niente.
      Ora sono righe distinte: lo sconto per conto suo, e ogni incasso col
      suo metodo e la sua ora.
      E si dice cosa copre. Un importo battuto a mano — «30 €» — NON copre
      nessuna riga: sono soldi lasciati sul conto, e si chiama ACCONTO.
      Chi paga scegliendo le righe copre esattamente quelle, e sotto
      l'incasso si leggono («2× Daiquiri · 1× Birra»). Non c'è una riga di
      istruzioni sopra le righe: a dire da dove viene il numero ci pensa
      l'etichetta sopra l'importo — «RIGHE SCELTE» o «IMPORTO A MANO» — che
      si legge nel momento in cui serve. Attribuire delle
      righe a un importo battuto a mano vorrebbe dire inventarselo: se
      servono attribuite, si scelgono nella schermata di pagamento — che è
      esattamente a cosa serve la selezione a sinistra.
    status: implemented
    generate_issue: false
    labels: [pagamenti, ux]
    test_cases: [tests/unit/pagamento.test.js]

  - id: REQ-ORD-008
    title: "Un conto chiuso o annullato si può rimettere in corso"
    area: "src/lib/storiaOrdine.js, src/lib/api.js, src/components/StoriaOrdine.jsx"
    description: >
      Capita di chiudere un conto sul tavolo sbagliato, di annullarlo per un
      malinteso, o che il cliente torni e voglia ordinare ancora su quello.
      Nella storia CHI ha fatto una cosa si scrive sempre allo stesso modo:
      il NOME, col ruolo fra parentesi se si sa. Mai l'email, che è un
      indirizzo e non una persona. Prima la stessa persona compariva tre
      volte con tre etichette diverse — l'email all'apertura, il ruolo
      all'annullo (l'unica cosa che quella strada scriveva), il nome alla
      riapertura — e chi leggeva non poteva dire «è stato lui».
      Chi ha il gestionale può rimetterlo in corso: si conferma in un pannello
      che dice cosa succederà e si può scrivere il perché — FACOLTATIVO, perché
      se fosse obbligatorio si scriverebbe "x" per passare oltre, e al banco i
      secondi non ci sono. Il conto torna aperto e si può battere di nuovo.
      RIAPRIRE = COME SE NON FOSSE MAI STATO PAGATO. Gli incassi si tolgono:
      il conto riaperto è un conto normale, da battere e da incassare, con
      tutte le righe modificabili. Prima gli incassi restavano attaccati e il
      conto tornava «ad acconto»: le righe già pagate erano bloccate — e
      riaprire serve proprio a toccarle — e i soldi restavano nei guadagni
      della serata di un conto che era di nuovo da incassare, quindi a fine
      turno lo stesso conto risultava incassato due volte.
      La cassa legge gli incassi dagli ordini, perciò toglierli dal conto li
      toglie anche dal flusso di cassa. Non si butta via niente: quello che
      era entrato resta in `payments_annullati` con l'ora in cui è stato
      tolto, e il totale compare nella storia del conto («riaperto — tolti
      15,50 € dagli incassi»), che è dove lo si va a cercare quando la cassa
      non torna. Le comande già servite restano servite: tornano da fare solo
      quelle annullate col conto.
      SU UN CONTO RIAPERTO SI TOCCA TUTTO, righe vecchie comprese. Di norma
      una comanda servita non si modifica più — il drink è stato fatto e
      portato — ma riaprire serve ESATTAMENTE a rimettere a posto quello che
      c'è dentro: un giro battuto sul tavolo sbagliato, una birra di troppo.
      Se le righe di prima restano bloccate, il conto riaperto non serve a
      niente. Le scorte si riallineano con la differenza, come per ogni
      altra modifica.
      Il tasto per riaprire NON è un tasto in più: è quello del PAGAMENTO,
      che su un conto chiuso o annullato era lì spento a non fare niente.
      ANNULLANDO, il saldo di un buono usato per pagare torna al
      beneficiario: il conto non si incassa più, e lasciarlo scalato
      significherebbe fargli perdere il credito per un conto mai pagato. Le
      righe restituite si segnano (`restituito_at`), così riaprendo lo
      stesso conto non tornano una seconda volta — sarebbe credito
      inventato, l'errore opposto.
      IL BUONO NON SI PAGA DUE VOLTE. Il saldo di un buono si scala quando
      lo si usa, non quando i soldi entrano in cassa. Se il conto era stato
      PAGATO con un buono, riaprendolo quella riga di incasso sparisce come
      le altre: il saldo torna al beneficiario, altrimenti avrebbe pagato
      due volte — una col buono che non torna, una quando ripaga il conto.
      Il buono usato come SCONTO invece resta dov'è: lo sconto è ancora sul
      conto, quindi qualcuno deve pagarlo, e ri-chiuderlo non lo scala una
      seconda volta.
      Se il conto annullato era stato scontato con un BUONO VIP, riaprendolo il
      saldo si ri-addebita: annullando era tornato al beneficiario, e lasciarlo
      lì significherebbe uno sconto che nessuno ha pagato e un credito in
      circolazione che non torna più con i conti. Se nel frattempo il buono è
      stato speso altrove e il saldo non basta, si addebita quel che c'è e lo
      sconto si riduce a quella cifra (fino a sparire): meglio un conto che
      chiede qualche euro in più che un buono in rosso. Su un conto CHIUSO non
      si tocca niente, perché lì il buono non era mai stato ristornato.
      Il motivo si legge DENTRO il conto riaperto, senza doverlo cercare, e la
      storia completa — aperto, chiuso, annullato, riaperto, con chi e perché —
      sta dietro i ⋯ del conto, sia nella coda sia nel dettaglio. La storia si
      ricostruisce da quello che il conto porta già addosso, quindi vale anche
      per i conti di ieri, senza migrazioni.
    status: implemented
    generate_issue: false
    labels: [ordini, difetto-risolto]
    test_cases: [tests/unit/storiaOrdine.test.js, tests/component/OrderPosDetail.test.jsx, tests/unit/vouchers.test.js, tests/unit/ripristino.test.js]

  - id: REQ-ORD-010
    title: "Gli annullati hanno una tab loro nella coda"
