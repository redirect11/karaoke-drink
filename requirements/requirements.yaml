  - id: REQ-CODA-007
    title: "Le comande si trascinano da una colonna all'altra per cambiare stato"
    area: "src/components/CorsieComande.jsx, src/lib/coda.js (statoDelRilascio), src/components/Corsia.jsx, src/index.css"
    description: >
      Chiesto dall'utente il 20/08: «le comande nella vista a lane [possono
      essere] trascinate da una colonna all'altra per cambiare stato. Se
      tengo premuto su una comanda questa fa come la modalita' organizza
      della creazione ordine (quindi usa la stessa libreria) e posso
      spostarla in una delle lane visibili. Posso spostarla in QUALSIASI
      lane, quindi gli stati della comanda cambiano di conseguenza».
      E LA PRECISAZIONE CHE DICE COS'E', sua, subito dopo: «non e' che
      DEVONO — come modo ALTERNATIVO per cambiare stato, le posso
      trascinare». I tasti restano identici: il tasto grande, il ⋯ col
      «torna a…», tutto dov'era. Questa e' una seconda strada per lo stesso
      gesto, per chi al banco preferisce spostare la card con un dito.
      COME: pressione lunga sulla card (dnd-kit, la stessa libreria della
      modalita' «Organizza» del POS e delle righe del conto), la card si
      stacca e segue il dito, si lascia su una colonna visibile e lo stato
      della comanda diventa quello della colonna. Vale in TUTTE le
      direzioni, anche indietro, e saltando i passi di mezzo.
      A SCRIVERE E' LA STRADA DI SEMPRE (`avanzaComanda` →
      `advanceComanda`), la stessa dei tasti: il rilascio decide solo DOVE
      finisce (`statoDelRilascio`, pura). Cosi' le regole di sempre valgono
      da sole — lo scarico del magazzino a «pronto» si applica una volta e
      non si disfa tornando indietro — e non c'e' una seconda verita' sugli
      stati. LOCAL-FIRST: al rilascio la card si sposta subito, la
      scrittura va in sottofondo.
      DUE COLONNE NON ACCETTANO IL RILASCIO, e lo dicono mentre la card e'
      ancora in mano (sbiadite, invece di accettare e non fare niente):
      «Chiuse» non e' un passo del lavoro ma il risultato di due cose
      insieme (servita + conto pagato), e trascinarci una comanda vorrebbe
      dire incassare un conto con un dito; «Annullate» sarebbe un annullo —
      ed e' la cosa giusta — ma la strada per annullare UNA comanda con
      quello che ne consegue sui soldi non c'e' ancora (REQ-ORD-021):
      finche' non c'e', la colonna rifiuta invece di far sparire un ticket
      senza dire dove sono finiti i suoi drink. Quando REQ-ORD-021 sara'
      fatto, quella colonna diventa un bersaglio come le altre.
      I RUOLI VALGONO ANCHE COL DITO: alla sala resta il solo «servito»,
      come sul tasto (puoSegnare), o trascinare sarebbe la scorciatoia per
      aggirarli. Una comanda annullata non si rianima trascinandola, e le
      card della colonna dei soldi non sono comande: non si prendono in
      mano.
      TABLET E DITA BAGNATE: si parte dopo una pressione (260ms col dito,
      200 col mouse) e non al primo movimento, o scorrere le colonne
      vorrebbe dire spostare comande per sbaglio; prima della soglia il
      dito scorre la pagina come sempre. Sulla card `touch-action:
      manipulation` e niente menu di sistema alla pressione lunga: `none`
      toglierebbe anche lo scorrimento. I tasti dentro la card fermano la
      pressione, o tenendo premuto «Incassa» partirebbe il trascinamento.
      COSA RESTA DA PROVARE A MANO, perche' un test senza schermo non ha un
      dito ne' le misure delle card: che lo scorrimento verticale delle
      corsie col dito non si rompa, che la card in volo si veda sopra le
      colonne senza essere ritagliata, e che sull'iPad la pressione lunga
      non apra la lente d'ingrandimento.
    status: implemented
    generate_issue: false
    labels: [coda, banco, ui]
    test_cases:
      - tests/unit/coda.test.js
      - tests/component/CodaCorsie.test.jsx
  - id: REQ-CODA-008
    title: "I filtri della coda stanno dietro un tasto solo, che dice cos'e' acceso"
    area: "src/pages/BartenderPage.jsx (filaFiltri, pastigliaFiltri, chipSoloOggi), src/lib/coda.js (etichettaFiltri, spiegaFiltri), src/lib/impostazioniLocali.js (filtriAperti), src/index.css"
    description: >
      Chiesto dall'utente il 20/08, con lo screenshot della coda: «i filtri
      e tutti i bottoni li voglio a scomparsa, con un tasto che non occupi
      troppo spazio, sia per ordini sia per comande».
      DA DOVE NASCE. Con BUG-042 e BUG-061 i filtri erano finiti sulla riga
      dei conteggi, tutti e due i mondi nello stesso punto: negli ORDINI
      sono sei o sette pastiglie (In corso, Chiusi, Annullati, Tutti, Miei,
      Solo oggi) piu' quella del cambio vista, nelle COMANDE sono Miei e
      «Colonne». Anche compattate e messe a scorrere si mangiano una riga
      larga, in una lavagna che si guarda da lontano mentre si versa.
      IL TASTO: una pastiglia sola, «⚗️ Filtri» — lo stesso linguaggio del
      magazzino, dove filtrare si chiama gia' cosi' — che apre e chiude la
      fila. Chiusa di suo, e la scelta e' di QUESTO terminale
      (`tana:coda:filtri-aperti`, come le colonne spente): al banco la fila
      resta aperta tutta la sera, alla cassa non si tocca mai, e nessuno la
      vuole riaprire a ogni ricarico.
      DA CHIUSO NON NASCONDE LO STATO, ed e' la parte che conta. Un filtro
      acceso e invisibile e' una coda che sembra sbagliata: si guardano
      dodici conti dove ce ne sono quaranta e non c'e' niente a schermo che
      lo dica. Il tasto porta scritto quello che e' acceso — «⚗️ Chiusi» —
      e quando i filtri sono piu' di uno ne nomina UNO e conta gli altri:
      «⚗️ Miei +2» (`etichettaFiltri`). Nominarli tutti rifarebbe la fila
      che si stava togliendo, e un numero secco («3 filtri») non dice quale
      coda si sta guardando. L'elenco per esteso sta nel title
      (`spiegaFiltri`), che larghezza non ne costa. Con tutto al default
      resta «⚗️ Filtri», grigio.
      I CHIP COMPAIONO NELLA STESSA RIGA, non in una tendina: sono pochi,
      si toccano a raffica mentre si lavora, e un pannello sopra la coda
      coprirebbe proprio quello che si sta guardando per decidere che
      filtro serve. La riga va a capo o scorre come ha sempre fatto.
      COSA STA DENTRO E COSA NO. Dentro tutto quello che RESTRINGE la
      lista, «▦ Colonne» compreso: spegnere una colonna e' filtrare. Fuori
      la pastiglia del cambio vista (🍸 Comande / 🧾 Ordini), che non
      filtra ma cambia quello che si guarda, e il «＋», che crea — e' la
      regola di docs/navigazione.md, sinistra restringe e destra cambia
      vista. Dentro seguono la fila anche le due righe che i filtri
      aprono: i sottofiltri dei chiusi e la scelta delle colonne, che
      senza il loro tasto resterebbero appese sotto i conteggi.
      UN MECCANISMO SOLO PER TUTTE E QUATTRO LE VISTE — griglia, corsie dei
      conti, corsie del banco, lista e schede: `filaFiltri` e' scritta una
      volta e appesa dove serve. Quattro meccanismi sarebbero quattro cose
      da imparare per la stessa coda.
      ── CORRETTA LA ROTTA IL 20/08/2026, guardando il risultato ──
      «Quando dicevo di nascondere i tasti intendevo tutti e non aggiungere
      un nuovo tasto. Lo spazio da risparmiare e' in altezza non in
      larghezza. Quindi togli il tasto filtri e metti un tasto piu' piccolo
      che nasconde i filtri e il tasto comande/ordini diventa solo una icona
      piu' piccola e mettila in alto insieme agli altri tasti (stampante,
      staff, ordine)».
      IL PRIMO GIRO AVEVA SBAGLIATO IL VERSO. La pastiglia «⚗️ Filtri»
      stava DENTRO la riga dei chip: chiusa, quella riga restava lì — alta
      come prima, i suoi margini, il suo scorrimento — per contenere una
      pastiglia sola. In larghezza si guadagnava, in altezza niente, che era
      la cosa da guadagnare.
      COSA CAMBIA. Il tasto dei filtri diventa un TASTINO SOLO ICONA (⚗️)
      nella testata, della famiglia di 📟 e ↕ (`board-icona`), e la riga dei
      chip a filtri chiusi NON viene proprio disegnata: `filaFiltri` torna
      null. Anche il cambio vista lascia la riga e diventa un tastino icona
      accanto agli altri — 🧾 verso i conti, 🍸 verso le comande — perche'
      quella riga non c'e' piu' quando serve, e il cambio vista deve restare
      a UN tocco (docs/navigazione.md, la regola «a destra nella riga dei
      filtri» e' riscritta apposta).
      LO STATO NON SPARISCE LO STESSO: quando c'e' un filtro acceso il
      tastino si accende e porta il NUMERO (`contaFiltri`, badge
      `.board-icona-conta`). In 44px non ci sta un nome, ci sta una cifra —
      quali siano lo dice il `title` (`spiegaFiltri`), che larghezza non ne
      costa. `etichettaFiltri` non esiste piu': faceva la scritta lunga che
      teneva in piedi la pastiglia.
      SUL TELEFONO I DUE TASTINI RESTANO IN TESTATA, accanto al ⋯ e non
      dentro: nel menu ci vanno le cose che si fanno OGNI TANTO (pannelli,
      ordinamento, cassa), e filtrare o passare alle comande si fanno decine
      di volte a serata — dentro il ⋯ sarebbero due tocchi ciascuno.
      Lista e schede non hanno la testata delle lavagne: li' i due tastini
      stanno in riga col campo di ricerca (`.coda-cerca-riga`), che e' lo
      stesso posto relativo e non costa una riga in piu'.
      ── TERZO GIRO, 20/08/2026: I TASTINI TORNANO GIU', E L'ORDINAMENTO
      IMPARA A PARLARE ──
      L'utente ha guardato il risultato e corretto tre cose, sue parole:
      «Questo testo e' completamente insensato [il title del tasto
      ordinamento ↕: "Adesso: prima gli ultimi — tocca per partire dai
      primi"]. Cioe' basta scrivere Prima i piu' recenti/vecchi in base
      all'ordinamento attuale. E cambia anche l'icona (freccia giu' freccia
      sopra) e spostala da li', mettila sotto dove stavano i vecchi bottoni.
      Rimetti li' giu' anche il tasto dei filtri e "filtra la coda" non va
      bene, deve essere "mostra filtri"».
      1) IL TASTO DELL'ORDINAMENTO DICE COM'E' MESSA LA CODA, in tre parole:
      «Prima i piu' recenti» o «Prima i piu' vecchi», nel title e
      nell'aria-label. Niente «Adesso:», niente «tocca per…»: erano due
      frasi in una — lo stato e la promessa — e al banco non se ne leggeva
      nessuna. QUI IL TASTO DICE DOVE SEI, NON DOVE PORTA, in deroga
      esplicita a docs/navigazione.md: quella regola vale per il CAMBIO
      VISTA, dove le due facce non si distinguono senza guardare la lista
      sotto, mentre un ordinamento si legge dalla coda stessa e quello che
      manca e' solo il nome di com'e' messa.
      L'ICONA SEGUE IL VERSO: ↓ si parte dai piu' recenti e si scende verso
      i vecchi, ↑ si parte dai piu' vecchi e si sale verso gli ultimi
      arrivati. Il «↕» era identico nei due stati — diceva «qui si ordina»,
      non come. Nome e icona escono insieme da `spiegaOrdine(desc)` in
      lib/coda.js: erano due ternari scritti a mano in due punti (testata e
      ⋯) e gia' divergevano.
      2) FILTRI E ORDINAMENTO SCENDONO NELLA RIGA SOTTO, quella dove
      stavano le pastiglie dei vecchi filtri (`filaFiltri`, sulla lavagna e'
      la riga dei conteggi). Il giro di prima li aveva portati in testata
      per far sparire del tutto la riga da chiusa; adesso la riga c'e'
      sempre, ma da chiusa e' DUE TASTINI, non le sette pastiglie di
      partenza — l'altezza guadagnata resta quasi tutta, e il tasto sta
      insieme a quello che apre invece di governarlo da un'altra zona.
      Vale per tutte le viste e anche sul telefono: dal ⋯ la voce
      «ordinamento» sparisce, che in due posti sarebbero due stati da
      tenere allineati a mano.
      I DUE TASTINI NON SCORRONO VIA (`.chips-tastini`, `position:
      sticky`): la riga scorre in orizzontale quando i chip non ci stanno —
      in griglia sono sei — e il tasto che l'ha aperta finirebbe fuori
      schermo con loro.
      LA PASTIGLIA VISTA RESTA IN TESTATA (🧾/🍸): l'utente non ha chiesto
      di spostarla, e li' e' a un tocco solo.
      3) IL TASTO DEI FILTRI SI CHIAMA COL GESTO CHE FA: «Mostra filtri» da
      chiuso, «Nascondi filtri» da aperto. «Filtra la coda» diceva una cosa
      che il tasto non fa — a filtrare sono i chip, uno per uno. L'elenco
      dei filtri accesi per esteso resta accodato nel title da chiuso, dopo
      il nome; il badge col conteggio e la classe `active` non cambiano.
      ── QUARTO GIRO, 20/08/2026: QUELLO CHE QUI SOPRA NON VALE PIU' ──
      Rimane vero il PERCHE' (i filtri a scomparsa, lo stato leggibile da
      chiusi, un meccanismo solo per tutte e quattro le viste). Tre cose
      del COME le ha riscritte REQ-CODA-009, che va letto dopo questo:
      · LE QUATTRO SCHEDE NON CI SONO PIU'. «In corso / Chiusi / Annullati
      / Tutti» erano esclusive e non erano filtri; adesso sono tre
      interruttori combinabili, «In corso» si chiama «Aperti» e «Tutti» e'
      sparito (`FILTRI_STATO` al posto di `SCHEDE_GRIGLIA`,
      `NOME_FILTRO_STATO` al posto di `NOME_SCHEDA`).
      · I DUE TASTINI NON STANNO PIU' DENTRO LA FILA DEI CHIP, e la fila da
      chiusa non viene proprio disegnata. Stavano dentro, e la riga doveva
      quindi esistere sempre per contenerli: «il tasto dei filtri deve
      essere sulla destra insieme a quello dell'ordinamento non a sinistra
      dei filtri [...] i filtri devono uscire sotto». Adesso si appoggiano
      a una riga che c'e' comunque (i conteggi sulle lavagne, la ricerca in
      lista e schede) e la fila dei chip esiste solo da aperta:
      `.chips-tastini` e il suo `sticky` sono spariti con lei.
      · IL TASTINO NON E' PIU' UN QUADRATO DA 44px COL BADGE NELL'ANGOLO:
      e' un bottone BASSO, scritto «▾ Filtri» (`.coda-tastino`, non
      `.board-icona`), e il conteggio gli sta accanto
      (`.coda-tastino-conta`) SOLO a fila chiusa. Per un giro era stato
      anche senza riquadro, sul modello del «▾ altre 3» di una card delle
      comande; l'utente l'ha rimandato a bottone lo stesso giorno («aggiungi
      un bordo e rendilo un bottone»), tenendolo pero' piu' basso della
      famiglia da 44px — il dettaglio sta in REQ-CODA-009.
      · I SOTTOFILTRI DEI CHIUSI non hanno piu' una riga «Dei chiusi:»
      tutta loro: sono chip in riga con gli altri. E dal 20/08 nemmeno la
      scelta delle colonne ne ha una: si accoda alla stessa riga — e nello
      stesso giorno, secondo passaggio, ha perso anche il tasto «▦ Colonne»
      che la apriva. Al banco le colonne SONO chip della fila, uno per
      colonna: «▾ Filtri» e' l'unico livello di nascondimento
      (REQ-CODA-009).
      ── QUINTO GIRO, 22/08/2026: IL BADGE CONTA QUELLO CHE SI VEDE ──
      «Non mi e' chiaro come conta i filtri. Secondo me non funziona»
      (l'utente, con lo screenshot di una lavagna a sei colonne e un «▾
      Filtri ①»). Il numero era `filtriAccesi.length`, cioe' quanti
      GENERI di filtro stringevano: e le colonne del banco, per quante
      fossero, erano un genere solo. Adesso conta UNA PER UNA — tre
      colonne fanno 3, con lo staff filtrato 4 — e chi guarda puo' contare
      a occhio e ritrovare lo stesso numero (BUG-080).
      Al primo avvio, tutto di serie, il badge e' spento (BUG-058); a fila
      APERTA resta zero, che i chip si vedono da se'. Quella regola sta
      adesso in `contaFiltri(accesi, aperti)`, non in un ternario della
      pagina, ed e' provata a unita' come il suo gemello `spiegaFiltri`.
      UNA LISTA SOLA PER IL BADGE E PER IL TITLE. Una voce e' un nome
      secco («Chiusi», «Solo oggi») e vale uno, oppure un gruppo che porta
      quante restrizioni tiene dentro (`{ nome: 'Colonne', quante: 3 }`):
      il badge somma, il title raggruppa. Due liste, o un numero calcolato
      per conto suo, sarebbero due verita' sulla stessa cosa.
      «SOLO OGGI» VALE IN TUTTE LE VISTE, e prima veniva contato solo in
      griglia. Taglia `ordersInVista`, la lista da cui scendono tutte e
      quattro le viste: chi lo accendeva in griglia e poi passava alle
      comande si portava dietro il taglio senza niente a schermo che lo
      dicesse. Adesso il chip e' uno solo (`chipSoloOggi`), sta in tutte
      le file — fuori dalla griglia solo se e' ACCESO, che li' e' l'unico
      modo per spegnerlo — e il badge lo conta ovunque.
      ── SESTO GIRO, 22/08/2026: IL BADGE CONTA SOLO CIO' CHE RESTRINGE ──
      «Credo che l'indicatore del numero di filtri attivi funzioni al
      contrario. Li ho disattivati tutti ma lui indica tre filtri attivi»
      (l'utente, BUG-085). QUELLO CHE IL QUINTO GIRO DICE SUL CRITERIO NON
      VALE PIU': il numero non conta le DEVIAZIONI dal normale.
      Un filtro e' qualcosa che RESTRINGE. Il badge esiste per avvisare
      che la coda non sta facendo vedere tutto, quindi si accende su
      quello che e' NASCOSTO: una corsia normalmente visibile che manca
      dalla lavagna, lo staff ridotto a una parte, «Solo oggi», uno stato
      diverso dal default in griglia, la porzione dei chiusi. NON conta
      una corsia MOSTRATA che di suo sarebbe spenta: accendere «Chiuse» o
      «Annullate» fa vedere di piu', e col «diverso dal normale» il numero
      saliva proprio mentre la lavagna si apriva.
      E SI GUARDA LA LAVAGNA, NON LA MEMORIA DELLE SPENTE: spegnendo tutte
      le colonne la coda le rimette a schermo tutte (`corsieVisibili`, che
      una lavagna senza colonne non si puo' mostrare) e la memoria resta
      piena di id che non nascondono niente. La regola sta in
      `corsieRistrette(sceglibili, mostrate)`, pura, al posto di
      `corsieDiverseDalNormale`.
      RESTA TUTTO IL RESTO: cosa fanno i filtri non cambia — cambia solo
      cosa il numero conta — e restano BUG-058 (terminale nuovo, badge
      spento: quelle due non le ha nascoste nessuno) e BUG-080 (si somma
      una per una, e badge e title leggono la stessa lista).
      ── SETTIMO GIRO, 22/08/2026: IL NUMERO SI RITIRA ──
      «Si' ma infatti togliamo quel numero. Non serve» (l'utente). TUTTO
      QUELLO CHE SOPRA SI LEGGE SUL BADGE NON VALE PIU': il tastino non
      porta nessun numero, e non deve tornare a portarlo. Resta «▾ Filtri»
      e basta.
      NON E' UN DIFETTO, E' UNA FUNZIONE CHE SI RITIRA, ed e' la fine di
      quattro giri sullo stesso numero. Il badge e' stato calcolato in
      quattro modi diversi, e chi guardava li ha bocciati tutti: i GENERI
      di filtro accesi (sei colonne spente facevano «1» — BUG-080), una
      restrizione per COLONNA ma contando anche le riaccese («funziona al
      contrario» — BUG-085), solo cio' che RESTRINGE davvero guardando la
      lavagna e non la memoria («ne ho tre e lui dice zero»), e infine i
      chip ACCESI contati e basta — quest'ultimo mai arrivato a schermo,
      perche' nel frattempo la richiesta e' diventata toglierlo.
      PERCHE' NESSUN CRITERIO POTEVA REGGERE. «Quanti filtri ci sono?» non
      ha una risposta sola: chi guarda conta i chip accesi, il codice
      conta le restrizioni, e i due numeri non coincidono quasi mai. Un
      numero che va spiegato non avvisa di niente — chiede di essere
      interpretato, mentre si versa. Il segnale, se serve, si legge
      aprendo la fila: i chip accesi si vedono da se'.
      COSA SE N'E' ANDATO CON LUI: `contaFiltri` e `corsieRistrette` in
      coda.js, con loro `NOME_FILTRO_STATO` e `nomeSottofiltro` (nomi che
      esistevano solo per il title del badge), la lista `filtriAccesi`
      della pagina, il badge `.coda-tastino-conta` e la classe
      `.coda-tastino.active` — che si accendeva sul conteggio e senza non
      ha piu' niente da leggere. Sono spariti anche i test del conteggio:
      non si adattano a un numero che non c'e'.
      IL TITLE RESTA, MA DICE SOLO IL GESTO: «Mostra filtri» /
      «Nascondi filtri». Accodava l'elenco dei filtri accesi, che era la
      STESSA lista da cui il badge tirava il numero letta in un altro
      modo: tenerla in piedi per un tooltip voleva dire tenere in piedi la
      macchina intera, pronta a farsi ricollegare a una cifra alla prima
      occasione. C'e' un test che controlla che il title non elenchi piu'
      niente, ed e' li' per quello.
      PER CHI LEGGE FRA SEI MESI: se venisse l'idea di «aggiungere un
      utile contatore accanto a Filtri», c'e' gia' stato, quattro volte, e
      la decisione finale e' stata toglierlo. Resta vero tutto il resto —
      i filtri a scomparsa, un meccanismo solo per le quattro viste, la
      fila che da chiusa non si disegna.
