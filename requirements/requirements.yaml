  - id: REQ-POS-019
    title: "La striscia delle card dice quello che serve a chi lavora"
    area: "src/lib/strisce.js, src/components/SettingsTab.jsx"
    description: >
      La striscia a sinistra delle card — griglia del conto e schede del
      menù — si sceglie, perché dipende da come si lavora: chi conosce il
      listino a memoria vuole i colori delle categorie per trovare il
      prodotto al tatto, chi sta finendo le bottiglie vuole vedere subito
      cosa non si può più fare, chi ha già abbastanza colori addosso la
      vuole spenta.
      Quattro modi: SPENTA (grigia, il colore resta nella linguetta),
      PRODOTTO (il suo colore, o quello della categoria se non ne ha uno),
      CATEGORIA (sempre la categoria: il colore del singolo prodotto lo
      dice la linguetta) e SCORTE (rosso ingrediente esaurito, arancione
      in esaurimento, e «ce n'è abbastanza» a scelta fra grigio e verde).
      Un prodotto fuori menu resta GRIGIO anche col verde acceso: è spento,
      non rotto — il rosso qui diceva due cose opposte, «l'ho tolto io» e
      «è finito il rum».
      La scelta è del LOCALE (settings/bar) e vale per tutti i terminali: la
      griglia dev'essere la stessa dovunque, o due persone parlano di due
      schermate diverse. Le due schermate si impostano separatamente.
      Le regole stanno in una funzione pura: la stessa striscia deve
      significare la stessa cosa in tutte le schermate, e con la logica
      dentro le pagine finiva per divergere.
      L'IMPOSTAZIONE È SOLO DELLA STRISCIA. La linguetta nell'angolo in
      alto a sinistra tiene sempre il colore del PRODOTTO — è quella che si
      tocca per cambiarlo — qualunque cosa dica la striscia. I due segni
      condividevano lo stesso valore, e scegliendo «categoria» il colore
      messo a mano spariva dalla vista pur essendo ancora lì.
      Ogni scelta sta DOVE SI LAVORA quella schermata: la griglia del conto
      in Impostazioni → Vista ordine, le schede del catalogo in Menù e
      catalogo — modo della striscia e colore del «ce n'è abbastanza»,
      separati per le due. Non è la stessa domanda: nel conto si batte di
      corsa e una griglia tutta verde è rumore (lì interessano i guai),
      nel catalogo si guarda con calma cosa si può fare e il verde è
      un'informazione.
      Il MENÙ ha tre sottosezioni nel menu laterale — modifica menù,
      categorie, marginalità del listino — invece dei due pannelli a
      scomparsa in cima al catalogo, che si aprivano spingendo giù la
      griglia: chi voleva solo guardare i margini si portava dietro tutto
      il listino sotto.
      Le scorte si leggono SOLO se servono: con gli altri modi ricette e
      giacenze non si caricano nemmeno.
      NIENTE LAMPO ALL'APERTURA. Le impostazioni arrivano dal server e per
      un istante non ci sono: aprendo un conto le strisce comparivano
      colorate e sparivano un attimo dopo, in un locale che le aveva
      spente. L'ultima risposta del server resta in memoria locale
      (`impostazioniLocali.js`) e la schermata parte da lì — l'ultima
      verità nota, non i valori di fabbrica.
    status: implemented
    generate_issue: false
    labels: [pos, menu, ux]
    test_cases:
      - tests/unit/strisce.test.js
      - tests/component/PosProductPicker.test.jsx
      - tests/unit/impostazioniLocali.test.js

  - id: REQ-POS-013
    title: "In «Organizza» la card segue il dito"
    area: "src/components/PosProductPicker.jsx, src/index.css"
    description: >
      Trascinando una card dalla maniglia, quella in mano segue il dito e le
      altre si spostano per farle posto; lasciandola, resta dove l'hai messa.
      Lo fa una libreria (dnd-kit), non codice nostro: la versione scritta a
      mano — cattura del puntatore, ciclo di auto-scroll, animazioni a mano —
      aveva un difetto dopo l'altro (lo scorrimento che non si fermava, le
      card che si spostavano solo mentre la griglia scorreva, il rilascio
      fuori area). Trascinare col dito è un problema risolto, con dieci casi
      limite che non si vedono finché non capitano al banco; in più arriva
      gratis il riordino da TASTIERA, che non avevamo.
      Quello che resta nostro è la regola: l'ordine è UNO SOLO e globale,
      anche quando a schermo c'è una sola categoria — se no spostare una birra
      dentro «Birre» la lascerebbe al suo posto in «Tutti».
      La maniglia sta SOPRA la card, sul suo bordo destro, e non a fianco:
      affiancata allargava ogni cella di 38px, e la griglia entrando in
      «organizza» cambiava numero di card per riga e misura — si sistemava
      una disposizione diversa da quella che poi si usa davvero. La cella
      occupa esattamente quello che occupa fuori da qui.
      Il contesto di trascinamento sta SEMPRE attorno alla griglia, anche
      fuori da «organizza» (senza gesti attivi e senza niente di
      trascinabile dentro, non fa nulla). Montarlo solo lì spostava la
      griglia in un altro posto dell'albero, e React a quel punto buttava il
      riquadro e ne faceva uno nuovo: il misuratore della larghezza — quello
      che decide quanto sono grandi le card e i loro testi — restava
      attaccato al vecchio, staccato dalla pagina e quindi largo zero, e le
      card tornavano alla misura di partenza coi testi rimpiccioliti.
      Sistemato quello restava comunque un lampo, il tempo di rifare il
      riquadro e rimisurarlo. Il misuratore, per sicurezza, si riaggancia
      comunque al riquadro che c'è (ref-funzione) e prende subito la misura.
      Dentro «organizza» la card riempie la sua casella come fuori: la
      griglia rende tutte le caselle di una riga alte uguali, ma in mezzo
      c'è il guscio che porta il trascinamento — si allungava lui e la card
      restava alta quanto il suo testo, con una riga di card di altezze
      diverse.
      La card in mano NON ESCE DALLA GRIGLIA. Trascinandola verso destra
      finiva oltre il bordo: lì fuori non c'è niente da riordinare, ma il
      riquadro — che scorre — si allargava per contenerla e partiva uno
      scorrimento orizzontale senza fine, da riportare indietro a mano. Il
      movimento si ferma ai bordi del riquadro (un modifier di dnd-kit) e
      la griglia non scorre di lato: va a capo.
      La card in mano è OPACA: il fondo delle card è un velo (--tile-bg,
      bianco al 5%), che appoggiate sulla pagina va bene ma alzandone una
      sopra le altre le faceva vedere attraverso — e non si capiva più
      quale si sta spostando. Sotto ci va il fondo della pagina, così in
      mano ha l'aspetto identico a quando è posata.
      Il minimo delle colonne — «almeno tre card per riga finché ci stanno»
      — lo calcola il CSS con min()/max(), non il JavaScript sulla
      larghezza misurata: la misura arriva sempre qualche fotogramma dopo, e
      trascinando la maniglia di fianco alla griglia per un attimo ci
      stavano due colonne invece di tre, fino a quando non arrivava. Nel
      CSS il conto si rifà insieme al ridimensionamento.
      Sempre per non far ballare la griglia, lo spazio della barra di
      scorrimento è riservato (`scrollbar-gutter: stable`): compariva e
      spariva a seconda di quanti prodotti ha la categoria, e al confine
      fra tre e quattro card per riga la griglia si riassestava da sola
      mentre la si guardava.
    status: implemented
    generate_issue: false
    labels: [pos, ux]
    test_cases: [tests/component/PosProductPicker.test.jsx]

