  - id: REQ-ORD-021
    title: "Le comande annullate: o si rifanno, o si stornano dal conto"
    area: "src/lib/comande.js, src/components/OrderPosDetail.jsx, src/lib/printer.js, src/components/PaymentScreen.jsx"
    description: >
      Chiesto dall'utente il 18/08. Annullare una comanda ferma la
      PREPARAZIONE, non tocca i soldi: quei drink restano sul conto finché
      qualcuno non decide cosa farne. Oggi invece spariscono dal totale in
      silenzio (aggregateItems salta le annullate), e nessuno se ne accorge.
      LA REGOLA, una sola, di cui la divisione è il caso particolare. Ogni
      unità di una comanda annullata sta in uno di tre posti:
      SOSTITUITA (è finita in una o più comande nuove nate al suo posto),
      STORNATA (tolta dal conto per davvero, e scritta come storno),
      DA DECIDERE (nessuna delle due: pesa ancora sul conto e si vede nel
      dettaglio, in attesa che qualcuno scelga).
      L'INVARIANTE, che è quello che tiene in piedi i soldi: per ogni
      comanda annullata `sostituite + stornate + da_decidere` fa sempre la
      quantità di partenza, e sul totale del conto pesa SOLO la parte da
      decidere — le sostituite pesano attraverso le comande nuove (se
      contassero entrambe il conto raddoppierebbe), le stornate non pesano
      più. Da qui la divisione smette di essere un'eccezione: è il caso in
      cui tutto è sostituito, il residuo è zero e il totale non si muove di
      un centesimo.
      COSA SI VEDE E COSA SI FA. Nel dettaglio del conto, fra i gruppi per
      passo del servizio, c'è anche il gruppo delle voci in comande
      annullate, distinto dagli altri: non sono lavoro in corso, sono roba
      da decidere. Da lì due strade: RIFARE (si stampa una comanda uguale,
      per tutto o per una parte, che nasce come una comanda qualsiasi — il
      bicchiere rotto si rifà) e STORNARE (col «−» si tolgono le voci, che
      escono dal conto segnate come stornate: non spariscono, restano
      scritte come storno).
      LO STORNO SI VEDE E SI STAMPA: nella colonna di sinistra della
      schermata di pagamento e sul preconto/scontrino, come riga propria
      con l'importo in negativo. Chi legge lo scontrino deve capire cosa è
      stato tolto e quanto, se no un conto che non torna diventa una
      discussione al tavolo.
      TRE DECISIONI PRESE (18/08, confermate dall'utente):
      1) la regola vale solo per le comande annullate DA QUI IN AVANTI —
      quelle nuove portano i campi del rendiconto, le vecchie no e si
      comportano come oggi. Nessuna migrazione, e nessun conto già chiuso
      che cambia importo;
      2) se il CONTO è annullato non pesa niente: eccezione esplicita,
      prima di ogni altro calcolo;
      3) il gesto per annullare una singola comanda su un conto vivo oggi
      NON esiste (lo fanno solo la divisione e l'annullamento del conto) e
      va aggiunto nel dettaglio comanda: solo a conto aperto e solo se non
      è ancora stata servita — servita vuol dire che il drink è uscito, e
      lì la strada resta «Riapri conto».
      Vale solo con gli stati del servizio accesi.
      E C'E' UN POSTO CHE ASPETTA QUESTA STRADA: nella vista a corsie del
      banco le comande si trascinano da una colonna all'altra per cambiare
      stato (REQ-CODA-007), e la colonna «Annullate» e' l'unica che RIFIUTA
      il rilascio — lasciarci cadere una comanda sarebbe un annullo, e
      annullare senza dire dove finiscono i suoi drink e' esattamente il
      buco che questo requisito chiude. Fatto questo, quella colonna
      diventa un bersaglio come le altre.
    status: todo
    generate_issue: true
    labels: [ordini, comande, pagamenti]
    priority: P1
    test_cases: [tests/unit/comande.test.js, tests/component/OrderPosDetail.test.jsx]

  - id: REQ-PAG-011
    title: "Il pagamento si legge per comanda, e dalla card servita si incassa quella"
    area: "src/components/PaymentScreen.jsx, src/components/CorsieComande.jsx"
    description: >
      Chiesto dall'utente il 18/08. Quando un conto ha più di una comanda,
      nella colonna di sinistra della schermata di pagamento le righe si
      raggruppano per comanda — stessa forma dei gruppi che ci sono già,
      intestazione e sotto le sue righe — e ogni gruppo ha i suoi due tasti,
