  - id: REQ-MAG-041
    title: "I documenti dello scadenzario si possono correggere"
    area: "src/lib/fatture.js, src/lib/statiOrdine.js, src/lib/ore.js, src/lib/api.js, src/components/SupplierInvoicesPanel.jsx"
    description: >
      Chiesto da Flavio il 03/09/2026: «in Scadenzario i documenti creati
      devono essere modificabili nel caso di variazione o errore».
      COM'ERA: sul documento si poteva solo segnare pagato o non pagato. Non
      c'era modo di correggere importo, data, numero, fornitore o tipo, e chi
      sbagliava a battere una cifra doveva CANCELLARE e rifare — portandosi
      via, con la cancellazione, i prodotti (REQ-MAG-030), l'allegato
      (REQ-MAG-033) e il legame con l'ordine (REQ-MAG-031). Su un documento
      con la foto della fattura dentro, quello e' un lavoro perso.
      SI CORREGGE, NON SI STRAVOLGE. Modificabili sono i sei campi della
      testata che una persona batte a mano guardando la carta: fornitore,
      numero, data, tipo, importo, note (`CAMPI_MODIFICABILI` in
      src/lib/fatture.js). Righe, allegato e `order_id` non sono nemmeno
      NOMINATI nella patch, e non e' una dimenticanza: ognuno ha gia' il suo
      gesto, che sa fare anche le cose attorno — il carico a magazzino, il
      file da cancellare su Storage, la guardia sulla fetta gia' coperta — e
      passarli da qui vorrebbe dire una seconda strada che quelle cose non le
      fa. Quello che non si nomina non si puo' sovrascrivere per sbaglio.
      NEMMENO «PAGATO» PASSA DI QUI: il suo tasto e' quello sulla riga e resta
      uno solo (REQ-MAG-038). La casella «Gia' pagato» del modulo e' della
      creazione — serve alla riga «Nessun documento», che nasce gia' pagata —
      e correggendo non compare: due posti per dire la stessa cosa vogliono
      dire due stati da tenere allineati.
      IL FORNITORE DI UN DOCUMENTO AGGANCIATO NON SI CAMBIA. Il legame con
      l'ordine E' la coppia ordine + fornitore (REQ-MAG-031): cambiando
      fornitore sotto un documento agganciato, quella fetta resterebbe legata
      alla fattura di qualcun altro — merce pagata a chi non l'ha venduta, che
      a fine mese e' un conto che non torna. La regola sta in
      `modificaAmmessa`, che e' la stessa risposta usata per spegnere il campo
      e per rifiutare la scrittura: si impedisce prima invece di spiegarlo
      dopo con un errore. Si scollega, e scollegare e' un gesto che si vede.
      LOCAL-FIRST. `modificaFattura` (src/lib/api.js) non aspetta e non
      rilegge: parte dal documento che la schermata ha gia' in mano, compone
      il risultato in memoria e manda la scrittura in sottofondo con
      `bgWrite`. Rileggendo, la cache risponderebbe con la versione di prima
      (BUG-045). Senza niente di cambiato non si scrive niente.
      IL CONFRONTO SI RIFA' DA SOLO. Il prospetto ordine/fattura (REQ-MAG-038)
      non e' un valore salvato: `totaliProspetto` e `riconciliato` leggono
      `fattura.amount` ogni volta, quindi correggere l'importo lo cambia
      nello stesso istante. Resta un limite dichiarato: un ordine gia' CHIUSO
      porta `closed_at` addosso e resta chiuso anche se la cifra corretta non
      riconcilia piu'. Riaprirlo da qui vorrebbe dire un secondo scrittore
      sull'ordine per una decisione che non e' di questa schermata.
      LA TRACCIA STA SUL DOCUMENTO, e la decisione va detta perche' e' il
      punto in cui si poteva sbagliare. Una modifica su un documento PAGATO e'
      legittima — e' proprio il caso di Flavio, «mi devono modificare il
      prezzo di una fattura magari gia' pagata» — ma e' il gesto che a fine
      mese qualcuno vorra' spiegarsi. Si e' riusato il meccanismo della storia
      dell'ordine (`movimento`, `conMovimento`, `storiaDi`,
      `descriviMovimento` in src/lib/statiOrdine.js) con un movimento nuovo,
      `documento_corretto`, ma scritto nell'array `storia` DEL DOCUMENTO e non
      dell'ordine: un documento dello scadenzario puo' non avere nessun ordine
      dietro — e' uno dei due buchi di REQ-MAG-031 — e la sua correzione
      resterebbe senza traccia proprio nei casi in cui non c'e' nient'altro
      che la spieghi. La voce porta cosa e' cambiato, da cosa a cosa, gia'
      scritto in italiano (`cambiFattura`), e dice se il documento era gia'
      pagato. Le frasi si compongono in fatture.js e non in
      `descriviMovimento` per due ragioni: un importo formattato nel momento
      in cui e' successo resta leggibile mesi dopo anche se il formato cambia,
      e statiOrdine.js resta fuori dai tipi di documento — che sarebbe un
      anello di import.
      L'IMPORTO SI CONFRONTA COL SEGNO. Una fattura da 120 diventata nota di
      credito (BUG-100) porta ancora scritto 120, ma sui conti quei soldi si
      sono spostati di 240: la storia deve accorgersene, se no la correzione
      piu' pesante sarebbe l'unica che non si racconta.
      COSA SI VEDE: sulla riga del documento un tasto «matita»; il modulo
      prende il posto della riga, gia' compilato, ed e' LO STESSO modulo della
      creazione — due copie prima o poi divergono, una impara a chiedere il
      fornitore e l'altra no. Sotto il documento, le correzioni fatte, dalla
      piu' recente.
    status: implemented
    generate_issue: true
    labels: [magazzino, fornitori, ux]
    priority: P1
    test_cases:
      - tests/unit/modificaDocumento.test.js
      - tests/component/ModificaDocumento.test.jsx
      - tests/unit/fatture.test.js

  - id: REQ-MAG-034
    title: "«Altre spese» e il «Riepilogo»: i soldi che escono, mese per mese"
    area: "src/lib/spese.js, src/lib/riepilogoFornitori.js, src/lib/api.js, src/components/AltreSpesePanel.jsx, src/components/RiepilogoFornitoriPanel.jsx, src/components/FornitoriTab.jsx, firestore.rules"
    description: >
      Ritagliato da REQ-MAG-025, di cui sono gli ULTIMI DUE PEZZI: la terza
      sottosezione di Fornitori e la quarta voce che le tiene insieme.
      DA DOVE NASCE, ed è una domanda dell'utente (19/08): «quelle spese da
      inserire a mano non sono gli ordini?». La risposta, misurata sui fogli,
      è che in parte sì: la sua riga SPESE è sempre più grande degli acquisti
      dello stesso mese — gennaio 2.380 contro 1.809, aprile 5.005 contro
      2.884, giugno 12.726 contro 8.673 — quindi contiene la merce PIÙ altro,
      da 570 a 4.050 euro al mese.
      COS'È QUELL'ALTRO, trovato e non ipotizzato: il foglio «TO BUY» di
      FORNITORI REC.xlsx — tavoli da esterno, sgabelli, divani, una tenda,
      uno scaffale IKEA, bicchieri di plastica in cinque misure — con le
      colonne articolo, quantità, prezzo, totale, DOVE si compra (Amazon,
      Bricoware, IKEA, Vente-Unique) e note, per 2.468,59 in tutto. Sono
      arredi, attrezzature e materiale di consumo: roba che esce dal conto
      corrente, non entra in magazzino e che nessun ordine fornitore
      intercetterà mai. Le colonne della sottosezione sono quelle del foglio.
      ── LA COSA CHE REGGE TUTTO: COMPRATA O SOLO DESIDERATA ──
      Quel foglio è una LISTA DELLA SPESA, non un registro: si chiama «da
      comprare» e diverse righe hanno prezzo zero, cioè non sono ancora
      prezzate. Serve quindi sapere se una voce è GIÀ STATA COMPRATA: solo
      quelle comprate pesano sul mese, le altre sono un promemoria. Senza
      questa distinzione un divano desiderato abbasserebbe l'utile di
      gennaio.
      IL DATO SONO DUE CAMPI E NON UNO: `bought` dice SE, `bought_at` dice
      QUANDO — ed è la data che decide su quale mese l'uscita pesa. Una spesa
      non comprata non ha mese, perché non è successo niente; segnarla
      comprata dalla riga ci mette la data di oggi, che è quando il gesto sta
      succedendo, e chi l'ha comprata un altro giorno la corregge dalla
      modifica.
      LA MODIFICA NON È UN DI PIÙ, ed è la conseguenza di com'è fatto il
      foglio: una voce nasce spesso senza prezzo e lo prende il giorno che la
      si compra. Senza poterla riaprire, quel numero non entrerebbe mai.
      IL BUCO DI QUESTA SOTTOSEZIONE, con lo stesso linguaggio degli altri
      due (REQ-MAG-031): una voce segnata comprata ma senza prezzo pesa zero
      sul mese e nessuno se ne accorge finché non si confrontano i totali.
      Porta la scritta «senza prezzo» in ambra e si isola col chip in testa.
      Su una riga ancora DA comprare invece il prezzo a zero è la normalità
      del foglio, e segnalarla insegnerebbe a ignorare il segnale.
      NIENTE ESEMPI NEI CAMPI, e non è una svista: REQ-CASSA-012 avverte che
      l'elenco «affitto, SIAE, commercialista, utenze» era una LISTA
      INVENTATA da chi scriveva quella voce, non una frase di Flavio. Un
      segnaposto nel campo insegnerebbe a scriverci quello che ci siamo
      immaginati noi. Campi vuoti, e basta.
      ── IL RIEPILOGO, QUARTA VOCE ──
      Mette insieme i tre elenchi in un totale PER MESE: merce (dalle fatture
      fornitore), altre spese (quelle comprate) e quanto resta APERTO. È il
      numero che poi Bilancio → Mesi userà per il netto, e la ragione per cui
      sta QUI e non lì è che i soldi che escono si guardano dove si
      registrano.
      COSA ENTRA NEL TOTALE E COSA NO, ed è il modo in cui questo numero
      potrebbe sbagliare in silenzio. TOTALE = merce + altre spese. «Da
      pagare» è una FETTA della merce già contata — quelle fatture stanno
      dentro «merce», sommarle conterebbe due volte la stessa uscita — e dice
      solo quanta parte del mese è ancora un debito. «Senza fattura» è merce
      ARRIVATA di cui manca il documento (il primo buco di REQ-MAG-031):
      sommarla la conterebbe una seconda volta il giorno che la fattura
      arriva, e tenerla fuori mostrandola accanto dice quanto manca al mese
      senza sporcarlo. Sotto le righe c'è scritto in una frase.
      DA DOVE VIENE OGNI NUMERO: la merce dall'importo dei documenti, sul
      mese della loro DATA (non del pagamento); le altre spese dal totale
      quantità per prezzo delle comprate, sul mese di `bought_at`; il senza
      fattura dal NETTO delle fette consegnate e non fatturate
      (`fetteSenzaFattura`, già scritto per REQ-MAG-031), sul mese
      dell'ordine. Una fattura senza data non ha mese e resta fuori: metterla
      in quello corrente sposterebbe soldi da un mese all'altro senza che
      nessuno l'abbia deciso.
      ⚠️ IL NUMERO DELL'APP VALE MENO DI QUELLO DEI FOGLI, e sta scritto a
      schermo: è la conseguenza della decisione di REQ-CASSA-012 («nell'app
      le due cose restano separate»). Nel foglio mensile la riga «spese»
      comprende anche la merce; qui la merce si conta una volta sola, nella
      sua colonna. La frase sta in testa al Riepilogo, dove i totali si
      confrontano — se non la si dice, al primo confronto sembra che l'app
      sbagli e si torna al foglio. La stessa cosa detta dall'altro lato è la
      didascalia di «Altre spese»: la merce dei fornitori non va lì, si conta
      dalle fatture, e riscriverla la conterebbe due volte.
      DOVE VIVONO I DATI: collezione `altre_spese`, un documento per riga
      (name, qty, unit_cost, shop, notes, bought, bought_at). Il TOTALE non
      si scrive: è quantità per prezzo, e un terzo numero da tenere d'accordo
      con gli altri due è il primo che qualcuno dimentica di aggiornare. La
      quantità che manca vale UNO e non zero — chi scrive solo il prezzo ha
      comprato una cosa, non zero cose — perché con lo zero il totale
      sparirebbe dal mese in silenzio.
      LOCAL-FIRST ANCHE QUI, che è di gestione e non la coda: l'IDENTIFICATIVO
      SE LO FA IL TERMINALE (`doc(collection(...))` e `setDoc`, non `addDoc`),
      perché con `addDoc` si aspetta il server per sapere come si chiama il
      documento appena scritto e senza rete quell'attesa non finisce mai. Le
      scritture partono in `bgWrite` e il risultato si COMPONE invece di
      rileggerlo (BUG-045). Lo dimostra un test che gira senza rete, sul
      modello di `giroInLocale.test.js`.
      ── LE DECISIONI PRESE IN IMPLEMENTAZIONE ──
      1) LE DUE VOCI NON SONO PREMIUM e non se ne è inventato un modulo
      nuovo: le altre spese si scrivono a mano e non dipendono da nessuna
      funzione a pagamento; il riepilogo mette insieme quello che c'è, e con
      lo scadenzario spento la colonna della merce resta a zero — che è la
      verità di quel locale, non un pezzo mancante. Il filtro `voceVisibile`
      di FornitoriTab le lascia passare senza un «if» in più.
      2) LE REGOLE FIRESTORE DI `altre_spese` sono quelle delle altre
      collezioni dei fornitori (`isBartender()`, che vale anche per l'admin):
      nell'app la sezione è del solo admin, ma un documento contabile non può
      essere più aperto della fattura che gli sta accanto. Le regole sono
      SCRITTE, non pubblicate: la pubblicazione è un gesto di chi gestisce.
      3) IL RIEPILOGO GUARDA CENTO ORDINI e non venticinque come lo
      Scadenzario: lì servono gli ultimi, per agganciare il documento che si
      ha in mano; qui si guarda indietro di mesi, e una consegna senza
      fattura di marzo sparirebbe dal conto del suo mese senza dire niente.
      RESTA APERTA UNA DOMANDA CHE NON È DI QUESTA VOCE (REQ-CASSA-012): fra
      gennaio e giugno le spese di Flavio superano gli acquisti di 11.243
      euro e il foglio «TO BUY» ne spiega 2.469 — restano quasi novemila euro
      in sei mesi di cui non si sa la natura, e la risposta ce l'ha solo lui.
      La forma di questa sottosezione regge in tutti e due i casi: poche voci
      ricorrenti o tante di natura diversa. Se un giorno servirà
      RAGGRUPPARLE, il campo si aggiunge senza rifare niente — e finché la
      domanda non ha risposta, inventare le categorie sarebbe rifare l'errore
      che REQ-CASSA-012 nomina per nome.
