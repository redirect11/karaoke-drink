  - id: REQ-SUMUP-CONFIG-001
    title: "Le functions SumUp sono no-op se non configurate"
    area: "functions/index.js isSumUpConfigured, functions/lib/sumup-service.js"
    description: >
      Se SUMUP_VENDOR_ID o SUMUP_OUTLET_ID non sono impostati, tutte le callable
      (syncSumUpProducts, createSumUpSale, updateSumUpSaleStatus) devono ritornare
      un esito { skipped: true } senza effettuare alcuna chiamata di rete verso
      SumUp né scritture su Firestore.
      SCARTATA (26/08/2026, dall'utente): «Questa cosa di SumUp Cassa Pro non
      ha senso, anche perché non ho capito come potrebbe mai inviare gli ordini
      al SumUp Cassa Pro. Sta cosa di SumUp Cassa Pro possiamo anche toglierla,
      non serve. A noi serve solo inviare il pagamento al POS in modo che si
      possa riscuotere tramite il POS SumUp».
      Il testo qui sopra resta per capire, fra sei mesi, cosa faceva questa
      roba — e perché non serviva. SumUp Cassa Pro (POS Pro / Goodtill)
      ricopiava ogni vendita nel loro registratore di cassa: NON È MAI STATA
      ACCESA (VITE_SUMUP_ENABLED non era impostato da nessuna parte e
      functions/.env aveva i valori vuoti), quindi al banco non cambia niente.
      Teneva però in piedi, pronte ad accendersi, tre callable e un webhook
      pubblico: superficie d'attacco per una funzione che nessuno usava.
      RIMOSSI il 26/08/2026: le quattro Cloud Functions (syncSumUpProducts,
      createSumUpSale, updateSumUpSaleStatus, sumupWebhook), i moduli
      functions/lib/sumup-core.js e functions/lib/sumup-service.js,
      src/lib/sumupApi.js, il riquadro «Sync catalogo» del gestionale e i
      relativi test.
      DA NON CONFONDERE COL LETTORE: il lettore SumUp Solo e il checkout
      online — quelli con cui si incassa davvero — sono un'altra integrazione,
      non c'entrano niente con questa e restano dove sono (REQ-PAY-*).
