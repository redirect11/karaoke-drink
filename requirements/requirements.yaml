  - id: REQ-UI-022
    title: "Le categorie senza macro si vedono a colpo d'occhio, in magazzino e nel menù"
    area: "src/components/MacroCategoryManager.jsx, src/components/InventoryManager.jsx (InvCategoryManager), src/components/MenuManager.jsx (CategoryManager)"
    description: >
      DECISO (19/08, dall'utente che riporta Flavio). ALTRO (magazzino) e
      BOTTIGLIE (menù) restano SENZA macro, ed è una scelta: non vanno
      forzate dentro un gruppo per far tornare un elenco. Da lì nasce il
      bisogno opposto — si deve capire in un attimo quali categorie sono
      fuori, perché una fuori APPOSTA e una dimenticata oggi si somigliano
      troppo.
      COSA C'È GIÀ, verificato nel codice il 19/08. `groupCategoriesByMacro`
      (src/lib/macros.js) torna già `unassigned`, e il pannello «🗂
      Macro-categorie» — lo stesso per magazzino e menù,
      MacroCategoryManager.jsx — le scrive in fondo su una riga sola:
      «Categorie senza macro: …», i nomi separati da virgola. Quindi LÌ IL
      «SENZA MACRO» SI VEDE, ma debolmente: è testo piccolo in coda alla
      schermata, e con venticinque categorie diventa una riga da leggere
      parola per parola per sapere se la tua c'è dentro.
      DOVE NON SI VEDE AFFATTO: negli ELENCHI delle categorie, che sono
      l'altro posto dove uno le guarda. Magazzino → 🏷 Categorie
      (InvCategoryManager) mostra il solo nome; Menù → 🏷 Categorie
      (CategoryManager in MenuManager.jsx) mostra nome, icona e colore.
      Nessuno dei due dice a quale macro appartiene la categoria, né che non
      ne ha nessuna — e sono le stesse liste da cui si esce convinti di aver
      sistemato tutto.
      DA FARE: nell'elenco delle categorie, da tutte e due le parti, si legge
      la macro di ogni categoria e si distingue quella che non ce l'ha.
      PROPOSTA sulla forma (non è una sua parola): accanto al nome
      un'etichetta con la macro, e dove manca due parole — «senza macro» —
      con lo stesso peso, non un avviso. Non è un errore, e il rosso qui non
      c'entra: in questa app vuol dire annullato o sbagliato (DESIGN.md).
      DA DEFINIRE IN IMPLEMENTAZIONE: se «apposta» sia un segno da mettere
      sulla categoria (un campo in più, e una spiegazione da scrivere) o
      basti che l'elenco si legga bene. Il secondo costa zero ma lascia il
      dubbio ogni volta che qualcuno di nuovo guarda quella lista.
      NON DIPENDE DA NIENTE: `groupCategoriesByMacro` torna già
      `unassigned`, il lavoro sta negli elenchi delle categorie. Piccolo, e
      utile proprio adesso che le macro si stanno mappando.
      FATTO (19/08). In tutti e due gli elenchi — Magazzino → 🏷 Categorie e
      Menù → 🏷 Categorie — accanto al nome c'è un'etichetta con la macro, e
      dove non c'è si legge «senza macro» con lo STESSO PESO: niente rosso,
      niente punto esclamativo. Non è un errore, è un fatto, e chi ha
      lasciato ALTRO fuori apposta non deve vedersi rimproverare ogni volta
      che apre la lista. L'unica differenza è il corsivo, che dice «questa è
      una constatazione, non un nome».
      SCELTO IL SECONDO DEI DUE MODI: nessun campo «apposta» sulla
      categoria. L'elenco che si legge bene costa zero e non chiede a
      nessuno di compilare niente; il segno esplicito si potrà aggiungere il
      giorno in cui il dubbio si presenta davvero, e allora sarà una
      decisione presa su un caso vero invece che su un'ipotesi.
      UNA MACRO CANCELLATA VALE COME NESSUNA MACRO, esatto come in
      `groupCategoriesByMacro`: il `macro_id` resta attaccato alla
      categoria, ma il gruppo non esiste più.
    status: implemented
    generate_issue: true
    labels: [ux, magazzino, menu]
    priority: P3
    test_cases:
      - tests/unit/macros.test.js
      - tests/component/InventoryManager.test.jsx
      - tests/component/MenuManager.test.jsx

  - id: REQ-MAG-035
    title: "Il listino si compila nella scheda del fornitore, non ordinando"
    area: "src/components/ListinoFornitore.jsx, src/lib/storicoPrezzi.js, src/lib/api.js"
    description: >
      Chiesto dall'utente il 27/08/2026, dopo aver provato quello che era
      stato costruito: «l'associazione prodotto -> fornitori DEVE avvenire
      nella gestione Fornitori. Quando creo/modifico un fornitore mi si deve
      aprire una pagina dove posso associare i prodotti gia' in magazzino a
      quel fornitore, o addirittura CREARE un prodotto che poi andra' a
      finire in magazzino. Posso aggiungere anche un prezzo di listino, che
      poi sara' quello che vedro' quando compilero'/precompilero' un ordine
      nella sezione ordini».
      COSA CAMBIA RISPETTO A OGGI. Il listino (REQ-MAG-029) esiste gia' come
      dato — `supplier_prices`, una riga per coppia prodotto-fornitore — ma
      non ha una schermata: si popola da solo consegnando gli ordini, e la
      scheda prodotto ha una tendina che ne scrive una riga. Chi implemento'
      REQ-MAG-029 lascio' fuori l'editor scrivendo che «non era chiesto».
      Adesso lo e', ed e' il PUNTO DI PARTENZA di tutto il giro: senza
      listino compilato la schermata dell'ordine non ha prezzi da proporre.
      LA SCHEDA DEL FORNITORE diventa quindi il posto dove si dice CHE COSA
      quel fornitore vende e A QUANTO: si cercano i prodotti gia' in
      magazzino e li si associa, si mette il prezzo di listino per pezzo, e
      si puo' creare li' un prodotto che ancora non esiste — che nasce in
      magazzino come qualunque altro.
      IL PREZZO DI LISTINO E' QUELLO CHE SI VEDE QUANDO SI ORDINA. Non e'
      il costo del prodotto (che resta uno solo, l'ultimo pagato, REQ-MAG-029)
      e non e' il prezzo di vendita del menu, che e' di Flavio.
      RESTA VERO che il prezzo si aggiorna anche dall'altro capo: quando si
      riceve merce e si corregge il prezzo, quella riga di listino si
      aggiorna con la sua data. Le due strade scrivono lo stesso dato.
      E LA FATTURA HA L'ULTIMA PAROLA. Aggiunto dall'utente il 27/08: «se il
      fornitore cambia i prezzi rispetto all'ordine — e possiamo vederlo solo
      dalla fattura — I PREZZI DEL LISTINO VANNO ALLINEATI A QUELLI DELLA
      FATTURA, mantenendo lo STORICO DEI PREZZI per le statistiche che voleva
      Flavio sull'andamento dei prezzi».
      E' la regola giusta perche' segue chi decide davvero: il listino e' cio'
      che ci aspettiamo di pagare, la fattura e' cio' che si paga. Un listino
      che resta fermo mentre le fatture salgono fa preventivare ordini a cifre
      che non esistono piu', e l'aumento si scopre solo guardando il conto
      corrente.
      SERVE QUINDI UNO STORICO, e oggi NON C'E': la riga di `supplier_prices`
      tiene UN prezzo solo (`price`, `last_price`, `last_price_at`), quindi
      ogni aggiornamento CANCELLA quello di prima. Finche' e' cosi', la
      domanda «quanto e' aumentato il Campari da gennaio» non ha dove
      leggersi. Va aggiunto un registro delle variazioni — per coppia
      prodotto-fornitore: prezzo, data, e DA DOVE viene (compilato a mano,
      corretto alla consegna, allineato da una fattura), perche' un prezzo
      scritto a mano e uno preso da un documento non hanno lo stesso peso.
      E' il dato che rende possibile il grafico che Flavio ha chiesto e che
      REQ-MAG-029 aveva rimandato: «ogni volta che carico qualcosa e vado a
      modificare il prezzo, il sistema mi dovrebbe registrare quanto
      acquistato e la variazione di prezzo su un grafico». Il grafico resta
      un'altra voce; QUI si scrive il dato senza cui non potra' mai esistere.
      Chi tocca questa parte scriva lo storico anche se il grafico non c'e'
      ancora: uno storico non si puo' ricostruire all'indietro.
      COM'E' STATO FATTO (27/08/2026). Il listino e' il DETTAGLIO della riga
      del fornitore, non una sottosezione in piu': si apre da «📋 Listino» in
      Fornitori -> Gestione fornitori, si esce con «← Fornitori» e uscendo si
      dimentica (docs/navigazione.md). Creando un fornitore si apre subito il
      suo listino, che e' quello che l'utente chiedeva con «quando
      creo/modifico un fornitore». La scheda prodotto del magazzino resta
      dov'era, tendina fornitore compresa: «non deve cambiare l'attuale UI o
      UX del magazzino» — scrive la sua riga di listino come prima, e adesso
      anche la variazione.
      IL PRODOTTO CHE NASCE DA QUI passa dalla stessa funzione del prodotto
      che nasce da una consegna (`prodottoDaRigaOrdine`, REQ-MAG-032): nome e
      prezzo, contato a pezzi, con la SCHEDA DA COMPLETARE addosso. L'id se
      lo da' il client invece di aspettare `addDoc`, che offline non torna
      mai: il prodotto esiste subito, anche senza rete.
      LO STORICO E' UNA COLLEZIONE A RADICE, `supplier_price_history`, una
      riga per variazione: `supplier_id`, `item_id`, `price`,
      `previous_price`, `origine` (manuale / consegna / fattura) e `at`. L'id
      e' deterministico — coppia piu' istante — perche' le scritture in
      sottofondo si ripetono quando falliscono, e con un id casuale il
      secondo tentativo lascerebbe un doppione che sul grafico si legge come
      un'oscillazione mai avvenuta. Il prezzo di prima sta SULLA RIGA: chi
      legge una variazione da sola deve poter dire di quanto e' salita.
      LE TRE STRADE CHE LA SCRIVONO passano tutte da `scriviVariazionePrezzo`
      in `api.js`: `salvaRigaListino` (a mano), il ramo dentro
      `registraAcquisto` chiamato dalla consegna di un ordine, e lo stesso
      ramo chiamato dalle righe di una fattura. Il prezzo di prima si legge
      PRIMA di scrivere, nella stessa attesa che gia' legge gli articoli:
      dopo, la cache direbbe gia' quello nuovo. Una variazione si scrive solo
      se il prezzo cambia davvero, al centesimo — se no lo storico si
      riempirebbe di righe uguali a ogni consegna.
      RESTA FUORI, ed e' voluto: il grafico dell'andamento dei prezzi (voce
      sua), e la schermata degli ordini, che si rifa' col 036/037.
    status: implemented
    generate_issue: true
    labels: [magazzino, fornitori, ux]
    priority: P2
    test_cases:
      - tests/unit/storicoPrezzi.test.js
      - tests/unit/storicoPrezziScrittura.test.js
      - tests/component/ListinoFornitore.test.jsx

  - id: REQ-MAG-036
    title: "«Nuovo Ordine»: una tabella sola, e la riga che si apre"
    area: "src/components/NuovoOrdinePanel.jsx, src/components/PurchaseOrdersPanel.jsx, src/lib/composizioneOrdine.js, src/lib/listini.js, src/lib/inventory.js"
    description: >
      Chiesto dall'utente il 27/08/2026, bocciando quello che era stato
      costruito: «nella sezione ordini NON MI PIACE LA DOPPIA LISTA e quei
      box sono POSTICCI. Serve una UX e UI piu' moderna e semplice. Deve
      esserci UNA SOLA TABELLA dove su ogni riga vedro' il nome del prodotto
      e i vari campi per compilare l'ordine, compresa una dropdown per la
      scelta del fornitore».
      LA RIGA. Nome del prodotto · fornitore (tendina) · prezzo unitario preso
      dal LISTINO di quel fornitore (REQ-MAG-035) · prezzo totale rispetto ai
      pezzi voluti, modificabile sulla riga stessa · e un modo per
      selezionare le righe da ordinare.
      IL FILTRO E LA RICERCA, parole sue: «quando filtro per fornitore vedro'
      nella tabella solo gli item di quel fornitore; se cerco un prodotto
      vedro' probabilmente il prodotto DUPLICATO se associato a piu' di un
      fornitore». Il duplicato non e' un difetto: e' lo stesso prodotto in
      due listini, e si distingue per fornitore e colore (REQ-MAG-029).
      LA RIGA CHE SI APRE: «quando seleziono un item mi si deve aprire la riga
      che mi dira' anche le info di quel prodotto — se in assortimento, out,
      in linea eccetera, quante scorte ho ancora in magazzino — piu' la
      possibilita' di modificare gli stessi campi che modificherei inline
      sulla riga stessa». Le stesse cose, due strade: in linea per chi sa gia'
      cosa vuole, aperta per chi deve guardare prima di decidere.
      LA PRESELEZIONE, che e' il motivo per cui questa schermata esiste: sono
      spuntati di partenza i prodotti FINITI o SOTTO LA SOGLIA di riordino
      impostata sul prodotto. Chi apre la schermata trova gia' fatto il lavoro
      di girare il magazzino.
      NON SI PRECOMPILA CHI E' FUORI LINEA: «se e' fuori linea non viene
      considerato nella precompilazione dell'ordine» (utente, 27/08). Un
      prodotto `out` si puo' sempre ordinare a mano — e' cosi' che rientra —
      ma non si propone da solo.
      L'ORDINE STA DI FIANCO, NON IN FONDO. Aggiunto dall'utente il
      27/08/2026 dopo aver provato: «e' SCOMODISSIMO l'ordine in basso.
      Dobbiamo metterlo affianco, e gia' li' separare i prodotti di un
      fornitore rispetto a un altro». La schermata si legge quindi a due
      colonne: a sinistra il catalogo da cui si sceglie, a destra l'ordine
      che si sta componendo, gia' diviso per fornitore. In fondo obbligava a
      scorrere avanti e indietro per sapere cosa si era gia' messo — e il
      riepilogo per fornitore (REQ-MAG-037) arrivava troppo tardi, alla
      conferma, quando lo si vuole sapere MENTRE si sceglie.
      L'INTESTAZIONE RESTA IN ALTO E ORDINA. «Voglio l'header della tabella
      fisso in alto, coi titoli delle colonne che posso usare per ordinare»:
      per NOME, per DISPONIBILITA' IN INVENTARIO, per PREZZO DI LISTINO e per
      FORNITORE. Con centinaia di righe, un'intestazione che scorre via
      lascia chi guarda a indovinare che cosa sia la terza colonna.
      LA DISPONIBILITA' HA TRE STATI e vanno mostrati: IN SCORTA, IN
      ESAURIMENTO, ESAURITO. Non e' un dato nuovo — e' `stockStatus` in
      src/lib/inventory.js (`ok` / `low` / `empty`), lo stesso che decide la
      preselezione: si mostra quello, non se ne calcola un altro.
      LE RIGHE SI PAGINANO. «Sono tanti e possono essere duplicati per piu'
      fornitori: e' vero che abbiamo la ricerca, ma dobbiamo paginare, e
      posso selezionare anche quanti risultati per pagina — oppure
      implementiamo un endless scroll che carica i successivi dopo un tot».
      Il numero misurato il 27/08 dice perche' serve: 388 prodotti e 367
      righe di listino gia' importate, e una riga per COPPIA
      prodotto-fornitore. La ricerca non basta, perche' il primo gesto di chi
      apre la schermata non e' cercare: e' GUARDARE cosa manca.
      Delle due strade, quella da preferire e' lo SCORRIMENTO CONTINUO, e la
      ragione e' d'uso: si compone un ordine scorrendo, e una paginazione
      costringerebbe a ricordarsi cosa si e' spuntato a pagina 2 mentre si
      guarda la 3. Se pero' lo scorrimento continuo litiga con
      l'intestazione fissa o con l'ordinamento, si fa la paginazione con la
      scelta di quanti per pagina: e' la seconda strada che l'utente indica,
      non un ripiego inventato.
      IL TOCCO SULLA RIGA AGGIUNGE E TOGLIE. Chiesto dall'utente il 27/08
      dopo aver provato: «se clicco su una riga degli ordini, questo deve
      essere aggiunto se non e' aggiunto e toglierlo se e' aggiunto. In
      pratica basta che tocco la riga». Il bersaglio e' tutta la riga, non
      solo la casella: si compone un ordine passando in rassegna decine di
      prodotti, e centrare una casella piccola decine di volte e' il tipo di
      fatica che non si nota finche' non la si fa. I campi che si scrivono
      (quantita', tendina del fornitore) e il tasto che apre la riga restano
      esclusi dal tocco, se no scriverci dentro toglierebbe il prodotto
      dall'ordine.
      LA CASELLA RESTA DOV'E', ed e' la scelta che tiene in piedi il gesto per
      chi non usa il dito: e' lei a portare ruolo, nome e stato («Ordina
      Bjorne, casella di controllo, selezionata») e a farsi premere con lo
      spazio dopo esserci arrivati col tabulatore. Il tocco sulla riga e' un
      bersaglio piu' grande sopra la stessa cosa, non un gesto suo: un `div`
      cliccabile al posto della casella sarebbe un comando che col tabulatore
      non esiste e che nessun lettore di schermo annuncia. Quello che e' gia'
      nell'ordine si riconosce anche dal FONDO della riga, perche' componendo
      se ne scorrono decine e la spunta da sola e' un segno piccolo in fondo a
      sinistra.
      LA QUANTITA' SELEZIONA: «se aggiungo una quantita' sulla riga del
      prodotto, questo viene selezionato automaticamente per l'ordine».
      Scrivere una quantita' E' la decisione di ordinarlo: chiedere anche la
      spunta sarebbe far dire due volte la stessa cosa.
      COM'E' STATO FATTO (27/08/2026). La composizione e' una schermata sua,
      `NuovoOrdinePanel`, dentro il pannello Ordini; i conti — ordinamento,
      preselezione, prezzi, finestra delle righe, raggruppamento per
      fornitore — stanno in `src/lib/composizioneOrdine.js`, dove si provano
      senza Firebase. La tabella riusa le classi che esistono gia'
      (`inv-list inv-table`, `inv-thead`, `inv-row`, `inv-row-dettaglio`) e
      l'intestazione ordinabile e' lo stesso componente della lista del
      magazzino, spostato in `src/components/SortTh.jsx` invece di essere
      riscritto due volte.
      SCORRIMENTO CONTINUO, non paginazione: e' la strada che l'utente
      preferisce e non litiga con niente. L'intestazione resta in alto
      perche' a scorrere e' la TABELLA, che ha una barra sua
      (`position: sticky` dentro un riquadro che scorre), e l'ordinamento
      riparte dalla prima finestra invece di tenere in vita seicento righe
      gia' disegnate. Il passo e' 40 righe. Accanto al conteggio c'e' un
      tasto «Mostra altre righe»: chi arriva con la tastiera non fa scorrere
      niente col tabulatore, e senza quel tasto la finestra non crescerebbe
      mai.
      IL FUORI LINEA ADESSO E' IN TABELLA. Prima gli `out` erano esclusi dal
      catalogo ordinabile (REQ-MAG-007, «non si ricompra»): cosi' pero' non
      c'era modo di farli rientrare, e ordinarne uno e' esattamente il gesto
      con cui rientrano. Restano fuori dalla PRESELEZIONE, che e' quello che
      l'utente ha chiesto, e portano scritto «fuori linea» accanto al nome.
      IL TOTALE SI CORREGGE, IL €/pz NO. La colonna del prezzo unitario e' il
      LISTINO di quel fornitore e resta di sola lettura: e' il dato che dice
      quanto ci si aspetta di pagare, e non deve mettersi a ballare mentre si
      scrive. Il totale della riga si scrive a mano, e da li' si ricava il
      prezzo che finisce sull'ordine (totale / pezzi). Cambiando i pezzi o il
      fornitore la correzione si perde: valeva per QUEI pezzi da QUEL
      fornitore.
      LA PRESELEZIONE PRENDE UNA RIGA SOLA PER PRODOTTO — quella del
      fornitore dell'ULTIMO ACQUISTO — perche' lo stesso Campari su due
      listini ha due righe, e spuntarle tutte e due vorrebbe dire comprarlo
      due volte.
      I DUE SUGGERIMENTI DI REQ-MAG-029 (chi e' l'ultimo acquisto, chi e' il
      piu' economico) sono passati dalla riga alla SCHEDA che si apre: in una
      riga di tabella a otto colonne non ci stavano, e la scheda e' dove si
      guarda un prodotto prima di decidere.
      LA TENDINA SELEZIONA COME LA QUANTITA': scegliere chi ci vende quel
      prodotto e' la stessa decisione di scrivere quanti pezzi servono, e
      lasciare la riga non spuntata dopo averlo fatto sarebbe un secondo
      gesto per la stessa cosa.
      RESTA FUORI, ed e' voluto: lo STORICO ORDINI e' rimasto quello di prima,
      sotto la composizione, con le sue fette per fornitore — diventa «Lista
      Ordini» con REQ-MAG-038, e il riepilogo di conferma e' REQ-MAG-037.
      La bozza della composizione vive finche' si sta sulla schermata: non e'
      la bozza del POS e non e' stato chiesto che sopravviva a un'uscita.
    status: implemented
    generate_issue: true
