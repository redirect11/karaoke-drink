      E dal banco: sulla card di una comanda SERVITA il tasto porta in
      cassa CON QUELLA COMANDA GIÀ SELEZIONATA. È quello che rende sensata
      la cosa: tre comande servite dello stesso tavolo non chiedono tre
      volte l'intero — ognuna porta in cassa la sua parte, e chi vuole
      incassare tutto tocca «tutto» sugli altri gruppi o parte dal conto.
