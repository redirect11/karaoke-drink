      - tests/component/NuovoOrdineTabella.test.jsx

  - id: REQ-MAG-037
    title: "Il riepilogo per fornitore, e «in assortimento» come stato di passaggio"
    area: "src/components/PurchaseOrdersPanel.jsx, src/lib/inventory.js, src/lib/api.js"
    description: >
      Chiesto dall'utente il 27/08/2026. La conferma di un giro d'ordini non
      e' un tasto: e' una schermata di revisione, fornitore per fornitore.
      «La creazione dell'ordine deve portarmi a una schermata di RIEPILOGO
      dove avro' una serie di tabelle in base all'ordine che voglio fare ai
      vari fornitori. Le tabelle saranno A SCOMPARSA, una sotto l'altra: se
      clicco sul nome di un fornitore mi si apre la tabella dei prodotti
      selezionati per quel fornitore, che io posso revisionare, e PER SINGOLO
      FORNITORE posso creare l'ordine. Se confermo l'ordine per quel
      fornitore, sulla riga relativa al fornitore vedro' il badge ORDINATO e
      tutti i prodotti di quell'ordine passeranno IN ASSORTIMENTO. E deve
      funzionare cosi' per tutte le tabelle, per tutti i fornitori — che sono
      ovviamente visibili SOLO se ho selezionato e sto ordinando prodotti da
      quel fornitore».
      UN ORDINE PER FORNITORE, deciso dall'utente il 27/08 rispondendo a una
      domanda diretta. Questo SOSTITUISCE la decisione del 20/08 («un ordine
      puo' contenere item di piu' fornitori, il per-fornitore e' una vista»)
      e con lei il modello a FETTE costruito il 26-27/08: alla conferma
      nascono N ordini distinti, uno per fornitore, ognuno col suo stato e la
      sua fattura. Il «giro» torna a essere la SESSIONE di composizione —
      cioe' la schermata «Nuovo Ordine» — e non un documento.
      PERCHE' SEMPLIFICA: la Lista Ordini (REQ-MAG-038), la riconciliazione e
      il legame con la fattura diventano cose per ORDINE invece che per
      fetta. Il legame fattura-fetta di REQ-MAG-031 diventa fattura-ordine, e
      la guardia sul fornitore resta (la fattura e' di chi la emette).
      «IN ASSORTIMENTO», e qui va letto con attenzione perche' ribalta quanto
      scritto in REQ-MAG-029 («non cambia significato»). Parole dell'utente,
      27/08, che chiudono la questione: «e' la gestione di Flavio che usa lo
      stato. In assortimento e' piu' relativo allo STATO DEI PRODOTTI:
      dipende dalla giacenza di magazzino ma viene comunque gestito come
      stato commerciale».
      I VERI STATI COMMERCIALI SONO TRE: IN LINEA, PREMIUM, FUORI LINEA (out).
      «In assortimento» e' UNO STATO SUPERIORE che viene indicato AL POSTO di
      «in linea» o «premium», e alla fine RESTITUISCE quello di prima. Quindi
      il prodotto deve RICORDARE lo stato da cui viene: senza quella memoria,
      un premium tornerebbe indietro come un prodotto qualunque e la
      classificazione di Flavio si cancellerebbe da sola, un ordine per volta,
      su tutto il magazzino.
      QUANDO SI ENTRA, e questo va letto senza scorciatoie (precisato
      dall'utente il 27/08: «va in assortimento SOLO DOPO CHE FLAVIO HA
      CREATO L'ORDINE, o solo se lo imposta manualmente, mi raccomando»).
      Il grilletto e' la CONFERMA DELL'ORDINE a quel fornitore nel riepilogo,
      e nient'altro: NON la giacenza sotto soglia, NON la spunta nella
      tabella, NON l'aver aperto la schermata. La catena, detta dall'utente:
      «se lo spunti in tabella verra' visualizzato nel RIEPILOGO dell'ordine,
      e SOLO DOPO LA CONFERMA di Flavio passera' in assortimento». La spunta
      porta il prodotto nel riepilogo e li' si ferma: finche' Flavio non
      conferma quel fornitore, in magazzino non e' cambiato niente — e infatti
      dal riepilogo si puo' ancora togliere. Un prodotto sotto soglia che
      nessuno ordina resta in linea o premium — e' basso, non e' in arrivo, e
      dire il contrario riempirebbe il magazzino di prodotti «in assortimento»
      che non ha ordinato nessuno.
      La giacenza bassa resta la condizione per cui il prodotto si PROPONE da
      solo nella tabella (REQ-MAG-036), che e' un'altra cosa dal cambiargli
      stato.
      Il prodotto «DEVE essere in linea o premium per poter passare allo stato
      in assortimento quando fa parte di un ordine aperto»: un `out` non ci
      passa, e' fuori linea e non lo si sta rifornendo.
      QUANDO SI ESCE, e questo paragrafo e' stato CORRETTO il 27/08 in
      implementazione perche' si contraddiceva da solo: diceva che si esce al
      carico "se la giacenza torna sopra la soglia", e trenta righe piu' sotto
      lo stesso testo decide l'opposto ("torna comunque in linea o premium",
      "due sole strade per uscirne"). Vale quello che viene dopo, che e'
      anche l'ultima cosa detta dall'utente: SI ESCE QUANDO IL PRODOTTO NON
      STA PIU' IN UN ORDINE APERTO, e la giacenza non entra nella decisione.
      A MANO SI PUO', MA COSTA UNA DOMANDA. «Siccome Flavio potrebbe voler
      impostare a mano quello stato, bisogna fargli presente che se lo imposta
      bisogna associarlo anche a un ordine — internamente sara' tipo IN
      ASSORTIMENTO SENZA ORDINE — e anche in quel caso verra' preso in
      considerazione come un prodotto sotto soglia o esaurito nella
      precompilazione dell'ordine». Quindi: lo stato messo a mano e' legittimo,
      si distingue perche' non ha un ordine dietro, e fa entrare il prodotto
      fra quelli proposti al prossimo giro.
      IL CARICO A MANO RESTA, E NON SPEGNE LO STATO. Parole dell'utente,
      27/08: «Flavio potrebbe aver comprato la bottiglia oggi al supermercato
      perche' si e' scordato di ordinarla. Se lo stato e' in assortimento e
      Flavio fa carico manuale, NON CAMBIA NIENTE: rimane in assortimento.
      Questo puo' succedere perche' ha fatto un ordine, ma l'ordine e' in
      ritardo e a lui servono bottiglie. Semplicemente aumentano le scorte,
      ma siccome c'e' un ordine attivo in attesa di essere ricevuto lui
      rimane in assortimento».
      Quindi non e' la GIACENZA a spegnere lo stato: e' il fatto che il
      prodotto non stia piu' dentro un ordine aperto. Legarlo alla soglia
      farebbe sparire l'informazione «sta arrivando altra merce» proprio nel
      momento in cui serve — Flavio si ritroverebbe la cassa piena di roba
      comprata di corsa e nessun segno che dal fornitore ne arriva dell'altra.
      DUE SOLE STRADE PER USCIRNE, ed e' l'utente a dirle:
      1) L'ORDINE ARRIVA (passa a consegnato): si carica sulle quantita'
      ricevute e il prodotto torna al suo stato di prima, in linea o premium.
      2) SI TOGLIE L'ITEM DALL'ORDINE: «quello che Flavio puo' fare e'
      eliminare quell'item dall'ordine ANCHE SE GIA' FATTO, e si ripristina lo
      stato in linea o premium».
      SE INVECE CAMBIA LO STATO A MANO DAL MAGAZZINO, l'app non lo lascia fare
      in silenzio: «gli si deve DIRE che quel prodotto e' presente in un
      ordine in attesa di essere ricevuto. Se cambia lo stato manualmente, il
      prodotto va eliminato dall'ordine». Sono la stessa decisione presa dai
      due capi, e non possono divergere: un prodotto che non e' piu' «in
      assortimento» ma resta dentro un ordine aperto e' un ordine che nessuno
      sa piu' di aver fatto.
      SE L'ORDINE ARRIVA MA LE SCORTE RESTANO BASSE, il prodotto torna
      comunque IN LINEA o PREMIUM. Deciso dall'utente il 27/08, che ha
      scartato l'ipotesi contraria: «ma anche no. In assortimento SENZA
      ORDINE e' solo se Flavio lo cambia manualmente. Torna in linea o premium
      ma con scorte in esaurimento».
      E' la regola piu' semplice, ed e' anche la piu' giusta: sono DUE ASSI
      DIVERSI, e nel codice lo sono gia'. Lo STATO COMMERCIALE dice che posto
      ha quel prodotto nel locale (in linea, premium, fuori linea); la SCORTA
      — `stockStatus`, che confronta giacenza e soglia — dice se ce n'e'
      abbastanza. «In assortimento» e' l'unico punto in cui i due assi si
      toccano, e li si tocca per una ragione precisa e temporanea: c'e' un
      ordine aperto. Finito l'ordine, i due assi si separano di nuovo.
      Quindi uscire dall'ordine restituisce SEMPRE lo stato di prima, senza
      guardare la giacenza. Che le scorte siano ancora in esaurimento lo dice
      gia' la scorta, si vede in magazzino come per qualunque altro prodotto
      basso, e basta quello per farlo tornare fra i proposti al giro dopo
      (REQ-MAG-036). Non serve un secondo modo di dire la stessa cosa.
      L'INTERFACCIA DEL MAGAZZINO NON SI TOCCA: «non deve cambiare l'attuale
      UI o UX del magazzino, mi raccomando» (utente, 27/08). I quattro stati
      restano quattro in schermata e nei filtri; quello che cambia e' chi li
      scrive e il fatto che uno dei quattro sia di passaggio e ricordi il
      precedente.
      MA QUELLO CHE SI LEGGE CAMBIA, e va detto invece di far finta che il
      magazzino resti identico (precisazione dell'utente, 27/08: «non e' del
      tutto vero, perche' i prodotti ordinati in magazzino diventeranno in
      assortimento»). Non si spostano comandi ne' colonne: cambia il VALORE
      che la lista mostra. Un prodotto dentro un ordine aperto si legge «in
      assortimento» al posto di «in linea» o «premium», e ci resta finche'
      l'ordine non arriva. Quindi in magazzino comparira' un gruppo di
      prodotti in quello stato che prima non c'era mai, i filtri per stato ne
      risentiranno, e chi cerca «i premium» in quel momento non ci trovera'
      quelli in arrivo. E' voluto — e' l'informazione che Flavio vuole a
      colpo d'occhio — ma e' un cambiamento di cosa dice la schermata, non
      solo di cosa fa l'ordine.
      COM'E' STATO FATTO (27/08/2026). Il riepilogo e' una schermata sua,
      `RiepilogoOrdini`, dove `NuovoOrdinePanel` porta col tasto «Rivedi e
      conferma»: una riga per fornitore, la tabella dei suoi prodotti che si
      apre toccando il nome, un tasto «Crea l'ordine» per ognuno e il badge
      «Ordinato» al posto del tasto quando e' fatto. La macchina degli stati
      del prodotto sta in `src/lib/statoAssortimento.js`, logica pura, dove si
      prova senza Firebase: e' la parte che, se sbagliata, fa danni silenziosi
      sui dati veri.
      DOVE VIVE LA MEMORIA: due campi sul prodotto, `assortimento_da` (lo
      stato a cui tornare) e `ordini_assortimento` (gli id degli ordini aperti
      che ce lo tengono). E' una LISTA e non un id solo perche' lo stesso
      prodotto puo' finire in due giri diversi: si esce quando non resta piu'
      nessun ordine, se no il primo che arriva spegnerebbe lo stato mentre
      l'altra merce e' ancora per strada.
      SE LA MEMORIA MANCA NON SI INVENTA NIENTE: un prodotto senza
      `assortimento_da` — tutti quelli scritti prima di questa voce —
      uscendo dall'ordine resta dov'e', e si liberano solo i due campi. Meglio
      fermo che promosso a caso.
      «IN ASSORTIMENTO SENZA ORDINE» SI RICONOSCE DALLA MEMORIA, non dal solo
      stato, e questa e' una decisione presa in implementazione sui numeri
      veri: 'assortimento' e' stato per anni il valore di DEFAULT di ogni
      prodotto che non dichiarava niente — 65 su 150 nella prima pagina del
      magazzino importato. Se bastasse lo stato a dire «l'ha messo Flavio a
      mano», meta' del magazzino risulterebbe messa a mano e si ritroverebbe
      preselezionata al primo ordine. Chi lo sceglie davvero scrive anche da
      dove veniva, e quella e' la firma.
      L'ASSORTIMENTO PRE-IMPOSTATO DI REQ-MAG-025 PUNTO 5 E' STATO TOLTO
      (casella «In assortimento quando arriva» e campo `status_target` sulla
      riga d'ordine). Non e' una semplificazione: chiedeva di ACCENDERE quello
      stato nell'istante esatto in cui adesso va spento, e tenere tutti e due
      i comportamenti vorrebbe dire una consegna che mette e toglie la stessa
      cosa nello stesso momento.
      SI TOGLIE SOLO QUELLO CHE NON E' ANCORA ARRIVATO. Una riga gia'
      consegnata ha alzato la giacenza, scritto un movimento e aggiornato il
      listino: toglierla vorrebbe dire scaricare merce che sta sullo scaffale,
      e non e' quello che e' stato chiesto. Chi ha ricevuto per sbaglio
      corregge con una rettifica di magazzino. Vale per tutte e due le strade
      — il tasto nello storico e il cambio di stato a mano.
      L'ORDINE CHE RESTA SENZA RIGHE NON SI CANCELLA: e' comunque un ordine
      mandato a un fornitore, e farlo sparire vorrebbe dire non poter piu'
      spiegare la telefonata che arriva dopo.
      IL GRUPPO «SENZA FORNITORE» SI PUO' CONFERMARE LO STESSO: 378 prodotti
      su 388 non stanno sul listino di nessuno, e rifiutarlo vorrebbe dire
      perdere per strada quello che si e' appena scelto. Resta in fondo, come
      nella composizione.
      LA CONFERMA NON ASPETTA LA RETE: `createPurchaseOrder` prendeva l'id da
      Firestore e poi RILEGGEVA il documento appena scritto — due attese in
      fila, e con la cassa offline il tasto restava premuto senza che
      succedesse niente. Adesso l'id si prende in locale, la scrittura parte
      in sottofondo e l'ordine si compone in memoria (BUG-045). Lo stesso vale
      per il passaggio in assortimento, che usa gli articoli gia' in mano alla
      schermata e non rilegge niente.
      L'ORDINE CANCELLATO LIBERA I SUOI PRODOTTI, e non era stato chiesto: il
      cestino dello storico c'era gia', e senza questo i prodotti di
      quell'ordine sarebbero rimasti «in arrivo» per sempre, da un documento
      che non esiste piu', con la sola via d'uscita di cambiargli stato a mano
      uno per uno. E' la terza porta della stessa stanza, e non poteva
      restare murata.
      LE RIGHE CONFERMATE ESCONO DALLA COMPOSIZIONE, e il riepilogo lavora su
      una FOTOGRAFIA: tornando indietro resta da fare solo quello che non e'
      partito, ma la tabella del fornitore confermato resta a schermo col suo
      badge. Se il riepilogo leggesse la composizione dal vivo, il fornitore
      appena confermato sparirebbe nell'istante della conferma.
    status: implemented
    generate_issue: true
    labels: [magazzino, fornitori, ux]
    priority: P2
    test_cases:
      - tests/unit/statoAssortimento.test.js
      - tests/unit/ordiniSenzaRete.test.js
      - tests/component/RiepilogoOrdini.test.jsx
      - tests/component/AssortimentoAMano.test.jsx

  - id: REQ-MAG-038
    title: "«Lista Ordini»: gli stati, la fattura, e i due confronti che contano"
    area: "src/components/FornitoriTab.jsx, src/components/OrdiniListaPanel.jsx, src/lib/api.js"
    description: >
      Chiesto dall'utente il 27/08/2026. La sottosezione «Ordini» si divide in
      due: «NUOVO ORDINE» e' la schermata di composizione (REQ-MAG-036), e
      nasce «LISTA ORDINI», «che conterra' lo storico di tutti gli ordini
      fatti, filtrabile per STATO dell'ordine».
      GLI STATI DELL'ORDINE SONO I TRE LIVELLI DI FLAVIO, spostati dalla
      riga all'ordine (precisato dall'utente il 27/08: «richiesto,
      consegnato, pagato RIMANGONO per ordine per fornitore, non vanno via
      completamente, mi raccomando»). Non spariscono con il modello a fette:
      cambiano soltanto di posto, e il posto giusto e' il documento, perche'
      adesso il documento e' di un fornitore solo.
      RICHIESTO = l'ordine e' stato mandato al fornitore ed e' aperto (e'
      quello che l'utente chiama anche «effettuato/aperto»).
      CONSEGNATO = la merce e' arrivata in negozio ed e' stata verificata:
      e' qui che avviene il carico a magazzino, sulle quantita' RICEVUTE, e i
      prodotti escono da «in assortimento» (REQ-MAG-037).
      «CONSEGNATO» E «ORDINE RICEVUTO» SONO LA STESSA COSA: «e' solo estetica,
      parole — il concetto e' lo stesso» (utente, 27/08). Non sono due stati e
      non vanno messi in fila uno dopo l'altro. A schermo se ne usa UNA sola,
      sempre la stessa, in tutte e tre le schermate: due nomi per lo stesso
      stato fanno cercare a chi legge una differenza che non c'e', ed e' il
      modo piu' rapido per far credere che manchi un passaggio.
      PAGATO = il documento del fornitore e' stato pagato.
      CHIUSO e' il gesto in piu' che l'utente chiede, e non e' un sinonimo di
      pagato: si puo' mettere solo quando la fattura e' stata RICONCILIATA —
      cioe' quando ordinato, ricevuto e fatturato tornano. Un ordine puo'
      essere pagato e non ancora riconciliato (si paga per non far aspettare
      il fornitore) e riconciliato ma non pagato: per questo la chiusura e'
      un gesto suo e non arriva da sola.
      Il filtro della Lista Ordini e' su questi.
      LA FATTURA, e sono due strade diverse che finiscono nello stesso posto:
      1) SI ASSOCIA: «un tasto associa fattura che mi permettera' di
      selezionare una fattura/proforma — qualsiasi documento fiscale — a
      quell'ordine»;
      2) SI GENERA DALL'ORDINE: «la posso anche generare dall'ordine, coi
      prezzi dell'ordine», che sono quelli del listino definito nella scheda
      del fornitore (REQ-MAG-035).
      QUINDI ANCHE LA FATTURA HA DEGLI STATI, e la differenza che conta e' fra
      una fattura GENERATA da noi — utile per sapere quanto ci si aspetta di
      pagare — e una fattura VERA, arrivata dal fornitore, «che puo' essere
      fatto caricando il documento reale della fattura, anche una foto o un
      pdf» (l'allegato c'e' gia': REQ-MAG-033).
      IL PRIMO CONFRONTO — PREZZI: «nel caso l'ordine abbia la fattura
      associata, bisognera' mostrare la DIFFERENZA DI PREZZO da quando e'
      stato fatto l'ordine rispetto al prezzo indicato in fattura». E' il
      motivo per cui il listino serve: senza un prezzo atteso non c'e' niente
      da confrontare, e un aumento passa inosservato.
      E IL CONFRONTO NON FINISCE IN UN AVVISO: il prezzo della fattura
      ALLINEA il listino di quel fornitore, e la variazione finisce nello
      storico dei prezzi (REQ-MAG-035). Mostrare la differenza e lasciare il
      listino fermo vorrebbe dire far ricomparire lo stesso scarto al giro
      dopo, e a quel punto l'avviso diventa rumore che si impara a ignorare.
      IL SECONDO CONFRONTO — QUELLO CHE E' ARRIVATO: se l'ordine e' ancora
      aperto, «quando l'ordine arriva deve poter MODIFICARE L'ORDINE in base a
      quello che ha effettivamente ricevuto». Da qui nascono tre elenchi da
      tenere distinti: quello che si e' ORDINATO, quello che si e' RICEVUTO, e
      quello che c'e' SULLA FATTURA. «Quando associera' la fattura potra'
      verificare se ci sono gli stessi articoli e i prezzi rispetto a quanto
      indicato nell'ordine effettuato e nell'ordine ricevuto».
      LA BOZZA, stato in piu' chiesto dall'utente il 27/08: «forse sarebbe
      meglio anche salvare l'ordine come BOZZA. L'ordine bozza NON IMPATTA SUL
      MAGAZZINO. In questo modo Flavio puo' riprendere la creazione dell'ordine
      in un altro momento e confermarlo quando effettivamente gli serve».
      Sta PRIMA di «richiesto» ed e' l'unico stato che non fa niente: niente
      «in assortimento» sui prodotti, niente segnalazioni, niente numeri nel
      riepilogo dei soldi che escono. E' importante che non impatti, perche'
      comporre un ordine di venti righe e' un lavoro che si interrompe — arriva
      gente, si apre il locale — e senza bozza si ricomincia da capo oppure si
      conferma un ordine solo per non perderlo, che e' peggio.
      LO STORICO DELL'ORDINE, chiesto per lo stesso motivo: «serve a questo
      punto una LISTA DEI MOVIMENTI fatti per quell'ordine, una specie di
      history, se l'ordine e' gia' stato confermato da Flavio ma Flavio fa
      delle modifiche». Un ordine mandato al fornitore che poi cambia — una
      riga tolta perche' la bottiglia e' stata comprata al supermercato, una
      quantita' corretta all'arrivo, un prezzo rifatto sulla fattura — senza
      storico diventa un documento che non corrisponde piu' a niente e nessuno
      sa piu' perche'. Con tre elenchi da confrontare (ordinato, ricevuto,
      fatturato) le modifiche sono la norma, non l'eccezione: vanno registrate
      con cosa e' cambiato e quando.
      «PAGATO» NON E' UN DATO DELL'ORDINE: E' UNA DOMANDA ALLA SUA FATTURA.
      Deciso il 27/08/2026 dopo che l'utente ha notato la sovrapposizione:
      «il discorso degli ordini pagati e' gia' nello scadenzario». E' vero, e
      resta scritto in un posto solo — sulla fattura (`paid`), che e' anche
      dove sta il tasto, il filtro «solo da pagare» e il totale «Da pagare».
      Chi paga, paga un DOCUMENTO: il bonifico porta sopra il numero della
      fattura, non quello dell'ordine. Quindi:
      · l'ORDINE sa cosa hai chiesto e cosa e' arrivato — richiesto,
      consegnato — perche' e' lui a conoscerli;
      · la FATTURA sa se e' stata pagata;
      · l'ordine e' «pagato» quando la fattura collegata lo e'.
      Due copie dello stesso stato divergono sempre, e il giorno che
      divergono il totale «Da pagare» smette di valere qualcosa proprio
      quando serve, a fine mese col commercialista.
      DA QUI IL GANCIO DIVENTA PORTANTE e non piu' una comodita': senza
      fattura collegata, un ordine non sa se e' stato pagato (REQ-MAG-031).
      E NESSUN PAGAMENTO SENZA UNA RIGA NELLO SCADENZARIO. Chiesto
      esplicitamente dall'utente il 27/08: «il caso di pagare un fornitore
      senza fattura non c'e'. Anche se puo' capitare, io creero' SEMPRE un
      item nello scadenzario che paga un ordine anche senza
      fattura/scontrino/proforma allegato. Possiamo semplicemente indicare
      nella fattura NESSUN DOCUMENTO, ma farlo risultare lo stesso pagato».
      Quindi non nasce nessuna strada alternativa per segnare pagato un
      ordine: si crea la riga nello scadenzario, la si marca «Nessun
      documento» e si paga. Il contante al piccolo fornitore e il
      contrassegno alla consegna restano soldi che escono, e devono comparire
      nel totale del mese come tutti gli altri — se ne esistesse una seconda
      strada, sarebbero gli unici a non comparirci.
      «Nessun documento» e' quindi un valore del TIPO DI DOCUMENTO
      (`doc_type`, che gia' esiste), non un caso speciale: e la fattura senza
      allegato si vede gia' a colpo d'occhio col chip «Senza allegato»
      (REQ-MAG-033), che qui diventa la spia giusta.
      LA RICONCILIAZIONE e' il gesto che dichiara che i tre elenchi tornano.
      Solo dopo l'ordine si puo' mettere a CHIUSO.
      IL CARICO A MAGAZZINO avviene «automaticamente dopo che Flavio ha
      effettivamente verificato che gli sia arrivato tutto quello che ha
      richiesto» — cioe' al passaggio a ORDINE RICEVUTO, sulle quantita'
      ricevute e non su quelle ordinate. In quel momento i prodotti
      «non avranno piu' lo stato in assortimento» e riprendono quello di prima
      se la giacenza torna sopra la soglia (REQ-MAG-037).
      COSA SOSTITUISCE. I tre livelli per riga richiesto/consegnato/pagato
      (REQ-MAG-029) e la consegna per fetta (REQ-MAG-032) lasciano il posto
      agli stati dell'ordine: il documento e' di un fornitore solo, quindi il
      livello per riga non serve piu' a distinguere consegne diverse. Resta il
      principio, che non cambia: il prezzo si corregge quando la merce arriva,
      il fornitore no.
      DOPO, NON ADESSO: l'OCR con l'AI sul documento allegato, «per associare i
      prodotti in fattura all'ordine, o anche solo verificare». La strada e'
      gia' apparecchiata dai tre elenchi e dall'allegato; e' una voce sua
      (REQ-AI-001) e non un pezzo di questa.
      ── COM'E' STATO FATTO (27/08/2026) ──
      DUE SOTTOSEZIONI AL POSTO DI UNA: «Nuovo ordine» e «Lista ordini» in
      FornitoriTab. A tenere i dati e i gesti resta un pannello solo
      (PurchaseOrdersPanel, con `vista`), perche' magazzino, fornitori,
      listini, ordini e documenti servono a tutte e due e leggerli due volte
      vorrebbe dire due versioni della stessa serata a schermo nello stesso
      momento. Quello che si vede sta in `OrdiniListaPanel.jsx`; le decisioni
      e i conti in `src/lib/statiOrdine.js` e `src/lib/confrontoOrdine.js`,
      logica pura, dove si provano senza Firebase.
      DUE ASSI, NON UNA FILA SOLA, ed e' la decisione piu' pesante presa in
      implementazione. I cinque stati SEMBRANO in fila (bozza -> richiesto ->
      consegnato -> pagato -> chiuso) ma non lo sono: il ciclo della MERCE lo
      sa l'ordine, il PAGAMENTO lo sa la fattura, la CHIUSURA e' un gesto a
      parte. Metterli in fila vorrebbe dire che un ordine pagato in anticipo
      — una proforma saldata prima che parta il camion, cosa che si fa per
      non far aspettare il fornitore — smetterebbe di risultare «richiesto»,
      e la merce mai arrivata non la cercherebbe piu' nessuno. A schermo si
      legge quindi lo stato della merce come BADGE e il pagamento come chip
      ACCANTO; il filtro invece e' uno solo, e ogni voce fa la sua domanda
      all'asse che la riguarda.
      IL FILTRO HA UNA VOCE IN PIU', «Da pagare», che il requisito non
      chiedeva: e' la stessa domanda del totale dello scadenzario vista dal
      lato dell'ordine, costa niente una volta che «pagato» c'e', e senza di
      lei l'unico modo di sapere cosa resta aperto sarebbe contare a mano.
      Esclude le bozze: una bozza non e' stata mandata a nessuno, quindi
      nessuno la fatturera', e comparire fra i debiti la farebbe sembrare un
      conto in sospeso.
      IL VOCABOLARIO IN ARCHIVIO NON SI TOCCA. Sul documento il campo resta
      `status` coi suoi valori di sempre, 'inviato' e 'ricevuto', piu' il
      nuovo 'bozza'; a tradurli in «richiesto» e «consegnato» ci pensa
      `statoOrdineDi`, in un punto solo. Rinominare due parole su ordini veri
      sarebbe una migrazione pagata per non guadagnare niente, e gli ordini
      senza il campo (quelli piu' vecchi) continuano a leggersi dalle righe —
      un ordine di ieri non e' una bozza per il fatto di non avere il campo.
      CHIUSO E' UNA DATA A PARTE (`closed_at`) E NON UNO STATO: un ordine
      chiuso resta consegnato. Se la chiusura sostituisse lo stato, chiudere
      un ordine cancellerebbe l'informazione che la merce era arrivata.
      «PAGATO» NON SI SCRIVE PIU' NEMMENO SULLA RIGA: `segnaRighePagate` e
      il tasto «💶 Pagato» sull'ordine non ci sono piu'. Il livello 'pagato'
      della riga resta LEGGIBILE, pero': sta scritto su ordini veri, e
      toglierlo dal vocabolario farebbe rileggere una riga pagata come se non
      fosse mai stata consegnata. Non si scrive piu', si legge ancora.
      TRE ELENCHI, TRE CAMPI. `qty_packages` resta SEMPRE quello ordinato e
      il ricevuto va in `qty_received`; il prezzo di quando l'ordine e'
      partito si conserva in `unit_cost_ordinato` la prima volta che lo si
      corregge, mentre `unit_cost` segue la bolla. Senza questi due campi il
      ricevuto sovrascriverebbe l'ordinato — la cassa mancante non la
      vedrebbe nessuno e la si pagherebbe in fattura — e il confronto dei
      prezzi direbbe per sempre «nessuna differenza». Le righe scritte prima
      ricadono sull'ordinato, che e' anche il caso normale: e' arrivato
      quello che si e' chiesto.
      LA RICONCILIAZIONE SI CALCOLA, NON SI SPUNTA. `riconciliato` guarda il
      prospetto: se ha un solo scarto non torna niente. Con una fattura SENZA
      RIGHE — la testata registrata a mano, che e' il caso normale
      (REQ-MAG-030) — la merce non e' confrontabile ma i soldi si': si accetta
      il documento che cade fra il netto ricevuto e il netto piu' l'IVA, che
      e' la forbice dentro cui deve stare per forza. Piu' stretti si direbbe
      «non torna» a un documento che torna, e chi legge imparerebbe a
      ignorare l'avviso.
      L'ALLINEAMENTO DEL LISTINO E' UN GESTO, non una conseguenza automatica
      dell'aggancio, ed e' la scelta prudente: riscrive il listino di quel
      fornitore e lascia una riga nello storico dei prezzi, e farlo di
      nascosto nell'istante in cui si collega un documento vorrebbe dire
      muovere prezzi che nessuno ha guardato. Il tasto dice quanti prezzi
      sposta. Passa da `registraAcquisto` con il carico SPENTO — la merce e'
      gia' entrata alla consegna — quindi resta una strada sola per cui un
      prezzo si aggiorna, con origine 'fattura'.
      LA FATTURA GENERATA SI RICONOSCE DA UN CAMPO, `generata`, e da un chip
      («Generata dall'ordine») che si vede sia nella Lista ordini sia nello
      Scadenzario. L'importo e' il LORDO, come su qualunque documento dello
      scadenzario, e le righe arrivano da `righeDaOrdine`, la stessa funzione
      con cui lo scadenzario le ricopia: una seconda versione qui vorrebbe
      dire due forme della stessa riga.
      «NESSUN DOCUMENTO» E' UN TIPO COME GLI ALTRI in `TIPI_DOCUMENTO`, e la
      riga si crea dalla stessa strada che genera la fattura, gia' pagata. Su
      quelle righe il chip ambra «senza allegato» non compare: segnalare un
      lavoro che manca a chi ha appena dichiarato che non esiste e' il modo
      di far ignorare gli avvisi.
      LA STORIA E' UN ARRAY SUL DOCUMENTO (`storia`), non una collezione a
      parte: un ordine ha una decina di movimenti in tutto e si scrivono
      nella STESSA `updateDoc` che tocca le righe — due scritture, e a
      restare indietro sarebbe proprio il diario che spiega l'altra. Non si
      ricostruisce all'indietro come quella di un conto (`storiaOrdine.js`):
      una riga tolta non lascia traccia e una quantita' corretta cancella
      quella di prima.
      E LA STORIA SI SCRIVE ANCHE DAL LATO DELLA FATTURA (collegata,
      scollegata, generata), che REQ-MAG-031 aveva escluso per non avere due
      scrittori sullo stesso documento. Quella ragione resta buona per i DATI
      — il legame sta ancora su un campo solo, `order_id` sulla fattura — e
      qui si accetta il rischio solo per il diario: se due terminali
      scrivessero nello stesso istante si perderebbe una RIGA DI DIARIO, non
      un numero.
      IL BUCO SI SEGNALA SOLO DOVE C'E': «senza documento» compare sui soli
      ordini consegnati. Su uno ancora richiesto non e' arrivato niente, e su
      una bozza non e' mai partito niente.
      LA PAROLA E' UNA SOLA: CONSEGNATO, in tutte le schermate, e c'e' un
      test che sorveglia che «Ricevuto» non ricompaia come etichetta.
      ⚠️ IL LIMITE E' STATO TOLTO, il 27/08/2026, appena scritto. Questa voce
      diceva che la Lista ordini legge gli ULTIMI VENTICINQUE ordini, come
      faceva lo storico. L'utente: «questa cosa non ha senso, non deve esserci
      un limite». Chiamarlo «limite noto» era archiviare un difetto invece di
      correggerlo.
      IL MOTIVO E' IL FILTRO, e va detto come lo dice lui, perche' la prima
      versione di questo paragrafo lo diceva male: «non mi interessa il dato
      accumulato, mi interessa poter FILTRARE i pagati, ricevuti, ordinati».
      Il difetto non era che mancasse un totale — nessuno lo ha mai chiesto —
      ma che un filtro su una lettura troncata da' una risposta TRONCATA CHE
      SEMBRA INTERA: chi filtra «pagati» su venticinque ordini letti vede i
      pagati fra quei venticinque, e niente a schermo glielo dice.
      DA DOVE VENIVA: non e' una scelta di questa voce, arriva dal commit
      `aafa62f`, da quando quella lista era «gli ultimi ordini» in fondo alla
      schermata del magazzino. Li' andava bene, perche' quello che prometteva
      erano gli ultimi. Ha smesso di andare bene diventando l'ARCHIVIO con i
      filtri.
      E TRONCAVA IN TRE PUNTI, tutti in silenzio: la Lista ordini (25),
      l'elenco da cui si aggancia una fattura (25 — agli ordini piu' vecchi
      non ci si arrivava, quindi certe fatture non erano agganciabili) e il
      riepilogo dei soldi che escono (100 — sommava un pezzo di anno).
      Adesso `fetchPurchaseOrders()` senza argomenti li legge TUTTI; il limite
      resta accettato come parametro per chi ne avesse davvero bisogno.
      LA REGOLA CHE RESTA: una risposta parziale che non dichiara di esserlo
      e' peggio di una lettura lenta. La lentezza si vede, il pezzo mancante
      no. Se un giorno gli ordini peseranno, la cura e' una lettura paginata,
      e si fara' quando il problema esiste.
