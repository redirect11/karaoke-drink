  - id: REQ-NOTIF-002
    title: "Il banco sa quando arriva un ordine nuovo"
    area: "functions/lib/push-core.js decideNewOrderStaffPush"
    description: >
      Un ordine nuovo — o un'aggiunta a un conto esistente — avvisa il banco.
      Avvisa quello che prima non c'era: si guardano QUALI comande sono da
      fare («ricevuto» o «in preparazione»), non quante. Un ordine battuto
      al POS nasce già in preparazione — chi lo batte sta facendo il drink —
      e guardando i soli «ricevuto» non risultava mai nuovo in coda: al
      banco non arrivava niente.
      Contarle non basterebbe: col cliente che ordina e gli stati accesi,
      «ricevuto» e «in preparazione» sono due momenti diversi — arriva
      l'ordine, poi qualcuno lo prende in mano — e un totale che non cambia
      non distingue «è avanzata quella di prima» da «ne è arrivata una
      nuova». Con gli identificativi, l'arrivo avvisa e l'avanzamento no:
      quella comanda il banco la conosce già, ed è il banco stesso ad
      averla presa in mano.
      Un conto fermo in attesa del pagamento obbligatorio entra in coda
      quando è saldato: lì è nuovo per il banco anche se le comande sono
      le stesse.
      A restare senza avviso è SOLO il dispositivo da cui è partito: sa già di
      averlo mandato. Non si guarda il ruolo: prima si buttava via l'avviso di
      ogni ordine battuto da un admin o da un bartender, dando per scontato che
      chi ha quel ruolo stia al banco — e chi gira ai tavoli col telefono, con
      un account da gestore, non faceva squillare niente a nessuno.
      I token push sono UNO PER DISPOSITIVO (`staff_tokens/<device>`), non
      per persona: prima lo stesso account su tablet e telefono si
      sovrascriveva la riga a vicenda e l'avviso arrivava solo all'ultimo
      che aveva aperto il gestionale — al banco, il tablet muto. Se lo
      stesso token compare due volte (la riga vecchia intestata alla
      persona e quella nuova al dispositivo) si avvisa una volta sola.
      Chi lavora può vedere se su QUESTO schermo gli avvisi arrivano:
      aprendo la campanella lo dice, e dove serve offre di attivarli. Su
      iPhone e iPad la push di sistema esiste solo con l'app installata
      sulla schermata Home, e questo va detto invece di lasciare pensare a
      un guasto.
      Il terminale viaggia con l'ordine (`placed_by.device`) e col token push
      del dispositivo; chi si è registrato prima che il dispositivo venisse
      segnato viene avvisato lo stesso — un avviso in più si chiude, uno in
      meno è un drink che non parte.
    status: implemented
    generate_issue: false
    labels: [notifiche]
    test_cases: [tests/bdd/notify-order.test.js, tests/unit/push-comande.test.js]

  - id: REQ-NOTIF-003
    title: "Un drink pronto avvisa chi lo deve portare"
    area: "functions/lib/push-core.js, functions/index.js, public/sw.js"
    description: >
      Quando una comanda passa a «pronto» l'avviso parte verso TUTTI i
      terminali registrati, tranne quello che ha appena premuto il tasto
      (`avanzamento_device` sul conto): chi l'ha premuto sa già, tutti gli
      altri no.
      NON SI SMISTA PER RUOLO. Questa voce diceva «avvisa la sala, non il
      banco», e la regola era scritta come un filtro sul campo `role` dei
      token: ma quel campo non era il ruolo della persona, era il nome
      della schermata che aveva registrato il dispositivo — sempre la
      coda, sempre 'bartender'. Non era 'staff' mai nessuno, e l'avviso
      non partiva più a nessuno (BUG-036). Chi porta i drink non è un
      ruolo: è chi in quel momento è in piedi.
      VALE ANCHE PER IL RITIRO al banco, che prima usciva subito dando per
      scontato che ci pensasse il cliente: al cliente la push arriva solo
      se ha ordinato dal menù, e un conto battuto al POS non ha nessun
      token. Le due parole sono diverse perché sono due gesti diversi:
      «da servire» al tavolo, «da consegnare» al banco.
      Il service worker la mostra sempre, tranne quando il gestionale è
      DAVVERO sotto gli occhi — visibile, non solo «a fuoco»: il fuoco
      resta alla finestra anche a schermo spento, e un tablet lasciato
      aperto sulla coda si mangiava l'avviso.
    status: implemented
    generate_issue: false
    labels: [notifiche]
    test_cases:
      - tests/bdd/notify-staff-call.test.js
      - tests/unit/serviceWorkerAvvisi.test.js

