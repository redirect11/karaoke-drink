      pagare» (già dentro la merce) e il «consegnato senza fattura» (che
      entrerà quando il documento arriva) — `src/lib/riepilogoFornitori.js`.
      Che il numero dell'app valga MENO di quello dei fogli di Flavio sta
      scritto in testa al Riepilogo, come chiedeva REQ-CASSA-012.
      QUESTA VOCE PASSA A «implemented», e non le resta niente: il legame
