  - id: REQ-STAMPA-016
    title: "La risposta della stampante e' DIAGNOSTICA: racconta, non trattiene"
    area: "src/lib/printer.js (lavoroDiStampa, rispostaDallaStampante, raccontaLaRisposta)"
    description: >
      Fino ad agosto 2026 la risposta della stampante — `onreceive`, con
      esito e codice: carta finita, coperchio aperto, fuori linea — finiva
      in una riga di console scollegata dal lavoro che l'aveva causata:
      NON SAPEVAMO SE LA CARTA FOSSE USCITA, ed e' la causa strutturale di
      BUG-098 («la chiusura di cassa spesso non stampa, e non compare
      nessun avviso»).
      LA STAMPA SI CHIUDE SULL'INVIO, e non deve mai fare altro. Chi chiude
      cassa o batte una comanda vede l'esito nell'istante in cui tocca: e'
      il local-first del CLAUDE.md applicato alla stampante — come non si
      aspetta Firestore per mostrare un conto incassato, non si aspetta la
      testina per dire che la stampa e' partita.
      LA RISPOSTA ARRIVA DOPO E PER CONTO SUO, e serve solo a RACCONTARE:
      aggiorna la voce gia' scritta nel registro delle stampe (da «inviata»
      a com'e' andata davvero) e, quando e' un errore, manda un avviso.
      Non chiude niente, non trattiene nessuno, non fa ritentare.
      PERCHE' QUESTO REQUISITO E' STATO RISCRITTO IL 01/09/2026, ed e' la
      cosa che serve fra sei mesi: la prima stesura (31/08) aveva messo il
      lavoro ad ASPETTARE la risposta, con un ritentativo automatico e una
      memoria «questa stampante parla / non parla» per decidere quando
      valesse la pena aspettare. Era un `await` sulla stampante nel mezzo
      di un gesto, cioe' il divieto numero uno di questo progetto, e tutta
      la macchina che ci stava intorno — attesa, ritentativo, memoria dei
      silenzi — esisteva solo per rendere sopportabile quell'attesa. Tolta
      l'attesa, e' sparita anche quella: quello che non serve piu' non
      resta a fare da trappola per chi legge. Il ritentativo in
      particolare NON torna: senza attesa non c'e' piu' il momento in cui
      riprovare, a ristampare e' una persona, ed e' anche l'unico modo di
      non rischiare il doppio scontrino su una stampa che era uscita.
      COME SI CORRELA una risposta col foglio che l'ha causata, senza
      identificativi (l'SDK non ne da'): le risposte tornano nell'ordine
      degli invii, quindi si contano — chi aspetta l'invio n scarta la
      risposta n-1, che e' di un foglio gia' passato — e si confronta anche
      l'oggetto stampante, perche' dopo una riconnessione e' un altro.
      L'ascolto si chiude da solo dopo qualche secondo: NON e' un'attesa
      (il lavoro e' chiuso da un pezzo), e' il momento in cui si smette di
      dare un padrone alle risposte, perche' un foglio che non riceve mai
      risposta lascerebbe il conto indietro di uno per sempre e da li' in
      poi ogni risposta finirebbe sul foglio sbagliato.
      SOLO GLI ERRORI FANNO RUMORE. Su risposta di errore parte un avviso
      (`notify`), che si vede subito e resta nello storico della
      campanella: dice COSA non e' uscito e PERCHE' in parole da banco
      («Scontrino conto #42: la carta e' finita»), mai il codice dell'SDK,
      che resta nel registro dove serve a chi ripara. Su risposta buona non
      si dice niente: la carta e' uscita e si vede, e un avviso a ogni
      comanda diventa rumore in mezz'ora. E NIENTE VALANGHE: lo stesso
      motivo non si ripete entro un minuto, perche' dieci strisce identiche
      sono peggio di una — si smette di leggerle. Il registro le ha
      comunque tutte.
      IL TEMPO MASSIMO DEL LAVORO (15 secondi, BUG-086) RESTA, ed e'
      un'altra cosa: difende da un lavoro che non finisce, e in quel caso
      la stampa RIFIUTA — perche' li' il chiamante deve saperlo adesso.
    status: implemented
    generate_issue: false
    labels: [stampa, difetto-risolto]
    test_cases:
      - tests/unit/confermaDiStampa.test.js

  - id: REQ-STAMPA-017
    title: "Il registro delle stampe: cosa e' uscito, quando e com'e' andata"
    area: "src/lib/registroStampe.js, src/components/PrinterSetup.jsx"
    description: >
      Una stampa fallita non lasciava NIENTE. L'avviso viveva otto secondi
      in una striscia che compare insieme a quella verde «Cassa chiusa» — e
      coi toast che si accavallano (BUG-078) puo' passare inosservata — e la
      risposta della stampante finiva in una console che nessuno legge. Con
      una cassa che si chiude UNA VOLTA A NOTTE, cosi' si va per tentativi
      per settimane: e' la seconda meta' di BUG-098.
      IL REGISTRO STA SUL DISPOSITIVO e si legge in Impostazioni →
      Stampante, dove c'e' la MACCHINA (indirizzo, prova di stampa, i dati):
      e' il posto dove si va quando la stampante fa i capricci. Per ogni
      lavoro dice COSA si e' provato a stampare, QUANDO, COM'E' ANDATA e il
      MOTIVO quando e' andata male. Accanto c'e' lo stato della CODA — cosa
      e' in corso e quanto c'e' dietro — perche' la seconda domanda davanti
      a una stampante ferma e' «si e' impiantata?».
      LA VOCE NASCE «INVIATA» E SI CORREGGE DOPO (riscritto il 01/09/2026,
      col ripensamento di REQ-STAMPA-016): la stampa non aspetta la
      stampante, quindi la riga entra nel registro nell'istante in cui il
      foglio parte, e la risposta — se arriva — la cambia in «stampata» o
      «non stampata» col motivo. Una voce rimasta «in attesa di risposta»
      NON e' un buco: e' una stampante che non conferma niente, ed e' la
      prima cosa da leggere alla prossima chiusura mancata. Chi ha il
      pannello aperto vede la riga cambiare da se'.
      TRE VINCOLI. Non cresce all'infinito: le ultime 50 voci, e bastano
      perche' la voce che conta — la chiusura — e' l'ULTIMA stampa della
      serata e non viene mai spinta fuori dalle comande della sera dopo.
      Niente dati personali: la voce dice «Scontrino conto #42», mai il nome
      di chi era al tavolo — un registro di diagnostica non e' il posto dove
      tenere i clienti del locale. E non rallenta la stampa: la voce entra
      in memoria subito, il salvataggio in localStorage parte di lato, su un
      microtask.
      FUNZIONA IDENTICO CON LA STAMPANTE FINTA (REQ-STAMPA-009), che dal
      28/08/2026 risponde come quella vera e sa anche fingere due guasti —
      carta finita e nessuna risposta — dal pannello Dev. Senza, questa
      catena si sarebbe potuta provare solo al banco, che e' esattamente il
      motivo per cui BUG-098 e' sopravvissuto tanto.
    status: implemented
    generate_issue: false
    labels: [stampa, difetto-risolto]
    test_cases:
      - tests/unit/registroStampe.test.js
      - tests/component/RegistroStampe.test.jsx

  - id: REQ-STAMPA-009
    title: "In locale la stampante è di carta finta"
    area: "src/lib/stampanteFinta.js, src/lib/printer.js"
    description: >
      Sull'ambiente di sviluppo la stampante non c'è — è un apparecchio
      sulla rete del locale — e ogni modifica a comande e scontrini si
      provava a occhio nel codice, o andando al bar. In locale l'app parla
      con una stampante finta che raccoglie le righe e le apre nella
      finestra di stampa del browser, da cui si salva in PDF: si prova
      quello che ESCE, che è la domanda vera («questa comanda si legge?»).
      SOLO IN LOCALE, e questo è il punto: sull'ambiente di TEST resta la
      stampante vera, perché è lì che si prova il collegamento — certificato,
      rete, riconnessione — e chi prova le funzioni sul test la vuole
      collegata davvero. Il segnale è il server di sviluppo, la build
      «locale» o gli emulatori: se il database è finto, lo è anche il bar.
      Si può forzare nei due versi con VITE_STAMPANTE_FINTA.
    status: implemented
    generate_issue: false
    labels: [stampa, strumenti]
    test_cases: [tests/unit/stampanteFinta.test.js]

  - id: REQ-STAMPA-006
