  - id: REQ-STAMPA-012
    title: "Più comande dello stesso conto si stampano insieme"
    area: "src/lib/printer.js (printComande, comandeStampabili), src/components/OrderPosDetail.jsx"
    description: >
      Chiesto dall'utente il 20/08: «se ho più di una comanda (dello stesso
      ordine!) devo poterle stampare insieme». Un conto battuto in tre
      riprese ha tre ticket, e rifarli uno per uno col conto in mano è tempo
      perso al banco.
      E SERVONO DUE MODI, non uno. Parole sue, sempre del 20/08: «avere la
      possibilità di stampare comande separate se ci sono più comande è
      giusto, e anche di stampare UNA SOLA comanda con tutti i prodotti di
      più comande ma sempre dello stesso ordine. Va bene stampare tutte le
      comande insieme su più ricevute ma serve anche stampare tutto su una
      sola ricevuta».
      DOVE: nel dettaglio del conto, dentro «Comande» — dove ogni comanda ha
      già il suo tasto di stampa. Sopra l'elenco compaiono due tasti, e solo
      quando le comande sono davvero più d'una (con una sola non c'è niente
      da mettere insieme). Le etichette dicono cosa ESCE dalla stampante,
      quanti pezzi di carta, perché è quello che chi stampa deve sapere
      prima di toccare: «Una per comanda (n)» e «Tutto su una».
      «UNA PER COMANDA»: insieme come GESTO, non come ticket. Escono
      SEPARATE, identiche a come uscirebbero da sole — stesso formato,
      stesso taglio in fondo. Al banco un ticket è un giro di lavoro, e due
      giri su una striscia sola sarebbero BUG-051 rifatto apposta.
      «TUTTO SU UNA»: un ticket solo con tutti i prodotti del conto, le
      quantità dello stesso drink sommate (aggregateItems; i personalizzati
      restano righe loro). Il formato è quello di sempre: cambia solo cosa
      ci finisce dentro, non c'è un secondo disegno da mantenere. È la
      stessa forma che in BUG-051 era il ripiego ACCIDENTALE di
      `printComanda` senza comanda: la differenza è tutta qui — prima
      capitava, adesso la sceglie chi stampa.
      IL CONFINE, che l'utente ha sottolineato («ma sempre dello stesso
      ordine!»): un lavoro di stampa contiene SOLO roba di UN conto, per
      tutte e due le strade. Sta nella FIRMA — `printComandaUnita(order)` e
      `printComande(order, comande)` partono da un ordine, non da una lista
      — e non da un controllo che qualcuno può dimenticare. Che nemmeno per
      incidente si mescolino lo garantisce la coda delle stampe (BUG-052).
      LE ANNULLATE RESTANO FUORI da tutte e due: è lavoro buttato, e
      ristamparlo rimetterebbe al banco un ticket da non preparare. Le
      SERVITE invece escono: si ristampa per rifare il giro, non per mandare
      al banco solo quello che manca.
