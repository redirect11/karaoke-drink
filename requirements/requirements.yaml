  - id: REQ-CASSA-006
    title: "La cassa è una sola: flusso, lista ordini, chiusure"
    area: "src/components/CassaTab.jsx, src/lib/sezioni.js"
    description: >
      «Cassa» (prima «Flusso cassa») ha tre sottosezioni nel menu laterale:
      il FLUSSO della serata in corso, la LISTA ORDINI e le CHIUSURE. Erano
      tre posti per la stessa domanda — quanto ho incassato — e due si
      raggiungevano da tasti in fondo alla pagina del flusso, che si
      trovano solo scorrendo fino in fondo; la lista ordini aveva perfino
      una voce sua nel menu, accanto alla cassa, come se fosse un altro
      mestiere.
      Le TIMBRATURE stanno in Staff, in cima alle ore, non in cassa: erano
      in fondo alla pagina del flusso — dove ci si va per i soldi — e per
      battere l'ingresso di chi arriva bisognava passare di lì.
      Il vecchio indirizzo `?tab=storico` continua a funzionare: porta alla
      cassa, aperta sulla lista ordini. Sta nei collegamenti salvati e nei
      messaggi, e non deve finire in una pagina senza nome.
      LE CHIUSURE SONO UNA LISTA, LA STESSA DEL MAGAZZINO (22/08/2026):
      «Anche qui nei rendiconti delle chiusure di cassa serve una lista
      fatta meglio, stile quella del magazzino ma con righe piu' alte».
      Prima ogni serata era una card a se' — riquadro, margine, ombra —
      con dentro una riga alta quanto il suo testo: tre pagine dell'app
      mostrano lo stesso oggetto (righe uguali che si aprono su un
      dettaglio) e lo mostravano in tre modi. Adesso la lista usa la
      famiglia condivisa (`.inv-list`, `.inv-row`, `.inv-row-main`,
      `.inv-row-dettaglio`, DESIGN.md): riquadro unico, righe separate da
      una linea, altezza `--riga-lista` — il bersaglio pieno di BUG-082 —
      e il dettaglio che si apre SOTTO la riga, dov'era.
      QUELLO CHE LA RIGA DICE NON CAMBIA: data, apertura → chiusura,
      durata, incasso. Cambia quanto pesa: l'INCASSO e' il numero che si
      cerca — «com'e' andata ieri sera» si risponde con quello, non con
      l'orario — e sta un gradino sopra i prezzi normali, in coda alla
      riga.
      LA SERATA IN CORSO SI RICONOSCE SENZA LEGGERE, e con due segni non
      uno: la pastiglia verde «in corso» al posto dell'ora di chiusura, e
      la striscia accesa a sinistra della riga. E NON DICHIARA UN INCASSO
      CHE NON CONOSCE: lo snapshot nasce alla chiusura, quindi finche' la
      serata e' aperta al suo posto c'era «0,00 €» — in una lista di soldi
      si legge come «stasera non e' entrato niente», ed e' una bugia.
      Adesso c'e' un trattino finche' il dato non c'e'; aprendo la riga il
      riepilogo viene ricalcolato dagli ordini e la cifra vera compare.
      NIENTE RIQUADRO ATTORNO ALLA LISTA (22/08/2026): «togli il box,
      lascia solo la lista, e aggiungi un selettore di data per cercare una
      chiusura cassa». La `.card` che avvolgeva l'elenco non lo separava da
      niente — e' l'unica cosa della sottosezione — e su una schermata
      fatta di righe si mangiava margine a destra e a sinistra.
      Col riquadro se ne va anche il TITOLO «📒 Chiusure di cassa»: il
      titolo di una pagina sta nella barra in alto, che quando si e' qui
      dice gia' «Chiusure» (src/lib/sezioni.js), e ripeterlo dieci pixel
      piu' sotto costa una riga senza aggiungere niente. E se ne va la
      didascalia «Una riga per serata, dall'apertura alla chiusura. Tocca
      per il venduto.»: descriveva quello che la riga ha gia' scritto
      sopra, ed era il tono confidenziale da cui ci si e' allontanati lo
      stesso giorno (DESIGN.md, guardrail 3).
      Resta la lista, esattamente come nelle statistiche (StatsTab.jsx →
      «📒 Per serata», dove un riquadro non c'e' mai stato): sono lo stesso
      elenco e devono leggersi allo stesso modo. La ricerca per data che si
      e' aggiunta sopra la lista sta in REQ-CASSA-013.
    status: implemented
