      drink esista — un doppione salvato di nascosto finirebbe in carta al
      cliente. Salvando nasce un prodotto nuovo: l'originale non si tocca.
      La foto resta all'originale: il file è agganciato al drink che l'ha
      caricata, e cancellando quello sparirebbe anche dalla copia.
