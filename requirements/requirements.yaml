  - id: REQ-PAG-009
    title: "Nel pagamento gli item sono separati di partenza"
    area: "src/components/PaymentScreen.jsx, src/lib/pagamento.js"
    description: >
      La schermata di incasso mostra gli item UNO PER RIGA fin da subito,
      senza dover premere «Separa uguali»: al banco si paga quasi sempre a
      pezzi — uno paga il suo, un altro offre due birre — e partire dal
      gruppo «3× Birra» vuol dire un tocco in piu' ogni volta, proprio
      mentre c'e' gente alla cassa. Restano possibili sia il raggruppamento
      («Unisci uguali», per un conto lungo che diventa illeggibile) sia
      l'incasso completo con un colpo solo.
      Ogni unita' e' una cosa a se': accenderne o spegnerne una non tocca
      le altre (vedi BUG-006, che nasce dallo stesso punto).
      FATTO (1.5.x). La schermata di incasso nasce con le righe uguali già
      separate: «2× Mojito» sono due righe da «1/1». Il tasto che c'era
      resta ed e' lo stesso — cambia solo faccia: adesso all'apertura offre
      «🔗 Unisci uguali», e unendo ripropone «≣ Separa uguali». Dove non
      c'e' niente da unire ne' da separare (righe tutte da uno) non compare
      affatto, come prima. La selezione parte PIENA come sempre: chi incassa
      tutto preme «Riscuotere» senza toccare niente, e l'incasso pieno
      continua a partire senza dettaglio articoli.
      IL PRIMO TOCCO RESTRINGE, I SUCCESSIVI AGGIUNGONO (chiesto dall'utente
      il 20/08/2026): «Quando apro la schermata del pagamento, quando clicco
      su una voce, anche solo sulla label, si devono azzerare le altre voci; e
      se voglio aggiungere alla riscossione le devo premere, la label, o premo
      il +. Quindi quando apro sono tutte selezionate, ma se premo o la label
      o il più le altre voci passano a 0, E DIVENTANO GRIGE O DI UN COLORE PIÙ
      SMORTO, e quando le premo le aggiungo al conto che voglio riscuotere».
      Il gesto vero al banco è «di tutto questo conto, adesso mi paghi
      QUESTI»: per arrivarci si spegneva una riga per volta tutto quello che
      NON serviva — su un conto da dieci righe, nove tocchi per incassarne
      una.
      · L'ETICHETTA È UN TASTO (con `aria-pressed`, bersaglio da pollice): al
        banco si punta il prodotto, non il piccolo «+» accanto.
      · Con TUTTO in riscossione, toccare una voce (etichetta o «+») vuol
        dire «solo questa» e spegne tutte le altre; da lì in poi toccare vuol
        dire «anche questa». Il «−» toglie come ha sempre fatto, anche al
        primo tocco: è il vecchio modo di dividere il conto, e chi lo usa da
        mesi non deve accorgersi di niente.
      · Le voci fuori dalla riscossione si vedono SMORTE (gettoni del tema:
        `--muted` e opacità, mai un grigio cablato), ma restano leggibili e
        toccabili — è toccandole che si rientra — e accanto resta scritto
        «0/2», che il colore da solo non basta.
      · RIGHE CON PIÙ UNITÀ: l'etichetta prende la riga INTERA («questo
        prodotto lo paga lui»), il «+» e il «−» muovono una unità per volta,
        com'è sempre stato. In «separa uguali» — che è come la schermata si
        apre — ogni unità è una voce a sé e vale la stessa regola: il primo
        tocco su una unità spegne tutte le altre unità di tutte le righe. Un
        meccanismo solo (`selezioneDopoTocco`), non due.
      · SI TORNA A TUTTE col tasto «Seleziona tutti» in cima alla lista (vedi
        qui sotto): prima era «Rimetti tutto in pagamento», in fondo alle
        righe, e compariva solo quando qualcosa era uscito.
      · «VERGINE» NON È UN FLAG: è lo stato che si vede a schermo — tutte le
        righe dentro per intero (`selezioneVergine`). Così non c'è niente da
        rimettere a posto quando il conto cambia sotto, quando si rientra o
        quando si è appena incassata una parte, e «Rimetti tutto» riporta al
        primo tocco senza saperlo. Due conseguenze volute: si RIENTRA sulle
        righe di uno sconto già preparato (`discount_items`, REQ-PAG-013) e
        quella non è una selezione piena, quindi un tocco aggiunge invece di
        buttare via le righe su cui lo sconto era stato deciso; e una riga che
        arriva mentre la schermata è aperta non entra da sola in un importo
        che il cassiere ha già detto ad alta voce.
      DESELEZIONA TUTTI / SELEZIONA TUTTI (chiesto da Flavio il 21/08/2026,
      con una registrazione vocale): «Nella sezione dei pagamenti degli
      ordini, dove in alto appare unisci uguali e separa uguali, mi dovrebbe
      apparire a fianco un altro bottone dove in automatico appare deseleziona
      tutti e poi dopo seleziona tutti. [...] Se devo fare un pagamento
      parziale e il cliente mi inizia a dire cosa ha preso di quel conto, io
      premendo deseleziona tutti me li porta tutti a zero e io man mano mi
      metto il più uno, più due, oppure un altro più uno su un'altra cosa.
      Immagina un conto con venti prodotti sopra: ne deve pagare uno solo, io
      devo togliere la spunta a venti voci. Invece così premo un solo tasto,
      si deselezionano tutti, e seleziono poi io».
      · UN TASTO SOLO, IN CIMA, nella stessa riga di «separa/unisci uguali» e
        con lo stesso vestito — «così come c'è unisci uguali e separa uguali».
        Il vecchio «Rimetti tutto in pagamento» in fondo alla lista non c'è
        più: faceva la metà del lavoro, e la faceva dove nessuno guardava.
      · CAMBIA SCRITTA e dice cosa FARÀ, non in che stato sei: «Deseleziona
        tutti» quando c'è qualcosa dentro, «Seleziona tutti» quando la lista
        è tutta a zero. Senza icona davanti, a differenza dei vicini: su un
        telefono da 360px le scritte devono stare sulla stessa riga, e
        «Deseleziona tutti» è già la più lunga della schermata. Con una selezione PARZIALE dice ancora
        «Deseleziona tutti»: è quello il gesto che serve — si riparte da zero
        e si rimettono dentro le voci giuste — ed è il motivo per cui questo
        tasto esiste. Per rimettere tutto dentro da una selezione parziale si
        passa quindi da zero, due tocchi.
      · UN MECCANISMO SOLO, anche in «separa uguali»: `selezioneTotale` scrive
        il conteggio E le unità, così una riga portata a zero non lascia
        accese le sue caselle. La regola del primo tocco non cambia di una
        virgola: a zero la selezione non è più piena, quindi il tocco
        successivo AGGIUNGE — che è esattamente il «man mano mi metto il più
        uno, più due».
      · CON ZERO RIGHE SCELTE — stato che prima si raggiungeva solo spegnendo
        una riga per volta, e adesso è il punto di partenza normale di ogni
        conto diviso: l'importo proposto è 0,00 €, sopra c'è scritto «NESSUNA
        RIGA SCELTA» invece di «PAGAMENTO», e sotto come si esce («tocca le
        voci da incassare, o batti un importo»). «Riscuotere» è spento finché
        non c'è niente da incassare, così da qui non parte un incasso a caso;
        il TASTIERINO resta vivo, perché battere una cifra a mano è un
        acconto legittimo e continua a riaccendere il tasto.
      · LO SCONTO IN PREPARAZIONE (REQ-PAG-013) RESTA SOSPESO, non si azzera e
        non si allarga. Con zero righe non c'è niente su cui farlo cadere:
        ricalcolarlo lo stenderebbe su tutto il residuo alle spalle di chi
        l'aveva deciso su tre voci (e con la strategia «proporzione» lo farebbe
        pure crescere). Buttarlo via sarebbe altrettanto sbagliato:
        «Deseleziona tutti» è il gesto con cui si COMINCIA a dividere un conto,
        non quello con cui si rinuncia allo sconto. Resta dov'è, e al primo
        tocco su una voce torna a seguire la selezione.
    status: implemented
    generate_issue: true
    labels: [pagamenti, ui]
    priority: P1
    test_cases: [tests/component/PaymentScreen.test.jsx, tests/unit/pagamento.test.js]

