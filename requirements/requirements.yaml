  - id: REQ-STAMPA-014
    title: "I campi dello scontrino e della comanda si scelgono dalle impostazioni"
    area: "src/lib/campiStampa.js, src/lib/printer.js (printScontrino, printComanda), src/components/CampiStampa.jsx"
    description: >
      Chiesto dall'utente il 20/08: «servono delle impostazioni per
      cambiare/modificare/aggiungere/eliminare i campi dello scontrino. I
      campi che si possono aggiungere/togliere NON sono campi liberi: sono
      i campi che in genere si trovano su uno scontrino. La stessa cosa per
      la comanda. Per i campi che si possono customizzare/eliminare/
      aggiungere fai tu in base ai dati che gestiamo. Sicuramente deve
      andarci la lista dei prodotti, quella è fissa. Magari insieme alle
      impostazioni per cambiare/visualizzare/nascondere il logo».
      UN VOCABOLARIO CHIUSO, non un editor di modelli: i campi sono quelli
      che le due stampe già maneggiano, elencati in lib/campiStampa.js con
      l'etichetta da vassoio e il valore di partenza. Ogni campo ha un
      interruttore; dove il campo è PURO TESTO (la fascia della comanda, la
      riga sotto al nome, le righe di servizio, la riga di saluto) ha anche
      le parole, modificabili.
      LA LISTA DEI PRODOTTI È FISSA — parole dell'utente — e non compare
      nemmeno fra le scelte: non c'è modo di spegnerla per sbaglio. Sullo
      scontrino è fisso anche il TOTALE (scelta nostra, dichiarata): un
      conto senza totale non è un conto, e chi lo riceve non avrebbe niente
      da controllare.
      SCONTRINO — si possono togliere: nome del locale, indirizzo, CAP e
      città, numero e data, chi stampa lo scontrino, quante persone, tavolo
      o nome del cliente, intestazione delle colonne, coperto, sconto, IVA
      e imponibile, come è stato pagato, codice lotteria, codice del conto,
      ragione sociale in fondo. Si può aggiungere una riga di saluto, spenta
      di suo. Le PAROLE del nome del locale, dell'indirizzo e della ragione
      sociale restano dove sono sempre state (impostazioni della stampante,
      riquadro «Dati del locale»): lì si scrivono, qui si sceglie se
      stamparle — due posti che scrivono la stessa cosa sarebbero un modo
      per perderla.
      COMANDA — si possono togliere: fascia nera in cima, ora nella
      fascia, riga del conteggio, riga del reparto, nome o tavolo in
      grande, riga sotto al nome, note dei singoli prodotti, nota del
      conto. Si può aggiungere una riga in fondo, spenta di suo.
      Fascia e ora spente insieme non lasciano una striscia nera vuota: la
      fascia non esce proprio (strisciaComanda, funzione pura).
      COSA DICE LA FASCIA (dal 25/08/2026, BUG-089). «COMANDA 2 - ORDINE
      28»: quale ticket è, dentro quale conto. Fino ad allora era una
      casella di testo che diceva «DIRETTO» su ogni comanda — un'etichetta
      di SumUp POS Pro, il modello da cui questa carta è stata copiata,
      dove indica la PRIMA infornata di un ordine spedito a portate
      (le successive sono «Ordine 1», «Ordine 2»). Noi la stampavamo anche
      sulla seconda e sulla terza comanda dello stesso tavolo, cioè col
      significato ribaltato. «Non usiamo Diretto o Subito. Chiamiamo
      Comanda X - Ordine Y sulla comanda» (l'utente, 25/08/2026).
      Il numero c'è anche quando la comanda è una sola: «senza numero vuol
      dire la prima» è una regola che chi legge un ticket non deve
      conoscere. È lo stesso nome che la comanda ha sullo schermo (corsia
      e dettaglio del conto).
      IL TESTO LIBERO DELLA FASCIA È SPARITO, l'interruttore no: il
      contenuto viene dai dati e una casella lì sopra vorrebbe dire poter
      far mentire il ticket. Un locale che aveva scritto la sua parola non
      trova niente di rotto — quel testo non viene più letto — e per dire
      «questo ticket è del bar» resta la riga del reparto.
      L'ORA È SCESA SOTTO, dentro lo stesso rettangolo nero: a corpo
      doppio sulla carta da 80 mm ci stanno 24 caratteri e la riga ne
      occupa 21. Le due righe si pareggiano in larghezza, se no il nero
      uscirebbe a scaletta.
      SONO IMPOSTAZIONI DEL LOCALE (settings/bar: `stampa_scontrino`,
      `stampa_comanda`, `stampa_logo`), non del terminale: lo scontrino è
      l'identità del bar, non una preferenza del tablet che l'ha stampato.
      Ma la STAMPA NON ASPETTA LA RETE: printer.js legge la copia locale
      che subscribeSettings riscrive a ogni risposta del server
      (lib/impostazioniLocali.js).
      NIENTE MIGRAZIONE: impostazione assente vuol dire valore di partenza,
      e i valori di partenza sono il comportamento di prima. In un locale
      che questo pannello non l'ha mai aperto la carta esce IDENTICA,
      carattere per carattere — c'è un facsimile a registro che lo prova, e
      se cambia o è cambiato il formato di proposito o qualcosa si è spento
      da solo.
      UN CAMPO CHE IL VOCABOLARIO NON CONOSCE SI STAMPA: se domani
      printer.js scrive un blocco nuovo e qui nessuno l'ha ancora elencato,
      la carta esce completa. Una riga sparita in silenzio sarebbe il
      difetto peggiore che questa roba possa avere.
      DOVE: Impostazioni → Stampante, sotto la connessione: «Cosa c'è sullo
      scontrino», «Cosa c'è sulla comanda» e «Logo sulle stampe»
      (REQ-STAMPA-011). Ogni riquadro ha una PROVA DI STAMPA che stampa un
      conto finto passando dalle stesse funzioni della serata — in locale
      apre il facsimile, al banco esce la carta: scegliere i campi senza
      vedere il risultato è scegliere alla cieca.
      COSA STAMPANO `operatore` E `riga_vendita` (dal 25/08/2026, BUG-088).
      Fino ad allora l'interruttore c'era ma quello che accendeva non
      diceva il vero: `operatore` scriveva la costante «Utente A» — uguale
      per chiunque e per sempre — e `riga_vendita`, senza tavolo,
      ripiegava su «Vendita - Comanda #28», cioè il numero del CONTO già
      stampato in cima e per giunta chiamato comanda.
      `operatore` porta il NOME DI CHI STA STAMPANDO: l'utente collegato a
      quel terminale, non chi ha battuto il conto né chi ha incassato
      («quell'"Utente A" dovrebbe essere il nome dell'utente che stampa lo
      scontrino», l'utente, 25/08/2026). Il nome arriva dall'ascolto di
      Firebase Auth (App.jsx) insieme all'uid con cui la stampante sceglie
      già la sua scheda, si ricorda in memoria locale — la prima stampa può
      capitare prima che Firebase abbia finito — e si ricava con
      `placedByName`, la stessa funzione della coda e del dettaglio conto.
      Una RISTAMPA porta il nome di chi ristampa: è lui che quel foglio lo
      consegna. Nessuno collegato: LA RIGA NON ESCE, che è meglio di una
      formula vuota.
      `riga_vendita` dice a chi appartiene il conto e nient'altro: il
      tavolo, o il nome del cliente se il tavolo non c'è (la stessa scelta
      del titolo grande della comanda), o niente. Il numero sta in cima, e
      una riga che lo ripete si legge come un secondo numero.
      Il plurale della riga `persone` è «2 clienti»: fino al 25/08 usciva
      «2 clientei».
      Le stesse due regole valgono sulla ricevuta d'acconto
      (REQ-STAMPA-015), che ha gli stessi due campi.
    status: implemented
    generate_issue: true
    labels: [stampa, impostazioni]
    priority: P2
    test_cases:
      - tests/unit/campiStampa.test.js
      - tests/unit/campiDiStampa.test.js
      - tests/component/CampiStampa.test.jsx

  - id: REQ-STAMPA-015
    title: "Lo scontrino d'acconto: la carta di chi versa una parte e se ne va"
    area: "src/lib/printer.js (printScontrinoAcconto), src/lib/scontrinoAcconto.js, src/lib/campiStampa.js, src/components/PaymentScreen.jsx, src/components/SettingsTab.jsx"
    description: >
      «È normale che se riscuoto solo un acconto non mi stampa lo
      scontrino?» (l'utente, 21/08/2026). Sì, ed era di proposito: la stampa
      era appesa alla CHIUSURA del conto (REQ-STAMPA-001) e un acconto non
      chiude. Era una scelta presa quando l'acconto era un caso di margine —
      da quando si sconta sulla selezione (REQ-PAG-013) e si parte da
      «Deseleziona tutti» (REQ-PAG-009), riscuotere una parte è il modo
      normale di dividere un conto.
      LA DECISIONE, parole sue (21/08/2026): «Lo scontrino esce ad ogni
      riscossione ma è configurabile. Va fatto così: una impostazione che
      attiva un terzo bottone, "riscuoti acconto con scontrino", e una
      ulteriore opzione che invece ad ogni riscossione stampa lo scontrino
      d'acconto. Il tasto preconto continua a stampare lo scontrino totale
      con tutti gli acconti specificati, così come lo scontrino finale
      (stampato quando si riscuotono gli ultimi articoli dell'ordine).
      Quando la riscossione dello scontrino di acconto è attiva, disabilita
      l'opzione del terzo bottone».
      IL DOCUMENTO È NUOVO, non lo scontrino con un'altra intestazione:
      risponde alle quattro domande di chi ha appena messo dei soldi sul
      tavolo con altri sei intorno — cosa ho pagato (le righe di QUELLA
      riscossione, quando ce ne sono: un acconto battuto a mano non salda
      righe in particolare e la lista non si stampa affatto), quanto, con
      che metodo, e quanto resta da incassare sul conto.
      E NON SI PUÒ SCAMBIARE PER LO SCONTRINO FINALE: la fascia nera
      ACCONTO in cima e la riga in fondo che dice che il conto resta aperto
      NON sono campi e non si spengono, come non si spengono la lista delle
      righe e l'importo versato (stessa regola per cui il totale dello
      scontrino è fisso, REQ-STAMPA-014). Tutto il resto — intestazione,
      numero e data, operatore, tavolo, sconto della riscossione, metodo,
      riepilogo del conto, codice, ragione sociale, riga di saluto — sta nel
      vocabolario chiuso di lib/campiStampa.js (`stampa_acconto`) e si
      accende dalle impostazioni. Il logo segue le regole di REQ-STAMPA-011
      con un tipo suo, acceso di suo: è carta che resta in mano al cliente,
      come il preconto.
      DUE INTERRUTTORI, in «💳 Pagamenti» accanto a «senza stampa» e
      «riscuoti e servi» (la lezione di BUG-070), tutti e due spenti di
      suo — chi non tocca niente non vede cambiare niente:
      `scontrino_acconto_tasto` fa comparire il terzo tasto «Acconto con
      scontrino» nella riga dei tasti alternativi;
      `scontrino_acconto_sempre` fa uscire la carta da sé a ogni riscossione
      che non chiude il conto. Quando il secondo è acceso il primo è SPENTO
      E NON TOCCABILE, con scritto perché: sparire sembrerebbe un guasto.
      La regola sta in un posto solo (lib/scontrinoAcconto.js), così il
      pannello e la cassa non possono pensarla diverso.
      QUANDO L'INCASSO CHIUDE IL CONTO il terzo tasto non sparisce, si
      SPEGNE e al tocco dice perché — lì la carta che esce è lo scontrino
      finale. Sparendo, comparirebbe e sparirebbe sotto il dito a ogni riga
      tolta o rimessa mentre si divide il conto, facendo ballare tutta la
      riga dei tasti.
      IL TERZO TASTO STAMPA SEMPRE, la stampa automatica del terminale non
      c'entra: è un gesto esplicito, come «Preconto». L'opzione automatica
      invece la rispetta (`autoPrintScontrino`), perché è carta che esce da
      sola: il telefono della sala che gli scontrini non li stampa non deve
      cominciare a stampare acconti.
      NIENTE PRETESA E NIENTE SEGNO SUL DATO: `claimReceiptPrint` e
      `receipt_print_at` dicono «la carta di QUESTO CONTO è già uscita», che
      è uno stato del conto. Un acconto è un evento — su un conto ce ne
      stanno tre — e legarlo a quel segno vorrebbe dire che il secondo non
      stampa più, o bruciare la pretesa dello scontrino finale (BUG-047).
      Il lettore SumUp resta fuori: lì l'incasso si registra quando risponde
      il lettore, non al gesto, e la carta segue il gesto.
      IL PRECONTO ELENCAVA GIÀ GLI ACCONTI ma non diceva quanto restava:
      «Totale con IVA» sopra e gli incassi sotto, e la sottrazione la faceva
      a mente chi teneva il foglio davanti al cliente. Adesso su un conto
      ancora aperto con degli incassi presi c'è anche «Resta da pagare»; su
      uno scontrino di chiusura il residuo è zero e la riga non compare.
      LE DUE RIGHE SOTTO AL NUMERO seguono le stesse regole dello scontrino
      (REQ-STAMPA-014, BUG-088): `operatore` porta il nome di chi sta
      stampando — al banco è chi ha appena preso i soldi, la persona che il
      cliente ha davanti — e non esce se non si sa chi è; `riga_vendita`
      dice il tavolo o il nome del cliente, e non esce se non ce n'è
      nessuno dei due, perché il numero è già in cima («ACCONTO - 12»).
    status: implemented
    generate_issue: true
    labels: [stampa, pagamenti]
    priority: P1
    test_cases:
      - tests/unit/scontrinoAcconto.test.js
      - tests/unit/cartaAcconto.test.js
      - tests/component/PaymentScreen.test.jsx
