  - id: REQ-STAMPA-011
    title: "Il logo sugli scontrini si sceglie: quale, e su quali stampe"
    area: "src/lib/campiStampa.js, src/lib/printer.js (stampaLogo, logoPerStampa), src/components/CampiStampa.jsx"
    description: >
      Chiesto dall'utente il 19/08. Prima il logo veniva stampato in cima
      allo scontrino e basta: nessuno poteva spegnerlo, e per cambiarlo
      bisognava sostituire un file nel codice.
      SU QUALI STAMPE, una per una: scontrino, preconto, comanda, chiusura
      di cassa. I valori di partenza sono quelli di ieri — il logo esce
      sullo scontrino e sul preconto, non sulla comanda («al banco è solo
      carta consumata») né sulla chiusura, che è un foglio interno.
      PRECONTO E SCONTRINO SONO LA STESSA STAMPA (printScontrino) e nessun
      chiamante passa un tipo: la differenza la fa il CONTO — un foglio
      stampato su un conto ancora aperto È il preconto, chiunque l'abbia
      chiesto e da qualunque schermata (tipoScontrino). Così la scelta vale
      anche per lo scontrino stampato dalla coda, non solo per il tasto
      «Preconto» della schermata di pagamento.
      L'IMMAGINE SI CARICA, e la carica solo l'admin: è l'identità del
      locale, non una preferenza del terminale. Sta nelle impostazioni del
      bar (settings/bar, `stampa_logo.immagine`) come immagine già RIDOTTA
      alla larghezza della testina — 220 punti, pochi kB.
      DOVE STA L'IMMAGINE, e perché non su Storage: la stampa non può
      aspettare la rete. Le impostazioni del locale ogni terminale se le
      porta già dietro (subscribeSettings → lib/impostazioniLocali.js), un
      indirizzo su Storage vorrebbe dire una lettura in più davanti al
      cliente — ed è la stessa ragione per cui il caricamento del logo ha
      già un tempo massimo di tre secondi (BUG-053). Ridotta a 220 punti
      l'immagine pesa quanto poche righe di testo; sopra i 150 kB non si
      tiene e si dice perché.
      SI DICE SUBITO, NON SULLA CARTA: «il caricamento deve dire subito se
      l'immagine non va bene invece di stampare un rettangolo nero». Si
      guarda l'immagine GIÀ RIDOTTA — la stessa che finirebbe sulla testina
      — e si contano i punti scuri: una foto scura verrebbe fuori come un
      rettangolo nero in cima a ogni scontrino della serata. Si rifiuta
      anche l'immagine quasi tutta chiara (non si vedrebbe), quella molto
      più alta che larga (si mangia mezzo scontrino) e quella che resta
      pesante; quella piccola si può usare, con l'avviso che sgranerà. Se
      si rifiuta, il logo resta quello di prima.
      CAMBIARE IL LOGO LO CAMBIA DAVVERO: la cache in printer.js vale per
      QUELL'immagine (l'indirizzo), non «una volta e basta» — prima il
      logo nuovo sarebbe uscito solo dopo un riavvio dell'app.
