  - id: REQ-MAG-015
    title: "Macro-categorie di magazzino e di menù, per incrociare speso e incassato"
    area: "src/lib/macros.js, src/components/InventoryManager.jsx, src/components/StatsTab.jsx"
    description: >
      Chiesto da Flavio a voce (17/08, nota delle 20:13). Le macro-categorie
      oggi sono una cosa sola e stanno sul MAGAZZINO: raggruppano le
      categorie dei prodotti che si comprano. Servono anche sul MENÙ, sulle
      categorie dei drink che si vendono — e le due cose vanno tenute
      distinte («macro-categorie magazzino» e «macro-categorie menù»).
      A cosa servono davvero: incrociarle. Da una parte quanto si è SPESO in
      una macro d'acquisto, dall'altra quanto si è INCASSATO in una macro di
      vendita, e il confronto fra le due — che è la domanda che il locale si
      fa a fine mese e a cui oggi si risponde a mano.
      Da decidere prima di scrivere codice: se le due macro vivono nella
      stessa collezione con un campo che dice a chi appartengono o in due
      separate; e come si aggancia una macro d'acquisto alla macro di
      vendita corrispondente (una a una, o molte a molte).
      FATTO (1.4.8) il primo pezzo: i due elenchi esistono davvero. Le macro
      hanno un `ambito` ('magazzino' o 'menu', le righe vecchie sono tutte di
      magazzino), il menù ha la sua sottosezione «Macro-categorie» che
      raggruppa le categorie dei drink, e su ogni macro di spesa si sceglie a
      quale macro di vendita corrisponde (`macro_menu_id`). Il pannello è uno
      solo, condiviso dalle due schermate.
      DA FARE: il confronto vero e proprio — speso su una macro d'acquisto
      contro incassato sulla macro di vendita agganciata. Attenzione: la
      tabella «Mensile per macro» che c'è già confronta acquisti e fatturato
      sulle macro di MAGAZZINO, spalmando l'incasso di ogni drink sugli
      ingredienti in proporzione al costo. Le due letture rispondono a
      domande diverse e vanno tenute distinte, non sovrapposte.
      RIPENSATO (18/08, vocale delle 15:47 — «discorso abbastanza complesso»,
      parole sue). Il confronto sopra non basta quando un ingrediente
      finisce in un drink di una macro DIVERSA dalla propria: «un prodotto
      può essere venduto in due macro categorie differenti». Il gin è
      semplice — comprato in «distillati», venduto nel Gin Tonic che sta in
      «alcolici e distillati»: stessa macro, nessun conflitto. Il caso
      complesso è la SCHWEPPES: comprata come bibita (macro magazzino
      «birre e bibite»), ma quando finisce in un Gin Tonic — che nel menù
      sta in «alcolici e distillati» — quella porzione «deve migrare nei
      distillati». Stesso schema per la RED BULL, comprata come bibita e
      venduta in uno Jäger Bomb (alcolici e distillati). Sintesi sua: «il
      menù alla fine controlla il magazzino».
      INTERPRETAZIONE DA CONFERMARE (non è la sua frase testuale, è la
      lettura che ne dà chi scrive questo requisito — riportata perché presa
      alla lettera la frase è irrealizzabile): non è il PRODOTTO a cambiare
      macro-categoria — la stessa Schweppes si vende anche da sola, quindi
      non può stare in una macro sola, e cambiarla nell'anagrafica romperebbe
      il magazzino. A migrare, ai soli fini del CONFRONTO acquistato/venduto/
      margine, è il singolo CONSUMO: la porzione di Schweppes versata in quel
      Gin Tonic si attribuisce alla macro di vendita del drink (distillati),
      non alla macro d'acquisto del prodotto (bibite). L'anagrafica del
      prodotto — la sua macro di magazzino — non si tocca mai.
      Se questa lettura è sbagliata, il rischio è concreto: al primo Gin
      Tonic venduto il magazzino sballa.
      CASI DI PROVA (le sue parole, non inventati): la Schweppes comprata in
      «birre e bibite» e venduta dentro un Gin Tonic conta, in quel consumo,
      su «alcolici e distillati»; la Red Bull comprata in «birre e bibite» e
      venduta dentro uno Jäger Bomb conta, in quel consumo, su «alcolici e
      distillati».
      CONFERMATO E PRECISATO (18/08, vocale delle 15:52). La lettura qui
      sopra e' quella giusta, e lui la irrigidisce: non si scompone NIENTE.
      Parole sue: «non mi deve fare la scomposizione della ricetta [...] e'
      tutto l'items che va nella macro categoria», e ancora «la Schweppes
      l'ho venduta come se fosse un distillato in quel momento, perche'
      integrato». Quindi la vendita di una voce di menu si attribuisce
      INTERA alla macro di quella voce — incasso e costo di tutti i suoi
      ingredienti insieme — e non si spalma sulle macro dei singoli
      prodotti che la compongono.
      E dice anche cosa il programma NON deve fare, indicando una cosa che
      gia' fa: «credo che sia la cosa che sta facendo adesso». E' la tabella
      «Mensile per macro» descritta qui sopra, che spalma l'incasso di ogni
      drink sugli ingredienti in proporzione al costo: quella scomposizione
      va tolta, non affiancata.
      DECISO (18/08, dall'utente): il COSTO DEL VENDUTO segue la vendita.
      La porzione di Schweppes finita in un Gin Tonic conta su «alcolici e
      distillati» insieme al suo incasso; in «birre e bibite» resta solo
      quello che e' stato venduto COME bibita, incasso e costo. Cosi' il
      margine per macro torna: ogni macro confronta soldi entrati e costo
      di quello che ha venduto davvero, senza pezzi che arrivano da
      un'altra parte.
      IL ROVESCIO NON E' UN COMPROMESSO, E' LA COSA GIUSTA. Da questa
      tabella non si legge piu' «quanto ho speso in bibite», e va bene
      cosi' (parole sue: «ed e' giusto che non sia piu' leggibile da li'»).
      Questa tabella risponde a UNA domanda — quanto rende ogni macro di
      quello che vendo — e un numero che parla d'altro, in mezzo, la
      renderebbe ambigua invece che piu' ricca. «Quanto ho speso in
      bibite» resta una domanda vera, ma e' degli ACQUISTI — le fatture,
      quello che e' entrato dalla porta — e vive dove stanno gli acquisti,
      non qui. Non serve nemmeno spiegarlo sotto la tabella: non c'e'
      niente da giustificare, c'e' una colonna che non deve esserci.
      DA TOGLIERE, non affiancare: la scomposizione di `splitLineRevenueByMacro`
      (src/lib/macroStats.js), che spalma l'incasso di ogni drink sugli
      ingredienti in proporzione al costo. Con la regola qui sopra non
      serve piu' a nessuno, e due letture diverse della stessa serata
      convivendo sono il modo migliore per non fidarsi di nessuna delle
      due.
      GLI ELENCHI SONO DUE, E NON ERA UNA DOMANDA APERTA (chiuso il 19/08
      dall'utente): «Le macro-categorie sono macro-categorie per gli
      ACQUISTI e macro-categorie per le VENDITE». Cioe' com'e' gia' fatto
      dalla 1.4.8, ed e' la stessa cosa chiesta il 17/08.
      La frase del vocale delle 15:47 — «sono le stesse, non sono
      separabili» — era stata segnata come possibile contraddizione, e non
      lo e': dice che le due famiglie si GUARDANO INSIEME, che e'
      esattamente quello che fanno stando in due elenchi agganciati. Un
      elenco solo non funzionerebbe: si compra «birre e bibite» e si vende
      «alcolici e distillati», e sono due tagli diversi della stessa merce.
      PERCHE' `macro_menu_id` RESTA anche se oggi nessun conto lo legge:
      e' l'aggancio fra una macro d'acquisto e la macro di vendita
      corrispondente, e serve il giorno in cui gli acquisti avranno la loro
      schermata — «quanto ho speso in bibite» vive li' (vedi
      `purchasesByMacro`, rimasta apposta). Senza quel campo, mettere le due
      colonne una accanto all'altra vorrebbe dire richiedere a mano un
      lavoro gia' fatto.
      IN QUALE MESE cade quello che si e' comprato e' un'altra domanda
      ancora, e sta a parte in REQ-MAG-021 (vocali del 18/08 sera).
      FATTO (1.5.x) il confronto, con la regola decisa il 18/08. La tabella
      «Statistiche → Mensile per macro» adesso ha per righe le macro del
      MENÙ, e ogni vendita ci conta INTERA: incasso della voce e costo di
      tutti i suoi ingredienti insieme, sulla macro della voce. La Schweppes
      versata in un Gin Tonic conta su «alcolici e distillati» con il suo
      costo; in «birre e bibite» resta solo quello venduto COME bibita.
      L'anagrafica del prodotto non si tocca: la sua macro di magazzino
      resta quella che è, e il magazzino si scala come prima.
      TOLTA, non affiancata, la scomposizione: `splitLineRevenueByMacro`
      non esiste più. Al suo posto `lineByMacro` (dove va una vendita,
      quanto ha incassato, quanto è costata) e `venditeByMacro`.
      LE RIGHE DELLA TABELLA sono cambiate di conseguenza: dove c'era
      «Acquisti / Fatturato / Utile / Fat-Acq» adesso c'è «Incassato / Costo
      del venduto / Margine / Inc-Costo». La riga «Acquisti» è la colonna
      che non doveva esserci: parlava di merce entrata dalla porta, non di
      merce venduta, e in mezzo a un margine rendeva ambiguo tutto il
      resto. «Quanto ho speso in bibite» resta una domanda vera e vive con
      gli acquisti: `purchasesByMacro` è rimasta lì, sulle macro di
      MAGAZZINO, per quando le si darà una schermata.
      NUMERI PIÙ ONESTI, come effetto collaterale: il costo del venduto è
      al netto dell'IVA d'acquisto (l'incasso era già scorporato: due
      numeri con dentro cose diverse non si sottraggono), e lo sconto
      abbassa l'incasso ma non il costo — un drink regalato è costato lo
      stesso.
      L'IVA DELL'INCASSO È QUELLA DEL LOCALE, e non più quella di ogni
      prodotto: si scorpora con `sale_vat` (Impostazioni). DECISO dall'utente
      (18/08), che ha chiuso la domanda con il caso vero: «Flavio compra al
      22 e rivende al 10, sulle sue vendite c'è solo il 10% di IVA. Deve
      essere l'IVA del locale sul drink, quella indicata nelle
      impostazioni». Il per-prodotto era nato solo perché l'incasso veniva
      spezzato per ingrediente: senza scomposizione una vendita è una
      vendita sola, con una aliquota sola — e l'aliquota del PRODOTTO è
      quella con cui lo si compra, non quella con cui lo si rivende. Dove
      erano state messe aliquote diverse per prodotto i netti cambiano di
      qualche punto, ed è il verso giusto.
      LA DOMANDA SUI DUE ELENCHI È CHIUSA (19/08): sono due — acquisti e
      vendite — come già sono. L'aggancio `macro_menu_id` resta e ha una
      ragione, scritta qui sopra: serve quando gli acquisti avranno la loro
      schermata, per mettere speso e incassato uno accanto all'altro.
      E NON C'È NIENTE DA SALVAGUARDARE, verificato il 18/08: la collezione
      `macro_categories` è VUOTA — zero documenti sia in produzione sia su
      `tana-drink-test`. Nessuno ha mai creato una macro, né di magazzino
      né di menù, quindi l'aggancio non è «compilato a mano» da nessuno.
      SU TEST NON È PIÙ VERO (19/08): le macro adesso ci sono, create a mano
      su `tana-drink-test` — quattro d'ACQUISTO e quattro di VENDITA, con
      gli agganci `macro_menu_id` compilati. Le categorie collegate sono 24
      su 25 in magazzino e 13 su 14 nel menù: restano fuori ALTRO
      (magazzino) e BOTTIGLIE (menù), e ci restano APPOSTA — è la ragione
      per cui «senza macro» deve vedersi a colpo d'occhio invece di sembrare
      una dimenticanza (REQ-UI-022).
      IN PRODUZIONE `macro_categories` È ANCORA VUOTA, e ci resta finché non
      arriva il via libera esplicito: si semina a mano, come su test, e la
      produzione non si tocca di propria iniziativa.
      SISTEMATO (19/08): il commento sopra `MacroMenuPanel` in
      `MenuManager.jsx` raccontava ancora una «domanda ancora aperta» e una
      collezione «vuota in produzione e in test». Adesso dice quello che è
      vero: gli elenchi sono due apposta, `macro_menu_id` resta perché è
      l'aggancio che servirà agli acquisti, su test le macro ci sono e vuota
      resta solo la produzione.
      CONSEGUENZA DA DIRE A CHI GUARDA: finché le macro di menù non
      vengono create, «Mensile per macro» non mostra numeri — mostra il
      suo messaggio, che dice dove crearle (Menù → Macro-categorie) e che
      vanno collegate alle categorie dei drink. Non è un guasto ed è lo
      stesso comportamento di prima; cambia solo il posto dove si va a
      crearle, che adesso è il menù e non il magazzino.
    status: implemented
    generate_issue: true
    labels: [magazzino, menu, statistiche]
    priority: P1
    test_cases:
      - tests/unit/macroStats.test.js
      - tests/component/MacroCategoryManager.test.jsx

  - id: REQ-MENU-011
