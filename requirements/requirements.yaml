  # ══════════════════════════════════════════════════════════════════════
  #  LICENZA E FUNZIONI PREMIUM
  # ══════════════════════════════════════════════════════════════════════

  - id: REQ-LIC-001
    title: "Le funzioni premium si accendono da un posto solo, e di partenza sono spente"
    area: "src/lib/licenza.js, src/lib/sezioni.js, src/components/InventoryManager.jsx, src/components/FornitoriTab.jsx, src/components/PaymentScreen.jsx, src/components/SettingsTab.jsx, src/components/ToggleRow.jsx, src/components/DevTools.jsx"
    description: >
      Decisione dell'utente del 26/08/2026, parole sue: «Facciamo che la
      conta di magazzino e le fatture (le due sezioni) diventano funzioni
      premium che si attivano all'occorrenza. Le chiamo premium perché in
      futuro diventerà multitenant; per il momento possiamo semplicemente
      disabilitarle dalle opzioni, e disabilitiamo le checkbox per attivarle
      scrivendo "funzione premium". Poi capiamo come fare a sbloccare gli
      switch».
      ANTICIPA LA FASE 3 del piano di sbrandizzazione
      (docs/piano-sbrandizzazione.md, «Licenza e moduli»): là il documento
      `settings/licenza` porta piano e moduli attivi, e le voci del
      gestionale compaiono solo dove il modulo è acceso, «estendendo lo
      schema già esistente di workflow_enabled». Qui nasce il meccanismo con
      le prime due funzioni; il documento della licenza arriverà dopo.
      RAFFINATO LO STESSO GIORNO, parole sue: «Ok dobbiamo riattivare lo
      scadenziario, ma lasciamolo sempre funzione premium: va abilitato lo
      switch e abilitata la funzione». Da lì nasce la distinzione qui
      sotto, che è quella che una licenza fa per mestiere.
      DUE DOMANDE, NON UNA:
      · INCLUSO — la licenza dice cosa il locale HA comprato;
      · ACCESO — l'impostazione dice se in questo momento lo USA.
      Un modulo lavora quando è incluso E acceso. Impastarle in un flag solo
      non permetterebbe di distinguere un locale che la funzione non ce l'ha
      da uno che ce l'ha e l'ha spenta — e sono due schermate diverse, una
      con l'interruttore bloccato e una con l'interruttore normale.
      PER LA TANA, OGGI: scadenzario INCLUSO (e quindi acceso, e col suo
      interruttore che si tocca), conta NON INCLUSA (interruttore spento e
      bloccato).
      UN POSTO SOLO CHE RISPONDE, `src/lib/licenza.js`: una tabella dei
      moduli e tre funzioni pure — `moduloIncluso`, `moduloAcceso` e
      `moduloAttivo`, che è l'AND delle prime due e l'unica che le
      schermate chiamano. Due interruttori
      sparsi diventano tre e poi cinque, e a quel punto per sapere cosa vede
      un locale bisogna leggersi mezza app. Aggiungere il prossimo modulo è
      una voce nella tabella: `id` (lo stesso della sezione che accende),
      `chiave` (il flag su settings/bar), nome e descrizione da mostrare.
      DOVE STA SCRITTO COSA È INCLUSO, oggi: nel campo `incluso` della
      tabella, cioè nel CODICE. Quello che un locale ha comprato non è una
      preferenza da pannello — lì si accende e si spegne quello che si ha,
      non si decide cosa si ha — e finché non esiste il documento della
      licenza, la licenza di questa installazione è la sua build. È lo
      stesso posto dove finirà la configurazione per cliente della Fase 2
      (`clienti/<slug>/`). Dalla schermata normale delle impostazioni non è
      modificabile; dagli strumenti di sviluppo sì (REQ-DEV-014).
      L'INTERRUTTORE D'USO è un flag booleano su `settings/bar`, della
      stessa forma di `workflow_enabled`: `modulo_conta_enabled` e
      `modulo_scadenzario_enabled`, in DEFAULT_SETTINGS a `true`. Stessa
      cache delle altre impostazioni, quindi nessuna lettura nuova e niente
      da aspettare (local-first). Acceso di suo con l'idioma `!== false`:
      quello che il locale ha comprato funziona senza che nessuno lo debba
      andare ad accendere, e si spegne solo se qualcuno lo spegne davvero.
      La sicurezza sta tutta nell'altra domanda.
      COME SI AGGANCERÀ LA LICENZA VERA: `moduloIncluso` guarda PRIMA un
      campo `licenza.moduli` nello stato che riceve. Oggi non c'è e si
      ricade sulla tabella; il giorno che `settings/licenza` esiste, chi lo
      collega lo fa arrivare fin lì e la licenza vince — nessuna schermata
      cambia, perché nessuna schermata sa da dove viene la risposta.
      L'interruttore d'uso resta dov'è: è del locale, non della licenza — un
      locale che ha comprato lo scadenzario può volerlo spento a gennaio.
      Se la licenza c'è ma non nomina il modulo, il modulo NON è incluso:
      ricadere sulla tabella vorrebbe dire riaprirsi da soli un modulo che
      la licenza non dà. Una licenza a metà (piano scritto, elenco dei
      moduli no) invece non conta: è un caso di migrazione, non una
      decisione commerciale.
      NEL DUBBIO NON LAVORA — id sconosciuto, licenza che tace, modulo non
      incluso: una funzione a pagamento non si regala per una svista. E una
      sezione che compare per mezzo secondo e poi sparisce è peggio di una
      che non c'è: le schermate partono dalla cache, non dal vuoto.
      I MODULI DI OGGI SONO TRE, e vivono in tre posti diversi con lo
      STESSO filtro (`voceVisibile`) — è il motivo per cui l'id del modulo è
      l'id della sezione che accende:
      · `conta` — sottosezione del magazzino. Non inclusa.
      · `scadenzario` — sottosezione di «Fornitori» (REQ-MAG-028). INCLUSA.
      · `fatture` — la SEZIONE del gestionale «Fatture», cioè le fatture di
        cortesia al cliente (collezione `invoices`). Non inclusa.
      ⚠️ LE DUE FATTURE NON SONO LA STESSA COSA, e stanno una sotto l'altra
      nelle impostazioni: «Fatture ai clienti» sono soldi che ENTRANO
      (`invoices`, il documento che si dà a chi lo chiede), «Fatture ai
      fornitori» sono soldi che ESCONO (lo scadenzario, `supplier_invoices`).
      Hanno in comune solo la parola, e le etichette a schermo lo dicono
      senza doverle aprire.
      LE FATTURE AI CLIENTI PORTANO VIA ANCHE UN TASTO. Chiesto dall'utente
      il 26/08/2026: «Un'altra funzione premium è la sezione delle fatture,
      e insieme a quello va nascosto il tasto fattura nel pagamento
      dell'ordine». Col modulo spento sparisce la voce «📄 Fatture» dal menu
      e il tasto «📧 Invia fattura» dalla schermata di pagamento. Quel tasto
      è l'UNICA porta della modale della fattura (`showInvoice` lo accende
      solo lui), quindi togliendolo si chiude tutto il flusso — emissione,
      stampa e invio per email — senza lasciare in giro mezze strade.
      UN CONTO CHE UNA FATTURA CE L'HA GIÀ non la perde: `invoice_number`
      resta scritto sull'ordine e il documento resta nella collezione
      `invoices`. Col modulo spento non si vede — le uniche schermate che lo
      mostravano erano il ✓ sul tasto, l'avviso dentro la modale e la
      sezione Fatture, e sono tutte dietro il modulo — e torna a vedersi
      identico appena il modulo si riaccende. Nessuna scrittura, nessuna
      cancellazione.
      SEZIONI.JS LEGGE LA LICENZA, ed è il pezzo che la Fase 3 del piano di
      sbrandizzazione chiede a quel file. `vociPerRuolo(role, impostazioni)`
      e `sezioneConsentita(id, role, impostazioni)` fanno DUE domande che
      restano separate: CHI SEI (la funzione di `ruoli.js` sulla voce) e
      COSA HA IL LOCALE (`voceVisibile`). Una voce premium non c'è per
      nessuno, admin compreso; una voce di ruolo non c'è per chi non ha il
      ruolo. Le impostazioni arrivano da chi le ha già in cache (StaffDrawer
      e BartenderPage): nessuna lettura nuova. Se non sono ancora arrivate
      passa solo quello che è incluso di suo — meglio una voce che compare
      che una che lampeggia e sparisce.
      DOVE VIVONO, in breve: la CONTA nel magazzino, lo SCADENZARIO in
      «Fornitori», le FATTURE nel menu del gestionale.
      NEL MAGAZZINO la sezione Conta resta nell'unico elenco `INV_VIEWS` (l'ordine delle sezioni è uno solo) e si filtrano
      con `voceVisibile`. Una voce che rientra torna al SUO posto, perché
      l'elenco è quello e basta. La vista aperta si RICAVA dall'elenco
      filtrato: se un modulo si accende da un altro terminale mentre si sta
      guardando un'altra sezione, la voce nuova entra e nient'altro si
      muove; se a spegnersi è proprio la sezione aperta, si torna ai
      Prodotti invece di restare su un pannello che non è più in elenco.
      Vedi REQ-MAG-010.
      NELLE IMPOSTAZIONI le due voci NON spariscono: gruppo «🔒 Funzioni
      premium», suo, prima di «Sistema». La regola del momento d'uso
      (REQ-UI-025) chiede di raggruppare per «quando lo cerco», e qui il
      momento è «cosa ha questo locale, e cosa potrebbe avere» — che non è
      il momento in cui si conta il magazzino né quello in cui si registra
      una fattura, tanto più che a modulo spento quelle schermate non
      esistono e l'interruttore sarebbe da cercare dentro una sezione che
      non compare. Sono la prima famiglia di questo tipo e ne arriveranno
      altre (la Fase 3 elenca cinque pacchetti): un gruppo che cresce è
      meglio di cinque voci sparse. E non sta in «Sistema», che parla della
      macchina (backup, versione): la licenza è del locale.
      I TESTI SONO ASCIUTTI (DESIGN.md, guardrail 3): la didascalia dice
      cosa fa la funzione e che non è inclusa. Niente «Sblocca ora», niente
      toni pubblicitari.
      DUE RIGHE DIVERSE, E SI VEDE:
      · modulo NON INCLUSO — interruttore spento e BLOCCATO, che al tocco
        dice perché. `ToggleRow` ha una prop `motivo` che lo rende
        `aria-disabled` invece di `disabled`, con la stessa ragione dei
        metodi di pagamento non disponibili e del tasto «Acconto» che
        salderebbe il conto: `disabled` non fa nemmeno partire l'evento, e
        chi preme resta a premere un tasto morto.
      · modulo INCLUSO — interruttore NORMALE, che si accende e si spegne
        come ogni altra impostazione e salva sul documento del bar. Resta
        scritto che è una funzione premium, ma la didascalia dice «inclusa
        in questa installazione»: scrivere «non inclusa» su una funzione che
        il locale ha sarebbe falso.
      PER CAMBIARE LA LICENZA (cosa è incluso) ci sono gli strumenti di
      sviluppo (REQ-DEV-014, solo in locale e sul sito di test): scrivono
      `licenza.moduli` su settings/bar, cioè la stessa forma che avrà il
      documento della Fase 3 — è la sua prova generale. L'altra strada,
      equivalente, è scrivere il campo a mano da console o dall'emulatore.
      NON dalla schermata normale delle impostazioni: un meccanismo di
      vendita non esiste ancora, e inventarne uno adesso sarebbe da
      buttare.
      SPEGNERE NASCONDE, NON CANCELLA. Le conte e le fatture già scritte
      restano nelle loro collezioni (`stock_counts`, fatture fornitore):
      spegnere un modulo non tocca un documento. Caso spiacevole da sapere:
      una conta APERTA nel momento in cui il modulo si spegne resta aperta e
      non allineata — la si ritrova esattamente com'era riaccendendo il
      modulo, ma finché è spento nessuno la può chiudere.
      ⚠️ IL FLAG NASCONDE, NON PROTEGGE. Oggi c'è un locale solo e la
      distinzione è teorica; quando i locali saranno tanti il controllo vero
      va sul SERVER — Cloud Functions e regole Firestore — perché chiunque
      apra la console del browser può accendersi un modulo da sé. Lo dice
      anche il piano: «mai fidarsi del solo frontend per una funzione a
      pagamento».
    status: implemented
    generate_issue: true
    labels: [licenza, impostazioni, magazzino]
    priority: P2
    test_cases:
      - tests/unit/licenza.test.js
      - tests/unit/sezioni.test.js
      - tests/component/InventoryManager.test.jsx
      - tests/component/FornitoriTab.test.jsx
      - tests/component/PaymentScreen.test.jsx
      - tests/component/SettingsTab.test.jsx

