  - id: REQ-MAG-022
    title: "Bilancio → Acquisti × Fatturato: gli acquisti per macro, mese per mese"
    area: "src/lib/macroStats.js purchasesByMacro, src/components/BilancioTab.jsx (nuovo)"
    description: >
      COSA FA IL FOGLIO. La riga ACQUISTI del rapporto per macro è battuta a
      mano, mese per mese e macro per macro: nessuna formula dice da dove
      viene. DA DOVE ARRIVANO QUEI NUMERI NON È DIMOSTRABILE dai file, e non
      va inventato. Due indizi, verificati tutti e due, e nessuno dei due
      torna al centesimo.
      (a) Il registro fatture (FORNITORI REC.xlsx), sommato per mese del
      2026, dà 1180 / 1129 / 1680 / 2448 / 4400 / 9081 / 761 da gennaio a
      luglio, contro gli ACQ TOT del rapporto 1809 / 1063 / 1697 / 2884 /
      4526 / 8673 / 2369: stesso ordine di grandezza, marzo e maggio quasi
      uguali, gennaio e luglio lontani. Il registro però tiene solo cinque
      fornitori, e negli ordini ne compaiono una decina.
      (b) GEN ORD REC.xlsx valorizza ogni fattura riga per riga (quantità ×
      prezzo ivato) e ogni riga porta il suo TIPO, quindi da lì una somma
      per macro si può fare a mano. È il modo più plausibile, ma è una
      ricostruzione: nel rapporto non c'è nessun collegamento che lo provi.
      QUELLO CHE È CERTO: gli ACQUISTI del foglio sono merce ENTRATA dalla
      porta, al LORDO dell'IVA (nel generatore il prezzo di riga è sempre
      «€/pz × 1,22»).
      COSA HA GIÀ L'APP. `purchasesByMacro` (src/lib/macroStats.js) somma
      gli ordini fornitore RICEVUTI per macro di MAGAZZINO, al netto IVA.
      Nessuna schermata la chiama, e non ha il taglio per mese. È rimasta lì
      apposta: REQ-MAG-015 dice che «quanto ho speso in bibite» è una
      domanda vera che vive con gli acquisti e non nella tabella del
      venduto, e che l'aggancio `macro_menu_id` esiste per il giorno in cui
      gli acquisti avranno la loro schermata. Quel giorno è questo.
      PROPOSTA, poi DECISA il 19/08 (vedi in fondo). Una vista «Acquisti
      per macro» con le macro di MAGAZZINO
      per riga e i mesi per colonna, e — dove la macro d'acquisto è
      agganciata a una macro di vendita (`macro_menu_id`) — l'incassato di
      quella accanto, che è il confronto che il locale fa a fine mese.
      ERANO TRE DOMANDE, E DUE SONO CHIUSE (19/08, dall'utente che riporta
      Flavio).
      (1) L'ACQUISTO È L'ORDINE FORNITORE RICEVUTO: la merce conta quando
      entra dalla porta, non quando arriva la fattura — che in app è
      un'altra cosa e segue tempi suoi.
      (2) LORDO E NETTO SI VEDONO TUTTI E DUE: i fogli di Flavio sono al
      lordo ed è come lui legge da sempre, il resto dell'app ragiona al
      netto, e obbligare a sceglierne uno vorrebbe dire dare torto a lui o
      dare torto alle statistiche. Servono tutti e due sulla stessa tabella;
      quale dei due si apre per primo lo si sceglie provandolo con lui.
      (3) RESTA APERTA: in quale mese cade un acquisto è REQ-MAG-021 — la
      quota consumata che migra da un mese all'altro — e questa tabella va
      pensata insieme a quella.
      DECISO ANCHE DOVE VIVE (19/08): nella pagina «Bilancio»
      (REQ-CASSA-010), sottosezione «Acquisti × Fatturato», accanto a «Mesi»
      e «Venduto × Incassato». È la tabella dell'Excel rifatta: per riga le
      macro d'ACQUISTO, per colonna i mesi, e in ogni cella acquisti,
      fatturato, utile (fatturato − acquisti), rapporto fat/acq e incidenza
      sull'utile del mese; in fondo i totali dell'anno e l'incidenza
      dell'anno.
      IL FATTURATO DI UNA MACRO D'ACQUISTO è l'incassato della macro di
      VENDITA agganciata con `macro_menu_id`, l'aggancio che REQ-MAG-015 ha
      tenuto in vita apposta per questo giorno. Dove l'aggancio non c'è, la
      colonna fatturato resta vuota e si dice perché: uno zero lì dentro si
      legge come «non ho incassato niente», che è un'altra cosa.
      GLI ACQUISTI SENZA MACRO NON SPARISCONO. `purchasesByMacro` li
      raccoglie già sotto UNASSIGNED, e adesso quella riga serve davvero:
      ALTRO è una categoria di magazzino che resta fuori dalle macro APPOSTA
      (REQ-UI-022). Va mostrata, non nascosta — un totale che non torna con
      le fatture non lo guarda più nessuno.
      E UNA COSA VA DETTA SUBITO: dello storico non si ricostruisce niente.
      Gli ordini fornitore in app nascono da oggi, i numeri 2026 del foglio
      non hanno un corrispondente in banca dati. La tabella si riempie da
      quando gli ordini passano per l'app, e i primi mesi saranno mezzi
      vuoti: è la verità, e va scritta sulla schermata invece di lasciarla
      scoprire a chi guarda — nella DIDASCALIA della tabella, che è il posto
      dove stanno le avvertenze (REQ-CASSA-010). Lì si dicono anche le altre
      due: cosa vogliono dire utile, rapporto e incidenza in parole da
      banco, e se i numeri che si stanno guardando sono al lordo o al netto
      dell'IVA — con due letture commutabili, sapere quale è aperta non è un
      dettaglio.
      DIPENDE DA REQ-CASSA-010 (la pagina che la ospita) e, per come si
      legge, da REQ-MAG-021 (P3, fermo finché non hanno risposta le cinque
      domande sui lotti): finché quello non è deciso un acquisto pesa sul
      mese in cui è ENTRATO e non su quello in cui si consuma, e la
      didascalia deve dirlo. Ma il vincolo che conta non è codice: la tabella
      resta vuota finché gli ordini fornitore non passano davvero dall'app,
      e dello storico 2026 non si ricostruisce niente. Per questo non è
      lavorabile adesso.
    status: todo
    generate_issue: true
    labels: [magazzino, statistiche, fornitori]
    priority: P2
    test_cases: []

  - id: REQ-STAFF-015
    title: "Il minimo della serata: quanto deve fare stasera, e quanto ha fatto"
    area: "src/lib/stats.js, src/components/StatsTab.jsx, src/components/StaffHoursTab.jsx"
    description: >
      COSA FANNO I FOGLI (verificato). In ANALISI DATI.xlsx ogni mese ha un
      foglio suo, diviso in settimane, e per ogni giorno tre righe: MINIMO
      (quanto quel giorno deve fare), REALE (quanto ha fatto), RAPP. = REALE
      − MINIMO. In fondo al mese: STIPENDI, SPESE, INCASSI (somma dei REALE
      delle cinque settimane), il netto = INCASSI − SPESE − STIPENDI, e la
      somma degli scarti.
      IL MINIMO NON È CALCOLATO. Tutte le celle MINIMO sono numeri battuti a
      mano: in nessuno dei diciotto fogli mensili c'è una formula. Cambia
      per giorno della settimana (gennaio 2026: giovedì 300, venerdì 600,
      sabato 600, domenica 300, lunedì 100, martedì 100, mercoledì 150) e
      cambia da mese a mese. Accanto c'è un'etichetta di testo — «MEDIA 2450
      €/w» — che è l'obiettivo settimanale: nei mesi vecchi coincide con la
      somma dei minimi della settimana (feb, mar, apr, set, ott 2025 e feb
      2026), nei mesi recenti no (gen, apr, mag, giu, lug 2026), segno che
      l'etichetta non viene aggiornata insieme ai minimi.
      DA DOVE VIENE LA RIGA STIPENDI: da RAPP ORE.xlsx, dove ogni persona ha
      le ore del mese × la paga oraria, e il totale finisce a mano in
      ANALISI DATI. Torna in quasi tutti i mesi provati (gen 26 800 + 700 =
      1500; dic 25 650 + 750 + 160 = 1560; apr 26 650 + 800 + 170 = 1620;
      mag 26 850 + 750 + 575 = 2175) e NON torna in giugno 26, dove il
      foglio ore dà 3335 e ANALISI DATI dice 3500: qualcuno ha arrotondato.
      COME SONO FATTE LE ORE E LE PAGHE: una griglia con le ore in riga
      (dalle 9-10 alle 04-05) e i giorni in colonna, una casella per ogni
      ora lavorata; in fondo, per persona, giorni = ore / 8, ore totali,
      €/h, totale = ore × €/h. Le tariffe viste: 6,25 €/h quasi per tutti,
      5 €/h per gli extra, in passato 7,50 / 8,75 / 5,625 / 4,375. Sono
      tutte tariffe GIORNALIERE divise per 8 (50, 40, 60, 70, 45, 35 € al
      giorno): il locale ragiona a giornate, non a ore.
      QUELLO CHE NON C'È, e che non va inventato. Nessun foglio calcola il
      minimo dalle paghe. L'ipotesi di chi ha chiesto questo lavoro — «i
      minimi dipendono dalle paghe orarie, più un extra che credo decida
      Flavio» — non è né confermata né smentita dai file: quella relazione
      non esiste in nessuna cella. Nei fogli il minimo resta un numero
      scritto a mano, e questo non cambia: cambia da dove lo prende l'app.
      DECISO (19/08, dall'utente che riporta Flavio): LA FORMULA È QUESTA —
      minimo del giorno = somma delle paghe di chi lavora quel giorno (ore
      × €/h, persona per persona) + un EXTRA messo a mano. Non è più
      un'ipotesi, è la regola con cui il minimo si calcola: la domanda
      scritta qui sopra è chiusa, e l'ipotesi era quella giusta. Il primo
      addendo l'app ce l'ha già per intero (REQ-STAFF-006), quindi non si
      ricopia da nessuna parte — nel foglio invece si ricopia, ed è già
      capitato che non torni.
      L'EXTRA: COME SI METTE, deciso dall'utente il 19/08. «Un valore che
      può inserire l'admin per ogni giorno, o una serie che può essere
      impostata su tutte le settimane del mese». Quindi DUE STRADE, e la
      seconda è quella che si userà quasi sempre:
      1) SUL SINGOLO GIORNO — l'admin scrive l'extra di quel giorno, e
      vince su tutto il resto. È il sabato della festa, la sera dell'evento;
      2) UNA SERIE SETTIMANALE stesa su tutto il mese — sette valori, uno
      per giorno della settimana, che si applicano a tutte le settimane del
      mese in un colpo. È come ragiona il foglio, dove i minimi cambiano per
      giorno della settimana e restano uguali di settimana in settimana (gen
      26: gio 300, ven 600, sab 600, dom 300, lun 100, mar 100, mer 150).
      CHI VINCE: il valore del giorno sulla serie, sempre. Uno si prende la
      briga di scrivere il singolo giorno solo quando quel giorno è diverso,
      e se la serie lo sovrascrivesse quel gesto sarebbe inutile. Va scritto
      dove si calcola, non lasciato all'ordine in cui si leggono i dati.
      E SOLO L'ADMIN LO TOCCA: è un numero su cui si misura il lavoro di
      chi sta in sala, e non è roba da turno.
      COSA HA GIÀ L'APP: le ore e le paghe per intero, storicizzate
      (REQ-STAFF-006), e l'incasso per giornata commerciale (REQ-CASSA-005).
      Manca il minimo, manca il confronto, manca l'obiettivo settimanale, e
      mancano le spese del mese — che nel foglio sono una riga sola battuta
      a mano, non un elenco.
      DOVE SI VEDE. Il minimo e il confronto con quello che si è fatto
      stanno nella tabella «Mesi» della pagina Bilancio (REQ-CASSA-011),
      giorno per giorno: minimo, incassato, differenza. Nella schermata
      della serata, accanto all'incasso, quanto manca o quanto avanza.
      L'obiettivo settimanale si somma dai minimi dei sette giorni invece di
      essere scritto a parte, così non può più restare indietro come
      l'etichetta «MEDIA 2450 €/w» del foglio.
      PROPOSTA (non è una sua parola): siccome il minimo nasce dalle ore, un
      giorno futuro ha un minimo solo dove i turni sono già programmati.
      Dove non lo sono il numero non si mostra, invece di mostrarne uno
      finto: un obiettivo inventato non lo insegue nessuno.
      LE SPESE DEL MESE, che nel foglio sono una riga sola battuta a mano,
      vivono per conto loro in REQ-CASSA-012: senza quelle il netto del mese
      non esiste.
      DIPENDE DA REQ-CASSA-011 per il posto dove il minimo si legge giorno
      per giorno, e quella a sua volta dalla pagina REQ-CASSA-010. La formula
      invece non aspetta nessuno: è decisa, e ore e paghe l'app le ha già
      per intero (REQ-STAFF-006).
    status: todo
    generate_issue: true
    labels: [statistiche, staff, ore, serata]
    priority: P2
    test_cases: []

  - id: REQ-MAG-023
    title: "Quanto ordinare: il foglio guarda la giacenza, l'app guarda una soglia"
    area: "src/lib/warehouse.js suggestedPackages, src/components/PurchaseOrdersPanel.jsx"
    description: >
      COSA FA IL FOGLIO (GEN ORD REC.xlsx, verificato). Centotrenta fogli,
      uno per giro d'ordini, coi numeri dei documenti nel nome
      («1410+1438+AGO+PAD+PIC»). Ogni foglio è il CATALOGO INTERO ricopiato
      — circa 380 righe — con: articolo, formato in cl, TIPO (la categoria:
      GIN, BIRRE, VINO, Z APE…), classe LINEA o PREM, una marca «OUT» per
      quello che non si tiene più, DEP (la giacenza), TRE colonne di
      quantità (A, B, C), il prezzo netto al pezzo, il prezzo ivato = netto
      × 1,22, l'importo di riga = quantità × prezzo ivato, il costo al cl =
      prezzo ivato / formato, e il fornitore. Il totale del giro è la somma
      delle tre colonne.
      IL FORNITORE STA SULL'ARTICOLO, non sull'ordine: un foglio solo tiene
      dentro più fornitori insieme, e i nomi dei fogli lo dicono (NOVA +
      AGOSTINO + PICCOLO). Le tre colonne A/B/C servono a tenere separati i
      pezzi del giro dentro lo stesso foglio.
      LO STESSO MODELLO SERVE PER LE RIMANENZE: i fogli «RES …» e
      «rimanenza giugno» sono lo stesso catalogo con le quantità CONTATE al
      posto di quelle ordinate, valorizzate dalle stesse colonne. Comprare e
      contare, per il foglio, sono lo stesso gesto.
      QUANTO ORDINARE NON È CALCOLATO: nessuna formula lega le quantità a
      DEP o al consumo. Si guarda la giacenza e si scrive un numero.
      L'UNICA REGOLA NUMERICA che compare in tutti i file sta in INV.xlsx,
      foglio «ORD»: la colonna CONS/w è «= ORD / 3», cioè l'ordine è
      dimensionato su circa TRE settimane di consumo. Quel foglio però oggi
      ha una riga sola compilata: è un indizio, non una prova, e va chiesto.
      COSA FA L'APP OGGI. Il generatore ordini fa un ordine per UN fornitore,
      coi soli prodotti di quel fornitore; «⚡ Precompila i sotto scorta»
      propone `suggestedPackages`, che riporta la giacenza a DUE VOLTE la
      soglia di avviso (`low_threshold`), minimo una confezione, e non
      propone niente se la soglia non è impostata. Al ricevimento la merce
      entra in magazzino in un colpo (REQ-MAG-006).
      LE DIFFERENZE, in ordine di quanto pesano: (1) l'app parte da una
      SOGLIA scritta a mano sull'articolo, il foglio dal CONSUMO e dalla
      giacenza; (2) l'app fa un ordine per fornitore, il foglio ne mette
      insieme quanti ne servono in un giro solo; (3) l'app non sa cosa sia
      un consumo settimanale, vedi REQ-MAG-024; (4) nella schermata
      dell'ordine non si vede il costo per unità di misura, che nel foglio
      c'è su ogni riga ed è il numero con cui si decide se un prodotto
      conviene.
      PROPOSTA. Proporre la quantità dal CONSUMO invece che dalla soglia —
      «coprire N settimane al ritmo delle ultime conte», con la soglia che
      resta come rete per i prodotti senza storico — e un giro d'ordini che
      tenga dentro più fornitori insieme, spezzandosi in un ordine per
      fornitore solo al momento dell'invio.
      LA DOMANDA SULLE SETTIMANE È STATA RITIRATA (19/08). Era nata da un
      indizio dei fogli (`ORD / 3` in INV.xlsx, che parrebbe dire «tre
      settimane di consumo») e l'avevo girata come una cosa da chiedere:
      per quanto tempo deve bastare un ordine. Non serve, e la risposta
      dell'utente chiude il discorso: «non c'entra quanto deve bastare o
      deve durare. Non lo sappiamo e non lo sapremo».
      SI ORDINA PER DIFFERENZA, non per previsione: ogni prodotto ha una
      quantità minima da tenere in magazzino, scritta dall'admin, e si
      ordina quello che manca per tornarci (REQ-MAG-026). Due numeri che
      esistono, invece di una stima che nessuno sa fare.
      COSA RESTA DI QUESTA VOCE. Il generatore vero è REQ-MAG-026, e non
      aspetta niente da qui. Qui resta il CONFRONTO COL FOGLIO — cosa fa
      lui che l'app non fa — e due cose ancora utili: il giro che tiene
      insieme più fornitori, e il costo per unità di misura sulla riga
      dell'ordine, che nel foglio c'è ed è il numero con cui si decide se
      un prodotto conviene.
      IL CONSUMO A SETTIMANA (REQ-MAG-024) l'app ora lo calcola, ma non
      serve a proporre le quantità: serve a chi guarda, per accorgersi che
      una minima è tarata male.
