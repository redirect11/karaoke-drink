  - id: REQ-STAT-001
    title: "Statistiche: prima la serata (lista e dettaglio), poi il periodo"
    area: "src/lib/serate.js, src/components/StatsTab.jsx, src/lib/sottosezioni.js"
    description: >
      «Nelle statistiche dovremmo rendere più sofisticata la selezione della
      serata. È la cosa principale che si vuole vedere, il resto dei filtri
      sono secondari. Io metterei una lista con dettaglio: di default la
      lista si apre sulle chiusure di cassa, e se ci clicco apre il
      dettaglio delle statistiche di quella chiusura di cassa. Facciamo due
      sottosezioni: una per le statistiche così come te le ho descritte, per
      le chiusure di cassa; una è quella che c'è adesso, che mostra le
      statistiche in base al filtro e al tempo» (l'utente, 22/08/2026).
      DUE SOTTOSEZIONI nel menu laterale — «Per serata» e «Per periodo» —
      con lo stesso meccanismo di Cassa e Magazzino (docs/navigazione.md):
      niente riga di pastiglie in pagina, che su una schermata di grafici
      costa altezza tutto il giorno.
      A) PER SERATA, ed è quella che si apre di suo. La LISTA delle chiusure
      di cassa, la più recente in cima, una riga per serata: quando (giorno,
      apertura→chiusura, durata) e TRE NUMERI incolonnati — incasso, conti,
      scontrino medio. Il primo è la domanda, gli altri due sono il perché:
      incasso = conti × scontrino medio, quindi una serata migliore
      dell'altra lo è perché è entrata più gente o perché ognuno ha speso di
      più, e sono due cose che si affrontano in modo diverso. Il resto (ora
      di punta, attese, top prodotti) sta un tocco più in là: in riga
      sarebbero numeri da leggere uno per uno, e la lista si guarda in una
      scorsa. La forma è quella della lista del magazzino (`inv-list` /
      `inv-row`), una famiglia sola di righe per tutto il gestionale.
      TOCCANDO UNA RIGA si apre il DETTAGLIO: le statistiche di quella
      serata, cioè lo stesso corpo di grafici della sottosezione del periodo
      (`CorpoStatistiche`), sugli ordini della finestra della cassa —
      mezzanotte compresa.
      SI TORNA CON «← Chiusure», in cima al dettaglio: una sola via
      d'uscita, e dice dove riporta invece di dire «indietro». Uscendo dalla
      sottosezione il dettaglio si dimentica: rientrando si riparte dalla
      lista, perché era stato chiuso apposta e ritrovarcisi dentro vuol dire
      non sapere più cosa fa la freccia in cima.
      LA CASSA ANCORA APERTA C'È, ed è la prima riga, con l'orario che dice
      «in corso» e i numeri di adesso: mentre si lavora è la serata che
      interessa di più, e senza di lei la prima sera del locale la lista
      sarebbe vuota.
      B) PER PERIODO: le pastiglie di sempre (7/10/20/30/60 e
      Personalizzato) MENO «🧾 Ultima chiusura» e la tendina delle serate,
      che ora vivono nella sottosezione A — lo stesso posto raggiunto in due
      modi prima o poi si contraddice.
      LOCAL-FIRST: la lista si costruisce da quello che la pagina ha già in
      mano (sessioni e ordini), senza una lettura in più e senza attese fra
      il tocco e la riga. Le serate più vecchie della finestra di ordini
      scaricata non si possono ricalcolare: per quelle si usano i numeri
      congelati nello `snapshot` della chiusura, che stanno già sulla
      sessione — una riga a zero si leggerebbe come «quella sera non ha
      incassato», che è un'altra cosa.
    status: implemented
    generate_issue: false
    labels: [statistiche, ux]
    test_cases: [tests/unit/serate.test.js, tests/component/StatsTab.test.jsx]

