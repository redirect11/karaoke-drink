  - id: REQ-SIC-001
    title: "Le regole del database seguono i ruoli"
    area: "firestore.rules"
    description: >
      Menù e impostazioni sono a lettura libera (servono al cliente); cassa,
      magazzino, gruppi, ore e fatture sono riservati al personale; le paghe e la
      gestione utenti all'admin. Nessuno può cancellare incassi o sessioni di cassa
      dall'app.
      GLI ORDINI SONO IL CASO DELICATO, perché contengono dati personali e
      insieme devono restare raggiungibili da un cliente che non si è
      registrato. Le due cose stanno insieme separando i due mestieri che
