  - id: REQ-MAG-010
    title: "Il magazzino sta in una schermata, con le sezioni a lato"
    area: "src/components/InventoryManager.jsx, src/components/CategoryRail.jsx"
    description: >
      Prodotti, Conta, Categorie, Macro-categorie e Movimenti si scelgono
      dalla BARRA IN ALTO: il titolo della pagina è il comando.
      TRE SEZIONI SONO USCITE DI QUI il 26/08/2026 — Ordini, Scadenzario e
      Fornitori sono passate alla sezione «Fornitori» del gestionale
      (REQ-MAG-028): il magazzino risponde a «cosa ho sullo scaffale», loro
      a «con chi lavoro e quanto gli devo».
      LA CONTA È UNA FUNZIONE PREMIUM (REQ-LIC-001) e per la Tana non è
      inclusa: di partenza il magazzino ha QUATTRO sezioni. Restano nello stesso elenco
      (`INV_VIEWS`), che si filtra: l'ordine delle sezioni è uno solo, e un
      secondo elenco prima o poi direbbe un'altra cosa. La vista aperta si
      ricava dall'elenco filtrato, così se il modulo si spegne mentre la sua
      sezione è aperta si torna ai Prodotti. In pagina costavano spazio fisso tutto il giorno —
      due file di tasti più tre pannelli a scomparsa, poi una barra a sinistra
      (che rubava la colonna ai prodotti), poi una riga di schede — per una
      scelta che si fa ogni tanto. Sul telefono, dove nella barra non ci sta un
      elenco, si apre il foglio dal basso: lo stesso gesto di «⋯ Azioni», che
      al banco si conosce già.
      La ricerca sta sopra; sotto, una riga sola con due TENDINE (filtri di
      scorta e assortimento, fornitore), il valore di magazzino, card/lista
      come due icone e il tasto per un prodotto nuovo. Il tasto di una tendina
      dice cosa è scelto senza doverla aprire.
      I filtri (tutti, in scorta, in esaurimento, esauriti, e i quattro di
      assortimento) stanno su UNA RIGA sola, con scritto che sono filtri:
      sembravano un riepilogo, si leggevano i numeri senza capire che
      toccandoli la lista si restringeva. Il valore di magazzino è lì accanto
      ma non si tocca: è un numero da leggere, non un filtro.
      «IN SCORTA» È LA DOMANDA CHE MANCAVA (segnalato al banco il 18/08, coi
      388 articoli veri sotto gli occhi: «al filtro manca quelli in
      magazzino»). Si poteva chiedere solo cosa sta finendo e cosa è finito;
      per vedere cosa c'è davvero sullo scaffale bisognava guardare «Tutti» e
      saltare a occhio due terzi di righe esaurite — 232 su 388. Sta per
      prima delle tre, che è l'ordine in cui ci si fa le domande, e ha il suo
      conteggio come le altre.
      GLI «IN ESAURIMENTO» CI STANNO DENTRO: sono in magazzino, solo pochi.
      «In esaurimento» è una lente più stretta dentro la stessa famiglia, non
      un'altra famiglia — e chi guarda cosa c'è vuole vedere anche l'ultima
      bottiglia di gin, che è proprio quella che gli serve sapere. Così il
      conto torna a vista: in scorta più esauriti fa il totale, e chi somma
      le voci non trova numeri che non tornano.
      QUELLO CHE NON È UNA SCORTA non sta né di qua né di là: il «Tempo di
      Lavorazione» non ha giacenza, e non è né disponibile né esaurito (vedi
      REQ-MAG-012). Metterlo fra i disponibili vorrebbe dire dire che c'è
      sullo scaffale una cosa che sullo scaffale non ci va; fra gli esauriti,
      mandare a comprare il tempo.
      Tutto sta nella finestra: filtri, ricerca e categorie restano fermi, a
      scorrere è solo l'elenco dei prodotti — prima, per tornare alla ricerca
      dopo aver guardato in fondo, si risaliva da capo. Anche i MOVIMENTI sono
      una sezione: stavano in fondo alla lista dei prodotti dietro un tasto
      largo quanto lo schermo, fuori contesto e in mezzo ai piedi.
      LA VISTA A LISTA E' LA CAPOSTIPITE di una famiglia che adesso vale
      per tre schermate — magazzino, chiusure di cassa (REQ-CASSA-006),
      statistiche: riquadro unico, righe separate da una linea, striscia a
      sinistra quando c'e' qualcosa da dire sulla riga, il numero che si
      cerca in fondo a destra, il dettaglio che si apre SOTTO. L'altezza
      della riga e' una sola per tutte e tre e sta in un gettone
      (`--riga-lista`, BUG-082): «aumenta l'altezza anche delle righe
      della tabella dell'inventario per un touch migliore» (l'utente,
      22/08/2026) — con 388 articoli, in piedi al banco, una riga alta
      quanto il suo testo fa aprire quella di fianco.
    status: implemented
    generate_issue: false
    labels: [magazzino, ux]
    test_cases: [tests/component/InventoryManager.test.jsx]

  - id: REQ-MAG-012
    title: "Unità generiche: la manodopera entra nel costo del drink"
    area: "src/lib/inventory.js, src/lib/pricing.js, src/components/InventoryManager.jsx, src/pages/MenuPage.jsx"
    description: >
      Un articolo di magazzino si può misurare in unità generiche «U», senza
      contenuto e senza conversioni: serve per quello che non si versa e non si
      pesa — il «Tempo di Lavorazione», che si aggancia come ingrediente ai
      drink che richiedono lavorazione perché il lavoro entri nel costo della
      ricetta e quindi nel prezzo consigliato. Ha un costo per unità, e basta.
      Prima l'unica scelta possibile era il grammo, e nella ricetta del
      Daiquiri si leggeva «Tempo di Lavorazione 1 g».
      Un articolo in U NON È UNA SCORTA, e da qui vengono tre regole: non si
      scarica quando il drink si fa (resta fuori dal consumo, quindi non si
      reintegra nemmeno all'annullo); non è mai «esaurito» né «in
      esaurimento», così il drink che lo usa non sparisce dalla carta al primo
      che se ne fa e non finisce nelle proposte d'ordine al fornitore; non vale
      niente nel valore del magazzino, che il lavoro non sta sullo scaffale.
      Al cliente non si mostra: le righe in unità generiche restano fuori dalla
      lista ingredienti in carta — «Tempo di Lavorazione 3 U» non è roba da far
      leggere a chi ordina — e la lista compare da due ingredienti veri in su.
      Restano visibili dove servono a chi gestisce: ricetta, costi, margini e
      prezzo consigliato.
    status: implemented
    generate_issue: false
