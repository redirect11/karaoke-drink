  - id: REQ-STAFF-014
    title: "La sala serve, non prepara: gli stati delle comande non li tocca"
    area: "src/lib/ruoli.js, src/pages/BartenderPage.jsx, src/components/ComandaDetail.jsx, src/components/OrderPosDetail.jsx, firestore.rules"
    description: >
      Chiesto dall'utente il 19/08. Chi sta in sala VEDE a che punto sono
      le preparazioni — gli serve per sapere cosa portare — ma non le
      comanda: l'unico passo che può segnare è «servito», perché è lui a
      portare il drink al tavolo. Tutto il resto (prendere in carico,
      segnare pronto, tornare indietro, dividere una comanda, annullarla)
      è del banco.
      SUGLI ORDINI invece la sala lavora: può aggiornare un conto —
      aggiungere righe, cambiare quantità — e quelle modifiche generano una
      NUOVA comanda, che il banco vedrà arrivare nella sua coda. Non tocca
      le comande esistenti: quelle sono il lavoro di chi versa.
      DOVE VA SCRITTA la regola: in `src/lib/ruoli.js`, insieme alle altre —
      c'è un test che boccia i confronti di ruolo sparsi nel codice. E vale
      anche lato server (`firestore.rules`): un permesso che esiste solo
      nell'interfaccia non è un permesso.
      FATTO. In `ruoli.js`: `puoSegnare` (alla sala solo «servito»),
      `puoGestireComande` (tornare indietro, dividere, annullare, riscrivere
      una comanda già mandata) e `aggiunteInComandaNuova` (quello che la
      sala aggiunge nasce come comanda a sé, anche col «+» su una riga già
      confermata). Le due prime sono scritte al contrario — «non è la sala»
      — apposta: spengono dei tasti mentre il ruolo torna dal server, e
      spegnerli per un istante al banco vuol dire premere a vuoto.
      LATO SERVER `firestore.rules` nega alla sala le due cose che il
      database sa vedere da sé: portare un conto ad «annullato» e far
      scendere il numero delle comande.
      PERCHÉ LÌ CI SI FERMA, e non è pigrizia — questa è la parte che
      altrimenti il prossimo rifà da capo. Il controllo fine («ha solo
      aggiunto una comanda in fondo», «ha solo portato quella comanda da
      pronto a servito») è un confronto fra due array ELEMENTO PER ELEMENTO,
      e le regole Firestore non hanno cicli: l'unica strada sarebbe
      srotolare gli indici a mano — `dopo[0:n] == prima`, più un ramo per
      ogni posizione possibile — con un tetto arbitrario al numero di
      comande oltre il quale alla sala verrebbe rifiutato il lavoro buono.
      E soprattutto quel confronto NON REGGE come lavora l'app: `leggiOrdine`
      (api.js) legge il documento DALLA CACHE e riscrive l'array `comande`
      per intero, perché Firestore un array lo riscrive tutto — non esiste
      un percorso `comande.2.status`. Basta che la cache del terminale sia
      indietro di un battito, o che la normalizzazione (`normalizeOrderDoc`)
      completi un campo mancante su una comanda vecchia, e il prefisso non
      combacia più: il server rifiuterebbe una scrittura giusta. Al banco
      vuol dire un ordine che non parte, che è un danno peggiore del
      permesso che quella regola chiuderebbe.
      SE UN GIORNO SERVE DAVVERO, la strada non è una regola più furba: è
      spostare l'avanzamento di stato dietro una Cloud Function (Admin SDK),
      che legge il documento fresco e applica la sola transizione consentita
      a chi chiama. Avvertenza: un deploy delle Functions lo autorizza
      l'utente, non noi. (BUG-040 sembrava chiedere la stessa medicina e
      invece no: quello si è curato spostando il MOMENTO dello scarico, non
      aggiungendo una macchina — vedi REQ-MAG-003.)
      Le regole si compilano con l'emulatore Firestore
      (`firebase emulators:exec --only firestore`): non c'è un test
      automatico che le esegua, `@firebase/rules-unit-testing` non è fra le
      dipendenze e non è stato aggiunto per questo.
    status: implemented
    generate_issue: true
