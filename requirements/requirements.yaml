  - id: REQ-MAG-003
    title: "Le scorte si scalano quando il drink è pronto"
    area: "src/lib/inventory.js computeConsumption, src/lib/comande.js, src/lib/api.js"
    description: >
      Il magazzino si scala quando la comanda è PRONTA: lì il drink è fatto —
      il gin è già nel bicchiere — e a segnarlo è chi l'ha fatto, il banco.
      «Servito» è un'altra cosa, è il drink arrivato al tavolo, e fra i due
      passi in magazzino non si muove più niente.
      PRIMA SI SCARICAVA AL SERVITO, e non andava per due ragioni. Di
      sostanza: si aspettava la consegna per registrare un consumo già
      avvenuto, e un drink pronto sul banco restava fra gli «impegnati» come
      se potesse ancora non farsi. Pratica, ed è quella che ha deciso:
      «servito» lo segna la SALA (REQ-STAFF-014), e la sala sul magazzino non
      scrive — le regole glielo negano, ed è giusto così. Lo scarico falliva
      in silenzio e la giacenza restava ferma (BUG-040). Spostandolo a
      «pronto» il difetto sparisce da sé, e non perché si sia allargato un
      permesso.
      Non si scala PRIMA, alla presa in carico: un drink iniziato e poi non
      fatto — riga tolta, cliente che cambia idea, comanda annullata —
      avrebbe già portato via gli ingredienti.
      Con gli stati del servizio spenti non esiste nessun «pronto»: le
      comande risultano servite alla riscossione, ed è lì che si scala, e
      quella strada non è cambiata. Incassare, di per sé, non scala niente:
      seguendo il servizio si paga anche in anticipo, con tre drink ancora da
      fare.
      PRIMA DI «PRONTO» gli ingredienti sono IMPEGNATI e si leggono in
      magazzino (REQ-MAG-014). Il metro dell'impegnato non è lo stato ma
      `inventory_applied`, ed è per questo che spostare lo scarico non ha
      richiesto di toccare `impegnato.js`: nell'istante in cui una comanda
      viene scaricata esce dai promessi ed entra nella giacenza, senza
      contarsi due volte e senza sparire per un battito.
      AVANTI E INDIETRO NON SCALA DUE VOLTE: si scala una volta sola,
      salvando lo snapshot del consumo sulla comanda (serve anche per
      stornare in caso di annullo). Una comanda riportata da «pronto» a «in
      preparazione» si porta dietro lo scarico già fatto e non lo disfa —
      resta fuori dall'impegnato, perché quegli ingredienti sono nella
      giacenza — e ripassando a «pronto» non si scala di nuovo.
      TORNARE INDIETRO NON RISTORNA, ED È UNA SCELTA — decisa il 19/08
      spostando lo scarico, e scritta qui perché è la domanda che si rifarà
      il prossimo che passa. Tre ragioni:
      1) I DUE CASI NON SI DISTINGUONO. «Ho segnato pronto il ticket
         sbagliato» (il drink non è fatto) e «lo rimetto in lavorazione
         perché manca qualcosa» (il gin è già versato) sono la STESSA
         transizione: ristornare sarebbe giusto nel primo caso e sbagliato
         nel secondo, e l'app non può sapere quale dei due sia.
      2) RISTORNARE VUOL DIRE RIAPPLICARE. Servirebbe lo storno
         all'indietro E il riscarico in avanti: due scritture di magazzino
         per ogni andata e ritorno, che devono nettare a zero anche quando
         una delle due non parte (offline, app chiusa a metà). È lo stesso
         tipo di macchina che `impegnato.js` evita apposta, per non lasciare
         in giro impegni fantasma che nessuno sa più togliere.
      3) IL GESTO GIUSTO ESISTE GIÀ. Per un drink che davvero non è stato
         fatto si annulla la comanda, che reintegra dallo snapshot di
         consumo (REQ-MAG-005).
      Lo stato intanto resta COERENTE: quegli ingredienti stanno nella
      giacenza scalata e fuori dall'impegnato, contati una volta e una sola,
      e «quello che ti ritrovi a fine serata» non si muove.
      Se un domani si decidesse di ristornare davvero, la strada è riusare il
      riallineo per DIFFERENZA che c'è già (`riallineaInSottofondo` /
      `consumptionDiff`, REQ-MAG-004), non scrivere un percorso nuovo.
      Il magazzino che non risponde non blocca la comanda: resta segnata come
      non scaricata e si recupera alla riscossione (`unappliedEntries`), che
      resta la rete di sicurezza anche con gli stati accesi.
      SOTTO ZERO CI SI SCENDE, ED È VOLUTO (BUG-101, chiesto da Flavio il
      03/09/2026). Quello che esce si toglie tutto, anche quando la giacenza
      non basta: un prodotto che continua a uscire dopo essere finito non è
      finito davvero — è arrivato senza che nessuno lo caricasse, o l'ultimo
      inventario era vecchio — e fermarsi a zero cancellava proprio il numero
      che lo dice. Il meno arriva fino alla card, perché un magazzino che sa
      di essere sotto zero e lo tiene per sé è il silenzio da cui il difetto
      è nato.
      IL MENO NON È MERCE CHE MANCA: da uno scaffale vuoto non si versa. È la
      misura di quanto se n'è versato senza che risultasse, e per questo si
      chiude da sé al primo CARICO, che riparte da zero (`giacenzaPerCarico`):
      le sei bottiglie appena consegnate sullo scaffale ci sono tutte e sei, e
      il magazzino deve contarle tutte e sei — non cinque, come farebbe
      trattando il buco da debito.
      DUE COSE RESTANO DA ZERO IN SU, e non è una svista. I SOLDI: un
      magazzino che vale meno di niente non vuol dire niente (`unitsInStock`,
      `stockValue`). LE BOTTIGLIE DA TOCCARE: sono oggetti su uno scaffale, e
      «−1 piena più 750 ml nell'aperta» non è una cosa che si può andare a
      guardare (`bottleBreakdown`). Il meno lo porta `pezziInGiacenza`, che
      conta una quantità e non degli oggetti.
      LO SCARICO A MANO INVECE SI FERMA A ZERO (`scaricoPossibile`): lì c'è
      una persona che dichiara quanto ha tolto dallo scaffale, e da uno
      scaffale vuoto non si toglie niente.
    status: implemented
    generate_issue: false
    labels: [magazzino, offline]
    test_cases:
      - tests/unit/inventory.test.js
      - tests/unit/incassoOffline.test.js
      - tests/unit/comande.test.js
      - tests/unit/scritturaComande.test.js
      - tests/unit/impegnato.test.js
      - tests/unit/salaEMagazzino.test.js
      - tests/unit/magazzinoSottoZero.test.js

