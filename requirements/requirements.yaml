      - tests/unit/agganciaFattura.test.js
      - tests/component/FatturaDellaFetta.test.jsx

  - id: REQ-MAG-030
    title: "Dalla fattura al magazzino: «Aggiungi prodotti», col prezzo che si decide"
    area: "src/components/SupplierInvoicesPanel.jsx, src/lib/listini.js, src/lib/inventory.js, src/lib/api.js"
    description: >
      Nasce da Flavio, che ha guardato lo scadenzario (registrazione del
      26/08/2026, 00:40): «ho appena visto che questa cosa quasi gia' c'e' ed
      e' scadenzario, e dalla foto e' proprio quello che mi serve. Pero' sotto
      mi deve apparire un tasto che fa il carico. Dobbiamo usare un'altra
      dicitura sicuramente, tipo AGGIUNGI PRODOTTI magari, e ci mettiamo anche
      i prodotti, in modo tale che li va gia' a caricare all'interno dei
      prodotti di magazzino. Sempre che poi dopo mi fa la domanda se voglio
      aggiornare il prezzo — nel caso lo vado a modificare — oppure lasciarlo
      invariato, cosi', senza carico, perche' magari me li sono caricati gia'
      prima in altro modo».
      IL DATO CHE VINCOLA IL DISEGNO, verificato il 26/08: una fattura in
      `supplier_invoices` oggi e' SOLO UNA TESTATA — fornitore, data, importo,
      stato pagato, note. NON HA RIGHE. Quindi il tasto non puo' «elencare i
      prodotti della fattura»: quei prodotti non esistono ancora come dato. E'
      il tasto stesso a metterli, ed e' quello che Flavio dice con «ci
      mettiamo anche i prodotti». La fattura guadagna delle righe, e le
      guadagna li'.
      LA DICITURA NON E' UN DETTAGLIO. Flavio chiede esplicitamente di NON
      chiamarlo «carico»: «dobbiamo usare un'altra dicitura sicuramente». Il
      tasto si chiama «Aggiungi prodotti» perche' e' quello che fa — il carico
      a magazzino e' una CONSEGUENZA, e per giunta facoltativa. Chiamarlo
      «carico» prometterebbe una cosa che l'utente puo' decidere di non fare.
      IL CARICO E' FACOLTATIVO, e la ragione e' operativa, non teorica: «magari
      me li sono caricati gia' prima in altro modo». Chi aggiunge i prodotti a
      una fattura sta ricostruendo un documento contabile, che e' cosa diversa
      dal muovere una giacenza. Le due cose vanno tenute separate: si possono
      aggiungere le righe SENZA toccare il magazzino. Caricare due volte la
      stessa merce e' l'errore da impedire, e qui lo si impedisce lasciando
      scegliere invece che decidendo al posto suo.
      IL PREZZO SI CHIEDE, NON SI IMPONE. Dopo aver messo le righe, per ogni
      prodotto il cui prezzo di acquisto differisce da quello in archivio si
      chiede se aggiornarlo, mostrando vecchio e nuovo affiancati e lasciando
      il nuovo MODIFICABILE («nel caso lo vado a modificare»). Chi non risponde
      non aggiorna niente: il pre-impostato non muove i prezzi. Il prezzo
      accettato aggiorna la riga di listino di quel fornitore con la sua data
      e il costo di riferimento del prodotto, esattamente come alla consegna di
      un ordine (REQ-MAG-029): e' la stessa strada, e va riusata, non
      riscritta.
      IL PREZZO DI VENDITA NON LO TOCCA NESSUNO. Vale qui la regola gia'
      scritta in REQ-MAG-029: cambia il costo, non il prezzo del menu, che e'
      di Flavio.
      RAPPORTO CON GLI ORDINI. Quando la fattura e' gia' agganciata a un ordine
      (REQ-MAG-025), le righe si propongono da quell'ordine invece di farle
      ribattere a mano: sono le stesse merci, e ribatterle e' lavoro doppio con
      due occasioni di sbagliare. Resta possibile correggerle, aggiungerne e
      toglierne: la fattura fa fede sulla merce arrivata, non l'ordine.
      FATTO (26/08/2026). Il tasto sta SOTTO ogni documento dello scadenzario
      e si chiama «Aggiungi prodotti». Apre una finestra che cerca il
      prodotto per nome, ne mette la quantita' in confezioni e il prezzo, e
      scrive le righe dentro il documento (`lines` su `supplier_invoices`):
      la fattura, che era solo una testata, guadagna le sue righe.
      IL CARICO E' UNA CASELLA A PARTE, e il tasto di conferma cambia
      dicitura con lei — «Aggiungi e carica» oppure «Aggiungi senza
      caricare» — cosi' il gesto non si puo' fare alla cieca. Il
      pre-impostato e' ACCESO, perche' e' il giro che Flavio descrive («in
      modo tale che li va gia' a caricare»), ma il doppio carico non e'
      impedito dall'attenzione: resta scritto sulla riga se il carico e'
      avvenuto (`caricata`), e le righe gia' in archivio non tornano mai
      dentro la finestra — di li' si aggiunge, non si ricarica. E' la
      risposta al RESTA APERTO qui sopra, presa nella direzione che quel
      testo dava per probabile.
      LA DOMANDA SUL PREZZO COMPARE SOLO DOVE IL PREZZO E' CAMBIATO (oltre il
      centesimo), con vecchio e nuovo affiancati e il nuovo che e' il campo
      stesso, quindi modificabile. Parte SPENTA. Il si' scrive la riga di
      listino di quel fornitore con la sua data e il costo di riferimento del
      prodotto; il prezzo di vendita del menu non lo tocca nessuno.
      UNA STRADA SOLA COL CARICO DEGLI ORDINI: la sequenza «prezzo accettato
      → listino → costo → giacenza e movimento» e' stata ESTRATTA da
      `consegnaRigheOrdine` in `registraAcquisto` (api.js), con due leve —
      `carica` e `aggiornaPrezzo` — che alla consegna sono accese tutte e
      due. Il conto delle unita' base sta in `caricoDaConfezioni`
      (inventory.js), perche' due copie della stessa moltiplicazione sono due
      occasioni di scriverla diversa.
      DECISO IN IMPLEMENTAZIONE, e non stava nel testo: (1) l'IMPORTO della
      testata non si muove da solo — i prodotti si aggiungono a mano, un po'
      per volta, e riscrivere l'importo dopo la prima riga farebbe sembrare
      sbagliata una fattura che e' giusta; il netto delle righe si legge
      accanto, e il confronto lo fa una persona; (2) il MAGAZZINO IN SOLA
      LETTURA (BUG-029) spegne il carico ma NON impedisce di aggiungere le
      righe: sono carta, non giacenze, e bloccarle sarebbe un divieto per un
      motivo che non le riguarda; (3) il catalogo dentro la finestra si vede
      solo cercando, perche' 388 prodotti dentro una finestrella non si
      scorrono.
      IL RAPPORTO CON GLI ORDINI, per adesso, e' SOLO UN AIUTO DI
      COMPILAZIONE: «Riprendi le righe da un ordine» pesca fra gli ordini
      dello stesso fornitore che hanno gia' consegnato qualcosa e ne copia le
      righe come punto di partenza, modificabili. NON scrive nessun id
      d'ordine sulla fattura: il gancio persistente fattura-ordine e'
      REQ-MAG-025, ancora da decidere, e inventarlo qui vorrebbe dire creare
      un dato che poi qualcun altro dovrebbe reggere. Le righe riprese da un
      ordine consegnato spengono il carico da sole: quella merce e' entrata
      in magazzino alla consegna.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-031): il paragrafo qui sopra e'
      SUPERATO. Il gancio persistente e' stato deciso e fatto, e non e' verso
      l'ordine ma verso la FETTA di fornitore. «Riprendi le righe da un
      ordine» quindi non e' piu' solo un aiuto di compilazione: scegliere
      l'ordine copia le righe E aggancia il documento, in una scrittura sola.
      Erano due gesti, e il legame restava non scritto proprio nell'istante in
      cui uno l'aveva appena dimostrato. Resta vero tutto il resto, compreso
      che le righe riprese da una consegna spengono il carico.
