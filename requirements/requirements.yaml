  - id: REQ-UI-024
    title: "Le impostazioni che cambiano l'aspetto stanno tutte sotto «Aspetto»"
    area: "src/components/SettingsTab.jsx, src/components/ThemeSettings.jsx"
    description: >
      Regola data dall'utente il 20/08/2026, con parole sue: «una cosa da
      segnare nei requisiti è che tutto ciò che riguarda l'aspetto degli
      elementi, di qualsiasi sezione del sito, dovrebbe essere messo sotto
      Aspetto. Ad esempio tutto ciò che cambia visivamente l'aspetto delle
      card e qualsiasi cosa cambi/imposti i colori di elementi della UI,
      andrebbero tutti in Aspetto nelle apposite sotto-sezioni da creare se
      non esistono».
      PERCHÉ. Oggi «🎨 Aspetto» contiene solo il tema del gestionale, e le
      altre impostazioni che cambiano come si VEDONO le cose sono sparse
      nella sezione della schermata a cui appartengono. Ha una sua logica —
      «sta dove sta la cosa che colora» — ma costringe chi cerca «perché le
      card si vedono così» a indovinare da quale schermata si passa. Con la
      regola c'è un posto solo, e sotto-sezioni che dicono di cosa si parla.
      COSA CI STA GIÀ. La scelta di cosa dice la striscia delle card della
      coda (`bordo_colore_conto`, REQ-UI-020) è nata dentro Aspetto, nella
      sotto-sezione «Le card della coda»: è il primo pezzo, e il modello per
      gli altri.
      COSA RESTA DA TRASLOCARE — trovato guardando SettingsTab.jsx, e sta
      qui perché chi farà il lavoro parta da un elenco e non da una caccia:
      · `conti_colorati` — «Coda ordini» ▸ «Il colore del conto»: ogni conto
        nuovo nasce col suo colore. Va accanto a `bordo_colore_conto`, nella
        stessa sotto-sezione: sono la stessa domanda in due tempi.
      · `category_display` — «Vista ordine»: pallino, icona o solo icona per
        le categorie nella griglia del POS.
      · `pos_testo_min` — «Vista ordine»: quanto è grande, come minimo, il
        testo delle righe del conto.
      · `stripe_pos` e `stripe_ok_verde` — «Vista ordine»: cosa dice, e di
        che colore, la striscia a sinistra delle schede della griglia
        prodotti (vedi lib/strisce.js).
      · `stripe_menu` e `stripe_menu_ok_verde` — «Menù clienti»: la stessa
        striscia sulle schede del menù dei clienti.
      · `theme_client` — «Menù clienti» ▸ «Colori del menù»: il tema della
        vista cliente. ATTENZIONE, questo è il caso da discutere prima di
        muoverlo: sta lì per una scelta scritta (ThemeSettings.jsx) — messo
        sotto quello del gestionale sembravano due varianti della stessa
        cosa e non si capiva quale si stesse toccando. Se trasloca, deve
        traslocare con un'etichetta che lo distingua a colpo d'occhio.
      · `queue_view` e `bartender_view` — «Coda ordini»: come si dispone la
        coda (griglia, corsie, schede, lista). Sono il confine della regola:
        cambiano la FORMA della schermata, non il colore di un elemento. Va
        deciso, e scritto qui, se la regola li prende o li lascia dove sono.
      HA UN GEMELLO, dal 22/08/2026: REQ-UI-025 dice la stessa cosa per il
      MOMENTO D'USO — la stampa automatica sta dove si incassa, non dove sta
      la stampante. I due insieme sono la regola di come si dispone questo
      pannello: per «quando lo cerco», non per «da cosa è fatto».
      COME SI FA IL TRASLOCO: da solo, in un commit suo. Muovere mezzo
      pannello impostazioni dentro un lavoro che parla d'altro rende i due
      cambiamenti impossibili da rileggere separatamente. Le chiavi non si
      rinominano (sono già scritte sui documenti dei locali): si sposta solo
      dove si toccano.
    status: todo
    generate_issue: true
    labels: [ui, impostazioni]
    priority: P3

  - id: REQ-UI-025
    title: "Le impostazioni si raggruppano per momento d'uso: la stampa automatica sta in Cassa"
    area: "src/components/StampaAutomatica.jsx, src/components/SettingsTab.jsx, src/components/PrinterSetup.jsx"
    description: >
      Regola data dall'utente il 22/08/2026, con parole sue: «Questo setting
      è in cassa e giornata mentre le altre impostazioni di stampa
      automatica sono in stampante. Perché hai scelto di metterla lì? Le
      impostazioni di stampa automatica riguardano la cassa, quindi anche le
      impostazioni di stampa automatiche spostale in cassa».
      LA REGOLA GENERALE, che è la cosa da tenere: un'impostazione sta dove
      sta il MOMENTO in cui la si vive, non dove sta il pezzo tecnico che la
      esegue. È il gemello di REQ-UI-024 («tutto ciò che riguarda l'aspetto
      sta sotto Aspetto») su un'altra famiglia, e i due insieme dicono come
      si dispone questo pannello: per «quando lo cerco», non per «da cosa è
      fatto». «Stampante» è la MACCHINA — indirizzo, porta, prova di stampa,
      i dati e i campi che finiscono sulla carta; QUANDO la carta esce da sé
      è una faccenda dell'incasso, e chi la cerca apre la cassa.
      COSA È TRASLOCATO in «💳 Cassa e giornata», riquadro «🖨️ Stampa
      automatica», subito sotto «Pagamenti»:
      · `autoPrintComanda` e `autoPrintScontrino` — erano nel pannello
        Stampante, riquadro «Stampa automatica».
      · `stampaSala` («Comande prese in sala», REQ-STAMPA-008) — decide se
        il telefono della sala stampa da sé o se la comanda esce al banco:
        è la stessa domanda, e l'avviso «così non le stampa nessuno» guarda
        proprio l'interruttore della comanda. Separarli lasciava un avviso
        che parla di un tasto che non è in pagina.
      · `scontrino_acconto_sempre` e `scontrino_acconto_tasto`
        (REQ-STAMPA-015) — erano in «Pagamenti». «Esce da sola a ogni
        riscossione» è stampa automatica; il gemello col tasto la segue
        perché uno SPEGNE l'altro, e due interruttori legati così si
        guardano insieme. La lezione di BUG-070 regge lo stesso: restano
        nella stessa SEZIONE dei tasti dell'incasso, a uno scorrimento.
      LE DUE FAMIGLIE SI DICONO A SCHERMO, sotto due intestazioni: «Su
      questo terminale» (vivono con le impostazioni della stampante, per
      dispositivo e per chi ci lavora — REQ-STAMPA-010: la comanda la vuole
      stampare il banco, non il telefono che passa a battere due conti) e
      «Per tutto il locale» (stanno su settings/bar e valgono ovunque).
      Senza dirlo, si accende una cosa al banco e ci si stupisce che in sala
      non sia cambiato niente.
      NEL PANNELLO STAMPANTE resta un rimando scritto a dove sono andate, e
      la scheda salva SOLO I SUOI CAMPI: prima mandava il `form` intero, che
      è una fotografia scattata all'apertura, e correggere l'indirizzo IP
      avrebbe rimesso la stampa automatica al valore di mezz'ora prima —
      spegnendola sotto le mani di chi l'aveva appena accesa.
      LE CHIAVI NON SI RINOMINANO: sono già scritte sui documenti dei locali
      e nella memoria dei terminali. Si sposta solo dove si toccano.
    status: implemented
    generate_issue: true
    labels: [ui, impostazioni, stampa]
    priority: P3
    test_cases:
      - tests/component/StampaAutomatica.test.jsx
      - tests/component/SettingsTab.test.jsx

  - id: REQ-PAG-013
    title: "Lo sconto cade sui prodotti che si stanno riscuotendo, e gli sconti si accumulano"
    area: "src/lib/pagamento.js, src/components/PaymentScreen.jsx, src/lib/api.js, src/lib/printer.js, functions/lib/payment-core.js"
    description: >
      Chiesto dall'utente il 20/08/2026: «Lo sconto va applicato solo sui
      prodotti selezionati. Nel senso che se tolgo prodotti dalla schermata
      pagamento, lo sconto va applicato solo sui prodotti che sto riscuotendo.
      Quindi gli sconti poi si accumulano nello scontrino. Se ho applicato uno
      sconto a 2 prodotti prima e a tre prodotti dopo, sono due sconti
      applicati».
      PRIMA lo sconto era uno solo per conto, calcolato sul totale e poi
      ripartito in proporzione su chi pagava la sua parte: chi offriva due
      birre a un amico si vedeva scontare una fetta di tutto il tavolo, e la
      cifra non tornava con niente di quello che aveva davanti.
      IL MODELLO. Lo sconto appartiene alla RISCOSSIONE, non al conto.
      · si calcola sul lordo delle righe selezionate in quel momento; se la
        selezione è tutto il conto il risultato è quello di prima, e il caso
        normale non cambia di un centesimo;
      · se la selezione cambia, l'importo si rifà sulle righe rimaste — in
        percentuale è la sua definizione, in euro decide la strategia del
        locale (tetto / proporzione / avviso, REQ-PAG-003), la stessa che
        governa un conto a cui si tolgono righe;
      · all'incasso viene CONSUMATO dentro quel pagamento
        (`payments[].sconto`) e sul conto non resta niente di preparato: da lì
        in poi è storia e non si ricalcola più, come il prezzo di un drink già
        bevuto;
      · due riscossioni scontate sono DUE sconti, ognuno con le sue righe, e il
        residuo è totale − sconti consumati − sconto in preparazione − pagato.
      DOVE VIVE LO SCONTO IN PREPARAZIONE: sul documento, come prima
      (`discount`/`discount_amount`), più il campo nuovo `discount_items` che
      dice a quali righe si riferisce. Senza quelle righe un altro terminale
      leggerebbe un importo e non saprebbe di che cosa; e visto che la
      selezione vive solo dentro la schermata, senza scriverle non
      sopravviverebbe all'uscita.
      LO SCONTRINO li elenca uno per uno, dicendo su che cosa cadevano
      («Sconto 10% su 3 prodotti −6,00 €»). Con UNO SOLO su tutto il conto
      resta la riga di sempre, «Sconto»: è il caso normale, ed è anche come si
      stampa un conto vecchio. Lo sconto resta un campo che si può spegnere fra
      quelli dello scontrino (REQ-STAMPA-014): spegnendolo spariscono tutte le
      righe insieme, ma il totale resta quello vero.
      IL BUONO è uno sconto come gli altri: cade sulle righe che si stanno
      riscuotendo (mai più del loro lordo, se no si brucia credito del
      beneficiario per niente) e se ne va dentro il pagamento col suo
      `voucher_id` — che serve a ridare il credito se il conto viene riaperto o
      annullato (REQ-PAG-006).
      I CONTI VECCHI NON SI MIGRANO. Nessuno sconto dentro i pagamenti e
      nessun `discount_items` vogliono dire «uno solo, su tutto il conto»: un
      conto aperto ieri sera si legge, si chiude e si stampa come prima.
      CHI SOMMAVA UN NUMERO ADESSO NE SOMMA UNA LISTA: cassa, statistiche,
      rendiconto, scontrino, fattura, badge della coda e dello storico passano
      tutti per `scontoTotale()`, che è consumati + in preparazione.
      E BUG-046 SI RISOLVE ALLA RADICE: lo sconto viaggia insieme all'importo
      dentro `registerPayment` (e dentro `readerCheckout` per il lettore
      SumUp), quindi un gesto è una scrittura sola e il residuo si calcola
      giusto anche su un documento vecchio di un istante. Il parametro `chiude`
      resta: quanto è dovuto lo sa comunque la schermata, non la rilettura.
    status: implemented
    generate_issue: true
    labels: [pagamenti, sconti, stampa]
    priority: P1
