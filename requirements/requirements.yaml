  - id: REQ-CODA-009
    title: "I filtri della coda sono combinabili, e gli autori stanno in una tendina"
    area: "src/lib/coda.js (FILTRI_STATO, cambiaFiltroStato, statoAlDefault, passaStatiCoda, statiDaFiltro, autoriDeiConti, cambiaAutoreScelto, conAutori, riassuntoAutori, frasePerCodaVuota, cambiaSottoChiusi, sottofiltriChiusi, nomiDelServizio), src/pages/BartenderPage.jsx, src/components/Tendina.jsx, src/index.css"
    description: >
      Chiesto dall'utente il 20/08/2026, guardando la coda in emulatore.
      Parole sue: «il conteggio dei filtri accesi e' inutile sulla schermata
      degli ordini. Non esistono veri e propri filtri. A meno che non
      diventino davvero dei filtri, cosi' togliamo TUTTI. Se diventano dei
      filtri io posso vedere quelli aperti, chiusi se seleziono chiuso e
      annullati se seleziono annullati. Posso anche disabilitare In Corso
      che deve diventare Aperti, non In corso. Il filtro Aperti lo posso
      deselezionare solo se chiusi, annullati o tutti e due sono attivi. Se
      disattivo il filtro su chiusi e annullati, si riattiva il filtro
      aperti. Miei continua a filtrare tra Aperti, chiusi e Annullati solo
      sui miei. Anzi il filtro miei dovrebbe diventare un menu a tendina
      dove di default sono selezionati tutti gli utenti che hanno aperto
      almeno un ordine per vedere tutti gli ordini. Poi posso scegliere di
      deselezionare e vedere solo gli ordini di qualcuno (i miei ad
      esempio)».
      E, nello stesso giro, sul DOVE stanno: «i filtri serviti/da servire
      deve stare insieme agli altri. E il tasto dei filtri deve essere sulla
      destra insieme a quello dell'ordinamento non a sinistra dei filtri. E
      non ci siamo capiti: il tasto per mostrare/nascondere i filtri deve
      essere un tasto piccolo e i filtri devono uscire sotto. Come il tasto
      che mostra/nasconde i prodotti da una card delle comande. Devi
      rivedere la UX e migliorarla sempre tenendo presente il fatto che ci
      serve spazio verticale».
      DA DOVE NASCE. Le quattro voci sopra la coda (REQ-CODA-008) erano
      SCHEDE che si escludevano a vicenda, non filtri: per vedere gli aperti
      insieme ai chiusi bisognava chiedere «Tutti», cioe' anche gli
      annullati. E il badge del tastino contava una scheda che c'e' sempre —
      un numero perenne che non distingueva niente.
      I TRE STATI, COMBINABILI. «Aperti» (era «In corso»: e' la parola con
      cui la riga dei conteggi li chiama gia', «12 aperti · 40 chiusi»),
      «Chiusi», «Annullati». Ognuno si accende e si spegne da solo e la coda
      mostra l'UNIONE di quelli accesi; «Tutti» non serve piu' — e' tutti e
      tre accesi, e si vede. Sono `aria-pressed`, non linguette.
      MAI ZERO STATI, ed e' una regola sola guardata da due lati: quando
      l'insieme si svuoterebbe torna «Aperti», che e' il lavoro da fare — la
      risposta giusta quando non se n'e' chiesta nessun'altra. Da li'
      scendono tutti e due i comportamenti chiesti: spegnere «Aperti» quando
      e' l'unico acceso non fa niente (RIFIUTO SILENZIOSO: il chip resta
      acceso, la coda non cambia di una riga, e un avviso per un tocco che
      non doveva partire e' rumore al banco), e spegnere l'ultimo fra
      «Chiusi» e «Annullati» riaccende «Aperti» da solo. La regola e' una
      funzione pura, `cambiaFiltroStato(attivi, tocco)`, provata a unita' su
      tutti i casi limite: la pagina la chiama e basta.
      GLI AUTORI IN UNA TENDINA. Era «✍️ Miei», acceso o spento: o tutti o
      solo i propri. Adesso e' un menu con dentro chi ha aperto almeno un
      conto nell'insieme caricato — piu' una voce «Clienti» per gli ordini
      arrivati dall'app — tutti selezionati di suo, e si spegne chi non
      interessa. «Solo i miei» e' diventato un caso particolare: un autore
      solo selezionato. La chiave e' l'EMAIL e non la lettera della legenda:
      due nomi con la stessa iniziale sulle card si distinguono a fatica, nel
      filtro sarebbero proprio la stessa persona.
      «TUTTI» E' UNO STATO A SE', non la lista che per caso li contiene
      tutti (`autoriScelti === null`): la coda vive mentre si lavora, e chi
      apre il suo primo conto alle undici deve entrare da solo in una
      tendina lasciata al default. Con l'elenco materializzato resterebbe
      fuori senza che nessuno l'abbia deciso.
      MAI ZERO AUTORI: deselezionare l'ultimo rimasto riseleziona tutti.
      Non l'ha chiesto l'utente — e' una decisione presa qui — ma e' la
      stessa domanda degli stati: una coda vuota per forza e' a schermo
      indistinguibile da un'app rotta. Nella tendina si legge da se': tutte
      le voci tornano accese.
      DA CHIUSA LA PASTIGLIA DICE COSA E' SCELTO: «✍️ Autori» con tutti
      dentro, «✍️ Daniele» se ne resta uno, «✍️ 2 autori» se sono di piu'.
      Il filtro autore si INCROCIA con quelli di stato e vale in tutte e
      quattro le viste: e' una implementazione sola, appesa dove serve.
      E' UNA TENDINA IN DEROGA a docs/navigazione.md, che le tendine per i
      filtri le evita — «costringe ad aprirla per sapere cosa c'e' dentro».
      L'ha chiesta l'utente, e qui si regge da se': gli autori sono quanti
      sono i turni (sei, otto, dieci nomi) e in riga sarebbero dieci
      pastiglie che scorrono, cioe' la riga che si sta togliendo. Si riusa
      `Tendina`, che sa gia' chiudersi al tocco fuori e con Esc, e NON si
      chiude al primo tocco: qui si deselezionano piu' persone di fila.
      DOVE STANNO E COME SI APRONO. I due tastini che governano la vista —
      «▾ Filtri» e la freccia dell'ordinamento — stanno IN FONDO A DESTRA su
      una riga che esiste comunque: la riga dei conteggi sulle lavagne, la
      riga della ricerca in lista e schede. A filtri chiusi la coda non paga
      NIENTE per averli: nessuna riga, nessun margine, in tutte le viste e
      anche sul telefono. Il tastino e' piccolo e senza riquadro, sul modello
      del «▾ altre 3» che apre le righe di una card delle comande
      (`.coda-tastino`, il pattern di `.corsia-piu`): un tasto che governa
      COME si guarda la coda non deve pesare come un tasto che fa qualcosa
      alla serata. I chip escono in una riga SOTTO, che da chiusa non viene
      disegnata affatto.
      LA FILA DEI CHIP VA A CAPO invece di scorrere, e qui e' obbligatorio:
      `.chips-row` scorre in orizzontale, e dentro un contenitore che scorre
      un pannello in `position: absolute` viene TAGLIATO — la tendina degli
      autori si aprirebbe dentro una riga alta 40px. La riga esiste solo da
      aperta e per scelta di chi guarda: se sul telefono i chip vanno su due
      righe, sono due righe che qualcuno ha chiesto.
      I SOTTOFILTRI DEI CHIUSI IN RIGA CON GLI ALTRI, non piu' una riga «Dei
      chiusi:» a parte, e da tre chip diventano DUE: la terza era «Tutti», il
      neutro, acceso quasi sempre — diceva «nessun filtro» sembrando un
      filtro, e in riga con gli altri sarebbe stata anche la stessa parola
      della scheda appena tolta. Adesso il neutro e' nessuno dei due acceso.
      Restano esclusivi fra loro e il sottofiltro stringe SOLO i chiusi: con
      «Aperti» e «Chiusi» accesi e «Da servire» scelto, gli aperti restano
      tutti — serviti o no, sono comunque da chiudere.
      IL BADGE CONTA LE DEVIAZIONI DAL DEFAULT, non i filtri accesi, e si
      mostra SOLO a fila chiusa. Con gli stati sempre accesi almeno uno,
      contarli darebbe il numero perenne che l'utente ha bocciato; e a fila
      aperta i chip accesi si vedono da se'.
      TUTTO IN LOCALE: il filtraggio e' client-side sull'insieme gia'
      caricato, nessuna lettura nuova e nessun await. La persistenza resta
      quella di prima — la memoria del terminale riguarda solo fila
      aperta/chiusa e colonne, i filtri sono di sessione.
      ---
      RIVISTO IL 20/08/2026, provato al banco sulle corsie comande. Due
      correzioni dell'utente, e QUELLO CHE C'E' SCRITTO SOPRA SU DOVE E COME
      STANNO I TASTINI E' SUPERATO da qui in giu'.
      PRIMA CORREZIONE — UNA RIGA SOLA. «Quei filtri devono apparire sulla
      stessa riga degli altri tasti e poi non ti avevo chiesto di farlo per
      il tasto dell'ordinamento. Il tasto dell'ordinamento deve essere come
      gli altri solo i filtri si nascondono in quel modo».
      Sotto i conteggi c'era la riga dei chip, e SOTTO ANCORA una seconda
      riga con la scelta delle colonne (le corsie del banco dietro «▦
      Colonne»): chip che aprivano chip, due livelli annidati sopra le
      comande. Adesso i chip delle colonne — le corsie e «✂️ Dividi il
      pronto» — si ACCODANO alla stessa riga degli altri, subito dopo il
      tasto che li apre. `.corsie-scelta` e' sparita col suo contenitore.
      La riga puo' andare a capo da se' se non ci sta, ed e' il capo
      naturale del flusso (`flex-wrap`, che serve comunque alla tendina),
      non un secondo livello. Il conto: fila chiusa = ZERO righe, fila
      aperta = UNA.
      SECONDA CORREZIONE — L'ORDINAMENTO NON E' UN FILTRO. Il pattern
      discreto (niente riquadro, colore attenuato, chevron) era finito
      anche sulla freccia ↓/↑, e non le appartiene: quel vestito dice «io
      apro e chiudo un pezzo di schermata», ed e' vero del solo tasto dei
      filtri. La freccia GIRA LA CODA e non si nasconde mai — non e' un
      filtro — e resta dov'e', in fondo a destra sulla riga dei conteggi,
      accanto al tasto dei filtri, con `spiegaOrdine` intatto.
      TERZA CORREZIONE, arrivata subito dopo e che MODIFICA la seconda: «Ok,
      cosi' com'e' filtri, aggiungi un bordo e rendilo un bottone ma lascia
      la freccetta e la scritta filtri. Il tasto non farlo troppo alto come
      gli altri, stessa cosa per la freccetta dell'ordinamento. Stessa
      dimensione dei filtri. E i tasti dei filtri, tutti, devono essere
      leggermente piu' piccoli».
      Quindi i due tasti sono GEMELLI e stanno in mezzo alle due misure
      provate prima: BOTTONI VERI col riquadro — senza, non si vedeva che
      erano tasti — ma BASSI, non i 44px della famiglia che fa qualcosa
      alla serata. Il tasto dei filtri tiene quello che mostrava («▾
      Filtri», il badge accanto a fila chiusa); la freccia ha solo l'icona
      e quindi il riquadro si fa quadrato (`.coda-tastino.solo-icona`,
      `min-width` = altezza). L'altezza sta in `--tastino-alto` (34px) ed e'
      la STESSA dei chip della fila: sono la stessa specie di comando e in
      riga si devono somigliare.
      E I CHIP SI RIMPICCIOLISCONO, tutti quelli della fila: stati, tendina
      degli autori, «▦ Colonne», sottofiltri dei chiusi, «📅 Solo oggi» e le
      colonne accodate (`.chips-filtri .chip` — 34px invece di 40, corpo
      0.86rem invece di 0.95). E' una DEROGA ai 44px di
      docs/navigazione.md, chiesta e circoscritta: vale solo dentro la fila
      dei filtri, che si tocca quando si decide cosa guardare e non con
      l'ordine in mano, e non arriva ai tasti che si premono di corsa
      (Avanti, Incassa). Il bersaglio resta comodo — su una pastiglia
      scritta il grosso della superficie e' l'imbottitura ai fianchi.
      LA RIGA DEI CONTEGGI NON CRESCE. I due tasti sono piu' alti del testo
      che li ospita; `.coda-tastini` ha margini verticali negativi, cosi'
      l'altezza di riga resta quella del testo e i tasti sporgono dentro il
      `gap` della testata, che c'e' comunque. Su una lavagna guardata da
      lontano ogni pixel di testata e' una comanda in meno sotto.
      ---
      QUARTA CORREZIONE, 20/08/2026 — IL CHIP «▦ COLONNE» NON C'E' PIU'.
      Parole dell'utente: «togli il testo colonne e metti tutti i tasti che
      si aprono cliccando colonne al posto di colonne. Non c'e' piu'
      bisogno visto che nascondiamo tutto con filtri».
      QUELLO CHE SOPRA NON VALE PIU': la PRIMA CORREZIONE aveva accodato i
      chip delle colonne alla riga «subito dopo il tasto che li apre», e
      l'elenco dei chip rimpiccioliti nomina «▦ Colonne». Quel tasto non
      esiste piu'. Al banco, con la fila aperta, i chip delle colonne — le
      corsie sceglibili e «✂️ Dividi il pronto» — stanno DIRETTAMENTE in
      fila al suo posto, con la tendina degli autori e gli altri filtri.
      IL PERCHE' E' UN CONTO DI LIVELLI. Il chip nasceva quando la fila era
      sempre a schermo: serviva a non tenere sei pastiglie di colonne
      addosso a chi non le tocca mai. Da quando la fila INTERA sta dietro
      «▾ Filtri» (REQ-CODA-008) quel lavoro lo fa gia' il tastino, e il
      chip era diventato un secondo livello dentro il primo: due tocchi per
      spegnere una colonna, e nessuna riga risparmiata — a fila chiusa non
      si disegna niente comunque. Un livello solo di nascondimento.
      LA LUNGHEZZA NON E' UN PROBLEMA: al banco la fila arriva a sei o
      sette chip piu' la tendina, e va a capo da se' (`flex-wrap`, che
      serve comunque alla tendina degli autori). E' il capo naturale del
      flusso, non un livello.
      MUORE CON LUI lo stato che lo governava (`scegliCorsie`) e la regola
      «chiudendo la fila si chiude anche la scelta delle colonne», che
      senza il tasto non ha piu' niente da chiudere. Muore anche
      `corsieSpente` in coda.js: contava le spente per il TITLE di quel
      chip, e da aperta la fila lo dicono i chip stessi.
      IL BADGE NON CAMBIA con la morte del chip: a fila chiusa il tastino
      «▾ Filtri» resta acceso col suo numero e il title dice «Colonne (2)»,
      ed e' l'unico posto dove quel segnale serve ancora — a fila aperta i
      chip si vedono. QUANTO VALGONO, invece, e' cambiato due volte il
      22/08: le colonne non sono piu' UNA voce sola ma valgono quante ne
      sono (BUG-080), e non sono piu' quelle «diverse dal normale» ma
      quelle NASCOSTE (`corsieRistrette`, BUG-085) — riaccenderne una fa
      vedere di piu', che e' l'opposto di filtrare. Il dettaglio sta in
      REQ-CODA-008, sesto giro.
      E DAL 22/08 NON VALGONO PIU' NIENTE, perche' il badge non c'e' piu':
      «si' ma infatti togliamo quel numero. Non serve» (l'utente). A fila
      chiusa il tastino dice «▾ Filtri» e basta, e il suo title dice solo
      il gesto — niente «Colonne (2)», niente elenco. Sono spariti con lui
      `corsieRistrette`, `contaFiltri` e `nomeSottofiltro`, che nominava
      la porzione dei chiusi PER QUEL TITLE e non aveva altri clienti (le
      porzioni sul tasto se le nomina `sottofiltriChiusi`, che resta). La
      storia dei quattro criteri sta in REQ-CODA-008, settimo giro.
      RESTA IL PATTERN DEI SOTTOFILTRI DEI CHIUSI, che e' un'altra cosa:
      «Serviti / Da servire» compaiono quando «Chiusi» e' acceso perche'
      fuori di li' non vogliono dire niente. Non e' un chip che apre chip,
      e' un filtro che ne implica altri.
      ---
      QUINTA CORREZIONE, 20/08/2026 — LA TENDINA SI CHIAMA «STAFF», E IL
      TAGLIO DEL PRONTO SE NE VA DALLA FILA. Parole dell'utente: «la
      dropdown che hai chiamato Autori chiamala Staff. E Dividi il pronto
      dobbiamo integrarlo meglio con gli altri due bottoni, in qualche modo
      non si capisce a che serve. E poi è troppo lungo. Non so, troviamo
      una soluzione migliore». Poco dopo, sul secondo punto: «ovviamente
      vale solo se è attivo il ritiro al banco».
      «STAFF», NON «AUTORI». Tutto quello che sopra si legge «Autori» sulla
      PASTIGLIA è superato: da chiusa dice «✍️ Staff» con tutti dentro.
      «Autore» è una parola da redazione; al banco si dice «chi l'ha
      battuto», e la squadra della serata è lo staff. Il pannello continua
      a intitolarsi «Chi ha aperto il conto», che è la domanda per esteso.
      I NOMI INTERNI RESTANO `autori*` (`autoriDeiConti`, `riassuntoAutori`,
      `conAutori`…): un rinomino a tappeto costa un diff che non serve a
      nessuno (CLAUDE.md), e a dover parlare italiano da bar è lo SCHERMO.
      C'è un test che tiene la cerniera: la pastiglia non deve contenere
      «autor» in nessuno dei suoi tre casi.
      COL CONTEGGIO SI DICE ANCHE SU QUANTI: «✍️ 2 di 5» al posto di «✍️ 2
      autori». La tendina si apre per capire QUANTO stringe, e il
      denominatore lo dice senza aprirla; e resta vero anche quando fra i
      selezionati c'è la voce «Clienti», che staff non è («2 di staff»
      sarebbe una bugia). Con una persona sola resta il nome: «✍️ Daniele».
      IL TAGLIO DEL PRONTO NON È PIÙ UN CHIP DELLA FILA. Il chip «✂️
      Dividi il pronto» stava in fondo, dopo le colonne, ed è stato tolto:
      adesso è un tastino appeso al chip «Pronto», dentro il suo gruppo
      (✂️ da unito, 🔗 da diviso). Il perché, per esteso, sta in
      REQ-ORD-020, che è il requisito del pronto diviso: qui basta il conto
      dei chip in fila — uno in meno, e nessuno che faccia un mestiere
      diverso dai suoi vicini.
      ---
      SESTA CORREZIONE, 20/08/2026 — GLI STATI TORNANO ESCLUSIVI, E I
      CHIUSI DIVENTANO UN TASTO A TRE PORZIONI. Parole dell'utente, dopo
      aver provato tutto: «No allora riportiamo aperti, chiusi e annullati
      come mutuamente esclusivi. In più la cosa di servire e serviti
      unisci i tasti con chiusi quindi tasto grande con tre selezioni. Se
      seleziono chiusi, vedo le altre due porzioni del tasto e posso
      filtrare Chiusi: sia da servire che serviti, serviti solo quelli
      serviti, da servire quelli da servire. Diventano Da Servire/Ritirare
      e Serviti/Ritirati. [...] Sono attivi solo quando sono attivi gli
      stati di servizio e se il ritiro non è attivo diventano solo Da
      servire e Serviti (sia filtri che label lane)».
      QUELLO CHE SOPRA NON VALE PIÙ: tutto il capitolo «I TRE STATI,
      COMBINABILI» e la regola del MAI ZERO STATI. Non sono più tre
      interruttori: sono tre filtri che si escludono, toccarne uno spegne
      gli altri, e ce n'è sempre esattamente uno acceso. Il default resta
      «Aperti». Il MODELLO A INSIEME È SPARITO dal codice — non è restato
      in giro «per sicurezza»: `STATI_DEFAULT` è diventato `STATO_DEFAULT`
      (una stringa), `statiAlDefault` è `statoAlDefault`,
      `cambiaFiltroStato(stato, tocco)` torna l'id toccato, e
      `statiDaFiltro` normalizza un id o 'tutti' invece di un array. I
      test dell'unione sono stati tolti insieme alla regola: un test che
      descrive un'app che non esiste più è peggio di nessun test.
      COSA ABBIAMO IMPARATO dal giro in mezzo, che vale la pena scrivere:
      la combinazione non serviva alla domanda che si fa davvero. Sopra la
      coda si chiede una cosa per volta — cosa c'è da fare, quanto ho
      incassato, cosa ho annullato — e una coda mista costringe a
      rileggere ogni card per capire in quale dei tre mondi sta. Quello
      che mancava alle vecchie schede era un'altra cosa: il modo di
      stringere DENTRO i chiusi. Ed è lì che è andata a finire la fatica.
      «TUTTI» NON È TORNATO: nessuno l'ha chiesto, e resta quello che era
      — una scheda che mescola gli incassi con gli annullati.
      IL TASTO DEI CHIUSI, TRE PORZIONI IN UN BOTTONE SOLO. «💶 Chiusi»
      e i due sottofiltri non sono più tre chip fratelli in fila: sono un
      gruppo (`.chip-gruppo`, il pattern di DESIGN.md nato per il taglio
      del pronto) con bordo condiviso e angoli tondi solo agli estremi. Da
      spento si vede la sola porzione «💶 Chiusi»; accendendolo, DENTRO
      LO STESSO TASTO, compaiono le altre due. Il perché: in quella fila i
      tre chip si leggevano come tre filtri dello stesso rango, mentre gli
      ultimi due sono una domanda DENTRO il primo — e comparivano dal
      nulla a metà riga, spostando tutto quello che avevano dopo.
      LA SEMANTICA DELLE DUE PORZIONI NON CAMBIA, cambia il vestito e il
      nome: NEUTRO = nessuna delle due accesa = tutti i chiusi, da servire
      E serviti («Chiusi: sia da servire che serviti», parole sue);
      accesa una, si vede solo quella; sono esclusive fra loro e
      ritoccando quella accesa si torna al neutro (`cambiaSottoChiusi`,
      invariata).
      ESISTONO SOLO COGLI STATI DEL SERVIZIO ACCESI («sono attivi solo
      quando sono attivi gli stati di servizio»): senza la preparazione
      tutto quello che è stato pagato è uscito per definizione, e la
      domanda non c'è. Nelle CORSIE DEI CONTI, dove la colonna «Chiusi»
      c'è sempre e non c'è nessun filtro da accendere, le due porzioni
      restano un gruppo da due, con lo stesso vestito.
      I NOMI SEGUONO IL RITIRO, e valgono per porzioni, chip delle colonne
      e titoli delle corsie: col ritiro al banco «Da servire/Ritirare» e
      «Serviti/Ritirati», col solo servizio «Da servire» e «Serviti». Una
      funzione pura, `nomiDelServizio(ritiroEsiste)` in lib/coda.js, usata
      da tutti e tre: scritti a mano tre volte divergerebbero al primo
      ritocco. Il resto (i titoli delle corsie del banco) sta in
      REQ-ORD-020.
      IL BADGE DEL TASTINO non cambia mestiere: conta sempre le DEVIAZIONI
      dal default — stato diverso da «Aperti», staff filtrato, colonne
      spente, porzione dei chiusi accesa. Con un solo stato acceso alla
      volta il conto si semplifica: uno stato vale uno, non tre.
      ---
      22/08/2026 — QUANTE DEVIAZIONI, NON QUANTI GENERI. Quello che sopra
      si legge «le colonne diverse dal normale contano come UNA deviazione
      dal default» non vale piu': ne contano una per COLONNA. Il badge
      diceva «1» con due colonne riaccese — «non mi e' chiaro come conta i
      filtri» (l'utente, BUG-080) — e un numero che non torna con quello
      che si vede e' un numero che si smette di guardare. Il title invece
      le raggruppa ancora in «Colonne (2)»: i loro nomi sono le testate
      della lavagna, gia' a schermo. Badge e title leggono la STESSA lista
      (`contaFiltri` e `spiegaFiltri`, lib/coda.js), dove una voce vale
      uno o porta quante ne tiene dentro.
    status: implemented
    generate_issue: true
    labels: [coda, ui]
    test_cases:
      - tests/unit/coda.test.js
      - tests/unit/css.test.js
      - tests/component/CodaCorsie.test.jsx
      - tests/component/CodaGiornate.test.jsx

