  - id: REQ-MAG-025
    title: "Ordini e fatture: una pagina sola, e una fattura paga un ordine"
    area: "src/components/PurchaseOrdersPanel.jsx, src/components/SupplierInvoicesPanel.jsx, src/components/InventoryManager.jsx, src/lib/api.js, src/lib/ruoli.js, src/components/StaffDrawer.jsx"
    description: >
      Chiesto dall'utente il 19/08. Oggi ordini fornitore e documenti stanno
      dentro Magazzino, in due sottosezioni che non si parlano: si ordina di
      la', si segna la fattura di qua, e nessuno sa quale fattura paghi quale
      ordine. Devono diventare UNA PAGINA LORO, «Ordini e fatture», nel menu
      laterale e visibile SOLO ALL'ADMIN, con due sottosezioni: «Ordini» e
      «Fatture». Sono i soldi che escono dal locale, e non e' roba da turno.
      ⚠️ IL CONTENITORE C'E' GIA', dal 26/08/2026: e' la sezione
      «Fornitori» (REQ-MAG-028), che l'utente ha chiesto con quel nome e con
      tre sottosezioni — anagrafica, Ordini, Scadenzario — visibile solo
      all'admin, esattamente per la ragione scritta qui sopra. Quindi di
      questa voce restano da fare LE DUE COSE CHE CONTANO, e non il
      trasloco: il LEGAME fattura-ordine e il GIRO d'ordini descritti qui
      sotto, piu' il prodotto nuovo che oggi si perde in silenzio. Chi la
      lavora parte da `FornitoriTab.jsx`, non da zero.
      IL LEGAME, che e' il cuore della richiesta: UNA FATTURA PAGA UN ORDINE
      (e un ordine e' di UN fornitore solo).
      Dall'ordine si arriva alla sua fattura e viceversa; un ordine senza
      fattura si vede a colpo d'occhio (la merce e' arrivata ma il documento
      no), e una fattura senza ordine pure — sono le due cose che a fine mese
      fanno tornare o non tornare i conti con il commercialista.
      TRE LIVELLI, NON DUE (precisato dall'utente il 19/08). Non e' una
      fattura che copre piu' ordini: e' un GIRO D'ORDINI che ne contiene
      diversi, UNO PER FORNITORE, e ogni fornitore manda la SUA fattura.
      «Un giro di ordini, non un ordine. Sono piu' fatture perche' ci sono
      diversi fornitori» — parole sue.
      Quindi: giro -> N ordini (uno per fornitore) -> N fatture (una per
      ordine). Il legame fattura-ordine resta uno-a-uno; quello che sta
      sopra e' il giro, che tiene insieme la serata di ordinazione.
      LO DICONO ANCHE I FOGLI, e adesso si spiegano: in GEN ORD REC ogni
      foglio e' un giro e si chiama coi numeri dei documenti che lo compongono
      («1410+1438+AGO+PAD+PIC», «nova+ago+picc»), col fornitore scritto
      sull'ARTICOLO e non sull'ordine — un foglio solo, piu' fornitori
      dentro (REQ-MAG-023).
      COSA CAMBIA PER L'APP: oggi `purchase_orders` e' gia' UN ORDINE PER
      FORNITORE, quindi quel livello c'e' e non si tocca. Manca il giro
      sopra: si guarda il fabbisogno una volta sola e ne escono N ordini
      insieme, che poi vivono ognuno per conto suo (arriva, si carica, si
      fattura). Da decidere se il giro e' un dato scritto (una collezione
      sua, che tiene la data e i suoi ordini) o solo un modo di crearli in
      blocco: la prima strada permette di chiedersi «quanto e' costato il
      giro di martedi'», la seconda costa meno.
      IL CARICO AL RICEVIMENTO C'E' GIA' e non va rifatto: receivePurchaseOrder
      in api.js, quando l'ordine passa a «ricevuto», alza la giacenza riga per
      riga (confezioni x contenuto, o pezzi), aggiorna le bottiglie totali e
      scrive un movimento «ordine fornitore». Questa voce ci aggiunge il pezzo
      che manca.
      ⚠️ AGGIORNAMENTO 26/08/2026 (REQ-MAG-029): `receivePurchaseOrder` non
      esiste piu'. Il carico avviene al passaggio della RIGA a «consegnato»,
      per FETTA di fornitore — `consegnaRigheOrdine` — perche' con piu'
      fornitori dentro un ordine solo il gesto «ricevuto» sull'ordine intero
      non esiste: consegnano in giorni diversi. Il conto del carico e' lo
      stesso di prima, e il punto 4 qui sotto («il carico non e' automatico»)
      e' fatto a meta': il gesto e' gia' per riga, quello che manca e' il
      tasto «CARICA TUTTI».
      IL PRODOTTO NUOVO, che oggi si perde in silenzio. Quel ciclo salta le
      righe il cui articolo non esiste in anagrafica (`if (!s.exists())
      continue`): se il fornitore manda una referenza nuova, la riga non
      carica niente e nessuno se ne accorge. Deve invece NASCERE il prodotto,
      inventariato con quello che l'ordine sa gia' (nome, fornitore, prezzo,
      confezione) e marcato come DA SISTEMARE — perche' quello che l'ordine
      non sa e' proprio cio' che serve al resto del sistema: la categoria (e
      quindi la macro d'acquisto), l'unita' di misura vera, la soglia di
      riordino.
      ATTENZIONE AL NOME: nel magazzino esiste gia' una lista «da sistemare»,
      ma e' del travaso a pezzi (i prodotti che la migrazione non sa
      convertire da sola) ed e' una cosa diversa. O si riusa quella stessa
      strada — e allora si dice perche' le due situazioni sono la stessa — o
      il nuovo stato ha un nome suo. Due liste omonime che vogliono dire cose
      diverse, sulla stessa schermata, sono un guaio che si paga dopo.
      COME SI INCASTRA COL RESTO, ed e' la parte da non sbagliare:
      1) MACRO-CATEGORIE. Un prodotto nuovo senza categoria non ha macro
      d'acquisto, quindi la sua spesa non compare in «Bilancio → Acquisti x
      Fatturato» (REQ-MAG-022): sparisce dai conti invece di risultare
      sbagliata, che e' peggio. Il prodotto da sistemare va quindi mostrato
      insieme alle categorie senza macro (REQ-UI-022): sono lo stesso buco
      visto da due lati.
      2) SCARICO. La giacenza caricata da un ordine si scala con le regole di
      sempre — snapshot della ricetta, unita' base, scarico a «pronto»: qui
      non cambia niente, e non deve cambiare.
      3) IVA. L'ordine porta il prezzo d'acquisto; l'IVA d'acquisto ha gia' il
      suo default (22%) e il campo per prodotto. Un prodotto nato da un ordine
      eredita il default finche' qualcuno non lo corregge.
      4) SPESE DEL MESE (REQ-CASSA-012): le fatture fornitore sono spesa
      registrata. Va deciso — e scritto — se entrano da sole nel netto del
      mese o se restano due elenchi separati, altrimenti la stessa uscita si
      conta due volte.
      ATTENZIONE, DUE «FATTURE» NEL CODICE: `supplier_invoices` sono i
      documenti dei FORNITORI (quello di cui parla questa voce), `invoices`
      sono le fatture di VENDITA ai clienti. Nomi vicini, mestieri opposti.
      TRE SOTTOSEZIONI, NON DUE (utente, 19/08): «Ordini», «Fatture» e
      «ALTRE SPESE», piu' un RIEPILOGO che le tiene insieme. La terza nasce
      da una domanda sua — «quelle spese da inserire a mano non sono gli
      ordini?» — e la risposta, misurata sui fogli, e' che in parte SI':
      la sua riga SPESE e' sempre piu' grande degli acquisti dello stesso
      mese (gen 2.380 contro 1.809, giu 12.726 contro 8.673), quindi
      contiene la merce PIU' altro, da 570 a 4.050 euro al mese.
      COSA C'E' IN QUELL'ALTRO, trovato il 19/08 e non piu' un'ipotesi:
      sta in FORNITORI REC.xlsx, foglio «TO BUY» — tavoli da esterno,
      sgabelli, divani, una tenda, uno scaffale IKEA, bicchieri di
      plastica in cinque misure. Colonne: articolo, quantita', prezzo,
      totale, DOVE si compra (Amazon, Bricoware, IKEA, Vente-Unique) e
      note. Totale del foglio 2.468,59.
      QUINDI SONO ARREDI, ATTREZZATURE E MATERIALE DI CONSUMO: roba che
      esce dal conto corrente e non entra in magazzino, e che nessun
      ordine fornitore intercettera' mai. Da qui la sottosezione, e le sue
      colonne sono quelle del foglio.
      IL FOGLIO PERO' E' UNA LISTA DELLA SPESA, non un registro: si chiama
      «da comprare» e diverse righe hanno prezzo zero, cioe' non ancora
      prezzate. Serve quindi sapere se una voce e' GIA' STATA COMPRATA:
      solo quelle comprate pesano sul netto del mese, le altre sono un
      promemoria. Senza questa distinzione un divano desiderato
      abbasserebbe l'utile di gennaio.
      IL RIEPILOGO, quarta voce del menu: mette insieme i tre elenchi in
      un totale per mese — merce (dalle fatture), altre spese, e quanto
      resta aperto (ordini senza fattura, fatture non pagate). E' il
      numero che poi Bilancio -> Mesi usa per il netto, e la ragione per
      cui sta QUI e non li': i soldi che escono si guardano dove si
      registrano.
      DECISIONI DEL 20/08 (l'utente, a voce sua), che AGGIORNANO il
      modello scritto sopra — dove si contraddicono, vince quanto segue:
      1) L'ORDINE PUO' CONTENERE ITEM DI PIU' FORNITORI: «un ordine puo'
      contenere item da piu' fornitori, per questo deve essere possibile
      FILTRARE l'ordine per fornitori». Il giro e l'ordine collassano in
      una cosa sola: quello che sopra si chiamava «giro» E' l'ordine, e il
      livello per-fornitore diventa una VISTA (il filtro), non un
      documento. Le fatture restano piu' d'una — di norma una per
      fornitore coinvolto.
      2) LE FATTURE SI ALLEGANO ALL'ORDINE **PER FORNITORE** (precisato
      dall'utente subito dopo): «la vista degli ordini contiene piu'
      fornitori, ma la fattura e' collegata all'ordine PER IL FORNITORE,
      perche' e' il fornitore che rilascia la fattura». Quindi il legame
      della fattura non e' con l'ordine intero ma con LA FETTA di quel
      fornitore dentro l'ordine — la stessa fetta che il filtro mostra:
      filtro su Nova = le sue righe E la sua fattura. Un ordine con tre
      fornitori ha fino a tre fatture, ognuna agganciata alla sua fetta, e
      si vede a colpo d'occhio quale fetta e' ancora senza documento.
      Allegare = il documento vero (foto/PDF), non solo un numero. Serve
      lo Storage; da decidere in implementazione limite di peso e formati.
      3) «ARRIVATO» LO DECIDE L'ADMIN: e' il suo gesto a segnare l'ordine
      arrivato, ed e' quel gesto che APRE la possibilita' di caricare
      l'inventario.
      4) IL CARICO NON E' AUTOMATICO: «e' il bartender che decide, quando
      l'ordine e' arrivato, SE e QUALI prodotti caricare in inventario».
      Riga per riga, piu' un tasto «CARICA TUTTI» quando l'ordine e'
      arrivato. Il receivePurchaseOrder di oggi (carica tutto in un colpo
      al ricevimento) va quindi spezzato in due: l'arrivo (admin) e il
      carico (bartender, selettivo o tutto).
      5) ASSORTIMENTO PRE-IMPOSTATO, opzionale: prima che l'ordine arrivi
      si puo' segnare, per ogni prodotto dell'ordine, il passaggio a «in
      assortimento» — e il cambio si applica quando l'ordine e' arrivato e
      il carico di quel prodotto e' stato fatto davvero. Serve a preparare
      il listino mentre la merce viaggia, senza che il cambio scatti prima
      che la merce esista.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-031): IL LEGAME E' FATTO, ed e'
      il punto 2 qui sopra — la fattura agganciata alla FETTA di fornitore,
      i due versi, la guardia sul fornitore e i due buchi a colpo d'occhio.
      Vive in `order_id` sulla fattura piu' `aggancioAmmesso`
      (src/lib/fatture.js), e si usa da Fornitori -> Ordini e da Fornitori
      -> Scadenzario. Di quel punto 2 resta fuori solo l'ALLEGATO del
      documento (foto/PDF): serve lo Storage e non sono decisi ne' peso ne'
      formati.
      QUESTA VOCE RESTA DA FARE per tutto il resto: il tasto «CARICA
      TUTTI», i due gesti separati arrivato/carico (punti 3 e 4),
      l'assortimento pre-impostato (punto 5), «Altre spese» col Riepilogo, e
      il prodotto nuovo che oggi si perde in silenzio.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-032): TRE PEZZI SONO FATTI, e sono
      il PRODOTTO NUOVO che si perdeva in silenzio, il tasto «CARICA TUTTI»
      col carico riga per riga (punto 4) e l'ASSORTIMENTO PRE-IMPOSTATO
      (punto 5). Il prodotto nasce alla consegna con lo stesso id della riga
      d'ordine e passa da `registraAcquisto` (api.js) come ogni altra merce
      che entra; la sua forma la compone `prodottoDaRigaOrdine`
      (src/lib/inventory.js). Lo stato nuovo NON riusa il nome «da
      sistemare» del travaso — le due situazioni non sono la stessa, e
      quella blocca il magazzino mentre questa non blocca niente — e si
      chiama SCHEDA DA COMPLETARE; si guarda accanto alle categorie senza
      macro (REQ-UI-022), che e' lo stesso buco visto dall'altro lato. La
      spunta riga per riga e il tasto che le prende tutte stanno nella
      finestra della consegna e passano dagli `indici` di
      `consegnaRigheOrdine`, senza nessuna seconda strada.
      DI QUESTA VOCE RESTANO: i due gesti separati arrivato/carico (punti 3
      e 4, che si contraddicono con la registrazione di Flavio del 26/08 su
      cui e' costruito il flusso di oggi — la decisione e' dell'utente, e
      REQ-MAG-032 dice dove andrebbe messo il taglio), «Altre spese» col
      Riepilogo, e l'allegato del documento (foto/PDF).
      ⚠️ DECISIONE DEL 27/08/2026, che CHIUDE la contraddizione fra i punti
      3 e 4 qui sopra (20/08) e REQ-MAG-029 (26/08). Vale il gesto solo:
      CONSEGNARE UNA RIGA LA CARICA, come lo descrive Flavio — «lo metto
      come consegnato e me lo inizia anche a caricare nel magazzino» — e
      come e' stato costruito. L'utente, richiesto di scegliere: «resta
      com'e'».
      Il punto 4 del 20/08 («e' il bartender che decide SE e QUALI prodotti
      caricare») NON viene tradito, ed e' la ragione per cui la scelta
      costa poco: quel «se e quali» c'e' gia', perche' si consegnano le
      righe che si spuntano, una per una, piu' il tasto «Carica tutti» per
      farle tutte insieme (REQ-MAG-032). Quello che cade e' solo il
      PASSAGGIO IN PIU': nessun livello «arrivato» fra richiesto e
      consegnato, e nessuna divisione di ruoli fra chi segna l'arrivo e chi
      carica. Un passaggio in piu' a ogni consegna, su una schermata che si
      usa con la merce in mano, si paga tutte le sere; il controllo che
      avrebbe dato lo si ha gia' spuntando le righe.
      Il punto 3 («arrivato lo decide l'admin») decade con lui.
      DI QUESTA VOCE RESTANO DUNQUE SOLO: «Altre spese» col Riepilogo, e
      l'allegato del documento (foto/PDF).
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-033): L'ALLEGATO E' FATTO, ed e'
      l'ultima riga del punto 2 qui sopra — «il documento vero (foto/PDF),
      non solo un numero». Dalla riga del documento, in Fornitori ->
      Scadenzario, si allega una foto o un PDF, lo si riapre, si sostituisce
      e si toglie; i documenti senza allegato si contano in testa e si
      isolano col chip «Senza allegato», con lo stesso linguaggio degli altri
      due buchi. Il file vive su Firebase Storage sotto `fatture/<id
      fattura>/`, protetto dalla stessa mano che protegge le fatture
      (bartender/admin, `storage.rules`), e se ne va insieme alla fattura che
      lo nomina. IL PESO E I FORMATI, che questa voce lasciava da decidere,
      sono decisi: JPG, PNG, WebP e PDF, fino a 8 MB, con le foto ridotte nel
      browser a 2000 punti sul lato lungo prima di partire — il perche' di
      ognuno di quei numeri sta in REQ-MAG-033.
      DI QUESTA VOCE RESTA DUNQUE SOLO «Altre spese» col Riepilogo.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-034): «ALTRE SPESE» COL RIEPILOGO
      È FATTO, ed erano gli ultimi due pezzi rimasti. «Altre spese» è la
      terza sottosezione di Fornitori, con le colonne del foglio «TO BUY» e
      la distinzione che regge tutto — comprata o solo desiderata, `bought` e
      `bought_at` in `src/lib/spese.js`: solo il comprato pesa sul mese. Il
      «Riepilogo» è la quarta voce e somma per mese la merce (dalle fatture),
