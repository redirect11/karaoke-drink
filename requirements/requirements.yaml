  - id: REQ-MAG-033
    title: "L'allegato della fattura: il documento vero, foto o PDF"
    area: "src/lib/allegati.js, src/lib/storage.js, src/lib/api.js, src/components/SupplierInvoicesPanel.jsx, storage.rules"
    description: >
      Ritagliato da REQ-MAG-025, punto 2 delle DECISIONI DEL 20/08, di cui
      REQ-MAG-031 aveva gia' fatto il legame. Qui c'e' l'ultima riga di quel
      punto, con le parole dell'utente: «Allegare = IL DOCUMENTO VERO
      (foto/PDF), non solo un numero. Serve lo Storage; da decidere in
      implementazione limite di peso e formati».
      PERCHE' SERVE: il numero dice quale fattura e', la carta e' quella che
      il commercialista chiede. Fino a ieri lo scadenzario teneva la testata
      (fornitore, numero, data, importo), le righe (REQ-MAG-030) e il legame
      con la fetta d'ordine (REQ-MAG-031) — tutto tranne il documento. La
      carta restava in una cartelletta al banco, e a fine mese si cercava li'.
      FATTO (27/08/2026).
      COSA SI PUO' FARE: dalla riga del documento, nello Scadenzario, si
      allega una foto o un PDF; l'allegato si riapre, si sostituisce e si
      toglie; e i documenti senza allegato si vedono a colpo d'occhio.
      IL TERZO BUCO, e si guarda come gli altri due (REQ-MAG-031): il segno
      «senza allegato» in ambra sulla riga e il chip «Senza allegato (n)» che
      tiene solo quelli. NON e' un linguaggio nuovo, ed e' deliberato: e' lo
      stesso del «senza ordine» che sta due righe piu' su, perche' e' la
      stessa cosa — lavoro che manca, non un errore dell'app (in questa app
      il rosso vuol dire annullato, DESIGN.md).
      SI CHIAMA «ALLEGATO» E NON «DOCUMENTO», per forza: in questa schermata
      «documento» e' gia' la fattura stessa — «Nuovo documento», «Eliminare
      il documento» — e un badge «senza documento» sotto un documento
      sarebbe una parola con due significati sulla stessa riga.
      ── LA DECISIONE SU PESO E FORMATI, che il requisito lasciava aperta ──
      FORMATI AMMESSI: JPG, PNG, WebP e PDF. Una fattura arriva in due modi
      soli — fotografata col telefono (JPEG, o PNG per uno screenshot) oppure
      scaricata dal portale del fornitore (PDF) — e tutto il resto non e' una
      cosa che il locale possa poi riaprire.
      L'ELENCO E' CHIUSO E NON E' `image/*`, ed e' la parte che costa: un
      HEIC di iPhone passerebbe da `image/*`, ma il canvas del browser non lo
      sa decodificare — finirebbe su Storage a piena dimensione e non si
      aprirebbe piu'. Meglio rifiutarlo nell'istante in cui lo si sceglie,
      dicendo cosa va bene. In pratica quasi non capita: caricando dalla
      libreria foto, iOS consegna gia' un JPEG.
      PESO MASSIMO: 8 MB, ed e' quello che finisce su Storage. Una foto
      ridotta sta in mezzo mega e un PDF di fattura pure, ma un PDF
      scansionato di piu' pagine — che certi fornitori mandano — arriva
      tranquillamente a cinque; sopra gli otto non e' piu' una fattura, e'
      un catalogo, e riscaricarlo dalla connessione del locale costerebbe
      piu' che ricercare la carta. Il limite vero sta in `storage.rules`;
      quello nell'app serve a DIRLO PRIMA, sul tasto, invece di far fallire
      un caricamento gia' partito.
      LE FOTO SI RIDUCONO NEL BROWSER, prima di partire: 2000 punti sul lato
      lungo e qualita' JPEG 0,72. Chi scatta e' in piedi in magazzino con la
      connessione del locale, e uno scatto di una fattura A4 sono facilmente
      5 MB; da qui esce intorno al mezzo. Duemila punti su un A4 fanno circa
      170 punti per pollice, che e' la soglia sotto la quale il corpo piccolo
      — aliquote, numeri di riga — comincia a impastarsi: UNA FATTURA SI DEVE
      LEGGERE, NON STAMPARE. Le foto dei drink si riducono a 1200 perche'
      sono francobolli in un menu; e' lo stesso conto (`downscaleImage` in
      storage.js) con numeri diversi, non una seconda strada.
      IL PDF NON SI TOCCA: ricomprimerlo vorrebbe dire rovinare il testo, che
      e' esattamente la cosa da leggere. Si accetta o si rifiuta.
      UN TERZO LIMITE, prima di tutti: 25 MB sullo scatto NON ancora ridotto.
      Una foto da telefono sta fra i 3 e i 5 MB e passa senza accorgersene;
      venticinque vuol dire un file che non viene da una fotocamera, e
      provare ad aprirlo in canvas su un telefono di tre anni fa vuol dire la
      schermata piantata con la merce in mano.
      IL LIMITE SI DICE PRIMA, e non dopo: formati e peso stanno scritti sul
      tasto («Allega foto o PDF, fino a 8 MB») e ogni rifiuto dice cosa fare
      — allegare solo le pagine che servono, rifare la foto — non che cosa
      chi legge ha sbagliato.
      DOVE FINISCE IL FILE: `fatture/<id fattura>/<istante>-<caso>.<est>` su
      Firebase Storage. Una cartella per fattura, cosi' la regola parla del
      documento e non di un mucchio comune; l'istante piu' un numero a caso
      nel nome perche' due terminali che allegano nello stesso secondo non si
      sovrascrivano. L'estensione la decide il TIPO e non il nome di
      partenza: dopo la riduzione il file E' un JPEG anche se si chiamava
      `.png`.
      SULLA FATTURA SI SCRIVE UNA SCHEDA, non solo l'URL: `attachment` con
      url, PERCORSO, tipo, peso, nome originale e data. Il percorso e' quello
      che permette di cancellare — senza, il file di una fattura eliminata
      resterebbe su Storage per sempre senza che nessuno sappia piu' di chi
      era; il nome originale e' l'unica cosa che permette di riconoscere
      l'allegato senza aprirlo.
      COM'E' PROTETTO: `storage.rules`, cartella `fatture/`, lettura
      scrittura e cancellazione al solo bartender/admin — LO STESSO permesso
      che ha `supplier_invoices` in `firestore.rules`, perche' la carta di un
      documento contabile non puo' essere piu' aperta del documento stesso.
      Non e' la regola delle foto dei drink, che sono a lettura pubblica.
      DA SAPERE, e non e' nascosto: l'app apre l'allegato con il download URL
      (`getDownloadURL`), che porta un token e vale per chiunque ce l'abbia.
      Quel link pero' sta scritto SOLO dentro il documento della fattura, che
      le regole proteggono: per averlo bisogna gia' poter leggere la fattura.
      Sostituire o togliere l'allegato cancella il file, e con lui il token.
      La strada alternativa — tenere solo il percorso e scaricare il file con
      `getBlob`, che passa dalle regole a ogni lettura — vuole la CORS del
      bucket configurata a mano, e senza quella l'allegato non si aprirebbe
      affatto: si e' scelto quello che funziona, scrivendo qui il prezzo.
      QUI SI ASPETTA, ed e' l'eccezione che conferma il local-first: non c'e'
      modo di scrivere sulla fattura il riferimento a un file che non e'
      ancora su Storage, e comporre in memoria un allegato che potrebbe non
      esistere vorrebbe dire una fattura che dice di avere una foto e non ce
      l'ha. Questa e' una schermata di gestione e non la coda. L'ATTESA SI
      VEDE («Carico l'allegato…» al posto della riga) e un caricamento
      fallito lo dice e lascia il documento esattamente com'era. La scrittura
      su Firestore invece resta `bgWrite` come tutte, e il documento
      aggiornato si COMPONE senza rileggerlo (BUG-045).
      SOSTITUIRE NON BUTTA VIA PRIMA DI AVERE: il vecchio file si cancella
      solo dopo che il nuovo e' su. E' il caso che fa il danno — la rete che
      cade a meta' sostituzione — e a quel punto sulla fattura c'e' ancora
      l'allegato di prima, intero.
      CHI CANCELLA LA FATTURA PORTA VIA ANCHE L'ALLEGATO. Prima se ne va il
      documento, che e' quello che conta e lo si aspetta; poi il file, che e'
      un tentativo e non solleva niente: un file gia' assente non e' un
      motivo per lasciare in pagina una fattura appena eliminata.
      COSA DEVE PUBBLICARE CHI GESTISCE, e senza quello non funziona:
      `storage.rules` (`firebase deploy --only storage`). Le regole sono
      scritte, NON pubblicate — la pubblicazione e' un gesto suo.
    status: implemented
    generate_issue: true
    labels: [magazzino, fornitori, scadenzario]
    priority: P2
    test_cases:
      - tests/unit/allegatoFattura.test.js
      - tests/unit/allegatoInArchivio.test.js
      - tests/component/AllegatoFattura.test.jsx

  - id: REQ-MAG-032
    title: "Il prodotto che nasce da una consegna, e il carico che si sceglie"
    area: "src/lib/inventory.js, src/lib/api.js, src/components/PurchaseOrdersPanel.jsx, src/components/InventoryManager.jsx, src/components/MacroCategoryManager.jsx"
    description: >
      Ritagliato da REQ-MAG-025, che resta da fare per il resto: qui ci sono
      tre pezzi soli, quelli che toccano la merce che entra.
      1) IL PRODOTTO NUOVO CHE SI PERDEVA IN SILENZIO, ed e' la ragione per
      cui questa voce esiste. Davanti a una riga d'ordine il cui articolo non
      sta in anagrafica non succedeva niente: la riga passava a «consegnato»,
      la giacenza non si muoveva, nessun movimento veniva scritto e nessuno
      se ne accorgeva — a schermo la consegna sembrava andata a buon fine. Se
      il fornitore mandava una referenza nuova, quella merce SPARIVA: non
      entrava in magazzino e non risultava da nessuna parte. Una merce
      contata male si vede e si corregge; una che sparisce in silenzio no, e
      quella e' la peggiore delle due.
      2) IL TASTO «CARICA TUTTI» (REQ-MAG-025 punto 4).
      3) L'ASSORTIMENTO PRE-IMPOSTATO (REQ-MAG-025 punto 5).
      FATTO (27/08/2026).
      IL PRODOTTO NASCE ALLA CONSEGNA, con quello che l'ordine sa gia' —
      nome, prezzo, IVA della riga — e CON LO STESSO id della riga d'ordine:
      cosi' l'ordine continua a puntare a un prodotto vero, e una seconda
      consegna della stessa referenza ritrova quello di prima invece di farne
      un doppione. Passa dalla stessa strada di ogni altra merce che entra
      (`registraAcquisto` in api.js, REQ-MAG-030), quindi alza la giacenza,
      scrive il movimento «ordine fornitore» e la riga di listino di quel
      fornitore col prezzo e la sua data. La forma del prodotto la compone
      `prodottoDaRigaOrdine` (src/lib/inventory.js), che e' logica pura e si
      prova senza database.
      SI SCRIVE UN DOCUMENTO INTERO, NON UNA PATCH: `increment()` non ha
      niente da incrementare su un documento che non esiste, e `updateDoc`
      su un id che non c'e' fallisce. Il prodotto nasce con la merce gia'
      dentro, in una scrittura sola.
      IL NOME NON E' QUELLO DEL TRAVASO, ed e' la trappola che REQ-MAG-025
      segnalava. In magazzino esiste gia' una lista «da sistemare»: sono i
      prodotti che il passaggio alla gestione a pezzi (REQ-MAG-018) non sa
      convertire da solo, e finche' ce n'e' uno il magazzino INTERO resta in
      sola lettura. Qui non c'e' niente di bloccato e niente da convertire:
      c'e' una scheda nata a meta', che si compila con calma mentre il locale
      lavora. Le due situazioni NON sono la stessa, e due liste omonime sulla
      stessa schermata sarebbero due significati per una parola sola — si
      pagherebbero il giorno in cui qualcuno legge «da sistemare» e ferma un
      turno per niente. Questo stato ha quindi un nome suo: SCHEDA DA
      COMPLETARE (`scheda_da_completare` sul prodotto), e non blocca nessuno.
      LA CONFEZIONE NON SI SCRIVE, e non e' una dimenticanza. La riga
      d'ordine porta un `package_size` ma non dice di che misura sia quel
      contenuto: scriverlo senza `content_unit` farebbe rispondere
      `motivoNonMigrabile` — «c'e' scritto che un pezzo contiene 700, ma non
      di che misura» — e da quel momento IL MAGAZZINO INTERO andrebbe in sola
      lettura per colpa di un prodotto appena nato, col locale aperto. Il
      prodotto nasce quindi contato a pezzi e basta, che e' esattamente
      quello che l'ordine sa: sei confezioni sono sei pezzi.
      DOVE SI VEDE, ED E' L'ALTRO LATO DELLO STESSO BUCO. Un prodotto senza
      categoria non ha macro d'acquisto, quindi la sua spesa non compare in
      «Bilancio → Acquisti x Fatturato» (REQ-MAG-022): sparisce dai conti
      invece di risultare sbagliata, che e' peggio. Sta percio' accanto alle
      CATEGORIE SENZA MACRO (REQ-UI-022), in Magazzino → Macro-categorie,
      perche' e' la stessa mancanza vista dall'altro lato e si guardano nello
      stesso momento. Nella lista dei prodotti il segno e' una matita accanto
      al nome, come la coroncina del premium; aperto, il prodotto dice cosa
      manca — la categoria, quanto contiene un pezzo, la soglia di riordino —
      in ambra, che vuol dire lavoro che manca (il rosso, in questa app, vuol
      dire annullato: DESIGN.md).
      LA SCHEDA SI CHIUDE CON LA CATEGORIA, non col semplice fatto di averla
      aperta. Bastasse un salvataggio qualunque, il segno sparirebbe dal
      prodotto guardato per un secondo e la spesa continuerebbe a non
      comparire nei conti senza piu' niente che lo dica. Le altre due cose
      che mancano si leggono nella scheda e non tolgono soldi a nessun
      totale.
      L'IVA D'ACQUISTO eredita quella della riga d'ordine, e il default (22%)
      dove la riga non la dice: l'ordine porta il prezzo, non l'aliquota
      (REQ-MAG-025 punto 3). IL FORNITORE NON SI SCRIVE SUL PRODOTTO: da
      REQ-MAG-029 quel legame vive nel listino, perche' un prodotto puo'
      averne piu' d'uno, ed e' la riga di listino a nascere insieme al
      prodotto.
      «CARICA TUTTI», E RIGA PER RIGA. La finestra della consegna adesso ha
      una spunta per riga: il fornitore consegna quello che ha, non quello
      che e' stato ordinato, e le due casse su tre arrivate si caricano
      mentre la terza resta «richiesta» e si carichera' quando arriva. SI
      PARTE CON TUTTO SPUNTATO, perche' la consegna intera e' il caso normale
      e chi non tocca niente carica quello che ha ordinato; il tasto dice
      sempre quante righe sta per caricare e se sono tutte — «Carica tutti
      (3)» oppure «Carica i selezionati (2)» — cosi' il gesto non si fa alla
      cieca, e con una riga sola non cambia niente rispetto a prima. C'e' un
      «Spunta tutte / Togli tutte le spunte» per non spuntarle a una a una.
      Passa dalla stessa strada del carico singolo (`consegnaRigheOrdine` con
      i suoi `indici`, REQ-MAG-029): non c'e' nessuna seconda funzione.
      Le righe gia' consegnate non compaiono piu' nella finestra: di li' si
      carica, non si ricarica — la stessa regola delle righe gia' in archivio
      di una fattura (REQ-MAG-030).
      L'ASSORTIMENTO PRE-IMPOSTATO si segna quando l'ordine si compone, con
      una casella sulla riga («In assortimento quando arriva»), e si applica
      AL CARICO: metterlo in assortimento mentre la merce viaggia vorrebbe
      dire offrire in carta una bottiglia che non c'e'. Sul dato e' un campo
      `status_target` sulla riga d'ordine — generico apposta, perche' e' uno
      stato commerciale e non un si'/no: il giorno in cui serviranno anche
      «in linea» o «premium» cambia la sola casella. «In assortimento» NON
      cambia significato: resta lo stato commerciale di REQ-MAG-007, come
      REQ-MAG-029 dice a chiare lettere. Qui si programma quel cambio e lo si
      applica al momento giusto, e basta.
      DECISO IN IMPLEMENTAZIONE, e non stava nel testo: (1) la casella
      dell'assortimento si chiede SOLO dove cambia qualcosa — su un prodotto
      gia' in assortimento sarebbe una casella che non fa niente, e su un
      premium spuntata per sbaglio sarebbe una retrocessione silenziosa;
      (2) il campo si scrive sulla riga solo dove e' stato chiesto, per non
      seminare un dato in piu' su ogni riga di ogni ordine; (3) il
      pre-impostato oggi si sceglie solo in COMPOSIZIONE, non su un ordine
      gia' mandato: modificare le righe di un ordine salvato e' un gesto che
      non esiste ancora, e inventarlo qui vorrebbe dire un secondo scrittore
      su un documento che consegna e pagamento gia' scrivono dal banco.
      RESTA APERTO, ed e' una domanda per chi decide: il pre-impostato serve
      soprattutto a far RIENTRARE un prodotto «fuori assortimento», ma oggi
      quei prodotti non compaiono nel catalogo ordinabile («non si
      ricompra», REQ-MAG-007), quindi quel caso non si puo' ancora
      raggiungere. La casella e' pronta e il campo pure; se si decide che un
      «out» si puo' riordinare, e' una riga di filtro.
      DOVE VA LA CESOIA, se si decidera' di separare l'arrivo dal carico
      (REQ-MAG-025 punti 3 e 4, che contraddicono la registrazione di Flavio
      del 26/08 su cui e' costruito il flusso di oggi): il taglio sta in
      `consegnaRigheOrdine` (api.js), che oggi fa due cose in fila — segna la
      riga e chiama `registraAcquisto`. Si spezza in due funzioni che
      scrivono le righe con lo stesso `scriviRigheOrdine`, si aggiunge un
      livello «arrivato» fra «richiesto» e «consegnato» in `LIVELLI`
      (src/lib/listini.js), e la finestra della consegna — che gia' sceglie
      le righe — diventa la finestra del carico. Il resto non si muove: il
      prodotto che nasce, il listino, il movimento e il pre-impostato stanno
      tutti dentro `registraAcquisto`, cioe' dalla parte del carico.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-038): i tre livelli
      richiesto/consegnato/pagato NON SPARISCONO — si spostano dalla RIGA
      all'ORDINE, ed e' li' che vanno letti. Con un ordine per fornitore non
      serve piu' distinguere consegne diverse dentro lo stesso documento,
      quindi il livello per riga perde il suo mestiere; ma i tre nomi sono di
      Flavio e restano i suoi, sul documento. Cade la consegna per FETTA, non
      la scala dei livelli. Il carico avviene al passaggio a
      ORDINE RICEVUTO, sulle quantita' RICEVUTE.
      RESTA VALIDO E NON SI TOCCA il pezzo che questa voce ha di suo: il
      prodotto che nasce quando il fornitore manda una referenza che in
      anagrafica non c'e', con la sua «scheda da completare» — quello e'
      indipendente da come e' fatto l'ordine, e continua a valere.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-037): L'ASSORTIMENTO
      PRE-IMPOSTATO NON C'E' PIU'. La casella «In assortimento quando arriva»
      e il campo `status_target` sulla riga d'ordine sono stati tolti, e non
      per semplificare: da REQ-MAG-037 «in assortimento» vuol dire «c'e' un
      ordine aperto», quindi la consegna è il momento in cui quello stato
      FINISCE. Una casella che chiede di accenderlo QUANDO ARRIVA chiederebbe
      di accendere uno stato nell'istante esatto in cui va spento. Al carico,
      adesso, `registraAcquisto` scrive la patch che fa USCIRE il prodotto
      dall'assortimento e gli restituisce lo stato di prima. Cade con la
      casella anche la domanda che restava aperta qui sopra (far rientrare un
      «out» col pre-impostato): un `out` si riordina dalla tabella di
      REQ-MAG-036, che è il modo in cui rientra.
    status: implemented
    generate_issue: true
    labels: [magazzino, fornitori, dati]
    priority: P2
    test_cases:
      - tests/unit/prodottoNuovoDaOrdine.test.js
      - tests/component/CaricoOrdine.test.jsx
      - tests/component/InventoryManager.test.jsx

  - id: REQ-MAG-031
    title: "La fattura si aggancia alla FETTA di fornitore dentro l'ordine"
    area: "src/lib/fatture.js, src/lib/api.js, src/components/PurchaseOrdersPanel.jsx, src/components/SupplierInvoicesPanel.jsx"
    description: >
      Ritagliato da REQ-MAG-025, che resta da fare per il resto: qui c'e' il
      solo LEGAME, che l'utente ha precisato il 20/08 con parole sue.
      «La vista degli ordini contiene piu' fornitori, ma la fattura e'
      collegata all'ordine PER IL FORNITORE, perche' e' il fornitore che
      rilascia la fattura».
      QUINDI IL LEGAME NON E' FATTURA-ORDINE, E' FATTURA-FETTA: la fetta di
      quel fornitore dentro l'ordine, la stessa che il filtro gia' mostra
      (REQ-MAG-029). Un ordine con tre fornitori ha fino a tre fatture,
      ognuna agganciata alla sua fetta.
      PERCHE' SERVE, ed e' la ragione per cui l'utente l'ha chiesto: «sono le
      due cose che a fine mese fanno tornare o non tornare i conti con il
      commercialista». Le due cose sono i due buchi — una fetta CONSEGNATA
      MA SENZA FATTURA (la merce e' arrivata, il documento no) e una FATTURA
      SENZA FETTA (il documento c'e', l'ordine no) — e vanno visti a colpo
      d'occhio, non cercati.
      DOVE VIVE IL DATO: `order_id` sulla FATTURA, e basta quello. Il
      fornitore la fattura ce l'ha gia' (`supplier_id`), e la coppia dei due
      E' la fetta — la stessa chiave con cui `fetteFornitore` la ritaglia.
      Su un campo solo, «una fattura sta su al massimo una fetta» e' vero per
      costruzione: non c'e' nessun posto dove scriverne una seconda.
      SULL'ORDINE NON SI SCRIVE NIENTE, ed e' deliberato: l'ordine lo
      scrivono la consegna e il pagamento, gesti che partono dal banco, e un
      secondo scrittore su quel documento vuol dire due terminali che si
      sovrascrivono le righe per aggiungere un riferimento che sta comodo
      dall'altra parte.
      IL VERSO OPPOSTO — una fetta, al massimo una fattura — nessun campo lo
      garantisce da solo, e lo tiene `aggancioAmmesso` (src/lib/fatture.js):
      la stessa funzione filtra gli elenchi delle candidate E sta davanti
      alla scrittura in api.js, cosi' le due cose non possono divergere. Le
      schermate aperte sono due e i terminali del locale pure: una fetta
      coperta da un altro terminale un minuto fa non si vede.
      IL FORNITORE FA DA GUARDIA: si aggancia solo un documento DELLO STESSO
      FORNITORE della fetta, e il modo di impedirlo e' non farlo comparire
      nell'elenco — non spiegarlo dopo con un errore. Agganciare la fattura
      di Nova alla fetta di Enofel non e' un errore di battitura: e' merce
      pagata a chi non l'ha venduta.
      SI AGGANCIA E SI SGANCIA DAI DUE LATI. Dalla fetta (Fornitori ->
      Ordini) si sceglie il documento di quel fornitore; dal documento
      (Fornitori -> Scadenzario) si sceglie l'ordine, e si legge a quale
      fetta si riferisce — data, articoli, netto della sola fetta. Staccare
      e' lo stesso gesto al contrario (`order_id` a null) ed e' un gesto che
      si vede: il campo e' uno solo, e riscriverlo di nascosto lascerebbe
      scoperta la fetta di prima senza che nessuno l'abbia deciso.
      I DUE BUCHI, DOVE SI VEDONO. Negli Ordini, una fetta consegnata e
      senza documento porta la scritta «manca la fattura» e in testa allo
      storico c'e' quante sono; nello Scadenzario, un documento senza ordine
      porta «senza ordine» e il chip «Senza ordine (n)» tiene solo quelli.
      L'ambra e non il rosso: non e' un errore, e' lavoro che manca — in
      questa app il rosso vuol dire annullato (DESIGN.md).
      «RIPRENDI LE RIGHE DA UN ORDINE» E L'AGGANCIO SONO STATI UNITI, ed e'
      una decisione presa in implementazione. Erano due gesti: si copiavano
      le righe (REQ-MAG-030, aiuto di compilazione) e il legame restava non
      scritto proprio nell'istante in cui uno l'aveva appena dimostrato —
      «questa fattura e' di quest'ordine» — e a fine mese quella fetta
      risultava scoperta. Adesso scegliere l'ordine copia le righe E aggancia
      il documento, in UNA scrittura sola (due scritture, e una delle due puo'
      restare indietro). Chi vuole il legame senza le righe ha «Collega a un
      ordine» sulla riga del documento; chi vuole le righe senza il legame
      cerca i prodotti per nome, come per un documento qualsiasi.
      CADUTA LA CONDIZIONE «SOLO ORDINI GIA' CONSEGNATI» che filtrava gli
      ordini riprendibili: una proforma arriva anche prima della merce, e
      allora quelle righe sono proprio quelle da copiare. La fetta ancora
      «richiesta» si collega, ma non conta come buco: li' non e' arrivato
      niente, e segnalarla insegnerebbe a ignorare il segnale.
      NON C'E' DENTRO L'ALLEGATO DEL DOCUMENTO (foto/PDF), che REQ-MAG-025
      cita nello stesso punto: serve lo Storage e non sono decisi ne' peso
      ne' formati. Resta li'.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-037/038): con un ordine per
      fornitore la FETTA non esiste piu' come cosa a se', perche' l'ordine ha
      gia' un fornitore solo. Il legame diventa quindi FATTURA-ORDINE, che e'
      la forma semplice di quello che questa voce descrive. Restano validi e
      vanno riusati: la guardia che vieta di agganciare la fattura di un
      fornitore a un ordine di un altro, l'uno-a-uno impedito per costruzione,
      e i due buchi che si vedono a colpo d'occhio — ordine senza fattura e
      fattura senza ordine.
      E IL GANCIO DIVENTA PORTANTE: senza fattura collegata un ordine non sa
      se e' stato pagato, perche' «pagato» e' una domanda alla fattura e non
      un dato dell'ordine (REQ-MAG-038). Da qui due conseguenze su questa
      voce. La prima: «SULL'ORDINE NON SI SCRIVE NIENTE» vale ancora per i
      DATI — il legame resta su `order_id`, un campo solo, sulla fattura — ma
      NON piu' per il diario: collegare, scollegare e generare un documento
      lasciano una riga nella `storia` dell'ordine, e il rischio dei due
      scrittori si accetta perche' cio' che si perderebbe e' una riga di
      diario, non un numero. La seconda: un ordine senza documento non e'
      «da pagare», e' un ordine di cui non si sa niente — e va detto cosi',
      invece di darlo per non pagato.
