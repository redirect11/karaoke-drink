  - id: REQ-ORD-020
    title: "Servizio o ritiro: il locale dice come nascono i conti, lo staff cambia il suo"
    area: "src/lib/consegna.js, src/components/SettingsTab.jsx, src/components/OrderPosDetail.jsx, src/components/OrderSummary.jsx, src/lib/coda.js, src/lib/api.js"
    description: >
      Un conto è servito al tavolo o ritirato al banco. Chi decide, in
      ordine: il LOCALE dice come NASCONO i conti — non quali modi
      esistono; il CLIENTE sceglie il suo, ma solo se glielo si lascia
      scegliere e solo se ordina da sé; lo STAFF può sempre cambiare quello
      che ha in mano. La scelta sta sul CONTO (`order.service_mode`), non
      sul terminale e non sul locale: due conti battuti dallo stesso tablet
      possono essere uno servito e uno da ritirare, ed è tutto il punto.
      Prima l'impostazione era un VINCOLO: finiva sull'ordine alla
      creazione e non c'era nessun posto in cui cambiarla.

      I DUE MONDI (Impostazioni → Consegna ordine): «Solo servizio» (il
      ritiro non esiste) oppure «Ritiro e servizio» (convivono, ed è il
      caso normale di un bar). Non esiste un mondo «solo ritiro»: quel
      vecchio valore non descriveva un locale, descriveva un DEFAULT — un
      posto che fa solo asporto non ha bisogno che l'app gli vieti il
      servizio, ha bisogno che i conti nascano «ritiro». Dentro il secondo
      mondo ci sono «come nascono i conti» (`consegna_default`) e «lo
      sceglie il cliente» (`cliente_sceglie_consegna`), quest'ultima spenta
      col motivo e il rimando quando i clienti non ordinano (menu_only): la
      voce parla di CHI sceglie, e senza ordinazioni non c'è nessuno a cui
      chiederlo. I vecchi valori si leggono ancora senza migrazioni — la
      traduzione sta in lib/consegna.js, in un posto solo.

      SUL CONTO si cambia da «Dati conto», dove ci sono già nome, tavolo e
      note. E CAMBIA I SOLDI: il ritiro azzera coperto e costo di servizio,
      il servizio li rimette coi valori del locale (supplementiPerModo). Tre
      casi (cambioModoPermesso): conto aperto e nessun incasso → si cambia
      e i supplementi si rifanno; conto con un ACCONTO → il modo si cambia
      ma i supplementi NON si toccano, perché erano stati calcolati sul
      totale su cui si è già incassato e muoverlo sotto un acconto è come
      cambiare il prezzo dopo aver preso i soldi (per quello c'è «Riapri
      conto», che lascia traccia); conto chiuso o annullato → non si tocca
      niente. Quello che succede ai soldi si legge PRIMA di premere.

      IN CODA, la colonna del PRONTO tiene due lavori diversi: roba da
      portare a un tavolo e roba che aspetta il cliente al bancone. Di suo
      resta una colonna sola col badge sulla card («Servizio» /
      «Ritiro»); si divide in «Da servire» e «Da ritirare», ed è una
      scelta del TERMINALE — il tablet della sala e quello del banco non
      guardano lo stesso lavoro. La colonna dei serviti NON si divide: lì
      il drink è già uscito e come sia uscito non cambia più niente da
      fare — è il traguardo, non una destinazione.

      COME SI CHIAMANO QUELLE DUE COLONNE — DECISO IL 20/08/2026. Parole
      dell'utente: «Anche la label sopra la lane, non deve essere Pronto
      ma Da servire/Ritirare. [...] se il ritiro non è attivo diventano
      solo Da servire e Serviti (sia filtri che label lane)».
      QUELLO CHE C'ERA PRIMA È SUPERATO: la colonna si chiamava «Pronto»
      (e quella dopo «Ritirato / Servito»), com'è ancora l'etichetta di
      stato al banco. Ma una colonna non dice a che punto è il drink: dice
      CHE LAVORO C'È LÌ DENTRO, e il lavoro è portarlo o consegnarlo.
      «Pronto» è pronto per qualcuno — e chi guarda la lavagna cerca il
      PROPRIO lavoro, non lo stato altrui.
      COL RITIRO ATTIVO sono «Da servire/Ritirare» e «Serviti/Ritirati»;
      col mondo «Solo servizio» diventano «Da servire» e «Serviti», che
      «/Ritirare» nominerebbe una cosa che in quel bar non succede.
      REQ-UI-021 NON CADE: una parola sola per passo resta vera nei posti
      che parlano dello STATO — la pastiglia sulla card, il tasto che fa
      avanzare, la tabella del servizio dentro il conto dicono tutti
      «Pronto». La colonna è l'unica deroga, ed è motivata.
      UN POSTO SOLO PER I DUE NOMI: `nomiDelServizio(ritiroEsiste)` in
      lib/coda.js. Da lì li prendono i titoli delle corsie, i chip delle
      colonne nella fila dei filtri e le due porzioni del tasto dei chiusi
      in griglia (REQ-CODA-009) — sono la stessa domanda in due viste, e
      due nomi diversi convincerebbero chi guarda di star guardando due
      cose diverse. Anche il gruppo col ✂️ segue: da unito il chip dice
      «Da servire/Ritirare ✂️», diviso «Da servire | Da ritirare 🔗».

      DOVE STA IL COMANDO CHE DIVIDE — RIVISTO IL 20/08/2026. Parole
      dell'utente: «Dividi il pronto dobbiamo integrarlo meglio con gli
      altri due bottoni, in qualche modo non si capisce a che serve. E poi
      è troppo lungo. Non so, troviamo una soluzione migliore». E, subito
      dopo: «ovviamente vale solo se è attivo il ritiro al banco».
      QUELLO CHE C'ERA PRIMA È SUPERATO: era un chip a sé in fondo alla
      fila dei filtri, «✂️ Dividi il pronto» (prima ancora stava dietro
      un «▦ Colonne», che non esiste più — REQ-CODA-009).
      PERCHÉ NON SI CAPIVA. In quella fila ogni chip ACCENDE O SPEGNE la
      sua colonna; quello lì cambiava il MODO in cui una colonna è fatta.
      Stesso vestito, due mestieri diversi, e per giunta lontano dalla
      colonna di cui parlava: l'unico modo di capirlo era premerlo e
      guardare cosa succedeva a mezzo schermo di distanza. La frase intera
      sul chip era la conseguenza, non la causa: serviva a spiegare un
      tasto che stava nel posto sbagliato.
      ADESSO STA DOVE AGISCE. Il comando è un TASTINO APPESO AL CHIP DELLA
      COLONNA, dentro lo stesso gruppo (`.chip-gruppo`, DESIGN.md): da
      unito si legge «Da servire/Ritirare ✂️», e premendolo — NELLO
      STESSO POSTO — al suo posto compaiono i due chip «Da servire» e «Da ritirare»,
      attaccati fra loro e col loro tastino per riunirli. L'interruttore
      sta dove sta la cosa che cambia, e l'effetto si vede lì: niente frase
      da leggere, niente chip orfano in fondo alla fila.
      IL SEGNO DICE COSA FA, NON COM'È MESSO: ✂️ da unito, 🔗 da
      diviso. Un ✂️ «acceso» direbbe comunque «taglia» mentre l'unica
      cosa che può fare è ricucire — e da lontano, sulla lavagna, si legge
      il segno, non il colore. Com'è messo adesso lo dicono i chip accanto,
      che è tutto il punto di averlo messo lì.
      È UN BOTTONE SUO, non un'icona cliccabile dentro il chip della
      colonna: accendere una colonna e dividerla sono due cose diverse, e
      da tastiera o con lo screen reader si devono poter distinguere. Ha il
      suo `aria-label` per esteso («Dividi «Da servire/Ritirare» in «Da
      servire» e «Da ritirare»» / «Riunisci …»); il gruppo unisce gli
      occhi, non i mestieri.
      SOLO COL RITIRO ATTIVO, ed è una decisione esplicita dell'utente e
      non una deduzione: «ovviamente vale solo se è attivo il ritiro al
      banco» (20/08/2026). Col mondo «Solo servizio» il tastino non c'è
      affatto — né ✂️ né 🔗 — e il chip della colonna (lì «Da servire»)
      resta da solo,
      senza gruppo attorno: non c'è niente da separare, e un tasto che non
      fa niente è peggio di un tasto che non c'è (`ritiroEsiste`).
      COME SI RAGGRUPPANO i chip lo dice una funzione pura, `gruppiColonne`
      in lib/coda.js: la pagina la chiama e disegna. La scelta resta del
      terminale e si ricorda (`ricordaProntoDiviso`), come prima.

      ANCHE LA FRASE DELL'ANNULLO segue il mondo: «Prego recarsi al
      bancone» ha senso solo dove il ritiro esiste, e con «solo servizio»
      manderebbe una persona a un bancone dove nessuno la aspetta. In
      Impostazioni la voce si spegne col motivo e il rimando (non sparisce:
      sparire fa dubitare di averla immaginata) e quella evidenziata è
      quella che si applica DAVVERO (fraseAnnulloDefault), non
      l'impostazione impossibile rimasta scritta. Nel dialogo di annullo,
      dove c'è il cliente davanti, quella frase non si propone affatto.
    status: implemented
    generate_issue: false
    labels: [ordini, pos, impostazioni]
    test_cases:
      - tests/unit/consegna.test.js
      - tests/unit/coda.test.js
      - tests/component/OrderPosDetail.test.jsx
      - tests/component/CodaCorsie.test.jsx

  - id: REQ-ORD-009
    title: "Un ordine battuto altrove si vede su tutti gli altri terminali"
    area: "src/lib/dispositivo.js, src/pages/BartenderPage.jsx, src/lib/notifyStore.js"
    description: >
      Chi manda un ordine — o lo annulla — non ha bisogno di un avviso che
      gli dica quello che ha appena fatto; tutti gli altri terminali sì.
      Vale anche per l'ANNULLAMENTO, che porta con sé il terminale
      (`cancelled_device`): chi annulla lo fa quasi sempre dal conto e non
      dalla coda, quindi «l'ho premuto io» non basterebbe — quella
      schermata è un'altra. Il metro è il
      DISPOSITIVO, non il ruolo: prima si tacevano tutti gli ordini battuti da
      un gestore su qualunque terminale, e chi stava in sala col telefono non
      sapeva mai che al banco era entrato un ordine — lo stesso account sta su
      tablet, telefono e portatile insieme. Ogni ordine porta l'identificativo
      del dispositivo che l'ha creato (un numero a caso per browser, non
      identifica una persona); gli ordini che non ce l'hanno avvisano, perché
      un avviso in più si chiude e uno in meno è un drink che non parte.
      Le notifiche della campanella si dividono in DA LEGGERE e lette: una
      letta sparisce dall'elenco — in mezz'ora di servizio un elenco che non
      si svuota mai diventa un muro di righe vecchie, e non ci si guarda più —
      e resta nello STORICO, che si apre dalla campanella. Aprire la
      campanella non è leggere: si segna leggendo, toccando la notifica,
      oppure con «segna tutte lette», che è una decisione.
      OGNI AVVISO SI PUÒ SPEGNERE, uno per uno: nuovo ordine, ciascuno stato
      della preparazione separatamente, le scorte (in esaurimento ed esaurita,
      solo per chi tiene il gestionale) e la nuova versione dell'app. La scelta
      è PER DISPOSITIVO E PER PERSONA e resta in memoria locale, perché non è
      una regola del bar: al banco «nuovo ordine» è la cosa più importante
      della serata, in sala serve «pronto», e sul portatile nel retro non serve
      niente. Un interruttore unico si spegnerebbe dove dà fastidio lasciando
      senza chi ne aveva bisogno; e due persone che si passano lo stesso tablet
      nei cambi turno non si sovrascrivono a vicenda. Di partenza sono tutti
      accesi: nessuno deve scoprire di essersi perso un ordine perché «era
      spento di default».
      UN FATTO, UN AVVISO. Di un conto la coda dice una cosa sola per volta:
      «è arrivato» quando non l'ha mai visto, «è cambiato» quando cambia
      passo, «è tornato in coda» quando qualcuno lo ripristina dopo un
      annullo. Il conto già visto non torna mai a essere nuovo — nemmeno se
      nel frattempo era sparito dalla vista — e chi ha premuto «Ripristina»
      non se lo sente ripetere, come già per chi annulla
      (`ripristinato_device`, stesso metro di `cancelled_device`).
      LE PAROLE DI UN AVVISO STANNO IN UN POSTO SOLO (src/lib/orderStatus.js):
      un avviso annuncia un FATTO e non porta il nome della colonna in cui il
      conto atterra. L'annuncio di un ordine nuovo lo scrivono tre posti che
      non possono importarsi a vicenda — la coda, la push del server e il
      service worker — e il titolo dev'essere IDENTICO nei tre, perché la
      notifica dell'app e quella del server portano lo stesso `tag` e il
      sistema le fonde in una.
    status: implemented
    generate_issue: false
    labels: [ordini, notifiche]
    test_cases: [tests/unit/dispositivo.test.js, tests/unit/notifyStore.test.js, tests/unit/preferenzeNotifiche.test.js, tests/component/AvvisiRipristino.test.jsx, tests/unit/paroleDegliAvvisi.test.js]

