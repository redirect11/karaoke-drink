  - id: REQ-MAG-028
    title: "«Fornitori» è una sezione sua: anagrafica, ordini e scadenzario"
    area: "src/components/FornitoriTab.jsx, src/lib/sezioni.js, src/components/InventoryManager.jsx, src/pages/BartenderPage.jsx"
    description: >
      Chiesto dall'utente il 26/08/2026, parole sue: «Dobbiamo spostare
      Fornitori come sezione a parte, e sotto Fornitori andrà la
      sottosezione Gestione Fornitori, lo Scadenzario e Ordini (che
      attualmente è sottosezione di magazzino)».
      PERCHÉ NON STAVANO BENE NEL MAGAZZINO. Il magazzino risponde a «cosa
      ho sullo scaffale»; queste tre rispondono a «con chi lavoro e quanto
      gli devo». Erano tre sottosezioni sparse fra prodotti e categorie, e
      non si parlavano: si ordinava di là, si segnava la fattura di qua, e
      quale fattura pagasse quale ordine non lo sapeva nessuno — è la stessa
      osservazione da cui nasce REQ-MAG-025, che questa voce ANTICIPA in
      parte (la pagina loro, e il ruolo che la vede) senza toccarne il cuore
      (il legame fattura-ordine e il giro d'ordini, ancora da fare).
      LE TRE SOTTOSEZIONI, in quest'ordine: «🏭 Gestione fornitori»
      (l'anagrafica: era la sottosezione `fornitori` del magazzino), «🛒
      Ordini» e «📄 Scadenzario». Si apre sull'anagrafica, che è il posto da
      cui si parte quando si entra qui senza un motivo preciso.
      NEL MAGAZZINO RESTANO Prodotti, Conta, Categorie, Macro-categorie e
      Movimenti (vedi REQ-MAG-010).
      IL MECCANISMO È QUELLO CHE C'È GIÀ: `lib/sottosezioni.js`, come Cassa,
      Magazzino, Impostazioni e Statistiche — le voci vanno nel menu a
      scomparsa, rientrate sotto la pagina aperta (docs/navigazione.md).
      FornitoriTab.jsx è scritto sul modello di CassaTab: un elenco `SEZIONI`
      e un ramo per voce. Aggiungerne una costa una voce e un ramo.
      SOLO ADMIN, e non è una stretta nuova: è la decisione già a verbale in
      REQ-MAG-025 («visibile SOLO all'ADMIN: sono i soldi che escono dal
      locale, e non è roba da turno»). Finché stavano dentro il magazzino le
      vedeva ogni gestore, ma per contiguità, non per una scelta. Il ruolo
      si confronta con `ruoli.js` (`isAdmin`), come per Bilancio, e la voce
      si TOGLIE dal menu invece di aprirsi per dire «non puoi»; anche
      l'indirizzo battuto a mano (`?tab=fornitori`) è filtrato, da
      `sezioneConsentita`.
      COSA NON PERDE CHI STA AL BANCO: un fornitore nuovo si crea ancora
      dalla tendina del modulo prodotto, nel magazzino, senza passare da
      qui. È la strada che si usa davvero quando si inventaria una
      referenza nuova.
      NIENTE COLLEGAMENTI ROTTI: le sottosezioni non erano indirizzabili
      (nessun `?sezione=` per il magazzino, lo stato è del componente),
      quindi non c'era nessun vecchio indirizzo da rimappare in
      `VECCHI_INDIRIZZI`. `?tab=inventario` continua ad aprire il magazzino,
      che esiste ancora.
      LO SCADENZARIO RESTA UNA FUNZIONE PREMIUM (REQ-LIC-001): dove il
      modulo non lavora la sua voce non c'è, e la sezione non resta né vuota
      né monca perché le altre due ci sono sempre. La sottosezione aperta si
      ricava dall'elenco filtrato: se il modulo si spegne da un altro
      terminale mentre lo si guarda, si torna all'anagrafica.
