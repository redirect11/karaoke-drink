  - id: REQ-CASSA-007
    title: "Il flusso cassa serve DURANTE la serata, non solo alla chiusura"
    area: "src/lib/cassa.js, src/components/CashFlow.jsx"
    description: >
      Alla chiusura i numeri sono un verdetto; durante il servizio sono
      decisioni. La schermata dice, in tempo reale:
      quanto deve esserci in cassa ADESSO (fondo più i contanti incassati) —
      prima si sapeva solo alla chiusura, e serve al cambio turno o quando
      due numeri non tornano;
      il conto medio, con quanti conti e quanti coperti, e quanto lascia una
      persona — in un cocktail bar un tavolo da sei e uno da due fanno due
      serate diverse con lo stesso «conto medio»;
      chi ha incassato e quanto, perché in una serata si alternano in due o
      tre alla cassa e se il contante non torna è la prima domanda che ci si
      fa (l'elenco compare solo se sono stati in più di uno);
      com'è andata l'ultima ora, non solo la curva della serata: dice come
      sta andando adesso, se aprire un'altra cassa o mandare qualcuno in
      pausa.
      Chi ha incassato è scritto sul pagamento; sui conti battuti prima non
      c'è e si ripiega su chi ha aperto il conto — meglio un nome vicino al
      vero che una riga «sconosciuto».
    status: implemented
    generate_issue: false
    labels: [cassa]
    test_cases: [tests/unit/cassa.test.js]

  - id: REQ-CASSA-008
    title: "La cassa si apre e si chiude dalla coda, ed è cosa del banco"
    area: "src/components/ApriCassaBox.jsx, src/pages/BartenderPage.jsx"
    description: >
      Aprire e chiudere la cassa sono le due cose che si fanno a inizio e
      fine serata, e si fanno dalla schermata in cui si sta già: nel menu ⋯
      della coda c'è «Apri cassa» quando è chiusa e «Chiudi cassa» quando è
      aperta. SONO DEL BANCO: alla sala non compaiono affatto — né nel menu
      né come tasto sul banner della cassa chiusa, dove legge che la deve
      aprire il banco. Un tasto che risponde «non puoi» è peggio di un tasto
      che non c'è. Andarle a cercare nel flusso di cassa vuol dire uscire dalla
      coda proprio mentre la si sta guardando.
      «Chiudi cassa» è spento per DUE motivi, e lo dice in una riga sola.
      Il primo è di sempre: finché ci sono conti aperti — un conto aperto è
      un incasso che manca, e chiudere così vorrebbe dire far quadrare una
      serata con dentro un buco. Il secondo è arrivato con gli stati del
      servizio: finché ci sono COMANDE ancora da servire. Un conto può
      essere già incassato e avere drink al banco — si paga in anticipo
      tutte le sere — quindi «zero conti aperti» non vuol più dire «niente
      in ballo», e chiudere lì vorrebbe dire mandare a casa la serata con
      dei drink pagati e mai usciti. Il conteggio dei ticket lo fa
      comandeDaServire (coda.js): non serviti, non annullati, dei conti che
      esistono ancora — e vale solo con gli stati del servizio accesi,
