  - id: REQ-CASSA-011
    title: "Bilancio → Mesi: minimo, incassato e differenza, giorno per giorno"
    area: "src/components/BilancioTab.jsx (nuovo), src/lib/stats.js, src/lib/paghe.js, src/lib/ore.js"
    description: >
      DECISO (19/08, dall'utente che riporta Flavio). È la versione navigabile
      dei fogli mensili di ANALISI DATI (com'erano fatti sta scritto per
      intero in REQ-STAFF-015). Si sceglie il mese; la tabella è divisa per
      SETTIMANE come il foglio, e ogni giorno porta tre numeri: MINIMO
      (quanto doveva fare), INCASSATO (quanto ha fatto), DIFFERENZA.
      SOTTO, I TOTALI DEL MESE: incassi, stipendi, spese, netto = incassi −
      spese − stipendi. Come nel foglio, con una differenza che pesa: GLI
      STIPENDI SI CALCOLANO dalle ore già registrate nell'app (REQ-STAFF-006,
      ore × paga in vigore quel giorno), NON si ricopiano. Nel foglio quel
      numero viene battuto a mano da RAPP ORE, ed è già capitato che non
      torni: giugno 26, il foglio ore dà 3335 e ANALISI DATI dice 3500.
      DUE RIGHE DI SINTESI che nel foglio non c'erano: PRIME COST = costo del
      venduto + costo del lavoro, in percentuale sugli incassi; e COSTO DEL
      LAVORO %, il solo lavoro sugli incassi. Sono i due numeri con cui si
      capisce in mezzo secondo se il mese è andato.
      DA DOVE ARRIVANO GLI ALTRI PEZZI: il MINIMO dalla formula decisa lo
      stesso giorno (REQ-STAFF-015 — somma delle paghe di chi lavora quel
      giorno più un extra a mano); le SPESE da REQ-CASSA-012, e senza quelle
      il netto del mese non esiste; l'INCASSATO per GIORNATA COMMERCIALE
      (REQ-CASSA-005), così la nottata che finisce alle tre resta la serata
      di ieri e non fa saltare il giorno dopo.
      LE DIDASCALIE NON SONO UN ABBELLIMENTO: prime cost e costo del lavoro
      sono le due righe che questa tabella aggiunge al foglio, e sono anche
      le due che nessuno sa leggere senza che gliele si spieghi. Ognuna porta
      la sua frase, come vuole REQ-CASSA-010 — compresa quella che dice che
      la merce è quella calcolata dalle ricette e non gli acquisti del mese.
      LA DIFFERENZA SI COLORA, MA NON DI ROSSO. In questa app il rosso vuol
      dire annullato o errore (DESIGN.md), e un giorno sotto il minimo non è
      né l'uno né l'altro: il verso lo dicono il segno e i colori di stato
      (--ok, --warn), che sono fuori tema apposta.
      QUALE COSTO DELLA MERCE ENTRA NELLA PRIME COST: quello CALCOLATO DALLE
      RICETTE, macro per macro (REQ-MAG-015) — deciso dall'utente il 19/08.
      Non gli ACQUISTI del mese, che è il numero dei fogli di Flavio: è
      l'unico dei due che sta in pari con l'incassato dello stesso mese, e
      finché REQ-MAG-021 non è risolto un mese di acquisti non somiglia
      nemmeno al mese in cui quella merce è stata venduta. Va scritto sotto
      la tabella, così chi confronta col foglio sa in partenza perché non
      torna. Gli acquisti del mese restano dove stanno — la tabella
      «Acquisti × Fatturato» (REQ-MAG-022) — e con la prime cost non
      c'entrano.
      DIPENDE DA REQ-CASSA-010 (la pagina), da REQ-CASSA-012 (senza le spese
      il netto del mese non esiste) e da REQ-STAFF-015 (senza il minimo
      restano due colonne su tre). Stipendi e costo del venduto invece ci
      sono già: REQ-STAFF-006 e REQ-MAG-015.
    status: todo
    generate_issue: true
    labels: [statistiche, serata, staff]
    priority: P2
    test_cases: []

  - id: REQ-CASSA-012
    title: "Le spese del mese si scrivono nell'app, non su un foglio a parte"
    area: "src/lib/api.js (collezione `spese`, nuova), src/components/BilancioTab.jsx (nuovo)"
    description: >
      DECISO (19/08, dall'utente che riporta Flavio). Nei fogli mensili le
      SPESE sono una riga sola, battuta a mano, e senza quel numero il netto
      del mese non esiste: incassi − spese − stipendi. Serve un posto
      nell'app dove inserirle, altrimenti la tabella «Mesi» (REQ-CASSA-011)
      arriva fino a metà strada e poi si torna al foglio.
      COM'È FATTA UNA SPESA: voci semplici — descrizione, importo, mese.
      Niente categorie, niente allegati, niente partita doppia: quello che
      c'è nel foglio e non di più. Il totale del mese finisce nella riga
      «spese» di Bilancio → Mesi.
      COSA NON SONO: non sono gli acquisti di merce, che vivono negli ordini
      fornitore e si contano da soli (REQ-MAG-022). Qui ci va quello che
      esce e non entra in magazzino.
      QUALI SIANO NON LO SAPPIAMO, e va detto invece di riempirlo di
      esempi: «affitto, SIAE, commercialista, utenze» era una LISTA
      INVENTATA da chi scriveva questa voce, non una frase di Flavio — lui
      di queste spese non ha mai parlato, e nei fogli non se ne trova
      traccia da nessuna parte (cercate per parola il 19/08 in tutti i
      file: niente affitto, niente SIAE, niente utenze).
      QUELLO CHE INVECE SI MISURA: fra gennaio e giugno 2026 le sue SPESE
      superano gli acquisti di 11.243 euro in tutto. Il foglio «TO BUY»
      (arredi e consumo, REQ-MAG-025) ne spiega 2.469: restano fuori quasi
      NOVEMILA EURO in sei mesi, che tornano tutti i mesi e crescono col
      volume. C'è dentro qualcosa di ricorrente che non è né merce né
      arredi, e nei fogli non è scritto da nessuna parte.
      DA CHIEDERE A FLAVIO, ed è la domanda che decide la forma di questa
      voce: cosa metti in quel numero? Le tiene da qualche altra parte (il
      commercialista, l'home banking) o le somma a mente? Se sono poche e
      ricorrenti bastano descrizione e importo; se sono tante e di natura
      diversa serve almeno un modo di raggrupparle, se no il totale del
      mese non si sa spiegare a chi lo guarda. Se le due cose si mescolano la merce viene contata due
      volte, e il netto del mese sbaglia in silenzio.
      ATTENZIONE, IL NUMERO DI FLAVIO NON SARÀ LO STESSO — misurato sui
      fogli il 19/08, e va saputo prima che qualcuno confronti i totali.
      La sua riga SPESE è più grande degli acquisti di quel mese, sempre:
      gen 2.380 contro 1.809 · apr 5.005 contro 2.884 · giu 12.726 contro
      8.673. Quindi nel foglio le spese CONTENGONO la merce, più altro (da
      570 a 4.050 € al mese, e la forbice cresce col volume).
      NELL'APP LE DUE COSE RESTANO SEPARATE, ed è giusto così: la merce
      arriva dalle fatture fornitore e si conta da sola, qui ci va solo il
      resto. Ma vuol dire che «spese» nell'app varrà MENO del suo numero, e
      va scritto in schermata — se no al primo confronto sembra che l'app
      sbagli, e si torna al foglio.
      IL NETTO DEL MESE si compone quindi di quattro pezzi, non di tre:
      incassi − stipendi (calcolati dalle ore) − fatture fornitore (dagli
      ordini ricevuti) − altre spese (queste, a mano).
      COSA C'È IN QUELL'«ALTRO», TROVATO (19/08). La cella SPESE del foglio
      mensile è un numero secco, senza dettaglio — ma il dettaglio esiste
      altrove: FORNITORI REC.xlsx, foglio «TO BUY». Dentro ci sono tavoli
      da esterno, sgabelli, divani, una tenda, uno scaffale IKEA e
      bicchieri di plastica, con quantità, prezzo, totale e DOVE si compra
      (Amazon, Bricoware, IKEA). Arredi, attrezzature e materiale di
      consumo: roba che esce dal conto e non entra in magazzino.
      DOVE VANNO NELL'APP, deciso dall'utente il 19/08: NON qui in Bilancio
      ma in «Ordini e fatture», come terza sottosezione accanto a Ordini e
      Fatture (REQ-MAG-025), con un riepilogo che tiene insieme i tre
      elenchi. È la scelta giusta: i soldi che escono si registrano tutti
      nello stesso posto, e Bilancio → Mesi ne legge il totale.
      QUESTA VOCE RESTA quindi come il PONTE: dice che il netto del mese ha
      quattro pezzi e che il totale delle altre spese arriva da lì, non che
      le spese si scrivono in Bilancio.
      DA DEFINIRE IN IMPLEMENTAZIONE: se una spesa che si ripete (l'affitto è
      lo stesso tutti i mesi) si possa riportare sul mese dopo invece di
      riscriverla. Non è stato chiesto: si guarda dopo aver visto quante
      spese si scrivono davvero in un mese.
      DIPENDE DA REQ-CASSA-010 per dove si scrivono e dove si sommano; la
      collezione e il modulo d'inserimento non aspettano nessun altro. È il
      primo pezzo da fare dei due che sbloccano REQ-CASSA-011.
      NON E' PRONTO DA LAVORARE, e l'utente l'ha detto chiaro il 19/08
      dopo aver visto cosa manca: «evidentemente non e' pronto per essere
      implementato». Rimesso in backlog lo stesso giorno in cui era stato
      portato in ready — la ragione e' che manca il DATO, non il disegno.
      COSA ASPETTA, in una riga: la risposta di Flavio su cosa mette in
      quel numero. Non e' un dettaglio di implementazione: e' la
      differenza fra una schermata con due campi e una che deve
      raggruppare voci di natura diversa, e sbagliarla vuol dire rifarla.
      COSA SI PUO' FARE INTANTO, senza aspettare nessuno: la sottosezione
      «Altre spese» in Ordini e fatture (REQ-MAG-025) e il riepilogo. La
      forma minima — descrizione, importo, data, comprato si o no — regge
      qualunque risposta arrivi; quello che cambia e' se serve un modo di
      raggruppare, e quello si aggiunge dopo.
      ⚠️ AGGIORNAMENTO 27/08/2026 (REQ-MAG-034): IL POSTO DOVE SI SCRIVONO
      C'È. «Altre spese» è la terza sottosezione di Fornitori, col riepilogo
      per mese accanto, esattamente dove questa voce diceva di metterle. La
      forma è quella minima che questa voce indicava — descrizione, importo,
      data, comprato sì o no — più le due colonne che il foglio «TO BUY» ha e
      che servono a ritrovare la stessa cosa: quantità e dove si compra.
      QUESTA VOCE RESTA APERTA, e per la ragione di sempre: manca il DATO,
      non il posto. La domanda a Flavio — cosa mette in quel numero — decide
      solo se serve un modo di RAGGRUPPARE le voci, e quello si aggiunge
      senza rifare niente. Nessuna categoria è stata inventata: i campi sono
      vuoti, senza esempi, apposta.
      QUELLO CHE RESTA DA FARE QUI È IL PONTE: Bilancio → Mesi deve leggere
      il totale delle altre spese del mese e sottrarlo nel netto, insieme
      agli stipendi e alle fatture fornitore. I numeri sono già calcolati e
      si prendono da `src/lib/spese.js` (`totaleSpeseDelMese`) e da
      `src/lib/riepilogoFornitori.js`: non c'è nessuna somma da riscrivere.
      LA COSA CHE QUESTA VOCE CHIEDEVA DI DIRE A SCHERMO È DETTA: che il
      numero dell'app vale MENO di quello dei fogli, perché lì le spese
      contengono anche la merce. Sta in testa al Riepilogo di Fornitori, dove
      i totali si confrontano.
    status: todo
    generate_issue: true
    labels: [statistiche, cassa]
    priority: P2
    test_cases: []

  - id: REQ-MENU-013
    title: "L'IVA di vendita si cambia sulla singola voce di menù"
    area: "src/components/MenuManager.jsx, src/lib/api.js, src/lib/macroStats.js, src/components/SettingsTab.jsx"
    description: >
      DECISO (19/08, dall'utente che riporta Flavio). L'IVA ha DUE LATI e
      vanno tenuti distinti: quella con cui si COMPRA e quella con cui si
      VENDE. Su tutti e due il valore generale sta nelle Impostazioni, e su
      tutti e due si deve poter fare l'eccezione sulla singola riga.
      IL LATO ACQUISTO È GIÀ FATTO, verificato nel codice il 19/08:
      `purchase_vat` nelle impostazioni vale 22% di default (DEFAULT_SETTINGS
      in src/lib/api.js), la scheda del prodotto ha il campo «IVA acquisto %»
      che parte da quel default e si cambia per prodotto
      (InventoryManager.jsx, `vat` sull'articolo), e i conti al lordo passano
      da `costWithVat` (src/lib/inventory.js). Su questo lato non c'è niente
      da fare: è già come lo si voleva.
      IL LATO VENDITA È QUELLO CHE MANCA: `sale_vat` nelle impostazioni vale
      10% (somministrazione bar) ed è generale per tutto il locale; la voce
      di menù NON ha un campo suo, quindi una cosa che si rivende con
      un'aliquota diversa oggi non si può dire. DA FARE: un campo IVA sulla
      voce di menù, vuoto = si usa quella del locale — così le eccezioni si
      scrivono dove sono, una per una, e chi non ne ha non deve compilare
      niente.
      NON RIAPRE UNA COSA CHIUSA, LA COMPLETA. Il 18/08 si è deciso che
      l'incasso si scorpora con l'IVA di VENDITA e non con quella del
      prodotto d'acquisto (REQ-MAG-015: «Flavio compra al 22 e rivende al
      10»). Resta così: cambia solo che alcune vendite hanno un'aliquota
      loro invece di quella generale. `macroStats.js` oggi prende `saleVat`
      una volta sola per tutto il report e andrà preso per voce, con quella
      delle impostazioni come ripiego.
      PERCHÉ SERVE, per quel che si vede dai dati (non è una sua parola): nel
      menù esiste una categoria BOTTIGLIE, e una bottiglia intera non è la
      stessa cosa di un drink servito al banco. Mettere tutto al 10% gonfia
      il netto, e il netto è il numero da cui scendono margine, prime cost e
      il conto di fine mese.
      LA REGOLA È CONFERMATA E NON VA PIÙ CHIESTA (utente, 19/08): «di
      default lui rivende al 10% di IVA, che è quello di default globale, e
      può essere modificato dalla relativa voce di menù». Quindi il 10%
      resta il generale e le eccezioni le mette lui, voce per voce, quando
      servono: non c'è nessuna aliquota da farsi dire prima: il campo
      esiste ed è dove uno la scriverebbe.
      NON DIPENDE DA NIENTE: il lato acquisto è già fatto e `sale_vat` c'è.
      Conviene però che arrivi PRIMA delle tabelle del Bilancio: finché
      tutto si scorpora al 10% il netto di quello che si rivende con
      un'altra aliquota è gonfiato, e da quel netto scendono margine,
      incidenze e prime cost.
      FATTO (19/08). La scheda del prodotto ha il campo «IVA vendita %»
      accanto al prezzo, e vuoto vuol dire «quella del locale»: chi non ha
      eccezioni non compila niente. Sotto c'è scritto quale aliquota vale
      lasciandolo vuoto, col numero.
      UNO ZERO È UN'ALIQUOTA VERA (esente) e non «campo non compilato»: solo
      `null` ripiega sul generale. Se i due casi finissero in un falsy, una
      voce esente si scorporerebbe al 10% e il netto sarebbe più basso del
      vero — un errore che non si vede.
      NEL CALCOLO: `aliquotaDiVendita` (macroStats.js) sceglie per riga
      quella della VOCE se c'è, quella del locale se no; una riga libera,
      che la voce di catalogo non ce l'ha, usa il generale. Le didascalie
      del Bilancio e la nota nelle Impostazioni lo dicono.
    status: implemented
    generate_issue: true
    labels: [menu, prezzi, impostazioni]
    priority: P2
    test_cases:
      - tests/unit/macroStats.test.js
      - tests/unit/ricetteUnita.test.js
