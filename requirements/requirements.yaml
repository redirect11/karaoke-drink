  - id: REQ-MENU-014
    title: "Un prodotto fuori menù si vede che è spento"
    area: "src/index.css"
    description: >
      Chiesto da Flavio il 03/09/2026, con la foto: «l'unica cosa che cambia
      è che la scritta da nera diventa grigia, e nei non disponibili si vede
      poco. Per farla più impattante metterei la scritta bianca e il fondo
      della card in grigio scuro».
      Aveva ragione: la differenza fra una card accesa e una spenta era la
      sola trasparenza al 55%, che di sera e con centinaia di card in
      griglia non si legge. Un drink spento scambiato per acceso è un drink
      promesso a un cliente e mai fatto.
      Adesso la card fuori menù ha il FONDO scuro e la scritta bianca: la
      differenza si vede da lontano e senza andare a leggere. La striscia
      colorata resta, e sul fondo scuro si distingue meglio di prima.
      Vale SOLO per la gestione del menù, dove la domanda è «cosa c'è e cosa
      no»: le altre schede amministrative continuano a sbiadire, che lì
      basta e il colpo d'occhio non serve.
    status: implemented
    generate_issue: false
    labels: [menu, ux]
    test_cases: []

  - id: REQ-STAMPA-018
    title: "Se la stampante è viva lo dice lei, non l'SDK"
    area: "src/lib/printer.js (ascoltaLaStampante, avviaBattito, preparaStampante, smettiDiAscoltare)"
    description: >
      La stampante viene INTERROGATA da sé (`startMonitor` dell'SDK Epson,
      una domanda lunga ogni dieci secondi) e quello che risponde si
      ascolta: `onpoweroff` quando smette di rispondere, `onoffline` quando
      risponde ma non è in grado di stampare, `oncoveropen`, `onpaperend`,
      `ononline` quando torna. Prima di BUG-102 l'app non ascoltava nessuno
      di questi segnali: sapeva solo la risposta ai singoli invii.
      NON RISPONDE PIÙ = SI MOLLA IL COLLEGAMENTO, così la stampa dopo rifà
      la stretta di mano invece di parlare al vuoto. Carta finita, coperchio
      aperto e fuori linea NO: lì la stampante ci parla, il collegamento è
      buono, e buttarlo sarebbe una riconnessione inutile in mezzo al
      servizio. Si avvisa e basta.
      `isConnected()` VALE SOLO AL CONTRARIO. Quando dice di no la caduta è
      certa; quando dice di sì non prova niente, perché nel codice Epson
      risponde così anche mentre sta soltanto PROVANDO a riconnettersi. È il
      motivo per cui il pallino restava verde con la stampante muta.
      IL PALLINO DICE QUELLO CHE LA STAMPANTE HA RISPOSTO, non che in memoria
      esista un oggetto: `preparaStampante` riporta il guaio noto.
      LA RETE PER QUANDO IL MONITOR NON C'È (firmware vecchio, domanda lunga
      bloccata): tre invii di fila senza risposta valgono come «strada
      chiusa». Uno solo no — quello resta un «non lo sappiamo» (REQ-STAMPA-016).
      E NIENTE DI QUESTO PUÒ FERMARE UNA STAMPA: il monitor non passa dal
      collegamento delle stampe, quando fallisce non lo butta giù, non alza
      `onreceive` (quindi non sfasa il conto invii/risposte da cui dipende il
      registro), e nessun lavoro lo aspetta. Un firmware che non lo sostiene
      non impedisce di stampare.
      PRIMA DI STAMPARE SI GUARDA COM'È MESSO IL COLLEGAMENTO, e si guarda
      chiedendolo alla STAMPANTE. Il monitor da solo non basta per la stampa
      che conta: se il collegamento muore tre secondi prima della chiusura di
      cassa, dieci secondi non fanno in tempo — e la chiusura è proprio la
      stampa che arriva dopo il buco più lungo, perché durante il servizio le
      comande si susseguono e il collegamento resta caldo, mentre fra
      l'ultimo scontrino e la chiusura passano ore.
      IL SEGNALE COSTA ZERO. A ogni giro il monitor scrive sulla testina lo
      stato che la stampante ha risposto, e quando smette di rispondere ci
      accende dentro `ASB_NO_RESPONSE`. Leggerlo prima di stampare non
      aspetta niente e non aggiunge traffico, e non è un'opinione dell'SDK: è
      quello che ha detto lei, al massimo un giro fa. La costante si prende
      dall'oggetto, non scritta a mano.
      LA RETE DI RISERVA È IL TEMPO. Senza monitor (firmware che non lo
      sostiene, richiesta bloccata) quello stato non si aggiorna mai e il
      controllo tace: allora vale l'ultima volta che la stampante ha
      RISPOSTO, e oltre `FRESCHEZZA_COLLEGAMENTO` (due minuti) si riparte da
      zero comunque. Provato vuol dire una cosa sola — ha risposto a un invio
      — o una stretta di mano appena riuscita, che è di adesso. Un invio
      mandato e mai confermato NON è una prova: è il silenzio da cui nasce
      questo difetto.
      IN TUTTI E DUE I CASI SI FA QUELLO CHE FA «TEST STAMPA»: si butta il
      collegamento e se ne apre uno nuovo. È l'unico gesto che non chiede
      niente a nessuno.
      E LÌ SI CHIUDE, NON SI ABBANDONA. Di regola `scordaConnessione` non
      chiama `disconnect()` — ci si arriva quando il collegamento è appeso, e
      quella chiamata può appendersi a sua volta — ma qui il collegamento può
      benissimo essere sano, e abbandonarlo lascerebbe sulla stampante una
      sessione mezza aperta finché non scade da sé. Una alla volta non è un
      problema; ripetuta a ogni pausa sì, perché di sessioni CONTEMPORANEE
      l'apparecchio ne regge poche. Il numero di connessioni non è invece un
      argomento contro il rifarle una dopo l'altra: quelle restano una alla
      volta.
      PERCHÉ NON A OGNI STAMPA COMUNQUE: la connessione si tiene viva apposta
      — rifare la stretta di mano ogni volta faceva fallire la prima stampa
      quando l'eccezione del certificato era scaduta, cioè col cliente
      davanti — e ogni riconnessione azzera il conto degli invii senza
      risposta, che è la terza rete. Con lo stato letto e la finestra si
      riparte quando serve. La finestra è una costante da sola: a zero, si
      riparte da capo prima di ogni stampa.
    status: implemented
    generate_issue: false
    labels: [stampa]
    test_cases: [tests/unit/stampanteCheNonRisponde.test.js]

