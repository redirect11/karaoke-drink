  - id: REQ-CLI-006
    title: "Il cliente sa che il suo drink è pronto da ritirare"
    area: "src/lib/push-core.js, functions/index.js, src/pages/OrderStatusPage.jsx, src/pages/MenuPage.jsx"
    description: >
      Chiesto dall'utente il 18/08. Su un conto da RITIRO, quando la
      comanda passa a «pronto» il cliente va avvisato: da lì in poi la
      palla è sua — deve alzarsi e venire al banco. Sul servizio al tavolo
      non serve: ci pensa chi porta il vassoio.
      PARTE DA SOLA, al passaggio di stato: non è un tasto che qualcuno
      deve ricordarsi di premere.
      TRE STRADE, e non si escludono: chi ha ordinato dal telefono segue
      l'ordine con la pagina del QR (c'è già) e riceve la notifica se ha
      dato il permesso; chi ha ordinato al banco non ha né l'una né
      l'altra, e per lui c'è il TABELLONE «stiamo servendo» (già in
      Impostazioni → Menù clienti) coi numeri pronti al ritiro, mentre il
      numero del conto è già stampato sullo scontrino.
      DA VERIFICARE PRIMA DI SCRIVERE: cosa fa già la pagina di stato, come
      il cliente viene registrato per le notifiche, e se serve un deploy
      delle Cloud Functions — che va chiesto, non deciso.
      DETTAGLI CHE FANNO LA DIFFERENZA: una volta sola per comanda (se
      qualcuno riporta indietro lo stato e lo rimette «pronto», il cliente
      non deve ricevere due squilli); senza permesso alle notifiche
      l'avviso non arriva e la pagina col QR resta la strada che funziona
      sempre; con gli stati di servizio spenti quel passaggio non esiste, e
      va detto cosa succede invece di lasciare il caso scoperto.
      VERIFICATO PRIMA DI SCRIVERE (19/08). L'avviso al cliente c'era già:
      decideOrderPush manda «🔔 Il tuo drink è pronto!» quando una comanda
      di un conto `service_mode: 'banco'` passa a «pronto», e parte da sola
      dal trigger notifyOrderUpdate. Il token si aggancia al conto dalla
      pagina di stato («🔔 Avvisami quando è pronto», o da solo se il
      permesso c'era già e si è scansionato il QR). Mancavano i tre
      dettagli, e uno era una promessa falsa.
      FATTO COSI'.
      1) UNA VOLTA SOLA PER COMANDA: si guardava se le comande pronte
      erano AUMENTATE, e una comanda riportata indietro e rimessa pronta
      faceva risalire il conteggio — secondo squillo per un drink già in
      mano, e al secondo non si crede più al primo. Ora si guardano gli
      IDENTIFICATIVI: il messaggio dice quali comande annuncia
      (`msg.comande`) e il trigger le segna sull'ordine (`pronto_avvisate`,
      arrayUnion, solo dopo un invio riuscito). Quella scrittura fa
      ripartire il trigger, che con le comande ormai segnate non manda più
      niente: si ferma da sé.
      2) SENZA PERMESSO ALLE NOTIFICHE non c'è token e non parte niente:
      resta la pagina del QR, che si aggiorna da sola, e ora lo DICE
      invece di lasciar aspettare uno squillo che non arriva.
      3) COL SERVIZIO AL TAVOLO il tasto «Avvisami quando è pronto» non
      compare più: la push non è mai partita per quel modo, e il tasto
      prometteva una cosa che non succedeva — peggio di nessun tasto, che
      la volta dopo non ci si fida più dell'app. Al suo posto la verità:
      «te lo portiamo al tavolo».
      4) CON GLI STATI DI SERVIZIO SPENTI nessuna comanda arriva mai a
      «pronto»: non è un caso scoperto, è che non c'è niente da annunciare
      — chi batte l'ordine lo prepara e lo consegna sul momento. La pagina
      lo dice («ritira al banco quando il drink è pronto») invece di
      offrire un tasto muto.
      IL TABELLONE «stiamo servendo» resta la terza strada, per chi ha
      ordinato al banco: c'è già e non è stato toccato.
      DEPLOY DELLE CLOUD FUNCTIONS NON AUTORIZZATO. Il punto 1 vive in
      functions/ e resta INEFFICACE in produzione finché non si deploya:
      fino ad allora l'avviso continua a partire sul passaggio di stato,
      cioè come prima — nessuna regressione, ma il doppio squillo resta
      possibile. Stesso caso di BUG-036, mergiato da giorni e ancora senza
      effetto in produzione per lo stesso motivo. I punti 2, 3 e 4 sono
      lato sito e vanno in produzione col normale rilascio.
    status: implemented
    generate_issue: true
    labels: [clienti, notifiche, comande]
    priority: P2
    test_cases:
      - tests/unit/push-comande.test.js
      - tests/component/OrderStatusPage.test.jsx

  - id: REQ-UI-020
    title: "Ogni conto ha il suo colore, e le sue comande lo portano"
    area: "src/lib/api.js, src/components/CorsieComande.jsx, src/components/CorsieStato.jsx, src/components/SettingsTab.jsx"
    description: >
      Chiesto dall'utente il 18/08. Un conto con tre comande sparse in tre
      colonne diverse non si riconosce a colpo d'occhio: il colore serve a
      quello. Due cose distinte:
      1) un'impostazione del LOCALE che accende i colori automatici: ogni
      conto nuovo nasce con un colore preso da una tavolozza, e quello è il
      suo — sta sulla card del conto e su TUTTE le card delle sue comande;
      2) il colore si può scegliere A MANO, sempre, che l'automatico sia
      acceso o spento, e vale anche per i conti nati prima.
      VINCOLI: il colore va SCRITTO sul conto, non ricalcolato dall'id —
      dev'essere lo stesso su ogni terminale e non deve cambiare se domani
      cambia la tavolozza. E dev'essere leggibile su tutti i temi, chiaro e
      scuro. Va deciso e scritto chi vince fra colore del conto e colore
      dello stato, invece di lasciarlo all'ordine delle regole CSS.
      DOV'E' IL COLORE, precisato dall'utente il 19/08 dopo aver visto la
      prima versione: «parlavo del colore della card intera, non di un
      pallino messo li'. Le card devono essere con un colore specifico,
      magari leggermente trasparente e sfumato». Il primo giro l'aveva
      messo come pallino da 10px accanto al numero, e non rispondeva alla
      domanda: questo colore serve da LONTANO — guardando la lavagna
      mentre si versa — e dieci pixel da lontano non ci sono.
      FATTO COSI'. Il colore sta nel campo `colore` del documento ordine,
      scelto UNA VOLTA alla nascita dal progressivo del conto (resto della
      divisione per la tavolozza: due conti battuti di fila non sono mai
      dello stesso colore) e da lì non si ricalcola più — cambiare
      tavolozza o aggiornare un solo terminale non sposta i colori dei
      conti già aperti. La tavolozza è quella delle categorie
      (CATEGORY_PALETTE, dodici tinte): una sola da tenere in pari.
      L'impostazione del locale `conti_colorati` (Impostazioni → Coda
      ordini → «Il colore del conto») accende i colori automatici, di suo
      spenta; il colore a mano si dà dal «⋯ Azioni» della card — sia dalle
      corsie dei conti sia dal ⋯ della comanda, dove si scrive comunque
      sul CONTO — e vale anche sui conti nati prima.
      CHI VINCE: LO STATO. La striscia a sinistra resta quella della
      preparazione, sempre, ed è quella che dice cosa fare adesso — un
      vocabolario chiuso di sei tinte (arancio da fare, azzurro al banco,
      verde pronto, grigio uscito, ambra pagato), dove il colore del conto
      non poteva entrare senza cancellarlo.
      IL COLORE DEL CONTO PRENDE IL FONDO DELLA CARD, che era libero:
      sfumato in diagonale dall'angolo, 16% in alto a sinistra e via via
      niente. Tenue apposta — dodici tinte sature stese sotto al testo lo
      renderebbero illeggibile su un tema o sull'altro e coprirebbero
      l'alone del passo di lavoro. In DIAGONALE perché da sinistra c'è già
      quell'alone, e due sfumature dallo stesso lato si impastano.
      Sta sulla card del conto (corsie, griglia e lista) e su tutte le
      card delle sue comande. E non è mai l'unica cosa che informa: il
      numero del conto è sulla stessa card.
      PER ARRIVARCI il fondo della card e' passato da due `background` che
      si sovrascrivevano a vicenda a due VARIABILI (`--tinta-stato` e
      `--conto-colore`) composte in una regola sola: prima vinceva l'ultima
      regola letta e l'altro segno spariva.
      Le regole stanno in src/lib/coloriConto.js, che è dove è scritto il
      perché.
      CHI VINCE ADESSO LO SCEGLIE IL LOCALE, dal 20/08/2026. Parole
      dell'utente: «serve una impostazione che mi permetta di scegliere se
      il bordino rappresenta gli stati del pagamento ordine o può essere
      del colore scelto per la card. Possiamo scegliere il colore della
      card dalle azioni o usare il colore random assegnato se acceso nelle
      impostazioni. Il colore che viene assegnato al momento è sfumato ma è
      molto chiaro. Deve essere più visibile. Se attiviamo nelle
      impostazioni il bordino dello stesso colore scelto/assegnato allora
      il bordino diventa di quel colore». «VINCE LO STATO, sempre» qui
      sopra non vale più come regola scritta nel codice: vale come DEFAULT.
      L'IMPOSTAZIONE è `bordo_colore_conto` (booleana, di suo falsa: chi
      non la tocca vede la coda di ieri sera). Sta in Impostazioni ▸
      Aspetto ▸ «Le card della coda», che è dove vanno le impostazioni
      d'aspetto per la regola data lo stesso giorno (REQ-UI-024), e non
      dov'è «Il colore del conto» oggi. Non è un acceso/spento ma DUE
      RISPOSTE con lo stesso peso — «💳 Com'è messo il conto» e «🎨 Il
      colore del conto» — perché un interruttore avrebbe costretto a
      scrivere nell'etichetta quale delle due è il no.
      VALE IN TUTTE LE VISTE della coda (corsie di stato, corsie delle
      comande, griglia, lista): la striscia deve voler dire la stessa cosa
      ovunque, o non vuol dire niente. E la decisione è UNA funzione pura,
      `coloreCardConto(order, bordoColoreConto)` in lib/coloriConto.js, non
      un ternario per vista: è esattamente così che era nata la striscia
      ambra mai comparsa del BUG-064.
      DUE ECCEZIONI, e stanno nella funzione, non nel CSS: un conto SENZA
      colore tiene la striscia dello stato (con la classe messa lo stesso,
      `var(--conto-colore)` non sarebbe definita e la striscia diventerebbe
      trasparente); un conto ANNULLATO tiene il grigio, impostazione o no —
      è lavoro buttato, e una striscia accesa lo rimetterebbe in mezzo ai
      vivi, nella colonna dove sarebbe la card più vistosa di tutte. Il
      fondo colorato, invece, resta anche sugli annullati: è del conto, non
      del suo stato.
      IL FONDO SI VEDE DI PIÙ: «molto chiaro, deve essere più visibile».
      La sfumatura in diagonale è passata da 16%/5% a 32% all'angolo e 12%
      a metà, e finisce a 88%. I due numeri non hanno lo stesso peso, e
      sono MISURATI: dodici tinte per gli otto temi di themes.js.
      All'angolo c'è il NUMERO del conto, scritto in --text: al 32% il caso
      peggiore è 4,4:1 (magenta su Catppuccin chiaro) e sui temi di casa si
      sta fra 7 e 11:1. Il 32% è il tetto — a 38% il peggiore scende a 3,9
      (giallo su Pico scuro). A metà cade il testo minore, in --muted, e lì
      si paga: dal 5% di prima al 12% il peggiore passa da 4,1 a 3,5, sugli
      stessi due temi, che partivano stretti già sul fondo nudo (4,5 e
      4,4). È il prezzo di «deve essere più visibile», pagato dove il testo
      è secondario e non dal numero del conto; il 12% è la soglia, e chi la
      alza rifà quei conti prima.
      E LA TINTA SI MESCOLA CON --card, non con la trasparenza: a schermo
      cambia poco, ma così ogni fermata della sfumatura è un colore OPACO —
      il testo sta sempre su un fondo pieno e nessun livello sotto può
      schiarirlo di sorpresa. Il contrasto misurato è quello che si vede.
      LA CASCATA CSS È PARTE DELLA REGOLA: `.order-card.bordo-conto` è
      l'ultima di tutte quelle che scrivono sulla striscia — dopo le
      `pay-*`, dopo `pagato-da-servire` e dopo le regole delle corsie, che
      stanno molto più in basso nel foglio e a parità di peso vincerebbero.
      La sorveglia tests/unit/css.test.js: dal DOM la cascata non si vede.
      LA TAVOLOZZA ESCE DAL MENU, dal 20/08/2026. Parole dell'utente: «i
      colori del conto e della comanda andrebbero messi in una modale che
      si apre con un bottone. I tasti della card avvicinali in verticale
      1/2 pixel (comunque di pochissimo)». Dentro il «⋯ Azioni» erano
      dodici gettoni da 26px in due file più il «✕»: tre righe di menu, e
      le azioni vere — torna indietro, dividi, ristampa — finivano sopra
      una macchia di quadratini, su una card che in corsia è larga un dito.
      NEL MENU RESTA UN TASTO SOLO, uguale agli altri, e PORTA ADDOSSO IL
      COLORE DI ADESSO (un pallino accanto al testo): senza, per rispondere
      alla domanda che ci si fa più spesso — «di che colore è questo
      conto?» — bisognerebbe aprire la modale ogni volta.
      LA MODALE È QUELLA DI CASA: `overlay confirm-overlay` +
      `confirm-box`, la stessa del colore del prodotto nel POS, con Esc,
      tocco fuori e ✕. I gettoni salgono a 48px — 26 erano stretti perché
      dovevano stare in una fila dentro un menu, e sotto i 44px di
      docs/navigazione.md un colore si prende male: due tavoli che si
      confondono. Cade con loro la deroga `pointer: coarse`, che era due
      misure per la stessa cosa.
      SCEGLIERE APPLICA E CHIUDE, la modale E il menu sotto: il gesto
      finisce lì, e un menu rimasto aperto dietro terrebbe la card alta il
      doppio proprio mentre si torna a guardare la colonna. Il menu della
      comanda si chiudeva già da sé per ogni voce; quello del conto lo fa
      la pagina, e solo se era aperto su QUEL conto.
      LOCAL-FIRST: la modale sparisce prima che la scrittura parta. Nessun
      `await` — con la rete che balla resterebbe ferma sopra la coda.
      VALE PER TUTTI E DUE I MENU, il ⋯ del conto (corsie di stato,
      griglia, lista) e il ⋯ della comanda: sono gli unici due posti dove
      la tavolozza esisteva, e in tutti e due si scrive comunque sul CONTO.
      Una comanda un colore suo non ce l'ha, e non gliene è stato inventato
      uno.
      È UNA COSA SCRITTA IN UN POSTO SOLO: `voceColoreConto(order, onApri)`
      in components/Corsia.jsx fa la voce (pallino, parole, cosa fa), e il
      tasto del menu del conto la disegna. Il menu della comanda è un
      elenco di oggetti, quello del conto è JSX: senza la voce condivisa
      erano le stesse parole in due posti.
      I TASTI DELLA CARD, «di pochissimo»: lo spazio fra loro era due
      numeri battuti a mano — 8px nel menu aperto, 6px nel piede — e adesso
      è un gettone solo, `--gap-tasti-card: 6px`, per tutti e due. Si
      stringe lo SPAZIO, non i tasti: i bersagli restano quelli di
      docs/navigazione.md. Lo stacco dal contenuto sopra
      (`.corsia-azioni-aperte`: margin-top 14px, padding-top 12px e il
      filo) NON è quel gap e non si tocca — sta lì perché il primo tasto
      del menu non sembri la seconda riga di quello del piede, e lì sotto
      ce n'è uno che rimanda indietro una comanda.
    status: implemented
    generate_issue: true
    labels: [ui, coda, impostazioni]
    priority: P2
    test_cases:
      - tests/unit/coloriConto.test.js
      - tests/component/CodaCorsie.test.jsx
      - tests/component/ThemeSettings.test.jsx
      - tests/unit/css.test.js

  - id: REQ-MAG-020
    title: "La resa di un prodotto sta dietro un interruttore"
    area: "src/components/InventoryManager.jsx"
    description: >
      Chiesto dall'utente il 18/08. Il blocco «Si usa in un'altra misura?
      (facoltativo)» sta sempre aperto nella scheda del prodotto, coi campi
      vuoti in grigio: occupa mezza scheda per una cosa che riguarda pochi
      prodotti, e chi apre la scheda per cambiare un prezzo se la trova
      davanti come se dovesse compilarla. Va dietro un interruttore, spento
      di suo, con l'etichetta in parole da locale e sotto la riga di
      spiegazione che c'è già (quella dei limoni).
      DUE COSE DA NON SBAGLIARE: se il prodotto ha già una resa impostata
      l'interruttore nasce ACCESO e i campi si vedono — se no chi apre un
      prodotto già configurato crede di aver perso il dato, o peggio non si
      accorge che c'è e ragiona su numeri sbagliati; e spegnendolo con una
      resa dentro non deve sparire in silenzio, perché quel numero cambia
      come si scala il magazzino.
      Stessa forma dell'interruttore che c'è già in quella scheda: due
      interruttori scritti in due modi nella stessa schermata sembrano fare
      cose diverse.
