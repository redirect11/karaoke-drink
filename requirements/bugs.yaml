  - id: BUG-080
    title: "Il badge dei filtri conta i generi, non le deviazioni: tre colonne diverse e un «1»"
    area: "src/lib/coda.js (spiegaFiltri), src/pages/BartenderPage.jsx (chipSoloOggi)"
    description: >
      Segnalato dall'utente il 22/08/2026, parole sue: «non mi e' chiaro
      come conta i filtri. Secondo me non funziona». Con due fotografie
      della coda a corsie del banco: in una sei colonne a schermo e il
      tastino «▾ Filtri ①», nell'altra tre colonne e nessun numero.
      COSA C'ERA. Il badge era `filtriAccesi.length`, e `filtriAccesi` era
      una lista di GENERI di filtro: tutte le colonne diverse dal normale
      collassavano in una voce sola, `Colonne (n)`. Due colonne riaccese a
      mano facevano quindi «1». Chi guarda conta a occhio quello che vede
      — due colonne in piu' del solito, lo staff filtrato — e trova un
      numero che non torna: da li' in poi il numero non lo guarda piu'.
      LA SECONDA FOTOGRAFIA NON ERA UN DIFETTO, e la prova sta in un test
      che riproduce quella lavagna (tests/component/CodaCorsie.test.jsx,
      «col locale che parte in preparazione»). Tre colonne senza badge
      succede col locale che fa nascere le comande gia' IN PREPARAZIONE:
      «Da fare» non e' spenta da nessuno, non esiste come colonna
      sceglibile finche' e' vuota (`corsieSceglibili`), e le due dello
      sguardo all'indietro nascono spente di serie
      (CORSIE_SPENTE_ALL_INIZIO). Niente di diverso dal normale, niente
      numero: il badge diceva la verita'.
      LA CURA. Il conteggio e' una funzione pura, `contaFiltri` in
      lib/coda.js, e conta le voci una per una: tre colonne fanno 3, con
      lo staff filtrato fanno 4. Resta che al primo avvio, con tutto di
      serie, il badge e' spento (BUG-058). Resta anche che a fila APERTA
      il numero sparisce, e la regola sta nella funzione (secondo
      argomento) invece che in un ternario nella pagina.
      IL CRITERIO E' CAMBIATO IL GIORNO DOPO (BUG-085). Qui si contavano
      le DEVIAZIONI dal normale nei due versi, e sopra si legge «due
      colonne riaccese a mano» come esempio di cosa il badge deve contare:
      non e' piu' vero. Riaccendere una colonna fa vedere di piu', che e'
      l'opposto di filtrare, e il badge ora conta solo cio' che RESTRINGE
      (`corsieRistrette`). Quello che regge di questa voce e' l'altra
      meta': il badge conta UNA PER UNA e non per generi, e badge e title
      leggono la stessa lista.
      UNA LISTA SOLA PER BADGE E TITLE, che e' il modo di non avere due
      verita': una voce e' un nome secco («Chiusi», «Solo oggi») e vale
      uno, oppure un gruppo che porta quante restrizioni tiene dentro
      (`{ nome: 'Colonne', quante: 3 }`). Il title continua a elencare per
      esteso e le colonne le RAGGRUPPA — «Colonne (3)» — perche' i loro
      nomi sono le testate della lavagna, gia' sotto gli occhi: sei titoli
      in fila annegherebbero i filtri che a schermo un nome non ce l'hanno.
      TROVATO STRADA FACENDO: «Solo oggi» non veniva contato fuori dalla
      griglia. Taglia `ordersInVista`, cioe' la lista da cui scendono
      TUTTE le viste, ma il chip nasceva solo in griglia: chi lo accendeva
      li' e poi passava alle comande — stessa pagina, un tocco — si
      portava dietro il taglio senza numero sul tastino e senza un chip
      per rimetterlo a posto. Adesso dove e' acceso si conta, e il chip
      per spegnerlo compare in tutte le viste (da spento resta solo in
      griglia, che e' la vista che raggruppa per data).
      PASSI PER RIPRODURLO (prima della cura): coda del banco a corsie,
      aprire «▾ Filtri», nascondere due colonne del lavoro, richiudere. Il
      tastino dice «1» con due colonne in meno a schermo. (Il passo
      originale erano due colonne RIACCESE: da BUG-085 quelle non fanno
      piu' numero, ed e' giusto cosi'.)
      ── COME E' FINITA: IL NUMERO E' STATO TOLTO (22/08/2026) ──
      «Si' ma infatti togliamo quel numero. Non serve» (l'utente, lo stesso
      giorno). Questo bug resta `fixed` — il conteggio per generi era
      sbagliato e la cura c'e' stata — ma la cosa che curava non esiste
      piu': il tastino «▾ Filtri» non porta nessun badge.
      IL GIRO PER INTERO, che e' la parte da ricordare. Il numero e' stato
      calcolato in quattro modi: i GENERI di filtro (questo bug), una
      restrizione per COLONNA contando anche le riaccese (BUG-085), solo
      cio' che RESTRINGE guardando la lavagna («non mi sembra che il
      conteggio dei filtri funzioni ancora [...] ne ho tre e lui dice
      zero»), e i chip ACCESI e basta — mai arrivato a schermo. Ogni
      criterio era una risposta diversa a «quanti filtri ci sono?», e chi
      guarda ne aveva in mente una sola: i chip che vede. Un numero che va
      spiegato non avvisa di niente.
      COSA NON RIAPRIRE. `contaFiltri`, `corsieRistrette`, la lista
      `filtriAccesi` e il badge `.coda-tastino-conta` sono stati rimossi
      insieme, e con loro i test del conteggio. Il dettaglio sta in
      REQ-CODA-008, settimo giro.
    labels: [bug, interfaccia, coda]
