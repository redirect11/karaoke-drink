      tornava al prodotto di catalogo, col suo prezzo e il suo costo. Anche
      quella modifica aspettava il suo mezzo secondo. Adesso ogni cambio a
      una comanda passa da una porta sola (`segnaModifica`), che scrive nel
      riferimento e nello stato insieme.
