  - id: BUG-096
    title: "Fuori da «organizza» i sensori del trascinamento venivano tolti, non spenti"
    area: "src/components/PosProductPicker.jsx, src/components/OrderPosDetail.jsx, src/lib/sensoriDnd.js"
    description: >
      Sia la griglia dei prodotti sia la lista del conto passavano a dnd-kit
      una lista di sensori VUOTA quando «organizza» era spento, e la lista
      piena quando era acceso.
      IL PUNTO: dnd-kit usa quella lista come dipendenze di un `useEffect`
      (`useSensorSetup`), e React le dipendenze le confronta una a una PER
      POSIZIONE. Una lista che cambia LUNGHEZZA fra un disegno e l'altro non e'
      un confronto valido — React lo dice a voce alta, «The final argument
      passed to useEffect changed size between renders» — e in pratica,
      entrando e uscendo dalla modalita', il montaggio e lo smontaggio dei
      sensori si disallineano: nessuno puo' garantire che dopo un giro dentro e
      fuori la maniglia prenda ancora. Al banco e' il tipo di guaio che non si
      riproduce a comando e si liquida con «non ha funzionato, riprovo».
      Trovato ripulendo gli avvisi della suite (agosto 2026), non da una
      segnalazione: l'avviso c'era da sempre, sepolto sotto migliaia di righe.
      Comportamento atteso: la lista dei sensori non cambia mai lunghezza;
      fuori da «organizza» nessun tocco deve poter far partire un
      trascinamento.
      RISOLTO: `src/lib/sensoriDnd.js` — `spegnibile(Sensore)` avvolge un
      sensore di dnd-kit in modo che il suo attivatore risponda «no» quando
      l'opzione `attiva` e' falsa. I sensori restano montati sempre (tre nella
      griglia, uno nella lista del conto) e si spengono con un'opzione, invece
      di sparire dalla lista. Il comportamento a schermo non cambia: dentro
      «organizza» si trascina come prima, fuori non si trascina come prima.
      PROVATO: i test che entrano ed escono da «organizza» ci passavano gia'
      sopra (tests/component/PosProductPicker.test.jsx, «la griglia non viene
      rifatta»); quello che mancava era che l'avviso COSTASSE qualcosa. Da ora
      lo fa: tests/helpers/guardiaConsole.js fa fallire il test che stampa un
      avviso inatteso, quindi se la lista tornasse a cambiare lunghezza la
      suite diventa rossa.
    status: fixed
    generate_issue: true
