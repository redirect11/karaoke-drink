  - id: BUG-099
    title: "Il conto appena incassato si vede sparire dalla coda: una memoria, due letture, una non la guardava"
    area: "src/lib/api.js (subscribeActiveOrders, payGroupCash), src/lib/mutazioniOrdine.js"
    severity: media
    priority: P1
    description: >
      Segnalato dall'utente il 01/09/2026: «dopo che riscuoto il conto e
      torna automaticamente alla coda ordini, vedo per un attimo scomparire
      l'ordine nella coda. Quando torno alla coda non voglio vedere
      quell'ordine scomparire: deve essere gia' andato via».
      LA CAUSA, e non e' una regressione di codice. Riscuotere passa da
      `scriviOrdine`, che fa due cose giuste: RICORDA com'e' il conto dopo la
      modifica (`ricordaOrdine`, lib/mutazioniOrdine.js) e manda la scrittura
      in sottofondo (`bgWrite`). La coda, per non restare bianca su una rete
      lenta, si dipinge SUBITO dalla cache di Firestore — scelta deliberata,
      sorvegliata da tests/unit/codaCache.test.js. Ma quella lettura mappava i
      documenti con `mapOrder` e NON consultava la memoria: `ordineRicordato`
      era applicato solo rileggendo UN conto (`leggiOrdine`), mai alla LISTA.
      Quindi la coda dipingeva il conto com'era — aperto — e un istante dopo
      la scrittura atterrava e il conto spariva. E' il lampo.
      In una riga: una memoria, due letture, e una non la guardava. E' la
      stessa FORMA di BUG-028 («una sola memoria di l'ho appena fatto io»),
      girata: li' erano due memorie e ogni vista ne leggeva una, qui e' una
      memoria e due letture, e una non la guarda.
      LA CURA (01/09/2026, ramo feature/lettura-ordini-ristretta).
      1) `ordineRicordato` si applica anche alle LISTE della coda, e a tutte
      e tre insieme — aperti, recenti, chiusi in questa cassa. `emit` non
      fonde piu' conti gia' mappati: tiene i documenti GREZZI dei tre ascolti,
      sceglie il piu' fresco per ogni conto (l'ultimo elenco che ce l'ha, come
      prima) e compone UNA volta sola passando dalla memoria. Applicarlo a un
      elenco solo, o due volte con esiti diversi, vorrebbe dire un conto che
      sparisce da un elenco e ricompare in un altro — al banco, peggio del
      lampo.
      2) L'incasso di GRUPPO passa da `scriviOrdine` invece che da `bgWrite`
      nudo: senza il ricordo, i conti di un tavolo restavano a schermo finche'
      non atterrava la scrittura, uno per volta.
      3) LA SVEGLIA. Il ricordo copre il documento vero al massimo per
      `VITA_MEMORIA` (2 secondi); se in quella finestra non arriva nessun
      altro snapshot — di notte, con un conto solo in ballo — la lista
      resterebbe ferma su una versione che non esiste piu', e a quel punto
      sarebbe il ricordo a nascondere quello che hanno fatto GLI ALTRI
      terminali. Quando la lista usa un ricordo, la coda si programma una
      ricomposizione alla scadenza. Non e' un ritardo che indovina la
      velocita' della macchina — il meccanismo resta il confronto con la
      cache, che si accorge da se' quando la scrittura e' arrivata: e' la
      sveglia che rimette in moto la ricomposizione quando il ricordo non vale
      piu'. Stessa idea del `setTimeout` di `ordiniNascosti`.
      COSA NON E' STATO INDEBOLITO, ed e' la parte che protegge gli altri
      terminali: il ricordo muore appena il documento vero racconta la stessa
      cosa (confronto della patch) e scade comunque dopo `VITA_MEMORIA`. Il
      limite dichiarato resta quello di sempre, ristretto a un paio di
      secondi: se un ALTRO terminale riapre il conto mentre il nostro ricordo
      e' vivo, per quella finestra qui si continua a vedere quello che si e'
      appena fatto. E' l'«ultimo che scrive vince» che c'era gia', e i test lo
      dimostrano invece di darlo per buono.
      RESTA FUORI, apposta: `subscribeOrder` (il singolo conto in tempo reale)
      e le liste di STORICO e rendicontazione (`subscribeOrdersHistory`,
      `fetchOrdersBetween`, `fetchOrdersRange`, `fetchRecentDrinkIds`) non
      consultano la memoria. Sullo storico sarebbe sbagliato — li' si guarda
      cos'e' successo, non cosa si e' appena fatto — e sul singolo conto il
      giro passa gia' dai valori COMPOSTI che le mutazioni restituiscono
      (`ordineDopo`).
    status: fixed
    in_produzione: false
    generate_issue: true
    labels: [bug, coda, local-first]
    test_cases:
      - tests/unit/codaRicordo.test.js

  - id: BUG-100
    title: "Nello scadenzario i resi si sommano invece di sottrarre, e «reso» non e' la dicitura giusta"
    area: "src/lib/fatture.js, src/lib/riepilogoFornitori.js, src/lib/warehouse.js, src/components/SupplierInvoicesPanel.jsx, src/components/OrdiniListaPanel.jsx, src/index.css"
    severity: grave
    priority: P1
    description: >
      Segnalato da Flavio il 03/09/2026, a voce e per messaggio: «in
      Scadenzario i resi si sommano alle fatture/proforma mentre dovrebbero
      sottrarre, e l'importo dei resi dovrebbe apparire di colore verde».
      A voce, la stessa cosa con dentro il perche': «quando si crea il
      documento e si sceglie la tipologia — fattura, proforma e reso — reso
      dovrebbe diventare NOTA DI CREDITO, perche' questa e' la dicitura
      giusta. Non e' importante che io renda: magari e' sbagliato solamente
      un prezzo, quindi io non rendo niente, mi devono modificare il prezzo
      di una fattura magari gia' pagata, mi fanno la nota di credito. E la
      nota di credito, che sostituisce la parola reso, deve andare a
      modificare il totale dello scadenzario: deve essere in negativo, perche'
      mi stanno scalando dei soldi. E poi il colore deve apparire in un altro
      colore, preferibilmente verde».
      QUANTO FA MALE: il totale sbagliava del DOPPIO della correzione. Mille
      euro di fattura e centoventi di nota facevano 1.120 da pagare invece di
      880, e lo stesso errore finiva nel «Da pagare» in testa allo
      scadenzario, nei totali per fornitore e nel Riepilogo dei soldi che
      escono (REQ-MAG-034), che conta la merce proprio dalle fatture. Sono i
      numeri che a fine mese vanno dal commercialista, e sbagliavano in
      silenzio: nessuna schermata diceva niente.
      LA CURA (03/09/2026, ramo feature/lettura-ordini-ristretta). Tre cose,
      piu' tre decisioni che il testo non chiedeva.
      1) IL NOME. In `TIPI_DOCUMENTO` «Reso» diventa «Nota di credito».
      2) IL SEGNO. `importoContabile` (src/lib/fatture.js) e' l'unico posto
      dove una nota di credito diventa negativa, e da li' passano tutti i
      totali: il «Da pagare», i totali per fornitore e il riepilogo mensile.
      Il commento sopra dice PERCHE' sottrae — non e' una spesa, e' la spesa
      tolta — perche' e' la riga che qualcuno «sistemera'» rimettendoci un
      valore assoluto.
      3) IL COLORE. `--testo-verde` accanto a `--testo-rosso` e
      `--testo-ambra`, con la sua variante chiara, e la classe
      `.importo-nota-credito`. Ma il colore non porta mai da solo il
      significato: la cifra si legge «− 120,00 €», perche' un numero colorato
      resta un numero che si somma.
      LE TRE DECISIONI PRESE IN IMPLEMENTAZIONE.
      a) I DOCUMENTI VECCHI NON SI MIGRANO. In archivio ci sono documenti con
      `doc_type: 'Reso'`: nessuno script li riscrive. `eNotaDiCredito` e'
      l'unica funzione che conosce il nome vecchio e lo tratta da sinonimo,
      cosi' i documenti di ieri continuano a valere; chi confronta `doc_type`
      a mano se li perde, ed e' per questo che non lo fa nessuno. Chi apre il
      modulo di correzione su un vecchio «Reso» lo vede gia' su «Nota di
      credito», e salvando lo riscrive col nome nuovo: una migrazione che
      avviene quando qualcuno tocca quel documento, non tutta insieme.
      b) COSA VUOL DIRE «PAGATA» PER UNA NOTA DI CREDITO. Il gesto resta uno
      solo — lo stesso campo `paid`, lo stesso tasto, gli stessi totali —
      perche' due modi di chiudere un documento vogliono dire due stati da
      tenere allineati, ed e' la stessa ragione per cui «pagato» sta sulla
      fattura e non sull'ordine (REQ-MAG-038). A cambiare e' la PAROLA: una
      nota di credito non si paga, o la si incassa o — molto piu' spesso — la
      si scala da quello che si deve. Il tasto dice «da scalare» / «scalata»
      (`etichettaSaldo`), che e' il verbo di Flavio e copre tutti e due i
      casi. Finche' non e' scalata resta dentro il «Da pagare», con il segno
      meno: e' il netto verso quel fornitore, cioe' la cifra da cui si parte
      quando si fa il bonifico.
      c) L'IMPORTO SI SCRIVE POSITIVO E SI CONTA NEGATIVO. Chi batte il
      documento ha in mano un foglio con scritto 120, non −120, e il campo
      chiede da sempre un numero senza segno. Il segno e' una conseguenza del
      TIPO. `importoContabile` usa `-Math.abs()` e non `-x`: se qualcuno
      scrive −120 intendendo una detrazione, il segno non si gira due volte e
      la nota non torna a sommare.
      DOVE E' FINITO `invoiceTotals`: era in src/lib/warehouse.js ed e'
      passato in src/lib/fatture.js, perche' adesso deve sapere che una nota
      di credito sottrae e quella regola vive li'. Lasciandolo dov'era,
      warehouse e fatture si sarebbero importati a vicenda.
    status: fixed
    in_produzione: false
    generate_issue: true
    labels: [bug, magazzino, fornitori]
    test_cases:
      - tests/unit/fatture.test.js
      - tests/unit/riepilogoFornitori.test.js
      - tests/component/SupplierInvoicesPanel.test.jsx

  - id: BUG-101
    title: "Il magazzino si ferma a zero: quello che esce da un prodotto finito non lo sa piu' nessuno"
    area: "src/lib/inventory.js, src/lib/api.js"
    severity: grave
    priority: P1
    description: >
      Chiesto da Flavio il 03/09/2026: «in Magazzino i prodotti devono andare
      in negativo se vengono scaricati dagli items di Menu' dopo che sono
      arrivati a 0».
      COM'ERA. Lo scarico toglieva «al massimo quello che risulta in
      giacenza» (`scaricoPossibile`): da un fondo di 0,2 pezzi se ne toglievano
      0,2 anche quando ne erano usciti 0,75, e il magazzino si fermava a zero.
      Sembrava prudenza — la vendita passa comunque, il conto e' gia' scritto
      — ed era il contrario: gli altri due drink sparivano senza lasciare
      traccia, e con loro l'unica cosa che diceva che qualcosa non tornava. Il
      giorno dopo la giacenza diceva «0» esattamente come un prodotto finito
      per bene, e chi guardava non aveva modo di sapere che c'era un buco.
      QUANTO FA MALE. E' il caso di tutti i giorni al banco: arriva una
      consegna, si mette in frigo e nessuno la carica, oppure l'ultimo
      inventario e' di un mese fa. Da li' in poi ogni drink versato da quelle
      bottiglie e' un consumo che il magazzino non registra. A fine mese il
      valore del magazzino e' piu' alto del vero, il costo dei drink piu'
      basso, e le proposte d'ordine chiedono meno di quello che serve.
      PERCHE' IL MENO NON E' MERCE CHE MANCA — ed e' il punto che ha deciso
      tutto il resto. Da uno scaffale vuoto non si versa: se un prodotto
      continua a uscire dopo essere finito, sullo scaffale c'era davvero. Il
      meno non conta bottiglie assenti, MISURA QUANTO SE N'E' VERSATO SENZA
      CHE RISULTASSE. Da qui la risposta alla domanda che decideva la cura —
      «se il magazzino segna meno una bottiglia e poi ne carichi sei, ne devi
      trovare cinque o sei?»: SEI. Il carico riparte da zero
      (`giacenzaPerCarico`, che c'era gia' e non si tocca): le sei bottiglie
      appena consegnate sullo scaffale ci sono tutte e sei. Trattare il buco
      da debito avrebbe scritto cinque, cioe' un numero falso, e per giunta
      su ogni residuo di arrotondamento.
      LA CURA (04/09/2026, ramo feature/lettura-ordini-ristretta).
      1) LA VENDITA SCENDE SOTTO ZERO. In `depleteComandeInventory` si chiede
         di togliere quello che e' uscito, punto. Il freno resta solo sullo
         scarico A MANO (`scaricoPossibile`), dove c'e' una persona che
         dichiara quanto ha tolto dallo scaffale — e da uno scaffale vuoto non
         si toglie niente.
      2) IL MENO ARRIVA A SCHERMO. Scriverlo nel dato non bastava: la card
         del magazzino legge i PEZZI, e `pezziInGiacenza` e `formatPezzi` si
         fermavano a zero anche loro. Un magazzino che sa di essere sotto zero
         e lo tiene per se' e' lo stesso silenzio di prima.
      3) QUELLO CHE RESTA DA ZERO IN SU, apposta. I SOLDI (`unitsInStock`,
         `stockValue`): un magazzino che vale meno di niente non vuol dire
         niente, e il meno non e' un credito. LE BOTTIGLIE DA TOCCARE
         (`bottleBreakdown`): sono oggetti su uno scaffale, e «−1 piena piu'
         750 ml nell'aperta» non e' una cosa che si puo' andare a guardare.
      QUELLO CHE E' SALTATO FUORI STRADA FACENDO, e vale piu' della richiesta:
      il freno teneva fermo anche IL VERSO OPPOSTO. `qtyInStockUnit`, che
      converte una quantita' nell'unita' della giacenza, davanti a un numero
      negativo rispondeva zero. Cosi' una comanda gia' scalata e poi RIDOTTA —
      un drink tolto, merce che torna sullo scaffale — scriveva un movimento
      di tipo «carico» e una giacenza che non si muoveva di un millilitro
      (REQ-MAG-004): il magazzino restava indietro di un drink per sempre, e
      il movimento raccontava un rientro mai avvenuto. Adesso la conversione
      conserva il segno.
      NESSUNA MIGRAZIONE E NESSUNO SCRIPT: le giacenze di oggi restano quelle
      che sono, e il primo prodotto che esce da zero comincia a raccontarlo.
    status: fixed
    in_produzione: false
    generate_issue: true
    labels: [bug, magazzino]
    test_cases:
      - tests/unit/magazzinoSottoZero.test.js
      - tests/unit/inventory.test.js

  - id: BUG-102
    title: "La stampante smette di stampare tutto, e il pallino resta verde"
    area: "src/lib/printer.js"
    severity: critica
    priority: P1
    description: >
      Segnalato il 06/09/2026: «nella versione di produzione, ieri la
      stampante ha smesso di stampare. Non stampava piu' niente, nemmeno le
      vecchie chiusure». E il pallino dello stato e' rimasto verde.
      LE RISTAMPE SONO LA PROVA: quelle rifanno un documento gia' pronto,
      quindi il guasto non era in quello che si stampava ma nella STRADA.
      LA CAUSA. La vita del collegamento si chiedeva a `isConnected()`
      dell'SDK Epson. Quella funzione risponde di si' anche quando lo stato
      e' `RECONNECTING` — cioe' mentre sta soltanto PROVANDO a riconnettersi
      — e per giunta mette in OR due canali: basta che uno sembri su. Quindi
      il battito dei 30 secondi non scattava mai, l'oggetto stampante restava
      in memoria, `getPrinter()` lo restituiva subito, `preparaStampante()`
      rispondeva «ok» senza chiedere niente a nessuno (pallino verde), e ogni
      `send()` finiva in un collegamento che non c'era piu'. Nessun errore,
      nessun blocco, nessuna carta: il silenzio perfetto.
      QUELLO CHE FA PIU' RABBIA: la stampante quei fatti li diceva. L'oggetto
      dell'SDK puo' alzare `ononline`, `onoffline`, `onpoweroff`,
      `oncoveropen`, `onpaperend`, `onstatuschange`, e c'e' `startMonitor()`
      che la fa interrogare da sola. L'app non ascoltava NESSUNO di questi:
      ascoltava solo la risposta ai singoli invii.
      LA CURA (06/09/2026, ramo feature/lettura-ordini-ristretta). Si smette
      di chiedere all'SDK e si ascolta la stampante — vedi REQ-STAMPA-018 per
      la regola per intero. In breve: monitor acceso a dieci secondi, i suoi
      segnali collegati (non risponde = si molla il collegamento; carta,
      coperchio e fuori linea = si avvisa e basta), il pallino che riporta il
      guaio noto, e tre invii di fila senza risposta come rete per quando il
      monitor non c'e'.
      PERCHE' IL MONITOR NON PUO' ROMPERE NIENTE, che era la condizione posta
      per accenderlo: non passa dal collegamento delle stampe ma da una
      richiesta sua; quando fallisce alza `fireStatusEvent` e NON
      `fireErrorEvent`, quindi non chiama `cleanup()` e non butta giu' il
      collegamento; non alza `onreceive`, quindi non sfasa il conto
      invii/risposte da cui dipendono registro e avvisi; nessuna stampa lo
      aspetta; e un firmware che non lo sostiene non impedisce di stampare.
      C'e' un test per ognuna di queste quattro cose.
      L'ALTRA STRADA, gia' chiusa nella 1.5.6-beta e ancora aperta in
      produzione: nella 1.5.5 la stretta di mano non ha nessun tempo massimo
      e viene aspettata DENTRO la coda delle stampe, quindi una connessione
      che non risponde mai congela la coda per sempre — stesso sintomo,
      «non stampa piu' niente», e l'unica via d'uscita e' chiudere e riaprire
      l'app. Il tempo massimo di 15 secondi con `scordaConnessione` (BUG-086)
      la chiude. Non sapendo se la sera del 05/09 sia stata questa o l'altra
      — l'app non e' stata riaperta per provare — si chiudono tutte e due.
      CONFERMATO SUL CAMPO IL 07/09/2026, e non piu' per lettura del codice.
      La stampante ha smesso di stampare di nuovo, in produzione; premendo
      «Test stampa» (Impostazioni → Stampante) si e' sbloccata subito. Quel
      tasto e' l'unico gesto dell'app che prima di stampare BUTTA il
      collegamento e ne apre uno nuovo — e il fatto che sia partito, invece
      di restare in attesa, esclude l'altra strada: con la coda impiccata si
      sarebbe messo in fila anche lui e non sarebbe mai tornato. Quindi era
      il collegamento morto tenuto per buono, esattamente questo difetto.
      LA RISPOSTA ALL'OSSERVAZIONE DI CHI L'HA VISTO — «invece di aspettare i
      dieci secondi, meglio controllare il collegamento prima di ogni stampa
      e rifarlo come il test». Giusto il PERCHE': se il collegamento muore tre
      secondi prima della chiusura, il monitor non fa in tempo. «Controllare»
      pero' non si puo': chiedere all'SDK se e' vivo e' cio' che non funziona.
      Resta il rifarlo, e si fa quando serve invece che a ogni stampa: la
      connessione e' tenuta viva apposta, e rifarla ogni volta faceva fallire
      la prima stampa col cliente davanti.
      E QUI LA PRIMA RISPOSTA ERA SBAGLIATA IN DUE PUNTI, corretti dopo che
      la domanda e' stata rifatta. Primo: «la stampante regge poche
      connessioni» vale per quelle CONTEMPORANEE, non per una dopo l'altra —
      buttarla e rifarla resta una connessione alla volta, e come obiezione
      era mal posta. Quello che e' vero e' che `scordaConnessione` ABBANDONA
      il collegamento invece di chiuderlo, quindi rifarlo spesso lascerebbe
      sessioni mezze aperte: adesso, quando si molla un collegamento che
      probabilmente sta bene, si chiama `disconnect()` dentro un try.
      Secondo, e piu' importante: interrogare la stampante SI PUO'. Non si
      puo' chiedere all'SDK se il socket e' vivo, ma il monitor a ogni giro
      scrive sulla testina lo stato che la STAMPANTE ha risposto, con dentro
      `ASB_NO_RESPONSE` quando ha smesso. Leggerlo prima di stampare non
      costa niente e non aspetta niente, ed e' diventato il controllo
      principale; la finestra dei due minuti e' scesa a rete di riserva per
      quando il monitor non c'e'. Vedi REQ-STAMPA-018.
      Esiste anche l'interrogazione a richiesta: `getPrintJobStatus()` manda
      un lavoro VUOTO — non esce carta — e la stampante risponde. E' un ping
      vero, ma bisogna aspettare la risposta e su un collegamento morto non
      arriva mai: si conclude solo per scadenza. Non serve finche' bastano i
      due controlli qui sopra; se un giorno la chiusura di cassa mancasse
      ancora, e' la mossa da accendere SOLO per lei, che e' l'unica stampa
      che puo' permettersi un secondo di attesa.
    status: fixed
    in_produzione: false
    generate_issue: true
    labels: [bug, stampa]
