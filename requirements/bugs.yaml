      l'UNICO che stampa. Il verso e' esattamente opposto a quello di questo
      bug, ed e' la trappola da non rifare distrattamente. La regola nuova,
      con l'assunzione sugli ordini dei clienti e l'incastro col rimbalzo,
      sta in REQ-STAMPA-013.
