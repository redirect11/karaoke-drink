      promessa resta aperta per sempre.
      PRIMA di BUG-052 questo sporcava: lo scontrino in attesa del logo
      teneva il builder condiviso aperto e ci si mescolava la comanda dopo.
      DOPO BUG-052 la stampa e' una coda seriale, quindi non si mescola
      piu' niente — ma un lavoro che non finisce BLOCCA tutti quelli dopo:
      la stampante muta per la serata intera, senza un errore da nessuna
      parte.
      LA CURA: tre secondi di tempo massimo sul caricamento. Scaduti, si
      stampa senza logo e il fallimento finisce nella cache dei tre stati
      di BUG-032 («provato e non c'e'»): non si riprova a ogni scontrino.
      Tre secondi perche' il logo sta nella cache del service worker e in
      condizioni sane arriva in millisecondi: se non e' arrivato in tre
      secondi, stasera non arriva.
      ── ADESSO È STATO VISTO: LA SERA DEL 24/08/2026 ──
      «Mai visto accadere al banco» è rimasto vero per quattro giorni.
      Flavio, dal locale, il 24/08 sera, sulla 1.5.1: «in fase di
      riscossione non stampava lo scontrino», e «ieri sera buona parte
      delle stampe non sono uscite». Era questo, per intero, e con un
      danno che qui sopra non era stato previsto: la pretesa dello
      scontrino si prende PRIMA di stampare e torna libera solo nel
      `catch` della stampa — una promessa che non si chiude né bene né
