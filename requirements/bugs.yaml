      `var(--ombra-card)`. Da qui i due sintomi insieme: card piatta e
      «bordino piu' spesso», che era il filo da 3px rimasto solo.
      RISOLTO rimettendo `var(--ombra-card)` in coda a ognuna delle tre.
      LA REGOLA, per chi tocchera' un'altra card: se aggiungi un'ombra a una
      card, l'ombra della casa va rimessa in fondo alla lista. Sorvegliata
