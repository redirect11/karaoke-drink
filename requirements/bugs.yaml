  - id: BUG-041
    title: "Icone storte nel menu a lato, e il numero delle categorie fermo"
    area: "src/lib/sottosezioni.js, src/components/MenuManager.jsx, src/components/InventoryManager.jsx, src/components/StatsTab.jsx, src/components/SettingsTab.jsx, src/components/MacroCategoryManager.jsx, src/components/MacroMonthlyTab.jsx"
    description: >
      Segnalati dall'utente il 19/08, due difetti del menu a lato delle
      pagine (le sottosezioni, roba di 1.5.x).
      PRIMO: le voci «Categorie» e «Macro-categorie» avevano per icona gli
      emoji lumaca e cartelle. Sono emoji a presentazione TESTUALE: Windows
      non ci mette la faccina colorata, li disegna come glifi monocromi
      storti, e nella fila del menu sembravano immagini non caricate. Non
      era la prima volta: lo stesso era successo al bollo dei gruppi, ed è
      per quello che in src/components/Icons.jsx esistevano già IconTag e
      IconCartelle, disegni SVG che seguono il colore del testo e vengono
      uguali su ogni sistema — nati apposta e mai messi in opera.
      RISOLTO IN DUE TEMPI, e il primo era sbagliato. Prima si erano messi
      quei due disegni ovunque la voce fosse una sottosezione: il glifo si
      vedeva, ma l'utente ha subito notato il perché sbagliato — «perché
      sono diverse dallo stile delle altre icone?». In una fila fatta di
      emoji a colori (scatola, carrello, fabbrica) due sagome monocrome al
      tratto stonavano, e lo stacco dava più fastidio del rettangolino.
      RISOLTO DAVVERO tenendo le emoji di sempre e scrivendole a colori: in
      coda va il selettore di variante U+FE0F, un carattere invisibile che
      dice al font «questa disegnala a colori». Stessa emoji, stesso senso,
      stessa fila — e il difetto di partenza sparisce lo stesso, perché
      quello che si vedeva storto era proprio la resa monocroma di serie.
      Nelle due frasi di MacroMonthlyTab che citano «Menù → Macro-categorie»
      l'emoji è stato tolto e basta: è prosa, e non ha bisogno del bollo.
      LA LEZIONE, che vale oltre queste due icone: un difetto di resa si
      cura al livello della resa. Cambiare famiglia di icone per aggirarlo
      sposta il problema sull'insieme, e l'insieme si vede tutto insieme.
      I disegni IconTag e IconCartelle restano in Icons.jsx: serviranno il
      giorno in cui le icone si uniformeranno per scelta, non per rattoppo.
      SECONDO: la scritta «Categorie (N)» contava un numero vecchio. Due
      cause, una dietro l’altra. Le categorie si leggevano UNA VOLTA SOLA
      all’apertura della pagina (fetchCategories dentro load), quindi una
      creata dall’altro terminale — o al volo dalla scheda di un drink —
      non si contava. E anche quando il numero cambiava, la barra non lo
      sapeva: useSottosezioni rideclarava le voci solo se cambiavano gli id
      o la sezione attiva, mai la scritta. Ecco perché il numero si
      sistemava entrando nella sezione: era il cambio di sezione a far
      ripartire l’effetto, non il dato.
      RISOLTO su tutt’e due: la pagina del menù ora sta in ascolto con
      subscribeCategories finché è aperta (e le ricariche a mano dopo ogni
      scrittura, che la sottoscrizione rende inutili, sono sparite), e
      useSottosezioni guarda anche le scritte delle voci — non le icone,
      che sono elementi nuovi a ogni disegno e lo farebbero girare in
      tondo.
      RESTANO EMOJI, fuori da questa voce perché non sono sottosezioni:
      il titolo «Prodotto libero» (CustomDrinkForm, MenuPage), il bollo dei
      gruppi in OrderSummary, la scheda «Schede per stato» e il titolo del
      grafico per categoria. In SettingsTab il campo icona dei riquadri
      (id prezzo) non lo disegna nessuno: è metadato morto.
    in_produzione: false
    status: fixed
    generate_issue: true
    labels: [bug, interfaccia, menu]
    severity: lieve
    priority: P2
    test_cases: [tests/component/MenuManager.test.jsx]

  - id: BUG-042
    title: "Nelle corsie i filtri costano una riga intera, e le comande scendono"
    area: "src/pages/BartenderPage.jsx, src/index.css"
    description: >
      Segnalato dall'utente il 19/08: «rispetto alla lista ordini, i filtri
      qua nella vista comande occupano troppo spazio insieme agli header.
      Dovrebbe stare più in alto come per gli ordini».
      PERCHÉ È UN DIFETTO E NON UN GUSTO. La lavagna delle comande si
      guarda da lontano mentre si versa: quello che non entra nello schermo
      non esiste, e ogni riga sprecata sopra è una comanda in meno sotto.
      Prima della prima card c'erano TRE livelli: la testata, la riga dei
      conteggi, la riga dei filtri — e solo dopo le testate delle colonne.
      La riga dei filtri costava 64px (8 di stacco + 40 di pastiglia + 4 di
      imbottitura + 12 sotto) per DUE pastiglie corte: «✍️ Miei» e
      «▦ Colonne», più la pastiglia «🧾 Ordini» a destra.
      RISOLTO portando i filtri sulla RIGA DEI CONTEGGI (.board-sotto), che
      è corta — «12 aperti · 40 chiusi · 380,00 €» — e ha spazio a destra.
      La riga in più sparisce; quella dei conteggi cresce di 20px, perché
      la pastiglia è più alta del testo e NON si rimpicciolisce (sotto i
      44px, con le dita bagnate, si sbaglia). PRIMA/DOPO: 64px spesi
      diventano 20px, 44px guadagnati, e sopra la prima comanda restano due
      livelli invece di tre.
      SUL TELEFONO RESTA COM'ERA. Lì la riga dei conteggi è già piena
      (conti, avviso della ricerca, legenda degli autori) e i filtri
      tornano sotto, a filo a sinistra, e scorrono in orizzontale come
      hanno sempre fatto. A dire da dove in su è la LAVAGNA e non la
      finestra — container query `corsie`, la stessa soglia delle due
      colonne: col menu agganciato la lavagna ha 200-250px in meno.
      COSA NON È CAMBIATO: quello che i filtri FANNO. Stessi tasti, stesso
      comportamento, stessa regola di docs/navigazione.md — a sinistra
      quello che restringe la lista, a destra quello che cambia vista,
      staccati da un margine automatico. È cambiato solo dove stanno.
      LA GRIGLIA NON ERA STATA TOCCATA: lì le pastiglie sono sette (In
      corso, Chiusi, Annullati, Tutti, Miei, Solo oggi, Comande) e sembrava
      che una riga se la meritasse. L'utente ha corretto il giorno dopo —
      «rispetto alla vista corsie li vorrei nello stesso punto» — e la
      griglia è andata dietro alle corsie: vedi BUG-061.
    in_produzione: false
