      valore noto; l'ordine può arrivare dalla card che l'ha già in mano.
      RISOLTO (19/08), tutte e due le attese.
      IL RUOLO: `src/lib/ruoloLocale.js` tiene l'ultimo ruolo letto con
      l'utente a cui apparteneva, e chi legge il token (App, BartenderPage,
      la comanda stessa) lo scrive. La schermata parte da lì, che si legge
      senza rete, e il token conferma un istante dopo. OTTIMISTI IN UN VERSO
