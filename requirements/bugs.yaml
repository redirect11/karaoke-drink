  - id: BUG-094
    title: "Le callable SumUp POS Pro non controllano né login né ruolo"
    area: "functions/index.js (syncSumUpProducts, createSumUpSale, updateSumUpSaleStatus), functions/lib/sumup-service.js, functions/lib/sumup-core.js"
    description: >
      LATENTE — oggi innocuo perché SumUp è spento (functions/.env vuoto), ma
      da chiudere PRIMA di accendere l'integrazione. Le tre callable
      syncSumUpProducts, createSumUpSale e updateSumUpSaleStatus non leggono
      request.auth; un onCall v2 non richiede autenticazione di default, e non
      c'è requireRole né App Check. A integrazione attiva, chiunque conosca
      l'id progetto (è nel bundle) può, da internet:
      - syncSumUpProducts: riscrivere l'intera collezione drinks (il menù) con
        la risposta dell'API SumUp;
      - createSumUpSale: passare orderId/items/unit_price/qty DAL CLIENT e
        scrivere sumup_sale_id su un ordine arbitrario con prezzi a piacere;
      - updateSumUpSaleStatus: cambiare lo stato di qualunque vendita.
      Comportamento atteso: sono operazioni di back-office, mai di un cliente.
      CURA: aggiungere `requireRole(request.auth, BANCO)` come già fanno i
      pagamenti (payment-service.js), validare orderId/items (esistenza
      dell'ordine) e RICALCOLARE i prezzi lato server invece di prenderli dal
      client. Insieme, imporre App Check (BUG-092).
      RISOLTO (26/08/2026). Il controllo di ruolo sta nel servizio
      (functions/lib/sumup-service.js), con lo stesso metro dei pagamenti: il
      ruolo vive nel custom claim, che nessuno puo' darsi da solo. BANCO per
      syncProducts — riscrivere il menu' e' back-office, non servizio — e
      TUTTO IL PERSONALE per createSale e updateSaleStatus, perche' la sala
      prende gli ordini al tavolo e segna «servito». index.js passa
      request.auth e traduce { code, message } in HttpsError, come staffAdmin.
      L'ORDINE DEI CONTROLLI E' VOLUTO: prima `isConfigured()`, poi il ruolo.
      Con SumUp spento queste funzioni non fanno NIENTE — nessuna chiamata,
      nessuna scrittura — e devono restare un no-op silenzioso: mettere il
      ruolo davanti trasformerebbe un nulla di fatto in un errore, e il primo a
      prenderlo sarebbe il telefono del CLIENTE, che chiama createSumUpSale a
      ogni ordine (api.js, creaOrdine). Cosi' il comportamento di oggi non
      cambia di una virgola, e il buco si chiude nell'istante in cui SumUp si
      accende.
      I PREZZI LI METTE IL SERVER: se l'ordine e' gia' su Firestore il payload
      della vendita si costruisce dai SUOI item. Se non c'e' ancora si usano
      quelli arrivati, e non e' una svista: il conto e' local-first, creaOrdine
      scrive senza aspettare e chiama subito la callable, quindi il documento
      puo' essere ancora per strada — pretenderlo vorrebbe dire perdere la
      vendita di ogni conto battuto con la linea lenta. Ora che di li' passa
      solo il personale, il salto vale la pena.
      DA DECIDERE, e non e' un dettaglio: `createSumUpSale` oggi parte dal
      BROWSER DEL CLIENTE a ogni ordine dal menu' (api.js), e il cliente non e'
      autenticato. Col ruolo, quando SumUp verra' acceso, gli ordini fatti dal
      telefono del cliente NON arriveranno piu' al POS: arriveranno solo quelli
      battuti dal personale. La strada giusta e' spostare l'invio lato server
      (un trigger onDocumentCreated su orders), ma e' un cambiamento
      d'architettura e lo decide l'utente. Finche' SumUp e' spento non cambia
      niente per nessuno.
      PROVATO in tests/bdd/: 12 casi nuovi fra create-sale, sync-products e
      update-sale-status — cliente e non autenticato respinti, sala e banco che
      passano dove devono, la sala respinta sul catalogo, il no-op silenzioso a
      SumUp spento, e i prezzi falsi dal client che vengono ignorati a favore
      di quelli dell'ordine.
      NON DEPLOYATO: le Functions non si pubblicano senza via libera esplicito.
    in_produzione: false
      CHIUSO SENZA CORREZIONE (26/08/2026): IL DIFETTO NON C'È PIÙ PERCHÉ LA
