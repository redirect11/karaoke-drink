    in_produzione: true
    status: fixed
    generate_issue: false
    labels: [bug, ui, coda]
    test_cases: [tests/unit/coda.test.js]

  - id: BUG-013
    title: "Le notifiche arrivano anche a chi si è scollegato"
    area: "src/lib/logout.js, src/lib/push.js, src/lib/customerAuth.js, src/pages/BartenderPage.jsx"
    description: >
      Dopo il logout il telefono continua a suonare. Uscendo si toglieva la
      riga da `staff_tokens`, ma quella è solo la RUBRICA dello staff: il
      token è del browser e resta valido, e gli avvisi al cliente («il tuo
      drink è pronto», «ordine annullato») lo tengono scritto sull'ORDINE.
      Da lì continuavano ad arrivare.
      Due strade in più lo lasciavano acceso: «Esci e accedi come staff»
      passava dal signOut secco (niente timbratura, niente rubrica), e il
      logout del cliente non toglieva niente.
      RISOLTO: uscendo si CANCELLA il token del browser (`spegniPush`),
      quindi non resta nessun indirizzo a cui bussare, chiunque sia il
      mittente; rientrando se ne fa uno nuovo e il dispositivo si registra
      da sé. Le due strade passano ora dalla porta giusta.
    in_produzione: true
    status: fixed
    generate_issue: false
    labels: [bug, avvisi]
    test_cases: [tests/unit/logoutAvvisi.test.js]

  - id: BUG-014
    title: "Unità di misura: la «U» sta nella domanda sbagliata, e il contenuto si chiede anche a chi non ha pezzi"
    area: "src/components/InventoryManager.jsx (form articolo), src/lib/inventory.js"
    description: >
      Segnalato da Flavio a voce (17/08, nota delle 20:25). Due cose nel
      form del prodotto, nessuna delle due urgente — «per ora non fa niente,
      tanto tutti i prodotti hanno pezzi come prima unità».
      1) «Unità generiche (U)» sta nella PRIMA domanda, quella sul tipo di
      unità di misura dell'articolo. Secondo Flavio doveva stare nella
      SECONDA — «a quanto corrisponde un pezzo» — dove si vorrebbe poter
      scrivere «10 U». Attenzione: la U nella prima domanda ci è finita di
      proposito con BUG-010/REQ-MAG-012, per mettere la MANODOPERA a
      listino («Tempo di Lavorazione»), e ci sono già articoli in
      produzione fatti così: spostarla non è una riga di CSS, è una
      migrazione. E perché «10 U per pezzo» serva davvero, deve reggerla
      tutta la catena (entryUnitsFor oggi, con contenuto in U, lascia
      dosare solo a pezzi).
      2) Scegliendo un'unità di volume o peso (cl, ml, g…) il form chiede
      lo stesso «contenuto per confezione»: mettendo «100 cl» sembra di
      moltiplicare per cento ogni singolo cl. Da chiarire cosa deve
      chiedere il form quando l'articolo NON si conta a pezzi.
      CHIARITO da Flavio a voce (17/08, note delle 21:06 e 21:11). La regola
      che vuole: se la prima unità è una misura standard — capacità (l, cl,
      ml) o peso (kg, g) — sotto NON si chiede in quante parti dividerla; se
      invece è «pezzi» o «U», sotto si chiede a quanto corrisponde
      (1 pz = 100 cl, 1 confezione = 10 U). E il tempo di lavoro lo vuole «in
      pezzi e dopo unità, oppure solo unità».
      FATTO (1.4.8), la parte che non tocca i dati di produzione: un pezzo
      può contenere UNITÀ (1 pz = 10 U) e in ricetta si dosa a U, col costo
      per unità che ne discende; le due domande sono riscritte come si
      parla — «Quanto contiene una confezione che compri?» e «A quanto
      corrisponde un pezzo?» — con scritto sotto che non toccano la
      giacenza. Era quello il fraintendimento: «contenuto per confezione»
      con dentro «100 cl» si leggeva come una moltiplicazione.
      RESTA APERTO: la «U» nella prima domanda (ci sono articoli in
      produzione fatti così) e il caso del limone — comprato al chilo, usato
      in cl. Vedi REQ-MAG-016, che rifà il modello invece di rattopparlo.
      CONFERMATO (18/08, tre vocali su REQ-MAG-016): la prima domanda sparisce
      del tutto, non solo la «U» — l'unità iniziale è sempre e sola il
      pezzo, fisso e bloccato, e la «U» (insieme a cl/ml/l e kg/g) sta solo
      nella seconda domanda, «a quanto corrisponde un pezzo». Il caso del
      limone resta senza risposta anche nei nuovi vocali: vedi il punto
      aperto in REQ-MAG-016.
      RISOLTO (1.5.0) rifacendo il modello, non rattoppando il form
      (REQ-MAG-016 e REQ-MAG-018). Delle due segnalazioni:
      1) la «U» non sta più nella domanda sbagliata perché QUELLA DOMANDA
      NON C'È PIÙ: l'unità è sempre il pezzo, e cl/ml/l, kg/g e U vivono
      solo nella seconda — «a quanto corrisponde un pezzo», che si può
      anche lasciare vuota. Gli articoli fatti alla vecchia maniera non si
      sono persi: si leggono giusti da subito e si riscrivono con
      l'aggiornamento del magazzino, che l'utente fa quando vuole (banner,
      prova a vuoto, conferma);
      2) il form non chiede più «il contenuto per confezione» a chi non ha
      pezzi: la domanda è una sola e parla di un pezzo.
      RESTA IL CASO DEL LIMONE — comprato al chilo, usato in cl — e resta
      aperto APPOSTA: un pezzo può corrispondere a una cosa sola, e
      sceglierla al posto di chi lavora farebbe scaricare un chilo a una
      ricetta che voleva un grammo. Quei prodotti non si travasano da soli:
      l'aggiornamento del magazzino li elenca per nome fra quelli «da
      sistemare», e si decide a mano quanto pesa un limone. Sui dati veri
      della produzione non ce n'è nessuno (388 articoli, 378 già a pezzi,
      10 travasati alla lettura, 0 da sistemare).
    in_produzione: true
    status: fixed
    generate_issue: true
    labels: [bug, magazzino]
    severity: lieve
    priority: P3
    test_cases: [tests/unit/inventory.test.js, tests/unit/travasoInventario.test.js]

  - id: BUG-015
    title: "Battendo di corsa, il pagamento non vede le ultime righe"
    area: "src/components/OrderPosDetail.jsx"
    description: >
      Si battono tre Negroni e una IPA e si apre subito il pagamento: nel
      conto 27,00 €, nella schermata di pagamento 21,00 € e la IPA non c'è.
      CAUSA: la schermata di pagamento riceveva `order`, cioè il conto come
      lo sa il SERVER. Le righe appena battute stanno ancora nella bozza —
      si confermano da sole poco dopo — o in una scrittura in volo, e da lì
      il pagamento non le vedeva. Contro la regola di casa: coda, conto e
      pagamento lavorano sui dati che hanno già (docs/architettura.md).
      RISOLTO: il conto per il pagamento si ricompone in locale — le comande
      con dentro le modifiche in volo, la bozza come una comanda in più, e
      il totale che si vede sotto le righe — e aprendo il pagamento la bozza
      si conferma subito, senza aspettare l'auto-conferma. Il server lo
      raggiunge un istante dopo: manda tutto `onBeforePay`, prima che
      l'incasso venga registrato.
      ANCORA (stessa serata): chiudendo il pagamento, aggiungendo altro e
      riaprendolo, le righe nuove non c'erano. Due cause diverse, tutte e due
      sistemate. La prima: il pagamento diretto CREA il conto, ma la
      schermata restava «in creazione» con un conto vero dietro — adesso
      appena l'ordine nasce diventa la sua modifica, come faceva già la
      creazione da bozza. La seconda, più profonda: quando l'aggiunta non
      trova una comanda modificabile ne va creata una NUOVA, e lì la bozza
      si svuotava subito mentre la comanda partiva per il server — per tutto
      il tempo della risposta quelle righe non esistevano da nessuna parte.
      Adesso resta a schermo una comanda provvisoria, che se ne va solo
      quando dal server arriva quella vera (e se la scrittura fallisce le
      righe tornano in bozza, invece di sparire in silenzio).
    in_produzione: true
    status: fixed
    generate_issue: false
