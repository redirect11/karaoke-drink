      l'ordine battuto da questo stesso terminale; (2) il blocco scattava
      solo sull'ordine NUOVO, quindi la seconda comanda aggiunta a un conto
      gia' aperto non stampava mai.
      E IL «FUNZIONAVA PRIMA» ERA UN CASO: tornando agli ordini il
      componente ripartiva, tutto risultava nuovo, e si ristampava cio' che
      NON era battuto da quel terminale. Non era una funzione: era lo
      stesso difetto visto da un'angolazione fortunata.
      LA CURA: la stampa esce dal blocco degli avvisi e ha la sua regola,
      per COMANDA — `comandeDaStampare` (pura: ancora al banco, non
      annullata, nata da meno di dieci minuti) piu' la pretesa
      `claimComandaPrint` in localStorage, come gli scontrini: una copia
      per comanda per terminale, chiunque l'abbia battuta, da qualunque
      vista, e tornare agli ordini non ristampa.
      RIVISTO SUBITO (20/08, l'utente): la prima versione usava una
      finestra di dieci minuti per non far ristampare la serata a un
      browser con la memoria vuota. Domanda sua, giusta: «semplicemente non
