  - id: BUG-071
    title: "Annullando un conto appena battuto, la comanda usciva lo stesso"
    area: "src/lib/printer.js, src/lib/api.js (cancelOrder), src/components/OrderPosDetail.jsx"
    description: >
      «Se alla creazione di un ordine lo annullo anche, la comanda non deve
      uscire se e' abilitata la stampa automatica» (l'utente, 21/08/2026).
      Al banco: si batte un conto al POS, si cambia idea, lo si annulla — e
      il ticket esce lo stesso. Carta buttata, e peggio: al banco si comincia
      a preparare un lavoro che nessuno deve fare.
      LE GUARDIE C'ERANO GIA' E NON BASTAVANO. `comandeDaStampare` scarta i
      conti annullati e le comande annullate, e `cancelOrder` scrive
      `status: annullato` e annulla tutte le comande non ritirate. Sulla
      carta il caso sembrava coperto. Il buco era in due posti diversi.
      UNO: IL CANCELLO SI APRIVA PRIMA CHE L'ANNULLO ARRIVASSE. Il segno
      `in_creazione` e' quello che tiene ferma la stampa finche' il conto si
      sta componendo (REQ-STAMPA-013); a toglierlo era l'USCITA dalla
      schermata, che annullando parte per prima — mentre l'annullo deve
      ancora leggersi il documento. In quel pezzo di secondo la coda vede un
      conto composto, aperto e da stampare, e la stampa automatica non
      aspetta nessuno. Ed e' il caso NORMALE, non un caso di margine:
      battuta la prima riga il conto e' gia' nato — la schermata passa a
      modifica, `isNew` diventa falso — ma resta `in_creazione`, quindi chi
      annulla li' passa dal ramo dell'annullo di sempre.
      DUE: IL TASTO «COMANDA» A MANO su un conto annullato stampava ancora, e
      stampava il peggio. `comandaDelTicket` scarta le annullate, su un conto
      annullato non ne trova nessuna, e `printComanda` ripiegava
      sull'AGGREGATO del conto (BUG-051): un ticket con TUTTE le righe di un
      lavoro che non si deve fare.
      COME E' STATO SISTEMATO, senza ritardi e senza riletture.
      · L'annullo chiude anche la composizione: `in_creazione: false` viaggia
        nello STESSO patch di `status: annullato`. Non esiste piu' un istante
        in cui il conto risulta composto e non ancora annullato.
      · L'uscita non tocca niente quando si sta annullando: il segno si mette
        in cima al gesto (memoria locale immediata, come `ordiniNascosti` per
        la coda), prima ancora di distinguere il conto nuovo da quello nato.
      · La domanda «questo lavoro e' annullato?» sta in una funzione pura
        sola (`lavoroAnnullato` in printer.js) e la fanno tutti e due i
        posti che stampano: chi sceglie (`comandeDaStampare`) e chi mette
        l'inchiostro (`printComanda`, dove il cancello vale anche per i
        chiamanti di domani, come per la coda delle stampe di BUG-052).
        Guarda `status` E `workflow_status`: annullato e' annullato da
        qualunque vista lo si guardi.
      NON ERA IN PRODUZIONE: ne' `in_creazione` ne' `comandaDelTicket`
      esistono su main — sono tutti e due della 1.5.x.
    labels: [bug, stampa, pos]
    severity: media
    priority: P1
    status: fixed
    in_produzione: false
    test_cases:
      - tests/unit/comandaAnnullata.test.js
      - tests/component/OrderPosDetail.test.jsx

  - id: BUG-072
    title: "Due avvisi per lo stesso conto: «Nuovo ordine» e il cambio di stato, sullo stesso #5"
    area: "src/pages/BartenderPage.jsx (coda: gestore di snapshot)"
    description: >
      Segnalato dall'utente il 21/08/2026, con due schermate — il centro
      notifiche del sistema e la lista della campanella dentro l'app —
      sull'ordine #5 delle 21:20: «perche' arrivano due notifiche diverse di
      ordine ricevuto?». Nella sequenza, uno dietro l'altro: «Annullato»,
      «Nuovo ordine · Ordine #5 ricevuto.», «Ordine ricevuto · Ordine #5»,
      «Annullato». E poi: «vedi che tra l'altro le notifiche sono diverse».
      COSA NON ERA. Non e' la stessa notifica consegnata due volte: quella la
      fonderebbe il `tag`, che l'app e la push del server portano uguale
      apposta. Sono DUE avvisi, con due titoli e due corpi.
      LA CAUSA. Nello stesso gestore di snapshot della coda vivevano due
      strade che potevano parlare dello stesso conto: «ordine nuovo», che
      chiedeva solo «l'ho gia' visto?» a una memoria (`knownIds`) rifatta da
      capo a ogni snapshot, e «cambio di stato», che guarda lo stato di
      prima. Bastava che il conto uscisse dalla finestra della coda e
      rientrasse — cioe' un annullo seguito da un ripristino — perche' la
      prima lo credesse nuovo mentre la seconda raccontava il ritorno.
      E SUCCEDEVA ANCHE SENZA CHE IL CONTO SPARISSE MAI, col pagamento
      obbligatorio: un conto nuovo che aspetta di essere pagato entrava
      nell'insieme `awaiting`, e da li' non usciva piu' nemmeno annullandolo
      — il ripristino lo faceva scattare come «nuovo ordine» mesi dopo essere
      arrivato. E' il giro che riproduce la sequenza vista al banco, riga per
      riga.
      COME E' STATO SISTEMATO. Una memoria sola, che si aggiunge e non si
      azzera: «mai visto» e' l'unica cosa che rende nuovo un conto, e i conti
      spariti dalla vista ci restano dentro. L'attesa del pagamento si pulisce
      quando il conto viene annullato — annullato vuol dire uscito, non «in
      arrivo». Un conto che rientra in coda si annuncia per quello che e',
      «Conto ripristinato», e chi l'ha ripristinato da quel terminale non se
      lo sente ripetere (`ripristinato_device`, stesso metro di
      `cancelled_device`). Rimettendo il difetto,
      tests/component/AvvisiRipristino.test.jsx torna rosso.
    labels: [bug, notifiche, coda]
    severity: media
    priority: P2
    status: fixed
    in_produzione: true
    test_cases:
      - tests/component/AvvisiRipristino.test.jsx

  - id: BUG-073
    title: "Lo stesso fatto annunciato con due vocabolari: «Nuovo ordine» e «Ordine ricevuto»"
    area: "src/lib/orderStatus.js, src/pages/BartenderPage.jsx, public/sw.js, functions/lib/push-core.js"
    description: >
      Dalla stessa segnalazione del 21/08/2026: «vedi che tra l'altro le
      notifiche sono diverse». Che gli avvisi fossero due era BUG-072; che
      dicessero due cose diverse e' questo, e sarebbe rimasto anche
      togliendone uno.
      COSA SI LEGGEVA. Lo stesso conto tornato in coda arrivava come «Nuovo
      ordine — Ordine #5 ricevuto.» da una strada e come «Ordine ricevuto —
      Ordine #5» dall'altra. Il primo titolo era battuto a mano dentro la
      coda; il secondo veniva dalle etichette di stato, cioe' dalle parole
      che si dicono AL CLIENTE («Ordine ricevuto»), finite in un avviso per
      il banco — dove lo stesso passo si chiama «Da fare».
      PERCHE' E' UN DIFETTO A SE'. Il progetto ha gia' la regola che le
      parole del banco stanno in un posto solo (`statoAlBanco`, sorvegliata
      da tests/unit/paroleDelBanco.test.js), ma l'avviso di ordine nuovo la
      aggirava: le sue parole erano scritte a mano in TRE posti che non
      possono importarsi a vicenda — la coda nel browser, la push del server
      (functions/, altro pacchetto) e il service worker che la disegna
      (public/sw.js, fuori dal bundle). Tre copie a mano divergono, ed erano
      gia' divergenti.
      E IL TITOLO DEVE ESSERE IDENTICO, non «simile»: la notifica dell'app e
      quella del server portano lo stesso `tag` e il sistema le fonde in una.
      Due titoli diversi sotto lo stesso tag sono una notifica che cambia
      parole sotto gli occhi di chi la legge.
      COME E' STATO SISTEMATO. Le parole degli avvisi hanno un posto solo,
      src/lib/orderStatus.js (`AVVISO_NUOVO_ORDINE`, `AVVISO_RIPRISTINO`), e
      un test le tiene allineate alle due copie che non possono importarle:
      tests/unit/paroleDegliAvvisi.test.js confronta il titolo con quello
      della push del server e col ripiego scritto nel service worker.
      Un avviso annuncia un FATTO, e non porta il nome della colonna dove il
      conto atterra: un conto ripristinato non e' «Da fare», e' «Conto
      ripristinato».
    labels: [bug, notifiche, interfaccia]
    severity: lieve
    priority: P3
    status: fixed
    in_produzione: true
    test_cases:
      - tests/unit/paroleDegliAvvisi.test.js

  - id: BUG-074
    title: "Due ordini #5 nella stessa sera: il conto battuto prima che si sapesse la cassa si numera sul giorno"
    area: "src/lib/progressivi.js, src/lib/api.js (creaOrdine)"
    description: >
      Segnalato dall'utente il 21/08/2026, con la schermata della coda: «e
      poi vedi che ci sono due ordini #5». Il numero del conto e' quello che
      il cliente si sente dire ad alta voce: due conti con lo stesso numero,
      la stessa sera, sono due comande che si scambiano di posto al banco.
      LA CAUSA. Il numero lo da' il contatore che il dispositivo ha gia' in
      memoria, e quale contatore sia lo decide una domanda sola: c'e' una
      cassa aperta? Se si' si conta dentro la SERATA (`cash-<sessione>`), se
      no dentro la GIORNATA. Sono due contatori indipendenti: nella stessa
      sera danno benissimo lo stesso #5. Il difetto stava nella terza
      risposta possibile, che non veniva considerata: «non lo so ancora».
      L'ascolto su `counters/_active_cash` riparte da capo a ogni
      ricaricamento della pagina, e finche' non ha risposto `cassaCorrente()`
      tornava `null` — che il codice prendeva per «cassa chiusa».
      COSA NE VENIVA, provato: il conto battuto in quella finestra nasce con
      `daily_number` preso dal contatore del giorno — cioe' un numero gia'
      usato quella sera — E con `cash_session_id: null`. Non e' «numerato
      male ma nella serata giusta»: e' proprio SENZA SERATA, quindi non
      compare nella chiusura di cassa. Due danni, uno visibile e uno no.
      E LA RETE DI SICUREZZA DEL SERVER NON LO PRENDE. `risolviNumeroDuplicato`
      (functions/index.js) cerca i fratelli dentro `cash_session_id` se c'e',
      dentro `order_date` altrimenti: il conto orfano si confronta con la
      giornata e vede il gemello, ma il conto REGOLARE che arriva dopo si
      confronta con la sola serata, dove l'orfano non c'e'. Nato per primo
      l'orfano, il doppione sopravvive. Resta cosi': allargare il confronto
      alla giornata romperebbe il caso legittimo di due casse nella stessa
      giornata commerciale, dove la numerazione riparte apposta.
      COME E' STATO SISTEMATO, restando local-first: non si aspetta nessuno,
      ci si RICORDA. L'ultima cassa che si sapeva aperta resta in memoria
      locale (`tana:cassa-aperta`), come gia' i numeri assegnati, e vale per
      la giornata commerciale in cui e' stata scritta — quella di ieri non e'
      una risposta, e' un'altra serata. Un ricaricamento non fa piu'
      dimenticare in che serata si sta; il server corregge appena risponde, e
      quando dice che nessuna cassa e' aperta la memoria si cancella.
      SCARTATE: aspettare il server prima di battere (un'attesa di rete a
      ogni conto, il contrario di tutto il progetto) e impedire di battere
      finche' non si sa (blocca il banco). Rimettendo il difetto,
      tests/unit/cassaDellaSerata.test.js torna rosso.
    labels: [bug, ordini, cassa, offline]
    severity: grave
    priority: P1
    status: fixed
    in_produzione: true
    test_cases:
      - tests/unit/cassaDellaSerata.test.js

  - id: BUG-075
    title: "Zoom al 120% nel pagamento: l'ultima riga del tastierino finisce dietro «Riscuotere»"
    area: "src/index.css (.paypad, .paypad-key)"
    description: >
      «Lo zoom al 120% nel pagamento fa si' che i tasti del tastierino
      finiscano dietro al tasto Riscuotere» (l'utente, 21/08/2026, con la
      schermata di pagamento su desktop e il controllo «- 120% +» in basso a
      sinistra: lo zoom dell'APP, non quello del browser). Si vedono 7 8 9,
      4 5 6, 1 2 3; l'ultima riga — 00, 0, =, il tasto per cancellare una
      cifra — sta sotto al tasto blu «Riscuotere», che ha il fondo pieno e la
      copre del tutto. Su una schermata che maneggia soldi un tasto che non
      si vede e' peggio di un tasto scomodo: chi batte un importo a mano non
      trova piu' ne' lo zero ne' il modo di correggere una cifra sbagliata.
      LA CAUSA. Lo zoom scala '#root', quindi dentro la pagina l'altezza a
      disposizione in pixel CSS SCENDE di un quinto a 120%. La colonna
      centrale e' un flex verticale: display, avvisi, tastierino (che si puo'
      stringere, 'flex: 1; min-height: 0') e sotto i tasti che incassano
      ('flex-shrink: 0'). Ma i TASTI del tastierino non si stringono:
      'min-height: 44px' secchi. Cinque righe da 44 piu' i vuoti fanno un
      pavimento di 244px che non scende. Quando l'altezza disponibile va
      sotto quel pavimento la griglia sborda dalla sua scatola, e siccome
      niente ha 'overflow' l'ultima riga finisce sotto i tasti che vengono
      dopo nel DOM.
      COME E' STATO SISTEMATO, due reti. (1) Il minimo dei tasti segue lo
      zoom: 'calc(44px / var(--zoom, 1))'. La soglia dei 44px (DESIGN.md) e'
      una misura FISICA — quanto e' grande il tasto sotto il dito — e dentro
      un contenitore scalato 44px CSS a zoom 1,2 sono gia' 52,8px veri: la
      garanzia era superata di suo, e intanto il tastierino non ci stava piu'.
      Diviso per lo zoom il tasto resta grande quanto a zoom 1, in centimetri
      veri, e la griglia rientra. E' lo stesso idioma delle altezze che
      dividono 100dvh, gia' in uso nel foglio. (2) Se anche cosi' non ci sta
      (finestre molto basse tenute a zoom alto) il tastierino SCORRE
      ('overflow-y: auto') invece di sbordare, e i tasti che incassano
      restano appiccicati in fondo: «Riscuotere» e' quello che si preme
      sempre, e non deve mai andare cercato.
      MISURATO IN CHROME VERO, non a occhio: 63 combinazioni di finestra
      (1440 x 500..1080) e zoom (100%..160%), leggendo per ogni tasto chi gli
      finisce sopra con 'elementFromPoint'. Prima: 15 combinazioni con tasti
      coperti, a partire da 1440x600 al 120% — il caso segnalato. Dopo: zero,
      e in 8 combinazioni in piu' il tastierino ci sta per intero senza
      nemmeno dover scorrere. Il tastierino dello sconto (tre colonne, dentro
      la finestrella) non aveva questo guaio — la' la griglia e' alta quanto
      il contenuto — e ci guadagna lo stesso: i suoi tasti restano 44px veri.
      RIMETTENDO UNA QUALUNQUE DELLE DUE RIGHE, tests/unit/css.test.js torna
      rosso.
    labels: [bug, interfaccia, pagamenti]
    severity: grave
    priority: P1
    status: fixed
    in_produzione: true
    test_cases:
      - tests/unit/css.test.js

  - id: BUG-076
    title: "Con lo zoom alto la finestrella dello sconto esce dallo schermo sopra e sotto"
    area: "src/index.css (.confirm-overlay, .confirm-box)"
    description: >
      Trovato misurando BUG-075, non segnalato al banco: la registro perche'
      e' lo stesso guaio di fondo — una misura fissa dentro una pagina che lo
      zoom rimpicciolisce — ma la cura e' un'altra riga di CSS e tocca TUTTE
      le finestrelle di conferma dell'app, non solo lo sconto.
      COSA SUCCEDEVA. '.confirm-overlay' centrava la finestrella
      ('align-items: center') dentro un velo fisso che non scorre. Quando la
      finestrella e' piu' alta dello schermo, centrare vuol dire tagliarla
      dai DUE lati: sopra spariva il titolo, sotto il tasto che applica. Non
      c'era modo di raggiungerli, perche' non scorreva niente.
      COME E' STATO SISTEMATO, due reti che servono tutte e due. (1) La
      scatola non e' mai piu' alta dello schermo e dentro scorre lei:
      'max-height: calc(100dvh / var(--zoom, 1) - var(--safe-top) - 32px)' e
      'overflow-y: auto' — e' l'idioma delle altezze a tutto schermo gia' in
      uso nel foglio ('.posd-root'), e tiene il velo fermo mentre si scorre.
      (2) 'align-items: safe center' e velo scorrevole ('overflow-y: auto'),
      per le finestrelle che si mettono un 'max-height' per conto loro in
      'vh' — che dentro '#root' scalato NON segue lo zoom e resta piu' alto
      dello schermo. Con 'center' secco il troppo esce anche DA SOPRA, dove
      non si scorre mai; con 'safe' esce solo di sotto, e di sotto il velo
      scorre. In piu' il cuscino del velo scende da 24 a 16px: ogni pixel li'
      e' un pixel che non si deve scorrere.
      MISURATO IN CHROME VERO, non a occhio: 77 combinazioni di finestra
      (460..1080px di altezza) per zoom 100%..160%, chiedendo per ogni
      elemento chi gli finisce sopra con 'elementFromPoint' e contando solo i
      casi in cui e' raggiungibile PER INTERO, dopo aver scorso quello che
      l'utente puo' davvero scorrere. Sul portatile (1440 di larghezza):
      prima 4 combinazioni con titolo e tasto tagliati, dopo ZERO. Sul
      telefono (390): prima 22, dopo ZERO. Quello che resta e' inevitabile e
      non e' un difetto: quando la finestrella e' piu' alta della finestra,
      per premere «Applica» si scorre dentro la finestrella (16 combinazioni
      su 77 sul portatile, 32 sul telefono) — prima, negli stessi casi, il
      tasto non c'era proprio.
      RIMETTENDO 'align-items: center' O TOGLIENDO IL TETTO ALLA SCATOLA,
      tests/unit/css.test.js torna rosso (provato).
    labels: [bug, interfaccia]
    severity: lieve
    priority: P3
    status: fixed
    in_produzione: true
    test_cases:
      - tests/unit/css.test.js

  - id: BUG-077
    title: "Con lo zoom alto, nel conto i tasti in fondo escono dallo schermo e non si scorre"
    area: "src/components/OrderPosDetail.jsx (.posd-root, il piede del conto)"
    description: >
      Trovato misurando BUG-075, non segnalato al banco. Stessa causa di
      fondo — lo zoom rimpicciolisce l'altezza disponibile e le misure fisse
      no — ma un'altra schermata e un'altra struttura, quindi un lavoro a se'.
      E' la schermata piu' usata della serata.
      COSA SUCCEDEVA. La schermata del conto e' alta quanto lo schermo
      ('calc(100dvh / var(--zoom, 1))') con 'overflow: hidden', e la colonna
      dell'ordine era fatta di tre fasce che non cedevano: testata, lista,
      piede. Sommate fanno circa 500px CSS SEMPRE UGUALI, mentre lo spazio
      disponibile e' 100dvh diviso lo zoom. Quando la somma superava
      l'altezza, gli ultimi tasti finivano FUORI dal riquadro e niente
      scorreva per andarli a prendere: irraggiungibili, non solo scomodi. A
      scorrere era la lista delle righe, che pero' sta sopra e non aiuta.
      COME E' STATO SISTEMATO. La regola adesso e' una sola: in quella
      colonna non cede mai la riga con «Invia comanda» e «Pagamento» — i due
      gesti della serata restano alla stessa altezza a qualunque finestra e
      qualunque zoom ('flex-shrink: 0' sulla '.grid-2'). Tutto il resto ha un
      pavimento e sotto quel pavimento SCORRE invece di sparire: la testata
      ('.posd-testa', che smette di essere uno 'style' inline dove
      'flex-shrink: 0' vinceva sempre) e i due tasti secondari
      ('.posd-foot-secondarie': «Stato servizio» e «Annulla ordine») si
      fermano a una '--riga-lista', cioe' 44px VERI sotto il dito a qualunque
      zoom; i numeri del piede ('.posd-foot-info': subtotale, supplementi,
      totale, incassi) a una riga di testo, perche' non sono bersagli. I due
      tasti secondari sono alti esattamente una '--riga-lista', cosi' il
      pavimento del loro contenitore e' alto quanto UN TASTO e scorrendo se
      ne vede sempre uno intero. Il piede cede grazie a 'min-height: 0': su
      'auto' varrebbe il minimo di CONTENUTO, e per un flex annidato Chrome
      lo calcola sommando le altezze piene dei figli — con 'auto' il piede
      non cedeva di un pixel (misurato). Ultima rete, se anche i pavimenti
      non bastassero: a scorrere e' il piede stesso.
      SUL TELEFONO E SUL TABLET STRETTO la colonna diventa un pannello in
      basso alto 'var(--pos-comanda-h)' in 'dvh', e quel 'dvh' aveva la
      stessa malattia: dentro '#root' scalato, '50dvh' vale mezzo schermo in
      pixel CSS, che al 160% sono OTTO DECIMI di schermo veri — il pannello
      sfondava il corpo e il suo piede finiva sotto il bordo. Ora l'altezza
      e' divisa per lo zoom, cosi' la maniglia continua a promettere quello
      che dice, e i tre gesti in fondo ('.posd-foot-telefono') hanno 52px
      veri invece di 52px CSS.
      MISURATO IN CHROME VERO, non a occhio: 77 combinazioni di finestra
      (460..1080px di altezza) per zoom 100%..160%, per tre larghezze, con
      'elementFromPoint' e contando solo i tasti raggiungibili PER INTERO
      dopo aver scorso quello che l'utente puo' davvero scorrere (attenzione:
      'scrollIntoView' scorre anche i contenitori 'overflow: hidden', e
      usarlo come giudice assolverebbe proprio il difetto che si cerca).
      Portatile 1440: prima 40 combinazioni con almeno un tasto perso, dopo
      ZERO. Tablet stretto 820, dove la colonna e' un pannello in basso:
      prima 63, dopo ZERO. Telefono 390: prima 18, dopo ZERO. I due gesti
      principali non chiedono mai di scorrere su 1440 e su 820; sul telefono
      restano 5 combinazioni su 77 (schermi alti 460..540 al 140..160%) in
      cui l'ultima riga vuole una spinta di pochi pixel dentro il piede —
      prima, negli stessi casi, non c'era proprio.
      RIMETTENDO UNA QUALUNQUE DELLE SEI RIGHE, tests/unit/css.test.js torna
      rosso; togliendo gli involucri dal componente ne cadono tre in
      tests/component/OrderPosDetail.test.jsx (provato).
    labels: [bug, interfaccia, pos]
    severity: media
    priority: P2
    status: fixed
    in_produzione: true
    test_cases:
      - tests/unit/css.test.js
      - tests/component/OrderPosDetail.test.jsx

  - id: BUG-078
    title: "Nel conto, fra la maniglia del piede e il Totale c'era piu' vuoto della riga stessa"
    area: "src/index.css (.posd-foot-handle)"
    description: >
      Segnalato dall'utente il 21/08/2026 con lo screenshot: «diminuire lo
      spazio tra la maniglia e il contenuto nel dettaglio ordine».
      PERCHE'. La maniglia e' il primo figlio di una colonna flex con
      `gap`, quindi fra lei e la riga del Totale finivano insieme tre
      cose: i 16px della sua area da afferrare, il gap della colonna e il
      suo margine. Un vuoto piu' alto della riga che stava separando — e
      siccome il gap scala con `--foot-scale`, tirando su la maniglia per
      ingrandire il piede quel vuoto cresceva con tutto il resto.
      COME E' STATO SISTEMATO, IN DUE GIRI. Il primo ha stretto solo
      sotto: «vedo ancora che la maniglia occupa troppo spazio sopra e
      sotto» (l'utente, 22/08/2026, col secondo screenshot) — perche'
      sopra restava il cuscino del piede, che non c'entrava col gap.
      Adesso la maniglia RIENTRA nei vicini invece di aggiungersi: sopra
      si mangia il cuscino (il piede scende a 4px di padding, che a
      separarlo da quello che ha sopra basta il bordo), sotto riassorbe il
      gap con un margine negativo che segue `--foot-scale`, perche' lo
      segue il gap che sta annullando.
      L'AREA DA AFFERRARE RESTA: quattordici pixel a tutta larghezza. Una
      presa che non si prende non serve a niente, e quello che dava
      fastidio non era la presa ma il VUOTO. Sorvegliato da
      tests/unit/css.test.js su tutti e due i lati: rimettendo il cuscino
      sopra, o togliendo il rientro, il test diventa rosso (provato).
    labels: [bug, interfaccia, pos]
    severity: lieve
    priority: P3
    status: fixed
    in_produzione: true
    test_cases:
      - tests/unit/css.test.js

