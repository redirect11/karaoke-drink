  - id: BUG-093
    title: "Ogni ordine è leggibile e creabile da chiunque: dati personali esposti"
    area: "firestore.rules (match /orders/{orderId}), src/lib/api.js"
    description: >
      RISOLTO IN DUE PASSI (26 e 28/08/2026). Il terzo — spostare i campi
      personali fuori dal documento — e' un lavoro a se', ed e' scritto in
      fondo.
      IL DIFETTO. Gli ordini sono l'unica collezione che un cliente NON
      autenticato deve poter creare e leggere: e' il modello «id ordine come
      lasciapassare», ed e' una scelta, non una dimenticanza. Ma le regole
      dicevano `allow read: if true` e una `create` senza vincoli di forma, e
      dentro un ordine ci sono dati personali — nome del cliente, note, token
      push, email e ruolo di chi l'ha battuto. Ne' la lettura ne' la creazione
      erano ristrette: con la sola chiave pubblica del bundle (che e' pubblica
      per disegno) si arrivava ai dati dei clienti e si scriveva nella coda
      del banco.
      Comportamento atteso: chi ha l'id in mano vede e modifica il SUO conto;
      l'archivio non si scarica, e la coda non si riempie da fuori.
      CHIUSA LA CREAZIONE (26/08/2026). Era un rubinetto aperto: in coda
      poteva comparire un conto firmato `placed_by: {email: admin@…, role:
      admin}` — la legenda della coda, la stampa e lo storico dicevano tutti
      «l'ha battuto lui» — oppure gia' pagato, gia' scontato, gia' fatturato,
      gia' venduto a SumUp, intestato all'account di un ALTRO cliente (che se
      lo ritrovava nei «miei ordini» e nel suo gruppo), gia' avanti di stato
      (saltando la coda: nessuno lo prepara e risulta servito) o con un totale
      che non e' un numero. Adesso chi non e' del personale puo' scrivere solo
      la forma che scrive davvero creaOrdine: conto `aperto`, una comanda
      sola, `placed_by` nullo, nessun campo di incasso/sconto/fattura/SumUp,
      `customer_uid` solo il proprio, totale numero non negativo. Il personale
      resta libero.
      CHIUSA LA LETTURA (28/08/2026). In Firestore `read` sono due mestieri
      diversi messi insieme: `get` (un documento di cui si conosce l'id) e
      `list` (scaricarne tanti). Il primo e' il modello voluto e resta
      `if true`; il secondo era concesso per errore, ed era quello che
      permetteva di travasare l'archivio — mesi di nomi, note, importi ed
      email. Ora `list` passa solo dove la domanda si dimostra sicura da se',
      perche' le regole misurano la query prima di eseguirla e non filtrano i
      risultati: il PERSONALE (coda, storico, statistiche, cassa, gruppi), il
      CLIENTE REGISTRATO sui conti intestati al suo account, e le due liste
      del TABELLONE del menu' (`comande_statuses` che contiene ricevuto /
      in_preparazione, oppure pronto). Tutto il resto e' rifiutato, anche
      quando i documenti che tornerebbero sarebbero leciti.
      CAMBIATO ANCHE IL CLIENT, ed e' il pezzo che mancava. «I miei ordini»
      del cliente NON registrato chiedeva i conti salvati sul telefono con
      una query su `documentId() in [...]`, spezzata in blocchi da 30 per il
      limite della clausola `in`. Quella domanda nessuna regola sa
      riconoscerla, e infatti restava fuori dai quattro rami. Adesso
      fetchOrdersByIds (src/lib/api.js) fa N letture singole — che il `get`
      gia' permette — con gli stessi risultati e lo stesso ordinamento: gli
      id sono al massimo venti (cart.js), quindi in velocita' non cambia
      niente, e la complicazione dei blocchi sparisce.
      SCARTATA una scorciatoia: un ramo `resource.id is string` fa passare la
      query per id e blocca il travaso, ma e' un comportamento non
      documentato del pianificatore (la condizione e' vera per qualunque
      documento). Una barriera di sicurezza non si appoggia a un dettaglio
      d'implementazione che domani puo' sparire.
      RESTA FUORI, e va deciso a parte: i documenti che le liste legittime
      tornano sono INTERI, e dentro ci sono ancora push_token, customer_uid e
      placed_by. Le regole non sanno proiettare campi: per non mostrarli
      vanno spostati in un sottodocumento a lettura ristretta, e `placed_by`
      e' letto in mezza app (coda.js, ServiceQueue, printer.js, storiaOrdine,
      cassa.js). Il recinto ora e' molto piu' stretto — restano dentro solo i
      conti in lavorazione, non l'archivio — ma quel travaso li' non e'
      chiuso. Insieme va imposto App Check (BUG-092), che e' quello che
      limita anche la creazione ai client legittimi.
      DA FARE A MANO: le regole hanno effetto solo dopo `firebase deploy
      --only firestore:rules`.
