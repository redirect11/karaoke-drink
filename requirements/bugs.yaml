  - id: BUG-092
    title: "App Check è inizializzato sul client ma non imposto da nessuna parte"
    area: "src/lib/firebaseClient.js (initializeAppCheck), functions/index.js (OPTS delle onCall), firestore.rules"
    description: >
      Il client registra App Check con reCAPTCHA v3 (firebaseClient.js), ma il
      backend non lo pretende mai: nessuna Cloud Function dichiara
      `enforceAppCheck: true` (OPTS è solo la region), l'enforcement non risulta
      acceso per Firestore/Storage, e se manca VITE_RECAPTCHA_SITE_KEY App Check
      si spegne in silenzio. Risultato: il token viene prodotto e allegato, ma
      le callable restano invocabili da qualunque client, anche fuori dall'app.
      È il moltiplicatore che rende sfruttabili i buchi da anonimo (BUG-091,
      BUG-093) e apre a spam/DoS/costo battendo createOrder o
      createPaymentCheckout in loop con la sola apiKey pubblica. È anche il
      sospetto già annotato per BUG-001 (il banner «Missing or insufficient
      permissions» in coda).
      Comportamento atteso: le operazioni riservate all'app passano solo da
      client legittimi con App Check valido.
      CURA: accendere l'enforcement in console per Firestore/Storage/Functions;
      aggiungere `enforceAppCheck: true` alle callable riservate allo staff
      (staffAdmin, sync/sale SumUp, pagamenti), lasciando fuori con grazia
      quelle pensate per il cliente anonimo con capability-token (checkout
      online); far fallire la build in produzione se manca
      VITE_RECAPTCHA_SITE_KEY, invece di spegnere App Check in silenzio.
    in_produzione: true
