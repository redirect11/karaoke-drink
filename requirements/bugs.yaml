  - id: BUG-098
    title: "Lo scontrino di chiusura cassa spesso non esce, e nessuno se ne accorge"
    area: "src/lib/printer.js (lavoroDiStampa, raccontaLaRisposta), src/lib/registroStampe.js, src/lib/notify.js, src/components/CashFlow.jsx"
    severity: media
    priority: P2
    description: >
      Segnalato da Flavio il 28/08/2026: «quando fanno la chiusura cassa, la
      stampante non stampa lo scontrino di chiusura molto spesso».
      I FATTI CHE HA DATO, e valgono piu' di qualunque lettura del codice:
      · durante la serata la stampante stampa SEMPRE — comande e scontrini
      escono anche nelle sere lente, con mezz'ora fra un ordine e l'altro;
      · la RISTAMPA della stessa chiusura, dalla lista delle serate, esce
      SUBITO;
      · quando non stampa NON compare nessun avviso;
      · la chiusura si fa dalla schermata della cassa (`CashFlow`), non dal
      riquadro della coda.
      COSA E' STATO ESCLUSO, con la verifica accanto, perche' il prossimo che
      ci mette mano non rifaccia la stessa strada:
      · NON e' la coda di stampa piantata: durante la serata stampa tutto;
      · NON e' la connessione morta per inattivita': stampa anche dopo mezz'ora
      di pausa, e il battito cardiaco c'e' anche in produzione;
      · NON e' un `await` che non torna: `closeCashSession` non restituisce
      niente, quindi la riga della stampa viene raggiunta;
      · NON e' una regressione: il codice della chiusura in produzione (1.5.5)
      e' IDENTICO a quello attuale, in tutte e due le schermate;
      · NON e' un interruttore che spegne la stampa: non esiste, e se manca
      l'IP della stampante il codice lancia un errore invece di tacere;
      · NON e' la schermata: i due test nuovi
      (`tests/component/ChiusuraCassaStampa.test.jsx`) dimostrano che la
      chiusura CHIEDE la stampa coi dati giusti e che un fallimento viene
      detto.
      RESTA QUINDI UN SOLO SPAZIO: la stampa parte, il codice la considera
      riuscita, e la carta non esce.
      LA CAUSA STRUTTURALE, che e' anche il motivo per cui il difetto e'
      difficile da inseguire: NON SAPPIAMO SE LA STAMPANTE HA STAMPATO. Il
      lavoro si considera finito quando `prn.send()` e' stato CHIAMATO, non
      quando la carta e' uscita. La stampante una risposta la manda —
      `onreceive`, con esito e codice: carta finita, coperchio aperto, fuori
      linea, tempo scaduto — ma nel codice quella risposta finisce in una riga
      di console, scollegata dal lavoro che l'ha causata. Non usiamo nessuno
      degli altri strumenti dell'SDK: ne' il monitoraggio di stato
      (`startMonitor`/`onstatuschange`), ne' il tempo massimo del dispositivo,
      ne' l'identificativo di lavoro sulla `send`.
      LA CURA, in due pezzi (com'e' stata scritta il 31/08; per il terzo
      pezzo previsto allora — il ritentativo automatico — vedi piu' sotto:
      e' stato tolto il giorno dopo):
      1) SAPERE COM'E' ANDATA: la risposta della stampante (`onreceive`)
      torna al foglio che l'ha causata invece di finire in console. La
      correlazione non ha bisogno di identificativi, che l'SDK non da': le
      risposte tornano nell'ordine degli invii, e si contano.
      2) LASCIARE TRACCIA: oggi una stampa fallita non lascia niente. L'avviso
      vive OTTO SECONDI in una striscia che compare insieme a quella verde
      «Cassa chiusa» — e con i toast che si accavallano (BUG-078) puo'
      passare inosservata — e la risposta della stampante finisce in una
      console che nessuno legge. Con una cassa che si chiude una volta a
      notte, cosi' si va per tentativi per settimane. Serve un registro delle
      stampe sul dispositivo: cosa, quando, esito.
      DA VERIFICARE AL BANCO, ed e' la domanda che dividerebbe in due il
      campo: alla prossima chiusura mancata, guardare il BASSO dello schermo
      per una decina di secondi. Se compare una striscia rossa, il testo dice
      gia' la causa e questo difetto si chiude in un pomeriggio.
      ---
      FATTO IL 31/08/2026 e RIVISTO IL 01/09/2026, sul ramo
      feature/lettura-ordini-ristretta.
      COM'E' ADESSO, in tre pezzi.
      1) LA RISPOSTA E' DIAGNOSTICA (REQ-STAMPA-016). La stampa si chiude
      sull'INVIO, come e' sempre stato: chi chiude cassa o batte una comanda
      ha il suo esito nell'istante in cui tocca. La risposta della stampante
      arriva DOPO e per conto suo, e serve solo a raccontare: aggiorna la
      voce gia' scritta nel registro. La correlazione non usa identificativi
      — le risposte tornano nell'ordine degli invii, e si contano — e para i
      due modi di sbagliare: la risposta di un foglio gia' passato (chi
      aspetta l'invio n scarta la risposta n-1) e quella che arriva da una
      connessione VECCHIA (si confronta anche l'oggetto stampante).
      2) SOLO GLI ERRORI FANNO RUMORE. Una risposta di errore manda un
      avviso, che si vede subito e resta nello storico della campanella:
      dice COSA non e' uscito e PERCHE' in parole da banco («Scontrino conto
      #42: la carta e' finita»), senza codici dell'SDK — quelli restano nel
      registro. Una risposta buona non dice niente a schermo. E lo stesso
      motivo non si ripete entro un minuto: con la stampante fuori linea
      falliscono dieci stampe di fila, e dieci strisce identiche sono
      peggio di una perche' si smette di leggerle.
      3) IL REGISTRO DELLE STAMPE (REQ-STAMPA-017), in Impostazioni →
      Stampante: cosa, quando, com'e' andata e il motivo, piu' lo stato
      della coda. Ogni stampa ci compare SUBITO come «inviata» e la voce si
      aggiorna dopo con l'esito vero — o resta «in attesa di risposta» se la
      stampante non parla mai, che e' un'informazione anche quella. Ultime
      50 voci, niente dati personali, scritto di lato. Funziona identico con
      la stampante FINTA, che risponde come quella vera e sa fingere due
      guasti (carta finita, nessuna risposta) dal pannello Dev — cosi' la
      catena si prova senza andare al banco.
      IL RIPENSAMENTO DEL 01/09/2026, ed e' la cosa che serve fra sei mesi
      piu' della regola nuova. La prima stesura (31/08) aveva fatto una cosa
      diversa: aveva messo il lavoro ad ASPETTARE la risposta prima di
      chiudersi, con un ritentativo automatico e una memoria «questa
      stampante parla / non parla» per decidere quando valesse la pena
      aspettare. Sembrava prudente e non lo era: e' un `await` sulla
      stampante nel mezzo di un gesto, cioe' il divieto numero uno di questo
      progetto (CLAUDE.md, local-first). Al banco vuol dire che chi chiude
      cassa col locale pieno resta fermo davanti a una testina — la stessa
      cosa che non si fa aspettando Firestore. E tutta la macchina che ci
      stava intorno (attesa, ritentativo, contatori di silenzi, memoria
      della stampante muta) esisteva SOLO per rendere sopportabile
      quell'attesa: tolta l'attesa, e' stata tolta anche quella, perche'
      quello che non serve piu' resta li' a fare da trappola per chi legge.
      IL RITENTATIVO NON TORNA, ed e' una scelta, non una dimenticanza:
      senza attesa non c'e' piu' il momento in cui riprovare, la risposta e'
      solo diagnostica, e a ristampare e' una persona — che e' anche l'unico
      modo di non rischiare il doppio scontrino su una stampa che in realta'
      era uscita. Quello che resta e' il tempo massimo di 15 secondi sul
      lavoro impiccato (BUG-086): e' un'altra cosa, difende da un lavoro che
      non finisce, e li' la stampa RIFIUTA perche' il chiamante deve saperlo
      adesso.
      MITIGATO, NON CHIUSO, e la differenza e' importante: la causa vera non
      e' ancora DIMOSTRATA. Non sappiamo tuttora perche' proprio la chiusura
      di cassa, e non lo sapremo finche' non capitera' di nuovo al banco. Il
      registro delle stampe e l'avviso servono esattamente a questo: alla
      prossima chiusura mancata compare una striscia che dice cos'e'
      successo, e in Impostazioni → Stampante la riga dice se la stampante
      ha risposto di errore (e quale), se non ha risposto affatto, o se il
      lavoro non e' nemmeno partito. Da li' il difetto si chiude davvero.
      06/09/2026 — UNA CAUSA CHE SPIEGHEREBBE TUTTO, e che nel frattempo e'
      stata trovata leggendo l'SDK per un'altra segnalazione (BUG-102): la
      vita del collegamento si chiedeva a `isConnected()`, che risponde di
      si' anche mentre l'SDK sta soltanto provando a riconnettersi. Un
      collegamento caduto restava quindi in memoria e ogni invio finiva nel
      vuoto, in silenzio. Perche' proprio la chiusura? Perche' e' la stampa
      che arriva dopo il buco piu' lungo senza stampare — durante il servizio
      le comande si susseguono e il collegamento resta caldo, mentre fra
      l'ultimo scontrino e la chiusura passano ore. E spiega anche perche' la
      RISTAMPA della stessa chiusura usciva subito: nel frattempo la stretta
      di mano era stata rifatta.
      NON SI CHIUDE LO STESSO. E' un'ipotesi che regge su tutti i fatti noti,
      non una prova: nessuno ha visto il registro di quella sera. La cura di
      BUG-102 e' in ogni caso quella che serve, e alla prossima chiusura
      mancata il registro dira' se era questa.
    # ATTENZIONE: NON e' `fixed`, ed e' voluto. Il testo qui sopra lo dice —
    # «mitigato, non chiuso» — e un `fixed` chiuderebbe da solo la sua issue
    # su GitHub, cioe' archivierebbe un difetto di cui NON conosciamo la
    # causa e che puo' ripresentarsi la prossima serata. Resta aperto finche'
    # il registro delle stampe non dice cos'e' successo davvero.
    status: todo
    in_produzione: false
    generate_issue: true
    labels: [stampa, cassa]
    test_cases:
