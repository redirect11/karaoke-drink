  - id: BUG-090
    title: "Il repository è pubblico e contiene vocali e foto di persone vere"
    area: "registrazioni/ (storia git e rami release/1.3.0, release/1.4.0), .gitignore, repository GitHub"
    description: >
      Il repo redirect11/tana-drink è PUBBLICO, e in registrazioni/ ci sono
      63 file — note vocali WhatsApp e foto dal 26/07 al 10/08/2026 — che, per
      stessa ammissione del .gitignore e di scripts/trascrivi-registrazioni.py,
      contengono i nomi dei clienti e le voci di chi lavora al banco. Sono dati
      personali (voce e immagine identificabili) pubblicati senza base
      giuridica: un problema di privacy prima ancora che di sicurezza.
      Il commit che li ha tolti (c002eb1, «fuori dal versionamento i vocali dal
      banco») li ha rimossi SOLO dal tip. Restano scaricabili da chiunque:
      dai tip dei rami remoti vivi release/1.3.0 e release/1.4.0 (63 file
      ciascuno), dalla storia raggiungibile di main e develop (i commit che li
      aggiungono — c89e4f5, fefa53a, 64573ad… — sono antenati del tip), e dai
      rami locali agents/configurazione-agenti e feature/riordino-css.
      Comportamento atteso: quei file non devono essere raggiungibili da un
      repository pubblico, né dal tip né dalla storia.
      COSA FARE (in quest'ordine): (1) cancellare sul server i rami
      release/1.3.0 e release/1.4.0 (e i locali citati, o riscriverli);
      (2) riscrivere la storia di tutti i rami con
      `git filter-repo --path registrazioni/ --invert-paths` (o BFG) e
      force-push; (3) aprire un ticket al GitHub Support per purgare gli
      oggetti dalle cache/reflog lato server — i commit restano raggiungibili
      per SHA anche dopo il force-push — e verificare che non esistano fork;
      (4) decidere se il repo debba restare pubblico. Non c'è un segreto da
      ruotare: è privacy di persone reali, ed è il finding più grave dell'audit.
