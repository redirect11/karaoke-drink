  - id: BUG-063
    title: "Con tutte le corsie accese le card si sballano: i tasti si tagliano a vicenda"
    area: "src/index.css (.corsia-card, .corsia-piede, .corsia-quando), src/components/CorsieComande.jsx, src/components/CorsieStato.jsx"
    description: >
      Segnalato dall'utente il 20/08/2026, con lo screenshot: «poi quando
